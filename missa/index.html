는 어찌하여 마음속으로 의아하게 생각하느냐?\n9 중풍 병자에게 ‘너는 죄를 용서받았다.’ 하고 말하는 것과\n‘일어나 네 들것을 가지고 걸어가라.’ 하고 말하는 것 가운데에서\n어느 쪽이 더 쉬우냐?\n10 이제 사람의 아들이 땅에서 죄를 용서하는 권한을 가지고 있음을\n너희가 알게 해 주겠다.” 그러고 나서 중풍 병자에게 말씀하셨다.\n11 “내가 너에게 말한다. 일어나 들것을 들고 집으로 돌아가거라.”\n12 그러자 그는 일어나 곧바로 들것을 가지고,\n모든 사람이 보는 앞에서 밖으로 걸어 나갔다.\n이에 모든 사람이 크게 놀라 하느님을 찬양하며 말하였다.\n“이런 일은 일찍이 본 적이 없다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 이 제물을 기꺼이 받으시고\n저희를 거룩하게 하시어\n저희가 간절히 바라는 것을 이루어 주소서.\n우리 주 …….","영성체송":"시편 36(35),10 참조\n주님, 당신께는 생명의 샘이 있고, 저희는 당신 빛으로 빛을 보나이다.\n<또는>\n요한 10,10 참조\n주님이 말씀하신다. 나는 양들이 생명을 얻고 또 얻어 넘치게 하려고 왔다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성체로 새로운 힘을 얻고 간절히 바라오니\n저희가 하느님의 뜻에 따라 살며 하느님을 충실히 섬기게 하소서.\n우리 주 ……."}},"20270116":{"d":"2027년 01월 16일 토요일","c":"녹","t":"연중 제1주간 토요일","o":[{"c":"백","t":"복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"나는 드높은 어좌에 앉아 계신 분을 보았네. 천사들의 무리가 그분을 흠숭하며 함께 노래하네. 보라, 그분의 나라는 영원하리라.","본기도":"주님,\n주님 백성의 간절한 기도를 자애로이 들으시어\n저희가 해야 할 일을 깨닫고 깨달은 것을 실천하게 하소서.\n성부와 성령과 …….","제1독서":"<확신을 가지고 은총의 어좌로 나아갑시다.>\n▥ 히브리서의 말씀입니다.\n4,12-16\n형제 여러분, 12 하느님의 말씀은 살아 있고 힘이 있으며\n어떤 쌍날칼보다도 날카롭습니다.\n그래서 사람 속을 꿰찔러 혼과 영을 가르고 관절과 골수를 갈라,\n마음의 생각과 속셈을 가려냅니다.\n13 하느님 앞에서는 어떠한 피조물도 감추어져 있을 수 없습니다.\n그분 눈에는 모든 것이 벌거숭이로 드러나 있습니다.\n이러한 하느님께 우리는 셈을 해 드려야 하는 것입니다.\n14 그런데 우리에게는 하늘 위로 올라가신 위대한 대사제가 계십니다.\n하느님의 아들 예수님이십니다.\n그러니 우리가 고백하는 신앙을 굳게 지켜 나아갑시다.\n15 우리에게는 우리의 연약함을 동정하지 못하는 대사제가 아니라,\n모든 면에서 우리와 똑같이 유혹을 받으신,\n그러나 죄는 짓지 않으신 대사제가 계십니다.\n16 그러므로 확신을 가지고 은총의 어좌로 나아갑시다.\n그리하여 자비를 얻고 은총을 받아 필요할 때에 도움이 되게 합시다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 19(18),8.9.10.15(◎ 요한 6,63ㄷ 참조)\n◎ 주님, 당신 말씀은 영이며 생명이시옵니다.\n○ 주님의 법은 완전하여 생기 돋우고, 주님의 가르침은 참되어 어리석음 깨우치네. ◎\n○ 주님의 규정 올바르니 마음을 기쁘게 하고, 주님의 계명 밝으니 눈을 맑게 하네. ◎\n○ 주님을 경외함 순수하니 영원히 이어지고, 주님의 법규들 진실하니 모두 의롭네. ◎\n○ 저의 반석, 저의 구원자이신 주님, 제 입으로 드리는 말씀, 제 마음속 생각, 당신 마음에 들게 하소서. ◎","복음 환호송":"루카 4,18\n◎ 알렐루야.\n○ 주님이 나를 보내시어 가난한 이들에게 기쁜 소식을 전하고 잡혀간 이들에게 해방을 선포하게 하셨다.\n◎ 알렐루야.","복음":"<나는 의인이 아니라 죄인을 부르러 왔다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n2,13-17\n그때에 13 예수님께서 호숫가로 나가셨다.\n군중이 모두 모여 오자 예수님께서 그들을 가르치셨다.\n14 그 뒤에 길을 지나가시다가\n세관에 앉아 있는 알패오의 아들 레위를 보시고 말씀하셨다.\n“나를 따라라.”\n그러자 레위는 일어나 그분을 따랐다.\n15 예수님께서 그의 집에서 음식을 잡수시게 되었는데,\n많은 세리와 죄인도 예수님과 그분의 제자들과 자리를 함께하였다.\n이런 이들이 예수님을 많이 따르고 있었기 때문이다.\n16 바리사이파 율법 학자들은,\n예수님께서 죄인과 세리들과 함께 음식을 잡수시는 것을 보고\n그분의 제자들에게 말하였다.\n“저 사람은 어째서 세리와 죄인들과 함께 음식을 먹는 것이오?”\n17 예수님께서 이 말을 들으시고 그들에게 말씀하셨다.\n“건강한 이들에게는 의사가 필요하지 않으나\n병든 이들에게는 필요하다.\n나는 의인이 아니라 죄인을 부르러 왔다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 이 제물을 기꺼이 받으시고\n저희를 거룩하게 하시어\n저희가 간절히 바라는 것을 이루어 주소서.\n우리 주 …….","영성체송":"시편 36(35),10 참조\n주님, 당신께는 생명의 샘이 있고, 저희는 당신 빛으로 빛을 보나이다.\n<또는>\n요한 10,10 참조\n주님이 말씀하신다. 나는 양들이 생명을 얻고 또 얻어 넘치게 하려고 왔다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성체로 새로운 힘을 얻고 간절히 바라오니\n저희가 하느님의 뜻에 따라 살며 하느님을 충실히 섬기게 하소서.\n우리 주 ……."}},"20270117":{"d":"2027년 01월 17일 일요일","c":"녹","t":"연중 제2주일","o":[],"n":"","g":"대영광송 · 신경 · 교중","i":"","s":{"입당송":"시편 66(65),4 참조\n하느님, 온 세상이 당신 앞에 엎드려 당신을 노래하게 하소서. 지극히 높으신 분, 당신 이름을 노래하게 하소서.","본기도":"전능하시고 영원하신 하느님,\n하늘과 땅을 다스리시니\n저희 기도를 인자로이 들으시어\n이 시대에 하느님의 평화를 주소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<주님, 말씀하십시오. 당신 종이 듣고 있습니다.>\n▥ 사무엘기 상권의 말씀입니다.\n3,3ㄴ-10.19\n그 무렵 3 사무엘이 하느님의 궤가 있는 주님의 성전에서 자고 있었는데,\n4 주님께서 사무엘을 부르셨다. 그가 “예.” 하고 대답하고는,\n5 엘리에게 달려가서 “저를 부르셨지요? 저 여기 있습니다.” 하고 말하였다.\n그러나 엘리는 “나는 너를 부른 적이 없다. 돌아가 자라.” 하였다.\n그래서 사무엘은 돌아와 자리에 누웠다.\n6 주님께서 다시 사무엘을 부르시자, 그가 일어나 엘리에게 가서,\n“저를 부르셨지요? 저 여기 있습니다.” 하고 말하였다.\n그러나 엘리는 “내 아들아, 나는 너를 부른 적이 없다. 돌아가 자라.” 하였다.\n7 사무엘은 아직 주님을 알지 못하고,\n주님의 말씀이 사무엘에게 드러난 적이 없었던 것이다.\n8 주님께서 세 번째로 다시 사무엘을 부르시자, 그는 일어나 엘리에게 가서,\n“저를 부르셨지요? 저 여기 있습니다.” 하고 말하였다.\n그제야 엘리는 주님께서 그 아이를 부르고 계시는 줄 알아차리고,\n9 사무엘에게 일렀다. “가서 자라. 누군가 다시 너를 부르거든,\n‘주님, 말씀하십시오. 당신 종이 듣고 있습니다.’ 하고 대답하여라.”\n사무엘은 돌아와 잠자리에 누웠다.\n10 주님께서 찾아와 서시어, 아까처럼 “사무엘아, 사무엘아!” 하고 부르셨다.\n사무엘은 “말씀하십시오. 당신 종이 듣고 있습니다.” 하고 말하였다.\n19 사무엘이 자라는 동안 주님께서 그와 함께 계시어,\n그가 한 말은 한마디도 땅에 떨어지지 않게 하셨다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 40(39),2ㄱㄴ과 4ㄱㄴ.7-8ㄱㄴ.8ㄷ-9.10(◎ 8ㄴ과 9ㄱ)\n◎ 주님, 보소서, 당신 뜻을 이루려 제가 왔나이다.\n○ 주님께 바라고 또 바랐더니 나를 굽어보셨네. 새로운 노래, 하느님께 드리는 찬양을 내 입에 담아 주셨네. ◎\n○ 당신은 희생과 제물을 즐기지 않으시고, 도리어 저의 귀를 열어 주셨나이다. 번제물과 속죄 제물을 바라지 않으셨나이다. 제가 아뢰었나이다. “보소서, 제가 왔나이다.” ◎\n○ 두루마리에 저의 일이 적혀 있나이다. 주 하느님, 저는 당신 뜻 즐겨 이루나이다. 당신 가르침 제 가슴속에 새겨져 있나이다. ◎\n○ 저는 큰 모임에서 정의를 선포하나이다. 보소서, 제 입술 다물지 않음을. 주님, 당신은 아시나이다. ◎","제2독서":"<여러분의 몸은 그리스도의 지체입니다.>\n▥ 사도 바오로의 코린토 1서 말씀입니다.\n6,13ㄷ-15ㄱ.17-20\n형제 여러분, 13 몸은 불륜이 아니라 주님을 위하여 있습니다.\n그리고 몸을 위해 주시는 분은 주님이십니다.\n14 하느님께서 주님을 다시 일으키셨으니,\n우리도 당신의 힘으로 다시 일으키실 것입니다.\n15 여러분의 몸이 그리스도의 지체라는 것을 모릅니까?\n17 주님과 결합하는 이는 그분과 한 영이 됩니다.\n18 불륜을 멀리하십시오.\n사람이 짓는 다른 모든 죄는 몸 밖에서 이루어지지만,\n불륜을 저지르는 자는 자기 몸에 죄를 짓는 것입니다.\n19 여러분의 몸이 여러분 안에 계시는 성령의 성전임을 모릅니까?\n그 성령을 여러분이 하느님에게서 받았고,\n또 여러분은 여러분 자신의 것이 아님을 모릅니까?\n20 하느님께서 값을 치르고 여러분을 속량해 주셨습니다.\n그러니 여러분의 몸으로 하느님을 영광스럽게 하십시오.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"요한 1,41.17 참조\n◎ 알렐루야.\n○ 우리는 메시아이신 그리스도를 만났네. 은총과 진리가 그분에게서 왔네.\n◎ 알렐루야.","복음":"<그들은 예수님께서 묵으시는 곳을 보고 그분과 함께 묵었다.>\n✠ 요한이 전한 거룩한 복음입니다.\n1,35-42\n그때에 35 요한이 자기 제자 두 사람과 함께 서 있다가,\n36 예수님께서 지나가시는 것을 눈여겨보며 말하였다.\n“보라, 하느님의 어린양이시다.”\n37 그 두 제자는 요한이 말하는 것을 듣고 예수님을 따라갔다.\n38 예수님께서 돌아서시어 그들이 따라오는 것을 보시고,\n“무엇을 찾느냐?” 하고 물으시자,\n그들이 “라삐, 어디에 묵고 계십니까?” 하고 말하였다.\n‘라삐’는 번역하면 ‘스승님’이라는 말이다.\n39 예수님께서 그들에게 “와서 보아라.” 하시니,\n그들이 함께 가 예수님께서 묵으시는 곳을 보고 그날 그분과 함께 묵었다.\n때는 오후 네 시쯤이었다.\n40 요한의 말을 듣고 예수님을 따라간 두 사람 가운데 하나는\n시몬 베드로의 동생 안드레아였다.\n41 그는 먼저 자기 형 시몬을 만나, “우리는 메시아를 만났소.” 하고 말하였다.\n‘메시아’는 번역하면 ‘그리스도’이다.\n42 그가 시몬을 예수님께 데려가자, 예수님께서 시몬을 눈여겨보며 이르셨다.\n“너는 요한의 아들 시몬이구나. 앞으로 너는 케파라고 불릴 것이다.”\n‘케파’는 ‘베드로’라고 번역되는 말이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>","예물 기도":"주님,\n그리스도의 희생을 기념하여 이 제사를 드릴 때마다\n저희에게 구원이 이루어지오니\n이 거룩한 신비를 정성껏 거행하게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<연중 주일 감사송 1 : 파스카 신비와 하느님 백성>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n저희는 죄와 죽음에서 벗어나\n선택된 겨레, 임금의 사제단, 거룩한 민족, 하느님의 백성이 되었고\n저희를 어둠에서 놀라운 빛으로 부르신 주님의 권능을\n온 세상에 전하게 되었나이다.\n이는 파스카의 신비로 이루어진 주님의 위대한 업적이옵니다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"시편 23(22),5 참조\n주님이 제게 상을 차려 주시니, 제 술잔 넘치도록 가득하옵니다.\n<또는>\n1요한 4,16\n하느님이 우리에게 베푸시는 사랑을 우리는 알고 또 믿게 되었네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 천상 양식을 함께 나누고 비오니\n사랑의 성령을 부어 주시어\n그 사랑으로 한마음이 되게 하소서.\n우리 주 그리스도를 통하여 비나이다."}},"20270118":{"d":"2027년 01월 18일 월요일","c":"녹","t":"연중 제2주간 월요일","o":[],"n":"일치 주간","g":"","i":"제2차 바티칸 공의회(1962-1965년)는 ‘일치 운동에 관한 교령’을 통하여, 가톨릭 신자들에게 다른 그리스도인들과 더불어 일치를 위하여 기도하고 노력할 것을 권장하였다. 이러한 뜻에 따라 교회는 해마다 1월 18일부터 성 바오로 사도의 회심 축일인 25일까지를 ‘일치 주간’으로 정하고, 그리스도인들의 일치를 간구하는 공동 기도를 바치고 있다.","s":{"입당송":"시편 66(65),4 참조\n하느님, 온 세상이 당신 앞에 엎드려 당신을 노래하게 하소서. 지극히 높으신 분, 당신 이름을 노래하게 하소서.","본기도":"전능하시고 영원하신 하느님,\n하늘과 땅을 다스리시니\n저희 기도를 인자로이 들으시어\n이 시대에 하느님의 평화를 주소서.\n성부와 성령과 …….","제1독서":"<예수님께서는 아드님이시지만 고난을 겪으심으로써 순종을 배우셨습니다.>\n▥ 히브리서의 말씀입니다.\n5,1-10\n1 모든 대사제는 사람들 가운데에서 뽑혀 사람들을 위하여\n하느님을 섬기는 일을 하도록 지정된 사람입니다.\n곧 죄 때문에 예물과 제물을 바치는 것입니다.\n2 그는 자기도 약점을 짊어지고 있으므로,\n무지하여 길을 벗어난 이들을 너그러이 대할 수 있습니다.\n3 그리고 연약한 탓에 백성의 죄뿐만 아니라\n자기의 죄 때문에도 제물을 바쳐야 합니다.\n4 이 영예는 어느 누구도 스스로 얻는 것이 아니라,\n아론과 같이 하느님에게서 부르심을 받아 얻는 것입니다.\n5 이처럼 그리스도께서도 대사제가 되는 영광을 스스로 차지하신 것이 아니라,\n그분께 “너는 내 아들. 내가 오늘 너를 낳았노라.” 하고\n말씀하신 분께서 그렇게 해 주신 것입니다.\n6 또 다른 곳에서 말씀하신 그대로입니다.\n“너는 멜키체덱과 같이 영원한 사제다.”\n7 예수님께서는 이 세상에 계실 때,\n당신을 죽음에서 구하실 수 있는 분께 큰 소리로 부르짖고 눈물을 흘리며\n기도와 탄원을 올리셨고, 하느님께서는 그 경외심 때문에 들어 주셨습니다.\n8 예수님께서는 아드님이시지만 고난을 겪으심으로써 순종을 배우셨습니다.\n9 그리고 완전하게 되신 뒤에는 당신께 순종하는\n모든 이에게 영원한 구원의 근원이 되셨으며,\n10 하느님에게서 멜키체덱과 같은 대사제로 임명되셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 110(109),1.2.3.4(◎ 4ㄴㄷ)\n◎ 멜키체덱과 같이 너는 영원한 사제로다.\n○ 주님께서 내 주께 이르셨나이다. “내가 너의 원수들을 너의 발판으로 삼을 때까지, 너는 내 오른쪽에 앉아 있어라.” ◎\n○ 주님이 당신 권능의 왕홀을 시온에서 뻗치시리이다. “너의 원수들을 다스려라.” ◎\n○ 네 권능의 날에 주권이 너와 함께하리라. 거룩한 빛, 새벽 품에서 나는 너를 낳았노라. ◎\n○ 주님은 맹세하시고 뉘우치지 않으시리이다. “멜키체덱과 같이 너는 영원한 사제로다.” ◎","복음 환호송":"히브 4,12 참조\n◎ 알렐루야.\n○ 하느님 말씀은 살아 있고 힘이 있으며 마음의 생각과 속셈을 가려낸다.\n◎ 알렐루야.","복음":"<신랑이 혼인 잔치 손님들과 함께 있다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n2,18-22\n그때에 18 요한의 제자들과 바리사이들이 단식하고 있었다.\n사람들이 예수님께 와서,\n“요한의 제자들과 바리사이의 제자들은 단식하는데,\n선생님의 제자들은 어찌하여 단식하지 않습니까?” 하고 물었다.\n19 예수님께서 그들에게 이르셨다.\n“혼인 잔치 손님들이 신랑과 함께 있는 동안에 단식할 수야 없지 않으냐?\n신랑이 함께 있는 동안에는 단식할 수 없다.\n20 그러나 그들이 신랑을 빼앗길 날이 올 것이다. 그때에는 그들도 단식할 것이다.\n21 아무도 새 천 조각을 헌 옷에 대고 깁지 않는다.\n그렇게 하면 헌 옷에 기워 댄 새 헝겊에 그 옷이 땅겨 더 심하게 찢어진다.\n22 또한 아무도 새 포도주를 헌 가죽 부대에 담지 않는다.\n그렇게 하면 포도주가 부대를 터뜨려 포도주도 부대도 버리게 된다.\n새 포도주는 새 부대에 담아야 한다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n그리스도의 희생을 기념하여 이 제사를 드릴 때마다\n저희에게 구원이 이루어지오니\n이 거룩한 신비를 정성껏 거행하게 하소서.\n우리 주 …….","영성체송":"시편 23(22),5 참조\n주님이 제게 상을 차려 주시니, 제 술잔 넘치도록 가득하옵니다.\n<또는>\n1요한 4,16\n하느님이 우리에게 베푸시는 사랑을 우리는 알고 또 믿게 되었네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 천상 양식을 함께 나누고 비오니\n사랑의 성령을 부어 주시어\n그 사랑으로 한마음이 되게 하소서.\n우리 주 ……."}},"20270119":{"d":"2027년 01월 19일 화요일","c":"녹","t":"연중 제2주간 화요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 66(65),4 참조\n하느님, 온 세상이 당신 앞에 엎드려 당신을 노래하게 하소서. 지극히 높으신 분, 당신 이름을 노래하게 하소서.","본기도":"전능하시고 영원하신 하느님,\n하늘과 땅을 다스리시니\n저희 기도를 인자로이 들으시어\n이 시대에 하느님의 평화를 주소서.\n성부와 성령과 …….","제1독서":"<희망은 닻과 같아 안전하고 견고합니다.>\n▥ 히브리서의 말씀입니다.\n6,10-20\n형제 여러분, 10 하느님은 불의한 분이 아니시므로,\n여러분이 성도들에게 봉사하였고 지금도 봉사하면서\n당신의 이름을 위하여 보여 준 행위와 사랑을 잊지 않으십니다.\n11 여러분 각자가 희망이 실현되도록\n끝까지 같은 열성을 보여 주기를 간절히 바랍니다.\n12 그리하여 게으른 사람이 되지 말고,\n약속된 것을 믿음과 인내로 상속받는 이들을 본받는 사람이 되라는 것입니다.\n13 하느님께서는 아브라함에게 약속하실 때,\n당신보다 높은 분이 없어 그러한 분을 두고 맹세하실 수 없었으므로,\n당신 자신을 두고 맹세하시면서,\n14 “정녕코 나는 너에게 한껏 복을 내리고\n너를 한껏 번성하게 해 주겠다.” 하고 말씀하셨습니다.\n15 그리하여 아브라함은 끈기 있게 기다린 끝에 약속된 것을 받았습니다.\n16 사람들은 자기보다 높은 이를 두고 맹세합니다.\n그리고 그 맹세는 모든 논쟁을 그치게 하는 보증이 됩니다.\n17 그래서 하느님께서는 약속하신 것을 상속받을 이들에게\n당신의 뜻이 변하지 않음을 더욱 분명히 보여 주시려고,\n맹세로 보장해 주셨습니다.\n18 하느님께서 이 두 가지 변하지 않는 사실에 관하여\n거짓말을 하신다는 것은 있을 수 없습니다.\n이 두 가지로, 당신께 몸을 피한 우리가\n앞에 놓인 희망을 굳게 붙잡도록 힘찬 격려를 받게 하셨습니다.\n19 이 희망은 우리에게 영혼의 닻과 같아,\n안전하고 견고하며 또 저 휘장 안에까지 들어가게 해 줍니다.\n20 예수님께서는 멜키체덱과 같은 영원한 대사제가 되시어,\n우리를 위하여 선구자로 그곳에 들어가셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 111(110),1ㄴㄷㄹ-2.4-5.9와 10ㄷ(◎ 5ㄴ 참조)\n◎ 주님은 언제나 당신 계약을 기억하신다.\n○ 주님을 찬송하리라. 올곧은 이들의 모임, 그 집회에서, 내 마음 다하여 찬송하리라. 주님이 하신 일들 크기도 하여라. 그 일 좋아하는 이들이 모두 깨치네. ◎\n○ 당신 기적들 기억하게 하시니, 주님은 너그럽고 자비로우시다. 당신 경외하는 이들에게 양식을 주시고, 언제나 당신 계약을 기억하신다. ◎\n○ 당신 백성에게 구원을 보내시고, 당신 계약을 영원히 세우셨네. 그 이름 거룩하고 경외로우시다. 주님 찬양 영원히 이어지네. ◎","복음 환호송":"에페 1,17-18 참조\n◎ 알렐루야.\n○ 우리 주 예수 그리스도의 아버지, 저희 마음의 눈을 밝혀 주시어 부르심을 받은 저희의 희망을 알게 하여 주소서.\n◎ 알렐루야.","복음":"<안식일이 사람을 위하여 생긴 것이지 사람이 안식일을 위하여 생긴 것은 아니다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n2,23-28\n23 예수님께서 안식일에 밀밭 사이를 질러가시게 되었다.\n그런데 그분의 제자들이 길을 내고 가면서 밀 이삭을 뜯기 시작하였다.\n24 바리사이들이 예수님께 말하였다.\n“보십시오, 저들은 어째서 안식일에 해서는 안 되는 일을 합니까?”\n25 그러자 예수님께서 그들에게 말씀하셨다.\n“다윗과 그 일행이 먹을 것이 없어 배가 고팠을 때,\n다윗이 어떻게 하였는지 너희는 읽어 본 적이 없느냐?\n26 에브야타르 대사제 때에 그가 하느님의 집에 들어가,\n사제가 아니면 먹어서는 안 되는 제사 빵을 먹고\n함께 있는 이들에게도 주지 않았느냐?”\n27 이어서 그들에게 말씀하셨다.\n“안식일이 사람을 위하여 생긴 것이지,\n사람이 안식일을 위하여 생긴 것은 아니다.\n28 그러므로 사람의 아들은 또한 안식일의 주인이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n그리스도의 희생을 기념하여 이 제사를 드릴 때마다\n저희에게 구원이 이루어지오니\n이 거룩한 신비를 정성껏 거행하게 하소서.\n우리 주 …….","영성체송":"시편 23(22),5 참조\n주님이 제게 상을 차려 주시니, 제 술잔 넘치도록 가득하옵니다.\n<또는>\n1요한 4,16\n하느님이 우리에게 베푸시는 사랑을 우리는 알고 또 믿게 되었네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 천상 양식을 함께 나누고 비오니\n사랑의 성령을 부어 주시어\n그 사랑으로 한마음이 되게 하소서.\n우리 주 ……."}},"20270120":{"d":"2027년 01월 20일 수요일","c":"녹","t":"연중 제2주간 수요일","o":[{"c":"홍","t":"성 파비아노 교황 순교자"},{"c":"홍","t":"성 세바스티아노 순교자"}],"n":"","g":"","i":"","s":{"입당송":"시편 66(65),4 참조\n하느님, 온 세상이 당신 앞에 엎드려 당신을 노래하게 하소서. 지극히 높으신 분, 당신 이름을 노래하게 하소서.","본기도":"전능하시고 영원하신 하느님,\n하늘과 땅을 다스리시니\n저희 기도를 인자로이 들으시어\n이 시대에 하느님의 평화를 주소서.\n성부와 성령과 …….","제1독서":"<너는 멜키체덱과 같이 영원한 사제다.>\n▥ 히브리서의 말씀입니다.\n7,1-3.15-17\n형제 여러분,\n1 멜키체덱은 “살렘 임금”이며 “지극히 높으신 하느님의 사제”로서,\n“여러 임금을 무찌르고 돌아오는 아브라함을 만나”\n“그에게 축복하였습니다.”\n2 그리고 아브라함은 “모든 것의 십분의 일을” 그에게 나누어 주었습니다.\n먼저 그의 이름은 ‘정의의 임금’이라는 뜻입니다.\n그는 또한 살렘의 임금 곧 평화의 임금이었습니다.\n3 그는 아버지도 없고 어머니도 없으며 족보도 없고\n생애의 시작도 끝도 없는 이로서 하느님의 아들을 닮아,\n언제까지나 사제로 남아 있습니다.\n15 멜키체덱과 닮은 다른 사제께서 나오시면 더욱 분명해집니다.\n16 그분께서는 육적인 혈통과 관련된 율법 규정이 아니라,\n불멸하는 생명의 힘에 따라 사제가 되셨습니다.\n17 “너는 멜키체덱과 같이 영원한 사제다.” 하고\n성경에서 증언하기 때문입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 110(109),1.2.3.4(◎ 4ㄴㄷ)\n◎ 멜키체덱과 같이 너는 영원한 사제로다.\n○ 주님께서 내 주께 이르셨나이다. “내가 너의 원수들을 너의 발판으로 삼을 때까지, 너는 내 오른쪽에 앉아 있어라.” ◎\n○ 주님이 당신 권능의 왕홀을 시온에서 뻗치시리이다. “너의 원수들을 다스려라.” ◎\n○ 네 권능의 날에 주권이 너와 함께하리라. 거룩한 빛, 새벽 품에서 나는 너를 낳았노라. ◎\n○ 주님은 맹세하시고 뉘우치지 않으시리이다. “멜키체덱과 같이 너는 영원한 사제로다.” ◎","복음 환호송":"마태 4,23 참조\n◎ 알렐루야.\n○ 예수님은 하늘 나라의 복음을 선포하시고 백성 가운데 병자들을 모두 고쳐 주셨네.\n◎ 알렐루야.","복음":"<안식일에 목숨을 구하는 것이 합당하냐? 죽이는 것이 합당하냐?>\n✠ 마르코가 전한 거룩한 복음입니다.\n3,1-6\n그때에 1 예수님께서 회당에 들어가셨는데,\n그곳에 한쪽 손이 오그라든 사람이 있었다.\n2 사람들은 예수님을 고발하려고,\n그분께서 안식일에 그 사람을 고쳐 주시는지 지켜보고 있었다.\n3 예수님께서 손이 오그라든 사람에게 “일어나 가운데로 나와라.” 하시고,\n4 그들에게 말씀하셨다.\n“안식일에 좋은 일을 하는 것이 합당하냐?\n남을 해치는 일을 하는 것이 합당하냐?\n목숨을 구하는 것이 합당하냐? 죽이는 것이 합당하냐?”\n그러나 그들은 입을 열지 않았다.\n5 그분께서는 노기를 띠시고 그들을 둘러보셨다.\n그리고 그들의 마음이 완고한 것을 몹시 슬퍼하시면서 그 사람에게,\n“손을 뻗어라.” 하고 말씀하셨다.\n그가 손을 뻗자 그 손이 다시 성하여졌다.\n6 바리사이들은 나가서 곧바로 헤로데 당원들과 더불어\n예수님을 어떻게 없앨까 모의를 하였다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n그리스도의 희생을 기념하여 이 제사를 드릴 때마다\n저희에게 구원이 이루어지오니\n이 거룩한 신비를 정성껏 거행하게 하소서.\n우리 주 …….","영성체송":"시편 23(22),5 참조\n주님이 제게 상을 차려 주시니, 제 술잔 넘치도록 가득하옵니다.\n<또는>\n1요한 4,16\n하느님이 우리에게 베푸시는 사랑을 우리는 알고 또 믿게 되었네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 천상 양식을 함께 나누고 비오니\n사랑의 성령을 부어 주시어\n그 사랑으로 한마음이 되게 하소서.\n우리 주 ……."}},"20270121":{"d":"2027년 01월 21일 목요일","c":"홍","t":"성녀 아녜스 동정 순교자 기념일","o":[],"n":"","g":"","i":"아녜스 성녀는 3세기 후반 또는 4세기 초반 로마의 유명한 귀족 가문에서 태어났다. 어릴 때부터 신심이 깊었던 그는 열네 살 무렵의 어린 나이에 순교하였다. 성녀는 청혼을 거절한 것에 앙심을 품은 자의 고발로 신자임이 드러났으나 끝까지 자신의 믿음을 버리지 않았다. 암브로시오 성인은 ‘유약한 나이에 보여 준 그의 위대한 신앙의 힘’을 높이 칭송하였다. 교회는 아녜스 성녀를 모진 박해 속에서도 신앙을 증언하고자 정결을 지킨 순교자로 기억한다. 성녀는 한 마리 양을 안고 있는 모습으로 자주 표현된다.","s":{"입당송":"보라, 이제 순결한 예물, 정결한 희생 제물인 용감한 동정녀가 우리를 위하여 십자가에 달리신 어린양을 따른다.","본기도":"전능하시고 영원하신 하느님,\n세상의 강한 자들을 부끄럽게 하시려고 약한 이들을 선택하셨으니\n복된 순교자 아녜스의 천상 탄일을 기념하며\n저희가 한결같은 그의 믿음을 본받게 하소서.\n성부와 성령과 …….","제1독서":"<예수님께서는 당신 자신을 제물로 바치심으로써 한 번에 다 이루셨습니다.>\n▥ 히브리서의 말씀입니다.\n7,25―8,6\n형제 여러분, 예수님께서는 25 당신을 통하여\n하느님께 나아가는 사람들을 언제나 구원하실 수 있습니다.\n그분께서는 늘 살아 계시어 그들을 위하여 빌어 주십니다.\n26 사실 우리는 이와 같은 대사제가 필요하였습니다.\n거룩하시고 순수하시고 순결하시고 죄인들과 떨어져 계시며\n하늘보다 더 높으신 분이 되신 대사제이십니다.\n27 그분께서는 다른 대사제들처럼 날마다 먼저 자기 죄 때문에 제물을 바치고\n그다음으로 백성의 죄 때문에 제물을 바칠 필요가 없으십니다.\n당신 자신을 바치실 때에 이 일을 단 한 번에 다 이루신 것입니다.\n28 율법은 약점을 지닌 사람들을 대사제로 세우지만,\n율법 다음에 이루어진 맹세의 그 말씀은\n영원히 완전하게 되신 아드님을 대사제로 세웁니다.\n8,1 지금 하는 말의 요점은 우리에게 이와 같은 대사제가 계시다는 것입니다.\n곧 하늘에 계신 존엄하신 분의 어좌 오른쪽에 앉으시어,\n2 사람이 아니라 주님께서 세우신 성소와 참성막에서\n직무를 수행하시는 분이십니다.\n3 모든 대사제는 예물과 제물을 바치도록 임명된 사람입니다.\n그러므로 대사제도 무엇인가 바칠 것이 있어야 합니다.\n4 만일 그분께서 세상에 계시면 사제가 되지 못하십니다.\n율법에 따라 예물을 바치는 사제들이 있기 때문입니다.\n5 모세가 성막을 세우려고 할 때에 지시를 받은 대로,\n그들은 하늘에 있는 성소의 모상이며 그림자에 지나지 않는 성소에서 봉직합니다.\n하느님께서 “자, 내가 이 산에서 너에게 보여 준 모형에 따라\n모든 것을 만들어라.” 하고 말씀하신 것입니다.\n6 그런데 이제 그리스도께서는 더 훌륭한 직무를 맡으셨습니다.\n더 나은 약속을 바탕으로 세워진 더 나은 계약의 중개자이시기 때문입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 40(39),7-8ㄱㄴ.8ㄷ-9.10.17(◎ 8ㄴ과 9ㄱ 참조)\n◎ 주님, 보소서, 당신 뜻을 이루려 제가 왔나이다.\n○ 당신은 희생과 제물을 즐기지 않으시고, 도리어 저의 귀를 열어 주셨나이다. 번제물과 속죄 제물을 바라지 않으셨나이다. 제가 아뢰었나이다. “보소서, 제가 왔나이다.” ◎\n○ 두루마리에 저의 일이 적혀 있나이다. 주 하느님, 저는 당신 뜻 즐겨 이루나이다. 당신 가르침 제 가슴속에 새겨져 있나이다. ◎\n○ 저는 큰 모임에서, 정의를 선포하나이다. 보소서, 제 입술 다물지 않음을. 주님, 당신은 아시나이다. ◎\n○ 당신을 찾는 이는 모두, 당신 안에서 기뻐 즐거워하리이다. 당신 구원을 열망하는 이는 언제나 외치게 하소서. “주님은 위대하시다.” ◎","복음 환호송":"2티모 1,10 참조\n◎ 알렐루야.\n○ 우리 구원자 그리스도 예수님은 죽음을 없애시고 복음으로 생명을 환히 보여 주셨네.\n◎ 알렐루야.","복음":"<더러운 영들은“당신은 하느님의 아드님이십니다!”하고 소리 질렀다. 예수님께서는 그들에게 당신을 사람들에게 알리지 말라고 이르셨다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n3,7-12\n그때에 7 예수님께서 제자들과 함께 호숫가로 물러가셨다.\n그러자 갈릴래아에서 큰 무리가 따라왔다.\n또 유다와 8 예루살렘, 이두매아와 요르단 건너편,\n그리고 티로와 시돈 근처에서도\n그분께서 하시는 일을 전해 듣고 큰 무리가 그분께 몰려왔다.\n9 예수님께서는 군중이 당신을 밀쳐 대는 일이 일어나지 않게 하시려고,\n당신께서 타실 거룻배 한 척을 마련하라고 제자들에게 이르셨다.\n10 그분께서 많은 사람의 병을 고쳐 주셨으므로,\n병고에 시달리는 이들은 누구나 그분에게 손을 대려고 밀려들었기 때문이다.\n11 또 더러운 영들은 그분을 보기만 하면 그 앞에 엎드려,\n“당신은 하느님의 아드님이십니다!” 하고 소리 질렀다.\n12 그러나 예수님께서는 그들에게 당신을 사람들에게 알리지 말라고\n엄하게 이르곤 하셨다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(1코린 1,26-31)와 복음(마태 13,44-46)을 봉독할 수 있다.>","예물 기도":"주님,\n일찍이 박해와 싸워 이긴 복된 아녜스의 생명을\n제물로 기꺼이 받아들이셨듯이\n그를 기리며 드리는 이 예물도 어여삐 받아 주소서.\n우리 주 …….","영성체송":"묵시 7,17 참조\n어좌 한가운데에 계신 어린양이 그들을 생명의 샘으로 이끌어 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"하느님,\n성인들 가운데 복된 아녜스에게\n동정과 순교의 두 월계관을 함께 씌워 주셨으니\n저희가 이 성사의 힘으로 모든 악을 용감히 이겨 내고\n마침내 천상 영광에 이르게 하소서.\n우리 주 ……."}},"20270122":{"d":"2027년 01월 22일 금요일","c":"녹","t":"연중 제2주간 금요일","o":[{"c":"홍","t":"성 빈첸시오 부제 순교자"}],"n":"","g":"","i":"","s":{"입당송":"시편 66(65),4 참조\n하느님, 온 세상이 당신 앞에 엎드려 당신을 노래하게 하소서. 지극히 높으신 분, 당신 이름을 노래하게 하소서.","본기도":"전능하시고 영원하신 하느님,\n하늘과 땅을 다스리시니\n저희 기도를 인자로이 들으시어\n이 시대에 하느님의 평화를 주소서.\n성부와 성령과 …….","제1독서":"<그리스도는 더 나은 계약의 중개자이십니다.>\n▥ 히브리서의 말씀입니다.\n8,6-13\n형제 여러분, 6 이제 그리스도께서는 더 훌륭한 직무를 맡으셨습니다.\n더 나은 약속을 바탕으로 세워진 더 나은 계약의 중개자이시기 때문입니다.\n7 저 첫째 계약에 결함이 없었다면, 다른 계약을 찾을 까닭이 없었을 것입니다.\n8 그런데 하느님께서는 그들의 결함을 꾸짖으시며 이렇게 말씀하십니다.\n“보라, 그날이 온다. ─ 주님께서 말씀하신다. ─\n그때에 나는 이스라엘 집안과 유다 집안과 새 계약을 맺으리라.\n9 그것은 내가 그 조상들의 손을 잡고 이집트 땅에서 이끌고 나올 때에\n그들과 맺었던 계약과는 다르다.\n그들이 내 계약을 지키지 않아 나도 그들을 돌보지 않았다.\n─ 주님께서 말씀하신다. ─\n10 그 시대가 지난 뒤에 내가 이스라엘 집안과 맺어 줄 계약은 이러하다.\n─ 주님께서 말씀하신다. ─\n나는 그들의 생각 속에 내 법을 넣어 주고 그들의 마음에 그 법을 새겨 주리라.\n그리하여 나는 그들의 하느님이 되고 그들은 나의 백성이 되리라.\n11 그때에는 아무도 자기 이웃에게,\n아무도 제 형제에게 ‘주님을 알아라.’ 하고 가르치지 않으리라.\n그들이 낮은 사람부터 높은 사람까지 모두 나를 알게 될 것이기 때문이다.\n12 나는 그들의 불의를 너그럽게 보아주고 그들의 죄를 더 이상 기억하지 않으리라.”\n13 하느님께서는 “새 계약”이라는 말씀을 하심으로써\n첫째 계약을 낡은 것으로 만드셨습니다. 낡고 오래된 것은 곧 사라집니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 85(84),8과 10.11-12.13-14(◎ 11ㄱ)\n◎ 자애와 진실이 서로 만나리라.\n○ 주님, 저희에게 당신 자애를 보여 주시고, 당신 구원을 베풀어 주소서. 그분을 경외하는 이에게 구원이 가까우니, 영광은 우리 땅에 머물리라. ◎\n○ 자애와 진실이 서로 만나고, 정의와 평화가 입을 맞추리라. 진실이 땅에서 돋아나고, 정의가 하늘에서 굽어보리라. ◎\n○ 주님이 복을 베푸시어, 우리 땅이 열매를 내리라. 정의가 그분 앞을 걸어가고, 그분은 그 길로 나아가시리라. ◎","복음 환호송":"2코린 5,19 참조\n◎ 알렐루야.\n○ 하느님이 그리스도 안에서 세상을 당신과 화해하게 하시고 우리에게 화해의 말씀을 맡기셨네.\n◎ 알렐루야.","복음":"<예수님께서는 당신께서 원하시는 이들을 부르시어 당신과 함께 지내게 하셨다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n3,13-19\n그때에 13 예수님께서 산에 올라가시어,\n당신께서 원하시는 이들을 가까이 부르시니 그들이 그분께 나아왔다.\n14 그분께서는 열둘을 세우시고 그들을 사도라 이름하셨다.\n그들을 당신과 함께 지내게 하시고, 그들을 파견하시어 복음을 선포하게 하시며,\n15 마귀들을 쫓아내는 권한을 가지게 하시려는 것이었다.\n16 이렇게 예수님께서 열둘을 세우셨는데, 그들은 베드로라는 이름을 붙여 주신 시몬,\n17 ‘천둥의 아들들’이라는 뜻으로 보아네르게스라는 이름을 붙여 주신\n제베대오의 아들 야고보와 그의 동생 요한,\n18 그리고 안드레아, 필립보, 바르톨로메오, 마태오, 토마스, 알패오의 아들 야고보,\n타대오, 열혈당원 시몬, 19 또 예수님을 팔아넘긴 유다 이스카리옷이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n그리스도의 희생을 기념하여 이 제사를 드릴 때마다\n저희에게 구원이 이루어지오니\n이 거룩한 신비를 정성껏 거행하게 하소서.\n우리 주 …….","영성체송":"시편 23(22),5 참조\n주님이 제게 상을 차려 주시니, 제 술잔 넘치도록 가득하옵니다.\n<또는>\n1요한 4,16\n하느님이 우리에게 베푸시는 사랑을 우리는 알고 또 믿게 되었네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 천상 양식을 함께 나누고 비오니\n사랑의 성령을 부어 주시어\n그 사랑으로 한마음이 되게 하소서.\n우리 주 ……."}},"20270123":{"d":"2027년 01월 23일 토요일","c":"녹","t":"연중 제2주간 토요일","o":[{"c":"백","t":"복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"시편 66(65),4 참조\n하느님, 온 세상이 당신 앞에 엎드려 당신을 노래하게 하소서. 지극히 높으신 분, 당신 이름을 노래하게 하소서.","본기도":"전능하시고 영원하신 하느님,\n하늘과 땅을 다스리시니\n저희 기도를 인자로이 들으시어\n이 시대에 하느님의 평화를 주소서.\n성부와 성령과 …….","제1독서":"<그리스도께서는 당신의 피를 가지고 단 한 번 성소로 들어가셨습니다.>\n▥ 히브리서의 말씀입니다.\n9,2-3.11-14\n형제 여러분,\n2 첫째 성막이 세워져 그 안에 등잔대와 상과 제사 빵이 놓여 있었는데,\n그곳을 ‘성소’라고 합니다.\n3 둘째 휘장 뒤에는 ‘지성소’라고 하는 성막이 있었습니다.\n11 그리스도께서는 이미 이루어진 좋은 것들을 주관하시는 대사제로 오셨습니다.\n그분께서는 사람 손으로 만들지 않은,\n곧 이 피조물에 속하지 않는\n더 훌륭하고 더 완전한 성막으로 들어가셨습니다.\n12 염소와 송아지의 피가 아니라 당신의 피를 가지고\n단 한 번 성소로 들어가시어 영원한 해방을 얻으셨습니다.\n13 염소와 황소의 피,\n그리고 더러워진 사람들에게 뿌리는 암송아지의 재가\n그들을 거룩하게 하여 그 몸을 깨끗하게 한다면,\n14 하물며 영원한 영을 통하여 흠 없는 당신 자신을\n하느님께 바치신 그리스도의 피는 우리의 양심을 죽음의 행실에서\n얼마나 더 깨끗하게 하여 살아 계신 하느님을 섬기게 할 수 있겠습니까?\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 47(46),2-3.6-7.8-9(◎ 6)\n◎ 환호 소리 가운데 하느님이 오르신다. 나팔 소리 가운데 주님이 오르신다.\n○ 모든 민족들아, 손뼉을 쳐라. 기뻐 소리치며 하느님께 환호하여라. 주님은 지극히 높으신 분, 경외로우신 분, 온 세상의 위대하신 임금이시다. ◎\n○ 환호 소리 가운데 하느님이 오르신다. 나팔 소리 가운데 주님이 오르신다. 노래하여라, 하느님께 노래하여라. 노래하여라, 우리 임금님께 노래하여라. ◎\n○ 하느님이 온 누리의 임금이시니, 찬미의 노래 불러 드려라. 하느님이 민족들을 다스리신다. 하느님이 거룩한 어좌에 앉으신다. ◎","복음 환호송":"사도 16,14 참조\n◎ 알렐루야.\n○ 주님, 저희 마음을 열어 주시어 당신 아드님 말씀에 귀 기울이게 하소서.\n◎ 알렐루야.","복음":"<그들은 예수님께서 미쳤다고 생각하였다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n3,20-21\n그때에 예수님께서 제자들과 함께 20 집으로 가셨다.\n그러자 군중이 다시 모여들어\n예수님의 일행은 음식을 들 수조차 없었다.\n21 그런데 예수님의 친척들이 소문을 듣고 그분을 붙잡으러 나섰다.\n그들은 예수님께서 미쳤다고 생각하였던 것이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n그리스도의 희생을 기념하여 이 제사를 드릴 때마다\n저희에게 구원이 이루어지오니\n이 거룩한 신비를 정성껏 거행하게 하소서.\n우리 주 …….","영성체송":"시편 23(22),5 참조\n주님이 제게 상을 차려 주시니, 제 술잔 넘치도록 가득하옵니다.\n<또는>\n1요한 4,16\n하느님이 우리에게 베푸시는 사랑을 우리는 알고 또 믿게 되었네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 천상 양식을 함께 나누고 비오니\n사랑의 성령을 부어 주시어\n그 사랑으로 한마음이 되게 하소서.\n우리 주 ……."}},"20270124":{"d":"2027년 01월 24일 일요일","c":"녹","t":"연중 제3주일","o":[],"n":"하느님의 말씀 주일","g":"대영광송 · 신경 · 교중","i":"프란치스코 교황께서는 연중 제3주일을 ‘하느님의 말씀 주일’로 선언하시며(2019년 9월 30일), 하느님 백성이 성경을 더욱더 경건하고 친숙하게 대하고, 하느님 말씀의 거행과 성찰과 전파를 위하여 이날을 봉헌하며 장엄하게 지내기를 권고하셨다.","s":{"입당송":"시편 96(95),1.6\n주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 존귀와 위엄이 그분 앞에 있고, 권능과 영화가 그분 성소에 있네.","본기도":"전능하시고 영원하신 하느님,\n저희를 자애로이 이끄시어\n사랑하시는 성자의 이름으로 저희가 옳은 일에 힘쓰게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<니네베 사람들이 악한 길에서 돌아섰다.>\n▥ 요나 예언서의 말씀입니다.\n3,1-5.10\n주님의 말씀이 1 요나에게 내렸다.\n2 “일어나 저 큰 성읍 니네베로 가서,\n내가 너에게 이르는 말을 그 성읍에 외쳐라.”\n3 요나는 주님의 말씀대로 일어나 니네베로 갔다.\n니네베는 가로지르는 데에만 사흘이나 걸리는 아주 큰 성읍이었다.\n4 요나는 그 성읍 안으로 걸어 들어가기 시작하였다.\n하룻길을 걸은 다음 이렇게 외쳤다.\n“이제 사십 일이 지나면 니네베는 무너진다!”\n5 그러자 니네베 사람들이 하느님을 믿었다.\n그들은 단식을 선포하고\n가장 높은 사람부터 가장 낮은 사람까지 자루옷을 입었다.\n10 하느님께서는 그들이 악한 길에서 돌아서는 모습을 보셨다.\n그래서 하느님께서는 마음을 돌리시어\n그들에게 내리겠다고 말씀하신 그 재앙을 내리지 않으셨다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 25(24),4-5ㄱㄴ.6과 7ㄴㄷ.8-9(◎ 4ㄱ)\n◎ 주님, 당신의 길을 알려 주소서.\n○ 주님, 당신의 길을 알려 주시고, 당신의 행로를 가르쳐 주소서. 저를 가르치시어 당신 진리로 이끄소서. 당신은 제 구원의 하느님이시옵니다. ◎\n○ 주님, 예로부터 베풀어 오신 당신의 자비와 자애 기억하소서. 주님, 당신의 자애에 따라, 당신의 어지심으로 저를 기억하소서. ◎\n○ 주님은 어질고 바르시니, 죄인들에게도 길을 가르치신다. 가련한 이 올바른 길 걷게 하시고, 가난한 이 당신 길 알게 하신다. ◎","제2독서":"<이 세상의 형체가 사라지고 있습니다.>\n▥ 사도 바오로의 코린토 1서 말씀입니다.\n7,29-31\n29 형제 여러분, 내가 말하려는 것은 이것입니다.\n때가 얼마 남지 않았습니다.\n이제부터 아내가 있는 사람은 아내가 없는 사람처럼,\n30 우는 사람은 울지 않는 사람처럼,\n기뻐하는 사람은 기뻐하지 않는 사람처럼,\n물건을 산 사람은 그것을 가지고 있지 않은 사람처럼,\n31 세상을 이용하는 사람은 이용하지 않는 사람처럼 사십시오.\n이 세상의 형체가 사라지고 있기 때문입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마르 1,15\n◎ 알렐루야.\n○ 하느님 나라가 가까이 왔다. 회개하고 복음을 믿어라.\n◎ 알렐루야.","복음":"<회개하고 복음을 믿어라.>\n✠ 마르코가 전한 거룩한 복음입니다.\n1,14-20\n14 요한이 잡힌 뒤에 예수님께서는 갈릴래아에 가시어,\n하느님의 복음을 선포하시며 15 이렇게 말씀하셨다.\n“때가 차서 하느님의 나라가 가까이 왔다. 회개하고 복음을 믿어라.”\n16 예수님께서 갈릴래아 호숫가를 지나가시다가,\n호수에 그물을 던지고 있는 시몬과 그의 동생 안드레아를 보셨다.\n그들은 어부였다.\n17 예수님께서 그들에게 이르셨다.\n“나를 따라오너라. 내가 너희를 사람 낚는 어부가 되게 하겠다.”\n18 그러자 그들은 곧바로 그물을 버리고 예수님을 따랐다.\n19 예수님께서 조금 더 가시다가,\n배에서 그물을 손질하는 제베대오의 아들 야고보와 그의 동생 요한을 보시고,\n20 곧바로 그들을 부르셨다.\n그러자 그들은 아버지 제베대오를 삯꾼들과 함께 배에 버려두고\n그분을 따라나섰다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>","예물 기도":"주님,\n저희 예물을 인자로이 받으시고 거룩하게 하시어\n이 제물이 저희를 위한 구원의 성사가 되게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<연중 주일 감사송 1 : 파스카 신비와 하느님 백성>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n저희는 죄와 죽음에서 벗어나\n선택된 겨레, 임금의 사제단, 거룩한 민족, 하느님의 백성이 되었고\n저희를 어둠에서 놀라운 빛으로 부르신 주님의 권능을\n온 세상에 전하게 되었나이다.\n이는 파스카의 신비로 이루어진 주님의 위대한 업적이옵니다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"시편 34(33),6 참조\n주님께 나아가면 빛을 받으리라. 너희 얼굴에는 부끄러움이 없으리라.\n<또는>\n요한 8,12 참조\n주님이 말씀하신다. 나는 세상의 빛이다. 나를 따르는 이는 어둠 속을 걷지 않고 생명의 빛을 얻으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성자의 살과 피로 저희를 기르시니\n하느님께서 주시는 생명의 은총으로\n저희가 언제나 기뻐하게 하소서.\n우리 주 그리스도를 통하여 비나이다."}},"20270125":{"d":"2027년 01월 25일 월요일","c":"백","t":"성 바오로 사도의 회심 축일","o":[],"n":"","g":"대영광송","i":"바오로 사도는 소아시아 킬리키아 지방의 타르수스에서 태어났다. 그는 어릴 때부터 율법을 엄격히 준수하도록 철저히 교육받은 유다인이었다. 그리스도교를 박해하던 그였으나, 다마스쿠스로 가는 길에 부활하신 예수님을 체험하고 극적으로 회심하여 그리스도를 전하는 열정적인 사도가 되었다. 8세기부터 거행하여 온 이 축일은 10세기 말 로마 전례력에 들어왔다. 교회는 회심 없이는 참된 그리스도인들의 일치가 가능하지 않다는 것을 드러내기 위하여 성 바오로 사도의 회심 축일을 ’일치 주간’의 마지막 날로 정하였다.","s":{"입당송":"2티모 1,12; 4,8 참조\n나는 내가 누구를 믿는지 잘 알고 있으며, 내가 맡은 것을 의로운 심판관이 마지막 날까지 지켜 주시리라고 확신하노라.","본기도":"하느님,\n복된 바오로 사도를 통하여 온 세상 사람들에게 복음을 전하셨으니\n오늘 그의 회심을 경축하는 저희가\n그의 모범을 따라 진리의 증인이 되고\n언제나 어디서나 복음을 전하게 하소서.\n성부와 성령과 …….","제1독서":"<일어나 예수님의 이름을 받들어 부르며 세례를 받고 죄를 용서받으십시오.>\n▥ 사도행전의 말씀입니다.\n22,3-16\n그 무렵 바오로가 백성에게 말하였다.\n3 “나는 유다 사람입니다.\n킬리키아의 타르수스에서 태어났지만 이 도성 예루살렘에서 자랐고,\n가말리엘 문하에서 조상 전래의 엄격한 율법에 따라 교육을 받았습니다.\n오늘날 여러분이 모두 그렇듯이\n나도 하느님을 열성으로 섬기는 사람이었습니다.\n4 또 신자들을 죽일 작정으로 이 새로운 길을 박해하여,\n남자 여자 할 것 없이 포박하고 감옥에 넣었습니다.\n5 대사제와 온 원로단도 나에 관하여 증언해 줄 수 있습니다.\n나는 그들에게서 동포들에게 가는 서한까지 받아 다마스쿠스로 갔습니다.\n그곳에 있는 사람들도 결박하여 예루살렘으로 끌고 와\n처벌을 받게 하려는 것이었습니다.\n6 그런데 내가 길을 떠나 정오쯤 다마스쿠스에 가까이 이르렀을 때,\n갑자기 하늘에서 큰 빛이 번쩍이며 내 둘레를 비추었습니다.\n7 나는 바닥에 엎어졌습니다.\n그리고 ‘사울아, 사울아, 왜 나를 박해하느냐?’ 하고\n나에게 말하는 소리를 들었습니다.\n8 내가 ‘주님, 주님은 누구십니까?’ 하고 여쭙자,\n그분께서 나에게 이르셨습니다.\n‘나는 네가 박해하는 나자렛 사람 예수다.’\n9 나와 함께 있던 이들은 빛은 보았지만,\n나에게 말씀하시는 분의 소리는 듣지 못하였습니다.\n10 ‘주님, 제가 어떻게 해야 합니까?’ 하고 내가 여쭈었더니,\n주님께서 나에게 이르셨습니다. ‘일어나 다마스쿠스로 들어가거라.\n장차 네가 하도록 결정되어 있는 모든 일에 관하여\n거기에서 누가 너에게 일러 줄 것이다.’\n11 나는 그 눈부신 빛 때문에 앞을 볼 수가 없어,\n나와 함께 가던 이들의 손에 이끌려 다마스쿠스로 들어갔습니다.\n12 거기에는 하나니아스라는 사람이 있었습니다.\n그는 율법에 따라 사는 독실한 사람으로,\n그곳에 사는 모든 유다인에게 좋은 평판을 받고 있었습니다.\n13 그가 나를 찾아와 앞에 서서,\n‘사울 형제, 눈을 뜨십시오.’ 하고 나에게 말하였습니다.\n그 순간 나는 눈을 뜨고 그를 보게 되었습니다.\n14 그때에 하나니아스가 말하였습니다.\n‘우리 조상들의 하느님께서는 당신을 선택하시어,\n그분의 뜻을 깨닫고 의로우신 분을 뵙고\n또 그분의 입에서 나오는 소리를 듣게 하셨습니다.\n15 당신이 보고 들은 것을 모든 사람에게 전하는 그분의 증인이 되라는 것입니다.\n16 그러니 이제 무엇을 망설입니까?\n일어나 그분의 이름을 받들어 부르며 세례를 받고 죄를 용서받으십시오.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n<네가 해야 할 일을 누가 일러 줄 것이다.>\n▥ 사도행전의 말씀입니다.\n9,1-22\n그 무렵 1 사울은 여전히 주님의 제자들을 향하여 살기를 내뿜으며\n대사제에게 가서, 2 다마스쿠스에 있는 회당들에 보내는 서한을 청하였다.\n새로운 길을 따르는 이들을 찾아내기만 하면\n남자든 여자든 결박하여 예루살렘으로 끌고 오겠다는 것이었다.\n3 사울이 길을 떠나 다마스쿠스에 가까이 이르렀을 때,\n갑자기 하늘에서 빛이 번쩍이며 그의 둘레를 비추었다.\n4 그는 땅에 엎어졌다.\n그리고 “사울아, 사울아, 왜 나를 박해하느냐?” 하고\n자기에게 말하는 소리를 들었다.\n5 사울이 “주님, 주님은 누구십니까?” 하고 묻자 그분께서 대답하셨다.\n“나는 네가 박해하는 예수다. 6 이제 일어나 성안으로 들어가거라.\n네가 해야 할 일을 누가 일러 줄 것이다.”\n7 사울과 동행하던 사람들은 소리는 들었지만\n아무도 볼 수 없었으므로 멍하게 서 있었다.\n8 사울은 땅에서 일어나 눈을 떴으나 아무것도 볼 수가 없었다.\n그래서 사람들이 그의 손을 잡고 다마스쿠스로 데려갔다.\n9 사울은 사흘 동안 앞을 보지 못하였는데,\n그동안 그는 먹지도 않고 마시지도 않았다.\n10 다마스쿠스에 하나니아스라는 제자가 있었다.\n주님께서 환시 중에 “하나니아스야!” 하고 그를 부르셨다.\n그가 “예, 주님.” 하고 대답하자 11 주님께서 그에게 말씀하셨다.\n“일어나 ‘곧은 길’이라는 거리로 가서,\n유다의 집에 있는 사울이라는 타르수스 사람을 찾아라.\n지금 사울은 기도하고 있는데,\n12 그는 환시 중에 하나니아스라는 사람이 들어와 자기에게 안수하여\n다시 볼 수 있게 해 주는 것을 보았다.”\n13 하나니아스가 대답하였다. “주님, 그 사람이 예루살렘에서\n주님의 성도들에게 얼마나 못된 짓을 하였는지\n제가 많은 이들에게서 들었습니다.\n14 그리고 그는 주님의 이름을 받들어 부르는 이들을 모두 결박할 권한을\n수석 사제들에게서 받아 가지고 여기에 와 있습니다.”\n15 주님께서 그에게 이르셨다. “가거라. 그는 다른 민족들과 임금들과\n이스라엘 자손들에게 내 이름을 알리도록 내가 선택한 그릇이다.\n16 나는 그가 내 이름을 위하여 얼마나 많은 고난을 받아야 하는지\n그에게 보여 주겠다.”\n17 그리하여 하나니아스는 길을 나섰다.\n그리고 그 집에 들어가 사울에게 안수하고 나서 말하였다.\n“사울 형제, 당신이 다시 보고 성령으로 충만해지도록 주님께서,\n곧 당신이 이리 오는 길에 나타나신 예수님께서 나를 보내셨습니다.”\n18 그러자 곧 사울의 눈에서 비늘 같은 것이 떨어지면서 다시 보게 되었다.\n그는 일어나 세례를 받은 다음 19 음식을 먹고 기운을 차렸다.\n사울은 며칠 동안 다마스쿠스에 있는 제자들과 함께 지낸 뒤,\n20 곧바로 여러 회당에서 예수님은 하느님의 아드님이시라고 선포하였다.\n21 그 말을 들은 자들은 모두 놀라며, “저 사람은 예루살렘에서\n예수의 이름을 받들어 부르는 자들을 짓밟은 자가 아닌가?\n또 바로 그런 자들을 결박하여 수석 사제들에게 끌어가려고\n여기에 온 것이 아닌가?” 하고 말하였다.\n22 그러나 사울은 더욱 힘차게 예수님께서 메시아이심을 증명하여,\n다마스쿠스에 사는 유다인들을 당혹하게 만들었다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 117(116),1.2ㄱㄴ(◎ 마르 16,15 참조)\n◎ 너희는 온 세상에 가서 복음을 선포하여라.\n○ 주님을 찬양하여라, 모든 민족들아. 주님을 찬미하여라, 모든 겨레들아. ◎\n○ 우리 위한 주님 사랑 굳건하여라. 주님의 진실하심 영원하여라. ◎","복음 환호송":"요한 15,16 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 내가 너희를 세상에서 뽑아 세웠으니, 가서 열매를 맺어라. 너희 열매는 길이 남으리라.\n◎ 알렐루야.","복음":"<너희는 온 세상에 가서 복음을 선포하여라.>\n✠ 마르코가 전한 거룩한 복음입니다.\n16,15-18\n그때에 예수님께서 열한 제자에게 나타나시어 15 그들에게 이르셨다.\n“너희는 온 세상에 가서 모든 피조물에게 복음을 선포하여라.\n16 믿고 세례를 받는 이는 구원을 받고 믿지 않는 자는 단죄를 받을 것이다.\n17 믿는 이들에게는 이러한 표징들이 따를 것이다.\n곧 내 이름으로 마귀들을 쫓아내고 새로운 언어들을 말하며,\n18 손으로 뱀을 집어 들고 독을 마셔도 아무런 해도 입지 않으며,\n또 병자들에게 손을 얹으면 병이 나을 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님, 복된 바오로 사도를 성령으로 가득 채우시어\n주님의 영광을 널리 전하게 하셨으니\n이 거룩한 제사를 드리는 저희의 믿음도 성령의 빛으로 밝혀 주소서.\n우리 주 …….","감사송":"<사도 감사송 2 : 교회의 기초이며 증거자인 사도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사도들을 기초로 삼아 그 위에 교회를 세우시어\n지상에서 주님의 거룩하고 영원한 표지가 되게 하시고\n모든 사람에게 구원의 복음을 전하게 하셨나이다.\n그러므로 이제와 영원히 모든 천사와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"갈라 2,20 참조\n나는 나를 사랑하시고 나를 위하여 당신 자신을 바치신 하느님의 아드님에 대한 믿음으로 사노라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주 하느님,\n복된 바오로 사도가 뜨거운 사랑으로 모든 교회를 돌보게 하셨으니\n성체를 받아 모신 저희 마음에도 그 사랑의 불이 타오르게 하소서.\n우리 주 ……."}},"20270126":{"d":"2027년 01월 26일 화요일","c":"백","t":"성 티모테오와 성 티토 주교 기념일","o":[],"n":"","g":"","i":"티모테오 성인과 티토 성인은 바오로 사도의 제자이며 선교 활동의 협력자들이었다. 티모테오는 에페소 교회를, 티토는 크레타 교회를 맡아 돌보았다.\n바오로 사도는 그의 서간 여러 곳에서 이들을 칭찬하고 있다. 또한 바오로 사도가 ‘티모테오에게 보낸 첫째 서간’과 ‘둘째 서간’, 그리고 ‘티토에게 보낸 서간’에는 목자들과 신자들에게 지침이 되는 권고가 많이 담겨 있다.","s":{"입당송":"시편 96(95),3-4 참조\n전하여라, 겨레들에게 주님의 영광을, 모든 민족들에게 그분의 기적을. 주님은 위대하시고 드높이 찬양받으실 분이시다.","본기도":"하느님,\n복된 티모테오와 티토에게 사도의 지혜와 용기를 주셨으니\n그들의 전구를 들으시어\n저희가 현세에서 정의와 사랑을 실천하며 살다가\n마침내 천상 고향에 이르게 하소서.\n성부와 성령과 …….","제1독서":"<나는 그대 안에 있는 진실한 믿음을 기억합니다.>\n▥ 사도 바오로의 티모테오 2서 시작입니다.\n1,1-8\n1 하느님의 뜻에 따라, 또 그리스도 예수님 안에 있는 생명의 약속에 따라\n그리스도 예수님의 사도가 된 바오로가,\n2 사랑하는 아들 티모테오에게 인사합니다.\n하느님 아버지와 우리 주 그리스도 예수님에게서\n은총과 자비와 평화가 내리기를 빕니다.\n3 나는 밤낮으로 기도할 때마다 끊임없이 그대를 생각하면서,\n내가 조상들과 마찬가지로 깨끗한 양심으로 섬기는 하느님께 감사를 드립니다.\n4 나는 그대의 눈물을 생각하면서\n그대를 다시 볼 수 있기를 간절히 바랍니다.\n그렇게 된다면 내가 기쁨으로 가득 찰 것입니다.\n5 나는 그대 안에 있는 진실한 믿음을 기억합니다.\n먼저 그대의 할머니 로이스와 어머니 에우니케에게 깃들어 있던 그 믿음이,\n이제는 그대에게도 깃들어 있다고 확신합니다.\n6 그러한 까닭에 나는 그대에게 상기시킵니다.\n내 안수로 그대가 받은 하느님의 은사를 다시 불태우십시오.\n7 하느님께서는 우리에게 비겁함의 영을 주신 것이 아니라,\n힘과 사랑과 절제의 영을 주셨습니다.\n8 그러므로 그대는 우리 주님을 위하여 증언하는 것을 부끄러워하지 말고,\n그분 때문에 수인이 된 나를 부끄러워하지 마십시오.\n오히려 하느님의 힘에 의지하여 복음을 위한 고난에 동참하십시오.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n<나 바오로가 같은 믿음에 따라 나의 착실한 아들이 된 티토에게 인사합니다.>\n▥ 사도 바오로의 티토서 말씀입니다.\n1,1-5\n1 나 바오로는 하느님의 종이며 예수 그리스도의 사도입니다.\n내가 이렇게 부르심을 받은 것은 하느님께 선택된 이들의 믿음을 돕고\n신앙에 따른 진리를 깨우쳐 주기 위한 것으로,\n2 영원한 생명의 희망에 근거합니다.\n이 영원한 생명은 거짓이 없으신 하느님께서 창조 이전에 약속하신 것입니다.\n3 사실 하느님께서는 제때에 복음 선포를 통하여\n당신의 말씀을 드러내셨습니다.\n나는 우리 구원자이신 하느님의 명령에 따라 이 선포의 임무를 맡았습니다.\n4 이러한 나 바오로가 같은 믿음에 따라\n나의 착실한 아들이 된 티토에게 인사합니다.\n하느님 아버지와 우리 구원자이신 그리스도 예수님에게서\n은총과 평화가 내리기를 빕니다.\n5 그대를 크레타에 남겨 둔 까닭은, 내가 그대에게 지시한 대로\n남은 일들을 정리하고 고을마다 원로들을 임명하라는 것이었습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 96(95),1-2ㄱ.2ㄴ-3.7-8ㄱ.10(◎ 3 참조)\n◎ 모든 민족들에게 주님의 기적을 전하여라.\n○ 주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 주님께 노래하여라, 그 이름 찬미하여라. ◎\n○ 나날이 선포하여라, 그분의 구원을. 전하여라, 겨레들에게 그분의 영광을, 모든 민족들에게 그분의 기적을. ◎\n○ 주님께 드려라, 뭇 민족의 가문들아. 주님께 드려라, 영광과 권능을. 주님께 드려라, 그 이름의 영광을. ◎\n○ 겨레들에게 말하여라. “주님은 임금이시다. 누리는 정녕 굳게 세워져 흔들리지 않고, 그분은 민족들을 올바르게 심판하신다.” ◎","복음 환호송":"루카 4,18\n◎ 알렐루야.\n○ 주님이 나를 보내시어 가난한 이들에게 기쁜 소식을 전하고 잡혀간 이들에게 해방을 선포하게 하셨다.\n◎ 알렐루야.","복음":"<수확할 것은 많은데 일꾼은 적다.>\n✠ 루카가 전한 거룩한 복음입니다.\n10,1-9\n그때에 1 주님께서는 다른 제자 일흔두 명을 지명하시어,\n몸소 가시려는 모든 고을과 고장으로 당신에 앞서 둘씩 보내시며,\n2 그들에게 말씀하셨다.\n“수확할 것은 많은데 일꾼은 적다.\n그러니 수확할 밭의 주인님께 일꾼들을 보내 주십사고 청하여라.\n3 가거라. 나는 이제 양들을 이리 떼 가운데로 보내는 것처럼 너희를 보낸다.\n4 돈주머니도 여행 보따리도 신발도 지니지 말고,\n길에서 아무에게도 인사하지 마라.\n5 어떤 집에 들어가거든 먼저 ‘이 집에 평화를 빕니다.’ 하고 말하여라.\n6 그 집에 평화를 받을 사람이 있으면 너희의 평화가 그 사람 위에 머무르고,\n그렇지 않으면 너희에게 되돌아올 것이다.\n7 같은 집에 머무르면서 주는 것을 먹고 마셔라.\n일꾼이 품삯을 받는 것은 당연하다.\n이 집 저 집으로 옮겨 다니지 마라.\n8 어떤 고을에 들어가든지 너희를 받아들이면 차려 주는 음식을 먹어라.\n9 그곳 병자들을 고쳐 주며,\n‘하느님의 나라가 여러분에게 가까이 왔습니다.’ 하고 말하여라.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n복된 티모테오와 티토를 기리며 바치는 이 예물을 받으시고\n저희 마음을 깨끗이 씻어 주시어\n저희가 주님께 맞갖은 제물이 되게 하소서.\n우리 주 …….","영성체송":"마르 16,15; 마태 28,20 참조\n주님이 말씀하신다. 너희는 온 세상에 가서 복음을 선포하여라. 내가 언제나 너희와 함께 있으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주 하느님,\n거룩하신 성체를 받아 모시고 비오니\n복된 티모테오와 티토가 열성으로 전파하고 굳게 지킨 믿음을\n저희가 더욱 풍성히 가꾸어 나가게 하소서.\n우리 주 ……."}},"20270127":{"d":"2027년 01월 27일 수요일","c":"녹","t":"연중 제3주간 수요일","o":[{"c":"백","t":"성녀 안젤라 메리치 동정"}],"n":"","g":"","i":"","s":{"입당송":"시편 96(95),1.6\n주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 존귀와 위엄이 그분 앞에 있고, 권능과 영화가 그분 성소에 있네.","본기도":"전능하시고 영원하신 하느님,\n저희를 자애로이 이끄시어\n사랑하시는 성자의 이름으로 저희가 옳은 일에 힘쓰게 하소서.\n성부와 성령과 …….","제1독서":"<그리스도께서는 거룩해지는 이들을 영구히 완전하게 해 주셨습니다.>\n▥ 히브리서의 말씀입니다.\n10,11-18\n11 모든 사제는 날마다 서서 같은 제물을 거듭 바치며 직무를 수행하지만,\n그러한 것들은 결코 죄를 없애지 못합니다.\n12 그러나 그리스도께서는 죄를 없애시려고 한 번 제물을 바치시고 나서,\n영구히 하느님의 오른쪽에 앉으셨습니다.\n13 이제 그분께서는 당신의 원수들이\n당신의 발판이 될 때까지 기다리고 계십니다.\n14 한 번의 예물로, 거룩해지는 이들을 영구히 완전하게 해 주신 것입니다.\n15 성령께서도 우리에게 증언해 주시니, 먼저 이렇게 말씀하셨습니다.\n16 “그 시대가 지난 뒤에 내가 그들과 맺어 줄 계약은 이러하다.\n─ 주님께서 말씀하신다. ─\n나는 그들의 마음에 내 법을 넣어 주고 그들의 생각에 그 법을 새겨 주리라.”\n17 그리고 이렇게 덧붙이셨습니다.\n“나는 그들의 죄와 그들의 불의를 더 이상 기억하지 않으리라.”\n18 이러한 것들이 용서된 곳에는 더 이상 죄 때문에 바치는 예물이 필요 없습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 110(109),1.2.3.4(◎ 4ㄴㄷ)\n◎ 멜키체덱과 같이 너는 영원한 사제로다.\n○ 주님께서 내 주께 이르셨나이다. “내가 너의 원수들을 너의 발판으로 삼을 때까지, 너는 내 오른쪽에 앉아 있어라.” ◎\n○ 주님이 당신 권능의 왕홀을 시온에서 뻗치시리이다. “너의 원수들을 다스려라.” ◎\n○ 네 권능의 날에, 주권이 너와 함께하리라. 거룩한 빛, 새벽 품에서, 나는 너를 낳았노라. ◎\n○ 주님은 맹세하시고 뉘우치지 않으시리이다. “멜키체덱과 같이, 너는 영원한 사제로다.” ◎","복음 환호송":"◎ 알렐루야.\n○ 씨앗은 하느님의 말씀, 씨 뿌리는 이는 그리스도이시니 그분을 찾는 사람은 모두 영원히 살리라.\n◎ 알렐루야.","복음":"<씨 뿌리는 사람이 씨를 뿌리러 나갔다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n4,1-20\n그때에 1 예수님께서 호숫가에서 가르치기 시작하셨다.\n너무 많은 군중이 모여들어,\n그분께서는 호수에 있는 배에 올라앉으시고\n군중은 모두 호숫가 뭍에 그대로 있었다.\n2 예수님께서 그들에게 많은 것을 비유로 가르치셨다.\n그렇게 가르치시면서 말씀하셨다.\n3 “자, 들어 보아라. 씨 뿌리는 사람이 씨를 뿌리러 나갔다.\n4 그가 씨를 뿌리는데, 어떤 것은 길에 떨어져 새들이 와서 먹어 버렸다.\n5 어떤 것은 흙이 많지 않은 돌밭에 떨어졌다.\n흙이 깊지 않아 싹은 곧 돋아났지만,\n6 해가 솟아오르자 타고 말았다. 뿌리가 없어서 말라 버린 것이다.\n7 또 어떤 것은 가시덤불 속에 떨어졌는데,\n가시덤불이 자라면서 숨을 막아 버려 열매를 맺지 못하였다.\n8 그러나 어떤 것들은 좋은 땅에 떨어져, 싹이 나고 자라서 열매를 맺었다.\n그리하여 어떤 것은 서른 배,\n어떤 것은 예순 배, 어떤 것은 백 배의 열매를 맺었다.”\n9 예수님께서는 이어서 말씀하셨다. “들을 귀 있는 사람은 들어라.”\n10 예수님께서 혼자 계실 때,\n그분 둘레에 있던 이들이 열두 제자와 함께 와서 비유들의 뜻을 물었다.\n11 예수님께서 그들에게 대답하셨다.\n“너희에게는 하느님 나라의 신비가 주어졌지만,\n저 바깥 사람들에게는 모든 것이 그저 비유로만 다가간다.\n12 ‘보고 또 보아도 알아보지 못하고\n듣고 또 들어도 깨닫지 못하여\n저들이 돌아와 용서받는 일이 없게 하려는 것이다.’”\n13 예수님께서 또 그들에게 말씀하셨다.\n“너희는 이 비유를 알아듣지 못하겠느냐?\n그러면서 어떻게 모든 비유를 깨달을 수 있겠느냐?\n14 씨 뿌리는 사람은 실상 말씀을 뿌리는 것이다.\n15 말씀이 길에 뿌려지는 것은 이러한 사람들을 두고 하는 말이다.\n그들이 말씀을 들으면 곧바로 사탄이 와서\n그들 안에 뿌려진 말씀을 앗아 가 버린다.\n16 그리고 말씀이 돌밭에 뿌려지는 것은 이러한 사람들이다.\n그들은 말씀을 들으면 곧 기쁘게 받는다.\n17 그러나 그들에게 뿌리가 없어서 오래가지 못한다.\n그래서 말씀 때문에 환난이나 박해가 일어나면 곧 걸려 넘어지고 만다.\n18 말씀이 가시덤불 속에 뿌려지는 것은 또 다른 사람들이다.\n이들은 말씀을 듣기는 하지만,\n19 세상 걱정과 재물의 유혹과 그 밖의 여러 가지 욕심이 들어가,\n그 말씀의 숨을 막아 버려 열매를 맺지 못한다.\n20 그러나 말씀이 좋은 땅에 뿌려진 것은 이러한 사람들이다.\n그들은 말씀을 듣고 받아들여, 어떤 이는 서른 배,\n어떤 이는 예순 배, 어떤 이는 백 배의 열매를 맺는다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희 예물을 인자로이 받으시고 거룩하게 하시어\n이 제물이 저희를 위한 구원의 성사가 되게 하소서.\n우리 주 …….","영성체송":"시편 34(33),6 참조\n주님께 나아가면 빛을 받으리라. 너희 얼굴에는 부끄러움이 없으리라.\n<또는>\n요한 8,12 참조\n주님이 말씀하신다. 나는 세상의 빛이다. 나를 따르는 이는 어둠 속을 걷지 않고 생명의 빛을 얻으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성자의 살과 피로 저희를 기르시니\n하느님께서 주시는 생명의 은총으로\n저희가 언제나 기뻐하게 하소서.\n우리 주 ……."}},"20270128":{"d":"2027년 01월 28일 목요일","c":"백","t":"성 토마스 아퀴나스 사제 학자 기념일","o":[],"n":"","g":"","i":"토마스 아퀴나스 성인은 1225년 무렵 이탈리아의 한 귀족 가문에서 태어났다. 그는 몬테카시노 수도원과 나폴리 대학교에서 공부하였으며, 가족의 반대를 무릅쓰고 성 도미니코 수도회에 들어가 대 알베르토 성인의 제자가 되었다. 1245년부터 파리에서 공부한 성인은 삼 년 뒤 독일 쾰른에서 사제품을 받고 그곳 신학교의 교수로 활동하였다. 그는 철학과 신학에 관한 훌륭한 저서를 많이 남겼는데, 특히 『신학 대전』은 그의 기념비적인 저술로 꼽힌다. 1274년에 선종하였으며, 1323년에 시성되었다.","s":{"입당송":"집회 15,5 참조\n주님이 그를 지혜와 지식의 영으로 충만하게 하시어, 회중 가운데에서 그의 입을 열어 주시고, 영광의 옷을 입혀 주셨네.","본기도":"하느님,\n복된 토마스를 뛰어난 성덕과 거룩한 학문의 본보기로 세워 주셨으니\n저희가 그의 가르침을 깨닫고 그 삶을 본받게 하소서.\n성부와 성령과 …….","제1독서":"<확고한 믿음으로 고백하는 희망을 굳게 간직하고 서로 자극을 주어 사랑하도록 주의를 기울입시다.>\n▥ 히브리서의 말씀입니다.\n10,19-25\n19 형제 여러분,\n우리는 예수님의 피 덕분에 성소에 들어간다는 확신을 가지고 있습니다.\n20 그분께서는 그 휘장을 관통하는 새롭고도 살아 있는 길을\n우리에게 열어 주셨습니다.\n곧 당신의 몸을 통하여 그리해 주셨습니다.\n21 우리에게는 하느님의 집을 다스리시는 위대한 사제가 계십니다.\n22 그러니 진실한 마음과 확고한 믿음을 가지고 하느님께 나아갑시다.\n우리의 마음은 그리스도의 피가 뿌려져 악에 물든 양심을 벗고 깨끗해졌으며,\n우리의 몸은 맑은 물로 말끔히 씻겼습니다.\n23 우리가 고백하는 희망을 굳게 간직합시다.\n약속해 주신 분은 성실하신 분이십니다.\n24 서로 자극을 주어 사랑과 선행을 하도록 주의를 기울입시다.\n25 어떤 이들이 습관적으로 그러듯이\n우리의 모임을 소홀히 하지 말고, 서로 격려합시다.\n여러분도 보다시피 그날이 가까이 오고 있으니 더욱더 그렇게 합시다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 24(23),1-2.3-4ㄱㄴ.5-6(◎ 6 참조)\n◎ 주님, 이들이 당신 얼굴을 찾는 세대이옵니다.\n○ 주님의 것이라네, 온 땅과 그 안에 가득 찬 것들, 온 누리와 그 안에 사는 것들. 그분이 물 위에 세우시고, 강 위에 굳히셨네. ◎\n○ 누가 주님의 산에 오를 수 있으랴? 누가 그 거룩한 곳에 설 수 있으랴? 손이 깨끗하고 마음이 결백한 이, 헛된 것에 정신을 팔지 않는 이라네. ◎\n○ 그는 주님께 복을 받으리라. 구원의 하느님께 의로움을 얻으리라. 이들이 야곱이라네. 그분을 찾는 세대, 그분 얼굴을 찾는 세대라네. ◎","복음 환호송":"시편 119(118),105 참조\n◎ 알렐루야.\n○ 주님 말씀은 제 발에 등불, 저의 길을 밝히는 빛이옵니다.\n◎ 알렐루야.","복음":"<등불은 등경 위에 놓는다. 너희가 되어서 주는 만큼 되어서 받을 것이다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n4,21-25\n그때에 예수님께서 군중에게 21 말씀하셨다.\n“누가 등불을 가져다가 함지 속이나 침상 밑에 놓겠느냐? 등경 위에 놓지 않느냐?\n22 숨겨진 것도 드러나기 마련이고 감추어진 것도 드러나게 되어 있다.\n23 누구든지 들을 귀가 있거든 들어라.”\n24 예수님께서 다시 그들에게 말씀하셨다. “너희는 새겨들어라.\n너희가 되어서 주는 만큼 되어서 받고 거기에 더 보태어 받을 것이다.\n25 정녕 가진 자는 더 받고 가진 것 없는 자는 가진 것마저 빼앗길 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(지혜 7,7-10.15-16)와 복음(마태 23,8-12)을 봉독할 수 있다.>","예물 기도":"하느님,\n복된 토마스를 기리며 드리는 이 제사를 자비로이 굽어보시고\n저희도 그의 가르침을 충실히 따라\n하느님께 드리는 찬미의 제물이 되게 하소서.\n우리 주 …….","영성체송":"루카 12,42 참조\n주님은 당신 가족을 맡겨 제때에 정해진 양식을 내주게 할 충실하고 슬기로운 종을 세우셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n살아 있는 빵이신 그리스도의 성체로 저희의 힘을 북돋아 주시니\n복된 토마스를 기리는 저희가\n스승이신 그리스도의 가르침을 따라 진리를 깨닫고\n그 진리를 사랑으로 실천하게 하소서.\n우리 주 ……."}},"20270129":{"d":"2027년 01월 29일 금요일","c":"녹","t":"연중 제3주간 금요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 96(95),1.6\n주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 존귀와 위엄이 그분 앞에 있고, 권능과 영화가 그분 성소에 있네.","본기도":"전능하시고 영원하신 하느님,\n저희를 자애로이 이끄시어\n사랑하시는 성자의 이름으로 저희가 옳은 일에 힘쓰게 하소서.\n성부와 성령과 …….","제1독서":"<많은 싸움을 견디어 냈으니 확신을 버리지 마십시오.>\n▥ 히브리서의 말씀입니다.\n10,32-39\n형제 여러분, 32 예전에 여러분이 빛을 받은 뒤에\n많은 고난의 싸움을 견디어 낸 때를 기억해 보십시오.\n33 어떤 때에는 공공연히 모욕과 환난을 당하기도 하고,\n어떤 때에는 그러한 처지에 빠진 이들에게 동무가 되어 주기도 하였습니다.\n34 여러분은 또한 감옥에 갇힌 이들과 고통을 함께 나누었고,\n재산을 빼앗기는 일도 기쁘게 받아들였습니다.\n그보다 더 좋고 또 길이 남는 재산을 가지고 있다는 것을 알고 있었기 때문입니다.\n35 그러니 여러분의 그 확신을 버리지 마십시오.\n그것은 큰 상을 가져다줍니다.\n36 여러분이 하느님의 뜻을 이루어 약속된 것을 얻으려면 인내가 필요합니다.\n37 “조금만 더 있으면 올 이가 오리라. 지체하지 않으리라.\n38 나의 의인은 믿음으로 살리라.\n그러나 뒤로 물러서는 자는 내 마음이 기꺼워하지 않는다.”\n39 우리는 뒤로 물러나 멸망할 사람이 아니라,\n믿어서 생명을 얻을 사람입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 37(36),3-4.5-6.23-24.39-40(◎ 39ㄱ)\n◎ 의인들의 구원은 주님에게서 오네.\n○ 주님을 믿으며 좋은 일 하고, 이 땅에 살며 신의를 지켜라. 주님 안에서 즐거워하여라. 네 마음이 청하는 대로 주시리라. ◎\n○ 주님께 네 길을 맡기고 신뢰하여라. 그분이 몸소 해 주시리라. 빛처럼 네 정의를 빛내시고, 대낮처럼 네 공정을 밝히시리라. ◎\n○ 주님은 사람의 발걸음 지켜 주시며, 그 길을 마음에 들어 하시리라. 주님이 그 손을 잡아 주시니, 비틀거려도 쓰러지지 않으리라. ◎\n○ 의인들의 구원은 주님에게서 오고, 그분은 어려울 때 피신처가 되신다. 의인들이 주님께 몸을 숨겼으니, 그분은 그들을 도와 구하시고, 악인에게서 빼내 구원하시리라. ◎","복음 환호송":"마태 11,25 참조\n◎ 알렐루야.\n○ 하늘과 땅의 주님이신 아버지, 찬미받으소서. 아버지는 하늘 나라의 신비를 철부지들에게 드러내 보이셨나이다.\n◎ 알렐루야.","복음":"<씨를 뿌리고 자는 사이에 씨는 자라는데, 그 사람은 모른다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n4,26-34\n그때에 예수님께서 군중에게 26 말씀하셨다.\n“하느님의 나라는 이와 같다. 어떤 사람이 땅에 씨를 뿌려 놓으면,\n27 밤에 자고 낮에 일어나고 하는 사이에 씨는 싹이 터서 자라는데,\n그 사람은 어떻게 그리되는지 모른다.\n28 땅이 저절로 열매를 맺게 하는데,\n처음에는 줄기가, 다음에는 이삭이 나오고 그다음에는 이삭에 낟알이 영근다.\n29 곡식이 익으면 그 사람은 곧 낫을 댄다. 수확 때가 되었기 때문이다.”\n30 예수님께서 다시 말씀하셨다.\n“하느님의 나라를 무엇에 비길까? 무슨 비유로 그것을 나타낼까?\n31 하느님의 나라는 겨자씨와 같다. 땅에 뿌릴 때에는 세상의 어떤 씨앗보다도 작다.\n32 그러나 땅에 뿌려지면 자라나서 어떤 풀보다도 커지고 큰 가지들을 뻗어,\n하늘의 새들이 그 그늘에 깃들일 수 있게 된다.”\n33 예수님께서는 그들이 알아들을 수 있을 정도로 이처럼 많은 비유로 말씀을 하셨다.\n34 비유를 들지 않고는 그들에게 말씀하지 않으셨다.\n그러나 당신의 제자들에게는 따로 모든 것을 풀이해 주셨다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희 예물을 인자로이 받으시고 거룩하게 하시어\n이 제물이 저희를 위한 구원의 성사가 되게 하소서.\n우리 주 …….","영성체송":"시편 34(33),6 참조\n주님께 나아가면 빛을 받으리라. 너희 얼굴에는 부끄러움이 없으리라.\n<또는>\n요한 8,12 참조\n주님이 말씀하신다. 나는 세상의 빛이다. 나를 따르는 이는 어둠 속을 걷지 않고 생명의 빛을 얻으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성자의 살과 피로 저희를 기르시니\n하느님께서 주시는 생명의 은총으로\n저희가 언제나 기뻐하게 하소서.\n우리 주 ……."}},"20270130":{"d":"2027년 01월 30일 토요일","c":"녹","t":"연중 제3주간 토요일","o":[{"c":"백","t":"복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"시편 96(95),1.6\n주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 존귀와 위엄이 그분 앞에 있고, 권능과 영화가 그분 성소에 있네.","본기도":"전능하시고 영원하신 하느님,\n저희를 자애로이 이끄시어\n사랑하시는 성자의 이름으로 저희가 옳은 일에 힘쓰게 하소서.\n성부와 성령과 …….","제1독서":"<아브라함은 하느님께서 설계하시고 건축하신 도성을 기다리고 있었습니다.>\n▥ 히브리서의 말씀입니다.\n11,1-2.8-19\n형제 여러분, 1 믿음은 우리가 바라는 것들의 보증이며\n보이지 않는 실체들의 확증입니다.\n2 사실 옛사람들은 믿음으로 인정을 받았습니다.\n8 믿음으로써, 아브라함은 장차 상속 재산으로 받을 곳을 향하여\n떠나라는 부르심을 받고 그대로 순종하였습니다.\n그는 어디로 가는지도 모르고 떠난 것입니다.\n9 믿음으로써, 그는 같은 약속의 공동 상속자인 이사악과 야곱과 함께\n천막을 치고 머무르면서,\n약속받은 땅인데도 남의 땅인 것처럼 이방인으로 살았습니다.\n10 하느님께서 설계자이시며 건축가로서\n튼튼한 기초를 갖추어 주신 도성을 기다리고 있었기 때문입니다.\n11 믿음으로써, 사라는 아이를 가지지 못하는 여인인 데다\n나이까지 지났는데도 임신할 능력을 얻었습니다.\n약속해 주신 분을 성실하신 분으로 여겼기 때문입니다.\n12 그리하여 한 사람에게서, 그것도 죽은 것이나 다름없는 사람에게서\n하늘의 별처럼 수가 많고 바닷가의 모래처럼 셀 수 없는 후손이 태어났습니다.\n13 이들은 모두 믿음 속에 죽어 갔습니다.\n약속된 것을 받지는 못하였지만 멀리서 그것을 보고 반겼습니다.\n그리고 자기들은 이 세상에서 이방인이며 나그네일 따름이라고 고백하였습니다.\n14 그들은 이렇게 말함으로써 자기들이 본향을 찾고 있음을 분명히 드러냈습니다.\n15 만일 그들이 떠나온 곳을 생각하고 있었다면, 돌아갈 기회가 있었을 것입니다.\n16 그러나 실상 그들은 더 나은 곳, 바로 하늘 본향을 갈망하고 있었습니다.\n그래서 하느님께서는 그들의 하느님이라고 불리시는 것을 부끄러워하지 않으시고,\n그들에게 도성을 마련해 주셨습니다.\n17 믿음으로써, 아브라함은 시험을 받을 때에 이사악을 바쳤습니다.\n약속을 받은 아브라함이 외아들을 바치려고 하였습니다.\n18 그 외아들을 두고 하느님께서는 일찍이,\n“이사악을 통하여 후손들이 너의 이름을 물려받을 것이다.” 하고\n말씀하셨습니다.\n19 아브라함은 하느님께서 죽은 사람까지 일으키실 수 있다고 생각하였습니다.\n그리하여 이사악을 하나의 상징으로 돌려받은 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"루카 1,69-70.71-72.73-75(◎ 68 참조)\n◎ 찬미받으소서, 주 이스라엘의 하느님. 주님은 당신 백성을 찾아오셨네.\n○ 우리를 위하여 당신 종 다윗 집안에서, 힘센 구원자를 세워 주셨네. 거룩한 예언자들의 입으로, 예로부터 말씀하신 대로 하셨네. ◎\n○ 우리 원수들에게서, 우리를 미워하는 자들의 손에서 우리를 구원하시리라. 그분은 우리 조상들에게 자비를 베푸시고, 당신의 거룩한 계약을 기억하셨네. ◎\n○ 우리 조상 아브라함에게 맹세하신 대로, 우리가 원수들의 손에서 풀려나, 아무 두려움 없이, 한평생 당신 앞에서, 거룩하고 의롭게 당신을 섬기게 하셨네. ◎","복음 환호송":"요한 3,16 참조\n◎ 알렐루야.\n○ 하느님은 세상을 너무나 사랑하신 나머지 외아들을 내주시어 그를 믿는 사람은 누구나 영원한 생명을 얻게 하셨네.\n◎ 알렐루야.","복음":"<도대체 이분이 누구시기에 바람과 호수까지 복종하는가?>\n✠ 마르코가 전한 거룩한 복음입니다.\n4,35-41\n35 그날 저녁이 되자 예수님께서 제자들에게,\n“호수 저쪽으로 건너가자.” 하고 말씀하셨다.\n36 그래서 그들이 군중을 남겨 둔 채,\n배에 타고 계신 예수님을 그대로 모시고 갔는데,\n다른 배들도 그분을 뒤따랐다.\n37 그때에 거센 돌풍이 일어 물결이 배 안으로 들이쳐서,\n물이 배에 거의 가득 차게 되었다.\n38 그런데도 예수님께서는 고물에서 베개를 베고 주무시고 계셨다.\n제자들이 예수님을 깨우며,\n“스승님, 저희가 죽게 되었는데도 걱정되지 않으십니까?” 하고 말하였다.\n39 그러자 예수님께서 깨어나시어 바람을 꾸짖으시고 호수더러,\n“잠잠해져라. 조용히 하여라!” 하시니 바람이 멎고 아주 고요해졌다.\n40 예수님께서는 그들에게,\n“왜 겁을 내느냐? 아직도 믿음이 없느냐?” 하고 말씀하셨다.\n41 그들은 큰 두려움에 사로잡혀 서로 말하였다.\n“도대체 이분이 누구시기에 바람과 호수까지 복종하는가?”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희 예물을 인자로이 받으시고 거룩하게 하시어\n이 제물이 저희를 위한 구원의 성사가 되게 하소서.\n우리 주 …….","영성체송":"시편 34(33),6 참조\n주님께 나아가면 빛을 받으리라. 너희 얼굴에는 부끄러움이 없으리라.\n<또는>\n요한 8,12 참조\n주님이 말씀하신다. 나는 세상의 빛이다. 나를 따르는 이는 어둠 속을 걷지 않고 생명의 빛을 얻으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성자의 살과 피로 저희를 기르시니\n하느님께서 주시는 생명의 은총으로\n저희가 언제나 기뻐하게 하소서.\n우리 주 ……."}},"20270131":{"d":"2027년 01월 31일 일요일","c":"녹","t":"연중 제4주일","o":[],"n":"해외 원조 주일","g":"대영광송 · 신경 · 교중","i":"해마다 1월 마지막 주일은 전 세계 가난한 이들을 위하여 나눔을 실천하는 ‘해외 원조 주일’이다. 한국천주교주교회의는 1992년 추계 정기 총회에서 전 세계의 가난하고 고통받는 이웃에 대한 관심과 사랑을 촉구하고자 이 주일의 2차 헌금을 해외 원조 기금으로 사용하도록 결정하였다.","s":{"입당송":"시편 106(105),47\n주 하느님, 저희를 구하소서. 민족들에게서 저희를 모아들이소서. 당신의 거룩하신 이름을 찬송하고, 당신을 찬양하여 영광으로 삼으오리다.","본기도":"자비로우신 주 하느님,\n저희가 마음을 다하여 주님을 공경하며\n그리스도의 사랑으로 모든 사람을 사랑하게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<나는 예언자를 일으켜 나의 말을 그의 입에 담아 줄 것이다.>\n▥ 신명기의 말씀입니다.\n18,15-20\n모세가 백성에게 말하였다.\n15 “주 너희 하느님께서 너희 동족 가운데에서\n나와 같은 예언자를 일으켜 주실 것이니, 너희는 그의 말을 들어야 한다.\n16 그것은 너희가 호렙에서 집회의 날에 주 너희 하느님께 청한 것이다.\n그때에 너희는 이렇게 말하였다.\n‘다시는 저희가 주 저희 하느님의 소리를 듣지 않게 하시고\n이 큰 불도 보지 않게 해 주십시오.\n저희가 죽지 않게 해 주십시오.’\n17 그러자 주님께서 나에게 말씀하셨다.\n‘그들이 한 말은 옳다. 18 나는 그들을 위하여\n그들의 동족 가운데에서 너와 같은 예언자 하나를 일으켜,\n나의 말을 그의 입에 담아 줄 것이다.\n그러면 그는 내가 그에게 명령하는 모든 것을 그들에게 일러 줄 것이다.\n19 그가 내 이름으로 이르는 말을 듣지 않는 사람은 내가 직접 추궁할 것이다.\n20 또한 내가 말하라고 명령하지도 않은 것을\n주제넘게 내 이름으로 말하거나,\n다른 신들의 이름으로 말하는 예언자가 있으면,\n그 예언자는 죽어야 한다.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 95(94),1-2.6-7ㄱㄴㄷ.7ㄹ-9(◎ 7ㄹ과 8ㄴ)\n◎ 오늘 주님 목소리에 귀를 기울여라. 너희 마음을 무디게 하지 마라.\n○ 어서 와 주님께 노래 부르세. 구원의 바위 앞에 환성 올리세. 감사하며 그분 앞에 나아가세. 노래하며 그분께 환성 올리세. ◎\n○ 어서 와 엎드려 경배드리세. 우리를 내신 주님 앞에 무릎 꿇으세. 그분은 우리의 하느님, 우리는 그분 목장의 백성, 그분 손이 이끄시는 양 떼로세. ◎\n○ 오늘 너희는 주님 목소리에 귀를 기울여라. “므리바에서처럼, 마싸의 그날 광야에서처럼, 너희 마음을 무디게 하지 마라. 거기에서 너희 조상들은 나를 시험하였고, 내가 한 일을 보고서도 나를 떠보았다.” ◎","제2독서":"<처녀는 거룩해지려고 주님의 일을 걱정합니다.>\n▥ 사도 바오로의 코린토 1서 말씀입니다.\n7,32-35\n형제 여러분, 32 나는 여러분이 걱정 없이 살기를 바랍니다.\n혼인하지 않은 남자는 어떻게 하면 주님을 기쁘게 해 드릴 수 있을까 하고\n주님의 일을 걱정합니다.\n33 그러나 혼인한 남자는 어떻게 하면 아내를 기쁘게 할 수 있을까 하고\n세상일을 걱정합니다.\n34 그래서 그는 마음이 갈라집니다.\n남편이 없는 여자와 처녀는 몸으로나 영으로나 거룩해지려고\n주님의 일을 걱정합니다.\n그러나 혼인한 여자는 어떻게 하면 남편을 기쁘게 할 수 있을까 하고\n세상일을 걱정합니다.\n35 나는 여러분 자신의 이익을 위하여 이 말을 합니다.\n여러분에게 굴레를 씌우려는 것이 아니라,\n아무런 방해도 받지 않고서\n품위 있고 충실하게 주님을 섬기게 하려는 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마태 4,16\n◎ 알렐루야.\n○ 어둠 속에 앉아 있는 백성이 큰 빛을 보았네. 죽음의 그림자가 드리운 고장에 앉아 있는 이들에게 빛이 떠올랐네.\n◎ 알렐루야.","복음":"<예수님께서는 권위를 가지고 가르치셨다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n1,21ㄴ-28\n카파르나움에서,\n21 예수님께서는 안식일에 회당에 들어가 가르치셨는데,\n22 사람들은 그분의 가르침에 몹시 놀랐다.\n그분께서 율법 학자들과 달리 권위를 가지고 가르치셨기 때문이다.\n23 마침 그 회당에 더러운 영이 들린 사람이 있었는데,\n그가 소리를 지르며 24 말하였다.\n“나자렛 사람 예수님, 당신께서 저희와 무슨 상관이 있습니까?\n저희를 멸망시키러 오셨습니까?\n저는 당신이 누구신지 압니다. 당신은 하느님의 거룩하신 분이십니다.”\n25 예수님께서 그에게 “조용히 하여라. 그 사람에게서 나가라.” 하고 꾸짖으시니,\n26 더러운 영은 그 사람에게 경련을 일으켜 놓고 큰 소리를 지르며 나갔다.\n27 그러자 사람들이 모두 놀라,\n“이게 어찌 된 일이냐? 새롭고 권위 있는 가르침이다.\n저이가 더러운 영들에게 명령하니 그것들도 복종하는구나.” 하며\n서로 물어보았다.\n28 그리하여 그분의 소문이 곧바로 갈릴래아 주변 모든 지방에 두루 퍼져 나갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>","예물 기도":"주님,\n저희가 주님의 제대에 예물을 올리오니\n너그러이 받아들이시어 저희 구원의 성사가 되게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<연중 주일 감사송 1 : 파스카 신비와 하느님 백성>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n저희는 죄와 죽음에서 벗어나\n선택된 겨레, 임금의 사제단, 거룩한 민족, 하느님의 백성이 되었고\n저희를 어둠에서 놀라운 빛으로 부르신 주님의 권능을\n온 세상에 전하게 되었나이다.\n이는 파스카의 신비로 이루어진 주님의 위대한 업적이옵니다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"시편 31(30),17-18 참조\n주님, 당신 얼굴 이 종에게 비추시고, 당신 자애로 저를 구하소서. 제가 당신을 불렀으니, 부끄럽지 않게 하소서.\n<또는>\n마태 5,3.5\n행복하여라, 마음이 가난한 사람들! 하늘 나라가 그들의 것이다. 행복하여라, 온유한 사람들! 그들은 땅을 차지하리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 구원의 성체를 받아 모시고 비오니\n영원한 생명의 보증인 이 성사의 힘으로\n저희 안에 참된 믿음이 자라나게 하소서.\n우리 주 그리스도를 통하여 비나이다."}}};

 {id:'cy', t:'가경자 최양업 토마스 신부 시복 시성 기도문', c:'#8a1c1c', txt:`지극히 좋으신 하느님,

  let h='<div class="top"><h1>'+M+'월 매일미사</h1></div>';
  if(DATA[tk]) h+='<div class="today"><button class="btn" onclick="go(\''+tk+'\')">오늘 미사 보기 ('+parseInt(tk.slice(4,6))+'월 '+parseInt(tk.slice(6))+'일)</button></div>';
  h+='<div class="mnav"><button class="mb" '+(viewYM<=W[0]?'disabled':'onclick="setMonth('+addM(viewYM,-1)+')"')+' aria-label="이전 달">◀</button><div class="mt">'+Y+'년 '+M+'월</div><button class="mb" '+(viewYM>=W[2]?'disabled':'onclick="setMonth('+addM(viewYM,1)+')"')+' aria-label="다음 달">▶</button></div>';
  if(!has){h+='<div class="prep">'+Y+'년 '+M+'월 매일미사는 준비 중입니다.<br>준비가 끝나면 이곳에서 볼 수 있습니다.</div>';}
  else{
  h+='<p class="calhint">해당 날짜를 누르면 해당 매일미사로 이동합니다.</p>';
  h+='<table class="cal"><tr><th class="sun">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr>';
  const first=new Date(Y,M-1,1).getDay(); let d=1; const last=new Date(Y,M,0).getDate();
  for(let r=0;r<6&&d<=last;r++){h+='<tr>';for(let c=0;c<7;c++){
    if((r===0&&c<first)||d>last){h+='<td></td>';continue;}
    const k=key(Y,M,d),e=DATA[k];
    const past=!!e&&k<tk;
    const cls='cell'+(e&&isMajor(e.t)?' major':'')+(k===tk?' now':'')+(e?'':' none')+(past?' past':'');
    h+='<td class="'+(c===0?'sun':'')+'"><button class="'+cls+'" '+(e&&!past?'onclick="go(\''+k+'\')"':'disabled')+' aria-label="'+d+'일 '+(e?esc(dispTitle(e.t)):'')+'"><span class="n">'+d+'</span><span class="dot c-'+(e?e.c:'')+'"></span></button></td>';
    d++;}h+='</tr>';}
  h+='</table>';
  h+='<div class="legend"><span><i class="c-백"></i>백색</span><span><i class="c-녹"></i>녹색</span><span><i class="c-홍"></i>홍색</span><span><i class="c-자"></i>보라색</span><span><b></b>대축일·축일·주일</span></div>';
  }
  const cfg=has?(MONTH_CFG[M]||{pray:[],site:[]}):{pray:[],site:[]};
  h+='<h2 class="sec">자주 쓰는 기도</h2>';
  for(const p of PRAY.slice(0,2)) h+='<button class="pbig" style="background:'+p.c+'" onclick="goP(\''+p.id+'\')">'+esc(p.t)+'</button>';
  h+='<h2 class="sec">미사 때 자주 쓰는 기도</h2>';
  for(const id of MASS_PRAY){const p=PRAY.find(x=>x.id===id); if(p) h+='<button class="plist" style="border-left-color:'+p.c+'" onclick="goP(\''+p.id+'\')">'+esc(p.t)+'</button>';}
  if(cfg.pray.length)h+='<h2 class="sec">'+M+'월 기도</h2>';
  for(const id of cfg.pray){const p=PRAY.find(x=>x.id===id); if(p) h+='<button class="plist" style="border-left-color:'+p.c+'" onclick="goP(\''+p.id+'\')">'+esc(p.t)+'</button>';}
  for(const [g,items] of cfg.site){
    h+='<h2 class="sec">'+esc(g)+'</h2>';
    for(const [n,u] of items) h+='<a class="plist ext" href="'+u+'">'+esc(n)+'<small>주교회의 사이트로 이동</small></a>';
  }
  if(cfg.site.length)h+='<div class="note">사이트로 이동한 뒤 이 앱으로 돌아오려면 휴대폰의 뒤로 가기 버튼을 누르세요. 인터넷 연결이 필요합니다.</div>';
  h+=foot();
  app.innerHTML=h; window.scrollTo(0,0);
}

function foot(){return '<div class="foot">자료 출처: 한국천주교주교회의 매일미사(missa.cbck.or.kr). 홈페이지 본문은 자동 추출된 텍스트라 지면 『매일미사』와 차이가 있을 수 있습니다. 저작권은 한국천주교주교회의에 있으며 개인 신앙 생활용으로만 사용해 주세요.</div>'}

function renderLines(name,txt){
  const out=[];let first=true;
  for(const raw of txt.split('\n')){
    const l=raw.trim();
    if(!l){out.push('<div class="gap"></div>');continue;}
    if(first){first=false;if(name==='화답송'||name==='복음 환호송'){if(l[0]!=='◎'&&l[0]!=='§'){out.push('<span class="ln ref">'+esc(l)+'</span>');continue;}}}
    if(l[0]==='§'){out.push('<span class="ln ref">'+esc(l.slice(1))+'</span>');continue;}
    if(l[0]==='<'&&l.slice(-1)==='>'){out.push('<span class="ln lead">'+esc(l)+'</span>');continue;}
    if(/^[▥✠]/.test(l)){out.push('<span class="ln kind">'+esc(l)+'</span>');continue;}
    if(/^\d{1,3}(,\d.*)$/.test(l)&&!/\s/.test(l)){out.push('<span class="ln ref">'+esc(l)+'</span>');continue;}
    if(l[0]==='◎'){out.push('<span class="ln rf">'+esc(l)+'</span>');continue;}
    const m=l.match(/^(\d{1,3})\s+(.*)$/);
    if(m){out.push('<span class="ln"><span class="vn">'+m[1]+'</span>'+esc(m[2])+'</span>');continue;}
    out.push('<span class="ln">'+esc(l)+'</span>');
  }
  return out.join('');
}

function secs(e){return e.m?e.m[state.mass].s:e.s}

function renderDay(k){
  const e=DATA[k]; if(!e){location.hash='';return;}
  if(state.day!==k){state.day=k;state.tab='제1독서';state.mass=0;state.more=false;}
  const S=secs(e);
  if(!S[state.tab]) state.tab=MAIN.find(x=>S[x])||Object.keys(S)[0];
  viewYM=+k.slice(0,6);
  const prev=shift(k,-1), next=shift(k,1);
  let h='<div class="top"><h1>매일미사</h1></div>';
  h+='<div class="bar"><button class="btn alt" onclick="goHome()">달력</button>'+
     '<button class="btn alt" '+(DATA[prev]&&prev>=todayKey()?'onclick="go(\''+prev+'\')"':'disabled style="opacity:.35"')+'>◀ 전날</button>'+
     '<button class="btn alt" '+(DATA[next]?'onclick="go(\''+next+'\')"':'disabled style="opacity:.35"')+'>다음날 ▶</button></div>';
  h+='<div class="head"><div class="date">'+esc(e.d)+'</div><div class="title"><span class="dot c-'+e.c+'" title="'+COLN[e.c]+'"></span><span>'+esc(dispTitle(e.t))+'</span></div>';
  if(e.n) h+='<div class="opt">'+esc(e.n)+'</div>';
  if(e.o&&e.o.length) h+='<div class="opt">선택 기념: '+e.o.map(x=>esc(x.t)).join(', ')+'</div>';
  h+='</div>';
  if(e.i) h+='<div class="intro">'+esc(e.i)+'</div>';
  if(e.m){h+='<div class="mset">'+e.m.map((x,i)=>'<button class="tab'+(i===state.mass?' on':'')+'" onclick="setMass('+i+')">'+esc(x.l)+'</button>').join('')+'</div>';}
  const mains=MAIN.filter(x=>S[x]);
  if(mains.length) h+='<div class="tabs" id="tabs">'+mains.map(x=>'<button class="tab'+(x===state.tab?' on':'')+'" onclick="setTab(\''+x+'\')">'+x+'</button>').join('')+'</div>';
  const others=OTHER.filter(x=>S[x]);
  if(others.length){
    h+='<button class="more" onclick="toggleMore()">'+(state.more?'다른 기도문 접기':'다른 기도문 보기 (입당송·본기도 등)')+'</button>';
    if(state.more) h+='<div class="tabs small">'+others.map(x=>'<button class="tab'+(x===state.tab?' on':'')+'" onclick="setTab(\''+x+'\')">'+x+'</button>').join('')+'</div>';
  }
  if(S[state.tab]) h+='<div class="body" id="body"><div class="bh"><h3>'+esc(state.tab)+'</h3>'+fsBox()+'</div><p>'+renderLines(state.tab,S[state.tab])+'</p></div>';
  else h+='<div class="body" id="body"><p>이날은 미사 본문이 없습니다. 위의 안내글을 읽어 주세요.</p></div>';
  h+='<div class="bar" style="margin-top:14px"><button class="btn alt" onclick="goHome()">달력</button>'+
     '<button class="btn alt" '+(DATA[prev]&&prev>=todayKey()?'onclick="go(\''+prev+'\')"':'disabled style="opacity:.35"')+'>◀ 전날</button>'+
     '<button class="btn alt" '+(DATA[next]?'onclick="go(\''+next+'\')"':'disabled style="opacity:.35"')+'>다음날 ▶</button></div>';
  h+=foot();
  app.innerHTML=h;
}
function setTab(t){state.tab=t;renderDay(state.day);const b=document.getElementById('tabs');if(b){b.scrollIntoView({behavior:'smooth',block:'start'});}}
function setMass(i){state.mass=i;state.tab='제1독서';renderDay(state.day)}
function toggleMore(){state.more=!state.more;renderDay(state.day)}
function goP(id){location.hash='p'+id}
function renderPrayer(id){
  const p=PRAY.find(x=>x.id===id); if(!p){location.hash='';return;}
  const bar='<div class="bar" style="grid-template-columns:1fr"><button class="btn" onclick="goHome()">홈으로 (달력 화면)</button></div>';
  let h='<div class="top"><h1>기도문</h1></div>'+bar;
  h+='<div class="bh"><div class="ptitle" style="color:'+p.c+'">'+esc(p.t)+'</div>'+fsBox()+'</div><div class="body ptext" style="border-color:'+p.c+'">';
  for(const raw of p.txt.split('\n')){const l=raw.trim(); if(!l){h+='<div class="gap"></div>';continue;}
    const cls=l[0]==='◎'?'ln rf':'ln'; h+='<span class="'+cls+'">'+esc(l)+'</span>';}
  h+='</div><div style="margin-top:14px">'+bar+'</div>'+foot();
  app.innerHTML=h; window.scrollTo(0,0);
}
function go(k){location.hash='d'+k}
function goHome(){location.hash=''}
function route(){
  const m=location.hash.match(/^#d(\d{8})$/); const pm=location.hash.match(/^#p(\w+)$/);
  if(m){renderDay(m[1]);window.scrollTo(0,0);} else if(pm){renderPrayer(pm[1]);} else {state.day=null;renderHome();}
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
