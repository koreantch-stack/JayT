다.>\n▥ 사도 바오로의 티토서 말씀입니다.\n3,4-7\n사랑하는 그대여,\n4 우리 구원자이신 하느님의 호의와 인간애가 드러난 그때,\n5 하느님께서 우리를 구원해 주셨습니다.\n우리가 한 의로운 일 때문이 아니라 당신 자비에 따라,\n성령을 통하여 거듭나고 새로워지도록 물로 씻어 구원하신 것입니다.\n6 이 성령을 하느님께서는 우리 구원자이신 예수 그리스도를 통하여\n우리에게 풍성히 부어 주셨습니다.\n7 그리하여 우리는 그분의 은총으로 의롭게 되어,\n영원한 생명의 희망에 따라 상속자가 되었습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"루카 2,14 참조\n◎ 알렐루야.\n○ 하늘 높은 데서는 하느님께 영광, 땅에서는 주님께서 사랑하시는 사람들에게 평화!\n◎ 알렐루야.","복음":"<목자들은 마리아와 요셉과 아기를 찾아냈다.>\n✠ 루카가 전한 거룩한 복음입니다.\n2,15-20\n15 천사들이 하늘로 떠나가자 목자들은 서로 말하였다.\n“베들레헴으로 가서 주님께서 우리에게 알려 주신 그 일,\n그곳에서 일어난 일을 봅시다.”\n16 그리고 서둘러 가서, 마리아와 요셉과 구유에 누운 아기를 찾아냈다.\n17 목자들은 아기를 보고 나서, 그 아기에 관하여 들은 말을 알려 주었다.\n18 그것을 들은 이들은 모두 목자들이 자기들에게 전한 말에 놀라워하였다.\n19 그러나 마리아는 이 모든 일을 마음속에 간직하고 곰곰이 되새겼다.\n20 목자들은 천사가 자기들에게 말한 대로 듣고 본 모든 것에 대하여\n하느님을 찬양하고 찬미하며 돌아갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n빛이신 주님, 성자의 탄생을 경축하는 교회를 비추시어, 교회가 모든 사람을 섬기고, 많은 이를 구원하러 오신 우리 주 예수 그리스도를 충실히 본받도록 이끌어 주소서.\n\n2. 우리나라를 위하여 기도합시다.\n\n사랑이신 주님, 이 나라를 주님의 사랑으로 이끌어 주시어, 이웃끼리 서로 불신하고 경쟁하기보다 소통하고 배려하며 함께하는 가운데 행복을 누리게 하소서.\n\n3. 난민을 위하여 기도합시다.\n\n보호자이신 주님, 전쟁이나 분쟁으로 삶의 터전을 떠나온 이들을 살피시어, 마음의 평화를 찾고, 사회와 이웃의 환대 속에서 하루빨리 평온한 일상으로 돌아가도록 도와주소서.\n\n4. 지역 사회를 위하여 기도합시다.\n\n구원의 주님, 아기 예수님의 탄생을 맞는 저희 지역 사회를 굽어살피시어, 차분한 마음으로 성탄의 참뜻을 묵상하는 가운데 주님께서 주신 참사랑을 실천하게 하소서.","예물 기도":"주님,\n하느님이신 성자께서 사람으로 태어나셨으니\n이 지상 예물을 보시고 천상 은혜를 베푸시어\n저희가 주님께 드리는 이 제사로\n오늘 성탄의 신비를 마땅히 경축하게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"즈카 9,9 참조\n딸 시온아, 기뻐하여라. 딸 예루살렘아, 찬양하여라. 보라, 너의 임금님이 오신다. 그분은 거룩하시며 세상을 구원하시는 분이시다.","영성체 후 묵상":"하느님이신 성자께서 사람으로 태어나신 신비를 천사들이 가난한 목자들에게 먼저 전합니다. 목자들은 아기를 찾아내고, 듣고 본 모든 것에 대하여 하느님을 찬양하고 찬미하며 돌아갑니다. 아기가 포대기에 싸여 구유에 누워 있습니다. 우리를 위한 표징입니다. 우리도 마리아처럼 이 모든 일을 마음속에 간직하고 곰곰이 되새겨야 하겠습니다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n성자의 탄생을 경건하고 기쁜 마음으로 기념하였으니\n저희가 이 성탄의 깊은 신비를 굳건한 믿음으로 깨닫고\n더욱 뜨거운 마음으로 주님을 사랑하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음에서 아기 예수님을 둘러싼 인물들인 성모님과 요셉과 목자들은 하느님의 천사에게서 “두려워하지 마라.”(루카 1,30; 2,10; 참조: 마태 1,20)라는 말씀을 들은 사람들입니다. 이해하기 어려운 하느님의 이끄심 앞에서 우리는 그것을 받아들이기 망설일 때가 있습니다. 그러나 오늘 복음에 나오는 인물들은 주저하지 않고, 저마다의 방식으로 하느님의 뜻에 응답\n합니다.\n이 가운데 목자들에 관하여 더 묵상해 봅니다. “서둘러 가서, 마리아와 요셉과 구유에 누운 아기를 찾아냈다”(루카 2,16). 목자들의 모습은 성모님께서 엘리사벳을 찾아가셨을 때처럼, 하느님 말씀을 들은 뒤 지체하지 않고 발걸음을 내디디는 태도를 떠오르게 합니다. 밤에도 양 떼를 지켜야만 하였던 목자들은 “그 아기에 관하여 들은 말을 알려 [줌으로써]”(2,17) 가장 먼저 기쁜 소식을 전한 사람들이 되었습니다. 이처럼 가난하고 낮은 사람들이 예수님을 가장 먼저 알아 뵈었습니다.\n목자들은 아기 예수님을 만난 뒤 어떤 삶을 살았을까요? 아마도 일상으로 돌아가 여전히 밤낮으로 양 떼를 돌보는 일을 하며 지냈을 것입니다. 그러나 그들의 마음에는 이전과는 다른 기쁨과 희망이 자리하였을 것입니다. 그리고 성모님께서 그러셨던 것처럼, 자신들에게 일어난 일의 뜻을 간직하고 곰곰이 되새기며 살았으리라 생각됩니다.\n성탄 시기를 보내는 우리 삶도 마찬가지여야 하겠습니다. 자신이 생각하는 하느님을 찾지 말고 이미 우리에게 오신 분께 서둘러 나아갑시다. 그리고 성탄의 참뜻을 마음속에 간직하고 되새기며, 저마다 삶의 자리에서 복음의 증인으로 나아가기를 바랍니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},{"l":"낮 미사","s":{"오늘 전례":"“지극히 높은 곳에서는 하느님께 영광, 땅에서는 그분 마음에 드는 사람들에게 평화!” 하느님의 아드님께서 이 세상에 아기의 모습으로 오셨습니다. 말씀이 사람이 되셨습니다. 창조주께서 피조물이 되셨습니다. 가장 높으신 분께서 가장 낮은 이가 되셨습니다. 이 놀라운 강생의 신비로 우리에게 지극한 사랑을 보여 주신 하느님을 찬미하며 오늘을 경축합시다.","입당송":"이사 9,5\n우리에게 한 아기가 태어났고, 우리에게 한 아들이 주어졌네. 왕권이 그의 어깨에 놓이고, 그의 이름은 놀라운 경륜가라 불리리라.","본기도":"하느님,\n저희를 하느님의 모습으로 오묘히 창조하시고 더욱 오묘히 구원하셨으니\n사람이 되신 성자의 신성에 저희도 참여하게 하소서.\n성자께서는 성부와 …….","제1독서":"<땅끝들이 모두 우리 하느님의 구원을 보리라.>\n▥ 이사야서의 말씀입니다.\n52,7-10\n7 얼마나 아름다운가, 산 위에 서서 기쁜 소식을 전하는 이의 저 발!\n평화를 선포하고 기쁜 소식을 전하며 구원을 선포하는구나.\n“너의 하느님은 임금님이시다.” 하고 시온에게 말하는구나.\n8 들어 보아라. 너의 파수꾼들이 목소리를 높인다.\n다 함께 환성을 올린다.\n주님께서 시온으로 돌아오심을 그들은 직접 눈으로 본다.\n9 예루살렘의 폐허들아, 다 함께 기뻐하며 환성을 올려라.\n주님께서 당신 백성을 위로하시고 예루살렘을 구원하셨다.\n10 주님께서 모든 민족들이 보는 앞에서 당신의 거룩한 팔을 걷어붙이시니\n땅끝들이 모두 우리 하느님의 구원을 보리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 98(97),1.2-3ㄱㄴ.3ㄷㄹ-4.5-6(◎ 3ㄷㄹ)\n◎ 우리 하느님의 구원을 온 세상 땅끝마다 모두 보았네.\n○ 주님께 노래하여라, 새로운 노래. 그분이 기적들을 일으키셨네. 그분의 오른손이, 거룩한 그 팔이 승리를 가져오셨네. ◎\n○ 주님은 당신 구원을 알리셨네. 민족들의 눈앞에 당신 정의를 드러내셨네. 이스라엘 집안을 위하여 당신 자애와 진실을 기억하셨네. ◎\n○ 우리 하느님의 구원을 온 세상 땅끝마다 모두 보았네. 주님께 환성 올려라, 온 세상아. 즐거워하며 환호하여라, 찬미 노래 불러라. ◎\n○ 비파 타며 주님께 찬미 노래 불러라. 비파에 가락 맞춰 노래 불러라. 쇠 나팔 뿔 나팔 소리에 맞춰, 임금이신 주님 앞에서 환성 올려라. ◎","제2독서":"<하느님께서는 아드님을 통하여 우리에게 말씀하셨습니다.>\n▥ 히브리서의 말씀입니다.\n1,1-6\n1 하느님께서 예전에는 예언자들을 통하여\n여러 번에 걸쳐 여러 가지 방식으로 조상들에게 말씀하셨지만,\n2 이 마지막 때에는 아드님을 통하여 우리에게 말씀하셨습니다.\n하느님께서는 아드님을 만물의 상속자로 삼으셨을 뿐만 아니라,\n그분을 통하여 온 세상을 만들기까지 하셨습니다.\n3 아드님은 하느님 영광의 광채이시며 하느님 본질의 모상으로서,\n만물을 당신의 강력한 말씀으로 지탱하십니다.\n그분께서 죄를 깨끗이 없애신 다음,\n하늘 높은 곳에 계신 존엄하신 분의 오른쪽에 앉으셨습니다.\n4 그분께서는 천사들보다 뛰어난 이름을 상속받으시어,\n그만큼 그들보다 위대하게 되셨습니다.\n5 하느님께서 천사들 가운데 그 누구에게\n“너는 내 아들. 내가 오늘 너를 낳았노라.” 하고 말씀하신 적이 있습니까?\n또 “나는 그의 아버지가 되고 그는 나의 아들이 되리라.” 하고\n말씀하신 적이 있습니까?\n6 또 맏아드님을 저세상에 데리고 들어가실 때에는 이렇게 말씀하십니다.\n“하느님의 천사들은 모두 그에게 경배하여라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"◎ 알렐루야.\n○ 거룩한 날이 우리에게 밝았네. 민족들아, 어서 와 주님을 경배하여라. 오늘 큰 빛이 땅 위에 내린다.\n◎ 알렐루야.","복음":"<말씀이 사람이 되시어 우리 가운데 사셨다.>\n✠ 요한이 전한 거룩한 복음입니다.\n1,1-18\n1 한처음에 말씀이 계셨다.\n말씀은 하느님과 함께 계셨는데 말씀은 하느님이셨다.\n2 그분께서는 한처음에 하느님과 함께 계셨다.\n3 모든 것이 그분을 통하여 생겨났고 그분 없이 생겨난 것은 하나도 없다.\n4 그분 안에 생명이 있었으니 그 생명은 사람들의 빛이었다.\n5 그 빛이 어둠 속에서 비치고 있지만 어둠은 그를 깨닫지 못하였다.\n6 하느님께서 보내신 사람이 있었는데 그의 이름은 요한이었다.\n7 그는 증언하러 왔다.\n빛을 증언하여 자기를 통해 모든 사람이 믿게 하려는 것이었다.\n8 그 사람은 빛이 아니었다. 빛을 증언하러 왔을 따름이다.\n9 모든 사람을 비추는 참빛이 세상에 왔다.\n10 그분께서 세상에 계셨고 세상이 그분을 통하여 생겨났지만\n세상은 그분을 알아보지 못하였다.\n11 그분께서 당신 땅에 오셨지만\n그분의 백성은 그분을 맞아들이지 않았다.\n12 그분께서는 당신을 받아들이는 이들,\n당신의 이름을 믿는 모든 이에게\n하느님의 자녀가 되는 권한을 주셨다.\n13 이들은 혈통이나 육욕이나 남자의 욕망에서 난 것이 아니라\n하느님에게서 난 사람들이다.\n14 말씀이 사람이 되시어 우리 가운데 사셨다.\n우리는 그분의 영광을 보았다.\n은총과 진리가 충만하신 아버지의 외아드님으로서 지니신 영광을 보았다.\n15 요한은 그분을 증언하여 외쳤다.\n“그분은 내가 이렇게 말한 분이시다.\n‘내 뒤에 오시는 분은 내가 나기 전부터 계셨기에 나보다 앞서신 분이시다.’”\n16 그분의 충만함에서 우리 모두 은총에 은총을 받았다.\n17 율법은 모세를 통하여 주어졌지만\n은총과 진리는 예수 그리스도를 통하여 왔다.\n18 아무도 하느님을 본 적이 없다.\n아버지와 가장 가까우신 외아드님, 하느님이신 그분께서 알려 주셨다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n<또는>\n<말씀이 사람이 되시어 우리 가운데 사셨다.>\n✠ 요한이 전한 거룩한 복음입니다.\n1,1-5.9-14\n1 한처음에 말씀이 계셨다.\n말씀은 하느님과 함께 계셨는데 말씀은 하느님이셨다.\n2 그분께서는 한처음에 하느님과 함께 계셨다.\n3 모든 것이 그분을 통하여 생겨났고\n그분 없이 생겨난 것은 하나도 없다.\n4 그분 안에 생명이 있었으니 그 생명은 사람들의 빛이었다.\n5 그 빛이 어둠 속에서 비치고 있지만 어둠은 그를 깨닫지 못하였다.\n9 모든 사람을 비추는 참빛이 세상에 왔다.\n10 그분께서 세상에 계셨고 세상이 그분을 통하여 생겨났지만\n세상은 그분을 알아보지 못하였다.\n11 그분께서 당신 땅에 오셨지만 그분의 백성은 그분을 맞아들이지 않았다.\n12 그분께서는 당신을 받아들이는 이들, 당신의 이름을 믿는 모든 이에게\n하느님의 자녀가 되는 권한을 주셨다.\n13 이들은 혈통이나 육욕이나 남자의 욕망에서 난 것이 아니라\n하느님에게서 난 사람들이다.\n14 말씀이 사람이 되시어 우리 가운데 사셨다.\n우리는 그분의 영광을 보았다.\n은총과 진리가 충만하신 아버지의 외아드님으로서 지니신 영광을 보았다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n진리의 샘이신 주님, 구세주를 보내시어 저희를 구원의 길로 이끌어 주시니, 교회가 주님 사랑 안에 머무르며 세상 모든 이에게 이 기쁜 소식을 전하게 하소서.\n\n2. 공직자들을 위하여 기도합시다.\n\n의로우신 주님, 공직에 있는 이들을 굽어살피시어, 그들이 국가의 역할과 시민의 권리를 올바로 깨닫고, 맡은 직무를 공정하고 책임 있게 실천하게 하소서.\n\n3. 새 영세자들을 위하여 기도합시다.\n\n은총의 주님, 사람의 모습으로 이 세상에 오신 예수님을 받아들인 새 영세자들을 돌보아 주시어, 그들이 세례의 서약을 늘 기억하고, 언제나 하느님을 섬기며 기쁘게 살아가게 하소서.\n\n4. 본당 사도직 단체들을 위하여 기도합시다.\n\n참행복이신 주님, 저희 본당의 단체들을 굽어보시어, 그리스도 강생의 신비를 체험하며 삶의 참의미를 깨닫고, 서로 사랑하며 화목하게 활동하도록 이끌어 주소서.","예물 기도":"주님, 오늘 성탄 대축일을 맞이하여\n거룩한 예배로 바치는 이 예물을 기꺼이 받아들이시어\n주님 마음에 드는 완전한 화해의 제물이 되게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"시편 98(97),3\n우리 하느님의 구원을, 온 세상 땅끝마다 모두 보았네.","영성체 후 묵상":"믿는 이들은 사람이 되신 말씀을 통하여 참된 영광을 보고 은총을 받습니다. 그러나 믿지 않는 이들은 사람이 되시어 오신 그 말씀을 받아들이지 못하여 어둠 속에 머무르게 됩니다. 성체 안에서 참된 영광을 바라보는 이들이 있는가 하면, 그러지 못하는 이들도 있습니다. 그 차이는 바로 믿음에 있습니다. 주님의 탄생을 경축하며 성체 안에 담긴 그분의 영광을 바라봅시다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"자비로우신 하느님,\n오늘 태어나신 구세주께서 저희에게 하느님의 생명을 주셨으니\n저희가 불사불멸의 은혜도 받게 하소서.\n성자께서는 영원히 …….","오늘의 묵상":"사제는 미사의 성찬 전례 가운데 성작에 봉헌된 포도주를 붓고 물을 따르면서 다음의 기도를 바칩니다. “이 물과 술이 하나 되듯이, 인성을 취하신 그리스도의 신성에, 저희도 참여하게 하소서”(예물 준비 기도). 오늘 본기도에서 청하듯, 예수님을 따르는 우리가 걸어가야 할 길은 분명합니다.\n“한처음에 말씀이 계셨다. 말씀은 하느님과 함께 계셨는데, 말씀은 하느님이셨다”(요한 1,1). 요한 복음서의 시작은 “한처음에 하느님께서 하늘과 땅을 창조하셨다.”(창세 1,1)로 시작하는 창세기를 떠올리게 합니다. 하느님께서는 말씀으로 세상을 창조하신 창조주이십니다. 그리고 요한 복음서는 그 창조의 말씀이 예수님이시라고 말합니다.\n“말씀이 사람이 되시어, 우리 가운데 사셨다”(요한 1,14). 참하느님이신 예수님께서는 참인간이 되시어 이 세상에 오셨습니다. 성탄은 세상을 창조하신 분께서 피조물이 되신 사건입니다. 이 역설적 사건은 인류의 구원을 위한 파스카 신비로 연결됩니다. 예수님께서는 죽음을 이기시고 부활하시어 영원한 생명의 길을 열어 주셨고, 그것을 믿는 이들을 하느님의 자녀로(1,12 참조) 초대해 주십니다.\n하느님의 자녀로 태어난 우리는 예수님께서 지니신 신성에 참여하도록 부름받은 사람들입니다. 성탄을 통하여 우리는 강생하신 예수님을 바라보면서 하느님의 생명에 참여하는 삶으로 부름받았음을 되새깁니다. 성탄의 기쁨 안에서, 참사람이 되신 그리스도를 본받아 하느님의 자녀답게 살아갑시다. 아타나시오 성인은 이렇게 말씀하였습니다. “하느님께서 사람이 되신 것은 사람이 하느님이 되도록 하시기 위함이다.”\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}}]},"20261226":{"d":"2026년 12월 26일 토요일","c":"홍","t":"성 스테파노 첫 순교자 축일","o":[],"n":"","g":"대영광송","i":"스테파노 성인은 초대 교회의 사도들이 뽑은 부제다. 식탁 봉사를 위한 일곱 봉사자 가운데 하나로 뽑힌 스테파노 성인은 가난한 이들에게 식량을 나누어 주는 일뿐만 아니라, 사도들과 마찬가지로 하느님 말씀을 선포하면서 진리를 증언하는 일도 소홀히 여기지 않았다. 또한 유다인들과 벌인 논쟁에서도 지혜로운 언변으로 그들을 물리쳤다. 유다인들은 스테파노 성인을 도저히 감당할 수 없음을 알고 그가 하느님을 모독하였다는 거짓 소문을 퍼뜨렸다. 결국 그는 돌에 맞아 죽임을 당함으로써 교회의 첫 순교자가 되었다.","s":{"입당송":"복된 스테파노에게 하늘의 문이 열렸네. 첫 순교자로 오른 그는 하늘에서 승리의 월계관을 받았네.","본기도":"주님,\n첫 순교자인 복된 스테파노의 천상 탄일에 거행하는 신비를\n저희가 삶으로 드러내게 하시고\n숨을 거두면서도 박해자들을 위하여 기도한 성 스테파노를 본받아\n원수까지도 사랑하게 하소서.\n성부와 성령과 …….","제1독서":"<보십시오, 하늘이 열려 있는 것이 보입니다.>\n▥ 사도행전의 말씀입니다.\n6,8-10; 7,54-59\n그 무렵 8 은총과 능력이 충만한 스테파노는\n백성 가운데에서 큰 이적과 표징들을 일으켰다.\n9 그때에 이른바 해방민들과 키레네인들과 알렉산드리아인들과\n킬리키아와 아시아 출신들의 회당에 속한 사람 몇이 나서서\n스테파노와 논쟁을 벌였다.\n10 그러나 그의 말에서 드러나는 지혜와 성령에 대항할 수가 없었다.\n7,54 그들은 스테파노의 말을 듣고 마음에 화가 치밀어 그에게 이를 갈았다.\n55 그러나 스테파노는 성령이 충만하였다.\n그가 하늘을 유심히 바라보니,\n하느님의 영광과 하느님 오른쪽에 서 계신 예수님이 보였다.\n56 그래서 그는 “보십시오, 하늘이 열려 있고\n사람의 아들이 하느님 오른쪽에 서 계신 것이 보입니다.” 하고 말하였다.\n57 그들은 큰 소리를 지르며 귀를 막았다.\n그리고 일제히 스테파노에게 달려들어,\n58 그를 성 밖으로 몰아내고서는 그에게 돌을 던졌다.\n그 증인들은 겉옷을 벗어 사울이라는 젊은이의 발 앞에 두었다.\n59 사람들이 돌을 던질 때에 스테파노는,\n“주 예수님, 제 영을 받아 주십시오.” 하고 기도하였다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 31(30),3ㄷㄹ-4.6과 8ㄱㄴ.16ㄴ-17(◎ 6ㄱ 참조)\n◎ 주님, 제 목숨 당신 손에 맡기나이다.\n○ 이 몸 보호할 반석 되시고, 저를 구원할 성채 되소서. 당신은 저의 바위, 저의 성채이시니, 당신 이름 위하여 저를 이끌어 주소서. ◎\n○ 제 목숨 당신 손에 맡기오니, 주님, 진실하신 하느님, 저를 구원하소서. 당신 자애로 저는 기뻐하고 즐거워하리이다. 당신은 가련한 저를 굽어보셨나이다. ◎\n○ 원수와 박해자들 손에서 구원하소서. 당신 얼굴 이 종에게 비추시고, 당신 자애로 저를 구하소서. ◎","복음 환호송":"시편 118(117),26.27 참조\n◎ 알렐루야.\n○ 주님의 이름으로 오시는 분, 찬미받으소서. 주님은 하느님, 우리를 비추시네.\n◎ 알렐루야.","복음":"<말하는 이는 너희가 아니라 아버지의 영이시다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n10,17-22\n그때에 예수님께서 제자들에게 말씀하셨다.\n17 “사람들을 조심하여라.\n그들이 너희를 의회에 넘기고 회당에서 채찍질할 것이다.\n18 또 너희는 나 때문에 총독들과 임금들 앞에 끌려가,\n그들과 다른 민족들에게 증언할 것이다.\n19 사람들이 너희를 넘길 때, 어떻게 말할까,\n무엇을 말할까 걱정하지 마라.\n너희가 무엇을 말해야 할지, 그때에 너희에게 일러 주실 것이다.\n20 사실 말하는 이는 너희가 아니라\n너희 안에서 말씀하시는 아버지의 영이시다.\n21 형제가 형제를 넘겨 죽게 하고 아버지가 자식을 그렇게 하며,\n자식들도 부모를 거슬러 일어나 죽게 할 것이다.\n22 그리고 너희는 내 이름 때문에 모든 사람에게 미움을 받을 것이다.\n그러나 끝까지 견디는 이는 구원을 받을 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n복된 스테파노의 영광스러운 축일에 저희가 봉헌하는 예물을 받으시고\n그가 순교로 증언한 믿음이 저희 안에서 굳건히 자라나게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"사도 7,59 참조\n스테파노는 돌을 맞으며 부르짖었네. 주 예수님, 제 영을 받아 주소서.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n성자의 탄생으로 저희를 구원하시고\n오늘 복된 스테파노의 축일로 저희를 더욱 기쁘게 하시니\n저희가 언제나 주님의 풍성한 자비에 감사하며 살게 하소서.\n우리 주 …….","오늘의 묵상":"순교는 우리를 구원하시고자 당신 생명을 내주신 예수님을 가장 분명히 증언하는 길입니다. 그래서 교회는 순교자들을 신앙의 본보기로 여깁니다. 초대 교회에서는 순교자들의 무덤 위에 제대를 세우기도 하였습니다.\n오늘은 성 스테파노 첫 순교자 축일입니다. 축일명에도 ‘첫 순교자’라는 말이 붙는 성인의 삶은 사도행전 6―7장에 자세히 전해집니다. “성령이 충만한 사람”(6,5)인 스테파노는 가난한 이들에게 식탁 봉사를 위하여 선택된 일곱 부제 가운데 하나였습니다.\n그뿐만 아니라 성인은 최고 의회에 끌려가서는 하느님의 구원 역사를 선포하며 자신이 만난 예수님을 증언하였습니다. 그러나 그의 설교는 예수님을 받아들이지 못한 사람들에게 분노를 불러일으켰고, 결국 그들은 성인에게 돌을 던졌습니다. 그럼에도 성인은 그들을 원망하지 않고 오히려 그들을 위하여 기도하였습니다. “주님, 이 죄를 저 사람들에게 돌리지 마십시오”(7,60). 이 기도는 십자가에서 “아버지, 저들을 용서해 주십시오. 저들은 자기들이 무슨 일을 하는지 모릅니다.”(루카 23,34)라고 기도하신 예수님을 떠올리게 합니다.\n죽음의 순간뿐만 아니라 스테파노 성인의 온 삶은 예수님을 닮았습니다. 그는 가난한 이웃과 함께하고, 진리를 선포하며, 원수까지 사랑함으로써 예수님을 증언하였습니다. 첫 순교자 스테파노 성인의 삶을 깊이 묵상하며, 우리도 저마다 삶의 자리에서 예수님을 증언하는 신앙인이 되도록 합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261227":{"d":"2026년 12월 27일 일요일","c":"백","t":"예수, 마리아, 요셉의 성가정 축일","o":[],"n":"가정 성화 주간","g":"대영광송 · 신경 · 교중","i":"‘예수, 마리아, 요셉의 성가정 축일’은 나자렛의 성가정을 기억하며 이를 본받고자 하는 축일이다. 1921년 이 축일이 처음 정해질 때는 주님 공현 대축일 다음 첫 주일이었으나, 1969년 전례력을 개정하면서 성탄 팔일 축제 내 주일(주일이 없으면 12월 30일)로 옮겼다.\n또한 우리나라에서는 2001년부터 해마다 ‘예수, 마리아, 요셉의 성가정 축일’부터 한 주간을 ‘가정 성화 주간’으로 지내고 있다. 가족 구성원 모두가 가정 공동체의 소중함을 되새기는 가운데 가정을 사랑이 넘치는 보금자리로 가꾸어 나가게 하려는 것이다.\n\n\n나해와 다해에는 『미사 독서』1: 173면과 175면의 독서들, 화답송을 봉독할 수 있다.","s":{"오늘 전례":"오늘은 예수, 마리아, 요셉의 성가정 축일입니다. 나자렛의 성가정을 본받아 우리도 주님을 가정의 중심에 모시고 가족이 화목하게 살아가도록 합시다. 또한 해체된 가정과 위기를 겪는 가정에 주님께서 은총을 내리시어, 주님 안에서 사랑으로 하나 되게 해 주시기를 청합시다.","입당송":"루카 2,16 참조\n목자들은 서둘러 가서, 마리아와 요셉과 구유에 누운 아기를 보았네.","본기도":"하느님,\n성가정을 통하여 참된 삶의 모범을 보여 주시니\n저희가 성가정의 성덕과 사랑을 본받아\n하느님의 집에서 끝없는 기쁨과 행복을 누리게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<주님을 경외하는 이는 아버지를 공경한다.>\n▥ 집회서의 말씀입니다.\n3,2-6.12-14\n2 주님께서 자녀들로 아버지를 영광스럽게 하시고\n아들에 대한 어머니의 권리를 보장하셨다.\n3 아버지를 공경하는 이는 죄를 용서받는다.\n4 제 어머니를 영광스럽게 하는 이는 보물을 쌓는 이와 같다.\n5 아버지를 공경하는 이는 자녀들에게서 기쁨을 얻고\n그가 기도하는 날 받아들여진다.\n6 아버지를 영광스럽게 하는 이는 장수하고\n주님의 말씀에 귀 기울이는 이는 제 어머니를 편안하게 한다.\n12 얘야, 네 아버지가 나이 들었을 때 잘 보살피고\n그가 살아 있는 동안 슬프게 하지 마라.\n13 그가 지각을 잃더라도 인내심을 가지고\n그를 업신여기지 않도록 네 힘을 다하여라.\n14 아버지에 대한 효행은 잊히지 않으니\n네 죄를 상쇄할 여지를 마련해 주리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n<네 몸에서 나온 아이가 너를 상속할 것이다.>\n▥ 창세기의 말씀입니다.\n15,1-6; 21,1-3\n그 무렵 1 주님의 말씀이 환시 중에 아브람에게 내렸다.\n“아브람아, 두려워하지 마라. 나는 너의 방패다. 너는 매우 큰 상을 받을 것이다.”\n2 그러자 아브람이 아뢰었다. “주 하느님, 저에게 무엇을 주시렵니까?\n저는 자식 없이 살아가는 몸,\n제 집안의 상속자는 다마스쿠스 사람 엘리에제르가 될 것입니다.”\n3 아브람이 다시 아뢰었다. “저를 보십시오.\n당신께서 자식을 주지 않으셔서, 제 집의 종이 저를 상속하게 되었습니다.”\n4 그러자 주님의 말씀이 그에게 내렸다.\n“그가 너를 상속하지 못할 것이다. 네 몸에서 나온 아이가 너를 상속할 것이다.”\n5 그러고는 그를 밖으로 데리고 나가서 말씀하셨다.\n“하늘을 쳐다보아라. 네가 셀 수 있거든 저 별들을 세어 보아라.”\n그에게 또 말씀하셨다. “너의 후손이 저렇게 많아질 것이다.”\n6 아브람이 주님을 믿으니, 주님께서 그 믿음을 의로움으로 인정해 주셨다.\n21,1 주님께서는 말씀하신 대로 사라를 돌보셨다.\n주님께서 말씀하신 대로 사라에게 해 주시니,\n2 사라가 임신하여, 하느님께서 아브라함에게 일러 주신 바로 그때에\n늙은 아브라함에게 아들을 낳아 주었다.\n3 아브라함은 사라가 자기에게 낳아 준 아들의 이름을 이사악이라 하였다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 128(127),1-2.3.4-5(◎ 1)\n◎ 행복하여라, 주님을 경외하는 사람, 그분의 길을 걷는 모든 사람!\n○ 행복하여라, 주님을 경외하는 사람, 그분의 길을 걷는 모든 사람! 네 손으로 벌어 네가 먹으리니, 너는 행복하여라, 너는 복을 받으리라. ◎\n○ 너의 집 안방에 있는 아내는 풍성한 포도나무 같고 너의 밥상에 둘러앉은 아들들은 올리브 나무 햇순 같구나. ◎\n○ 보라, 주님을 경외하는 사람은 이렇듯 복을 받으리라. 주님은 시온에서 너에게 복을 내리시리라. 너는 한평생 모든 날에 예루살렘의 번영을 보리라. ◎","제2독서":"<주님과 함께하는 가정생활>\n▥ 사도 바오로의 콜로새서 말씀입니다.\n3,12-21\n형제 여러분, 12 하느님께 선택된 사람, 거룩한 사람, 사랑받는 사람답게\n마음에서 우러나오는 동정과 호의와 겸손과 온유와 인내를 입으십시오.\n13 누가 누구에게 불평할 일이 있더라도 서로 참아 주고 서로 용서해 주십시오.\n주님께서 여러분을 용서하신 것처럼 여러분도 서로 용서하십시오.\n14 이 모든 것 위에 사랑을 입으십시오. 사랑은 완전하게 묶어 주는 끈입니다.\n15 그리스도의 평화가 여러분의 마음을 다스리게 하십시오.\n여러분은 또한 한 몸 안에서 이 평화를 누리도록 부르심을 받았습니다.\n감사하는 사람이 되십시오.\n16 그리스도의 말씀이 여러분 가운데에 풍성히 머무르게 하십시오.\n지혜를 다하여 서로 가르치고 타이르십시오.\n감사하는 마음으로 하느님께 시편과 찬미가와 영가를 불러 드리십시오.\n17 말이든 행동이든 무엇이나 주 예수님의 이름으로 하면서,\n그분을 통하여 하느님 아버지께 감사를 드리십시오.\n18 아내 여러분, 남편에게 순종하십시오.\n주님 안에 사는 사람은 마땅히 그래야 합니다.\n19 남편 여러분, 아내를 사랑하십시오. 그리고 아내를 모질게 대하지 마십시오.\n20 자녀 여러분, 무슨 일에서나 부모에게 순종하십시오.\n이것이 주님 마음에 드는 일입니다.\n21 아버지 여러분, 자녀들을 들볶지 마십시오. 그러다가 그들의 기를 꺾고 맙니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n<아브라함과 사라와 이사악의 믿음>\n▥ 히브리서의 말씀입니다.\n11,8.11-12.17-19\n형제 여러분, 8 믿음으로써, 아브라함은 장차 상속 재산으로 받을 곳을 향하여\n떠나라는 부르심을 받고 그대로 순종하였습니다.\n그는 어디로 가는지도 모르고 떠난 것입니다.\n11 믿음으로써, 사라는 아이를 가지지 못하는 여인인 데다 나이까지 지났는데도\n임신할 능력을 얻었습니다.\n약속해 주신 분을 성실하신 분으로 여겼기 때문입니다.\n12 그리하여 한 사람에게서, 그것도 죽은 것이나 다름없는 사람에게서\n하늘의 별처럼 수가 많고 바닷가의 모래처럼 셀 수 없는 후손이 태어났습니다.\n17 믿음으로써, 아브라함은 시험을 받을 때에 이사악을 바쳤습니다.\n약속을 받은 아브라함이 외아들을 바치려고 하였습니다.\n18 그 외아들을 두고 하느님께서는 일찍이,\n“이사악을 통하여 후손들이 너의 이름을 물려받을 것이다.” 하고 말씀하셨습니다.\n19 아브라함은 하느님께서 죽은 사람까지 일으키실 수 있다고 생각하였습니다.\n그리하여 이사악을 하나의 상징으로 돌려받은 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"콜로 3,15.16\n◎ 알렐루야.\n○ 그리스도의 평화가 너희 마음을 다스리게 하여라. 그리스도의 말씀이 너희 가운데에 풍성히 머무르게 하여라.\n◎ 알렐루야.","복음":"<아기는 자라면서 지혜가 충만해졌다.>\n✠ 루카가 전한 거룩한 복음입니다.\n2,22-40\n22 모세의 율법에 따라 정결례를 거행할 날이 되자,\n예수님의 부모는 아기를 예루살렘으로 데리고 올라가 주님께 바쳤다.\n23 주님의 율법에 “태를 열고 나온 사내아이는 모두\n주님께 봉헌해야 한다.”고 기록된 대로 한 것이다.\n24 그들은 또한 주님의 율법에서 “산비둘기 한 쌍이나\n어린 집비둘기 두 마리를” 바치라고 명령한 대로 제물을 바쳤다.\n25 그런데 예루살렘에 시메온이라는 사람이 있었다.\n이 사람은 의롭고 독실하며 이스라엘이 위로받을 때를 기다리는 이였는데,\n성령께서 그 위에 머물러 계셨다.\n26 성령께서는 그에게 주님의 그리스도를 뵙기 전에는 죽지 않으리라고 알려 주셨다.\n27 그가 성령에 이끌려 성전으로 들어갔다.\n그리고 아기에 관한 율법의 관례를 준수하려고\n부모가 아기 예수님을 데리고 들어오자,\n28 그는 아기를 두 팔에 받아 안고 이렇게 하느님을 찬미하였다.\n29 “주님, 이제야 말씀하신 대로 당신 종을 평화로이 떠나게 해 주셨습니다.\n30 제 눈이 당신의 구원을 본 것입니다.\n31 이는 당신께서 모든 민족들 앞에서 마련하신 것으로\n32 다른 민족들에게는 계시의 빛이며 당신 백성 이스라엘에게는 영광입니다.”\n33 아기의 아버지와 어머니는 아기를 두고 하는 이 말에 놀라워하였다.\n34 시메온은 그들을 축복하고 나서 아기 어머니 마리아에게 말하였다.\n“보십시오,\n이 아기는 이스라엘에서 많은 사람을 쓰러지게도 하고 일어나게도 하며,\n또 반대를 받는 표징이 되도록 정해졌습니다.\n35 그리하여 당신의 영혼이 칼에 꿰찔리는 가운데,\n많은 사람의 마음속 생각이 드러날 것입니다.”\n36 한나라는 예언자도 있었는데, 프누엘의 딸로서 아세르 지파 출신이었다.\n나이가 매우 많은 이 여자는 혼인하여 남편과 일곱 해를 살고서는,\n37 여든네 살이 되도록 과부로 지냈다.\n그리고 성전을 떠나는 일 없이 단식하고 기도하며 밤낮으로 하느님을 섬겼다.\n38 그런데 이 한나도 같은 때에 나아와 하느님께 감사드리며,\n예루살렘의 속량을 기다리는 모든 이에게 그 아기에 대하여 이야기하였다.\n39 주님의 법에 따라 모든 일을 마치고 나서,\n그들은 갈릴래아에 있는 고향 나자렛으로 돌아갔다.\n40 아기는 자라면서 튼튼해지고 지혜가 충만해졌으며, 하느님의 총애를 받았다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n<또는>\n<아기는 자라면서 지혜가 충만해졌다.>\n✠ 루카가 전한 거룩한 복음입니다.\n2,22.39-40\n22 모세의 율법에 따라 정결례를 거행할 날이 되자,\n예수님의 부모는 아기를 예루살렘으로 데리고 올라가 주님께 바쳤다.\n39 주님의 법에 따라 모든 일을 마치고 나서,\n그들은 갈릴래아에 있는 고향 나자렛으로 돌아갔다.\n40 아기는 자라면서 튼튼해지고 지혜가 충만해졌으며, 하느님의 총애를 받았다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n거룩하신 주님, 성가정의 모범을 따르려는 교회를 굽어보시어, 겸손과 온유와 인내로 세상 모든 이에게 그리스도의 향기와 구원의 기쁜 소식을 전하게 하소서.\n\n2. 정치인들을 위하여 기도합시다.\n\n참된 통치자이신 주님, 이 땅의 정치인들에게 통찰과 식별의 은총을 주시어, 무엇보다도 국민의 삶을 먼저 살피며 시대정신을 읽고 주어진 사명을 올바로 실천하게 하소서.\n\n3. 홀몸 노인들을 위하여 기도합시다.\n\n도움이신 주님, 홀로 살아가는 노인들을 굽어살피시어, 추위와 외로움에서 보호하시고, 저희가 사회 안에서 그들을 알아보고 먼저 다가가 따뜻한 손길을 나누게 하소서.\n\n4. 종교나 인종의 문제로 차별받는 젊은이들을 위하여 기도합시다.\n\n치유자이신 주님, 차별과 편견으로 상처받은 젊은이들을 위로해 주시어, 모든 이가 주님의 가르침 안에서 하나 되어 평화와 사랑의 증인이 되게 하소서.","예물 기도":"주님,\n화해의 이 제사를 드리며 간절히 청하오니\n동정 성모 마리아와 성 요셉의 전구를 들으시고\n저희 가정을 주님의 은총과 평화로 굳건하게 지켜 주소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"바룩 3,38 참조\n우리 하느님이 세상에 나타나시어, 사람들과 함께 사셨네.","영성체 후 묵상":"성가정을 통하여 참된 삶의 모범을 보여 주신 하느님께 감사드리며 노래합시다. “행복하여라, 주님을 경외하는 사람, 그분의 길을 걷는 모든 사람! …… 주님은 시온에서 너에게 복을 내리시리라. 너는 한평생 모든 날에, 예루살렘의 번영을 보리라.”\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"지극히 인자하신 아버지,\n저희를 천상 성사로 길러 주시니\n저희가 언제나 성가정을 본받아\n현세의 온갖 어려움을 이겨 내고\n마침내 영원한 천상 가정에 들게 하소서.\n우리 주 그리스도를 통하여 비나이다.","오늘의 묵상":"구유를 바라보면 우리 마음은 평온해지고 따뜻해집니다. 예수님께서 사람이 되시어 이 세상에 오셨다는 기쁨과 함께 아기 예수님을 사랑스럽게 바라보시는 성모님의 눈길과, 이들을 지키는 요셉 성인의 든든한 책임감도 느껴지기 때문입니다. 교회는 성탄 팔일 축제 주일 또는 팔일 축제 안에 주일이 없으면 12월 30일을 예수, 마리아, 요셉의 성가정 축일로 보냅니다.\n우리가 이 세상에서 살아갈 수 있는 것은 부모의 사랑 덕분입니다. 그 사랑 안에서 우리는 자라고, 시간이 지나면서 부모에게서 독립하여 배우자를 만나 새로운 가정을 이룹니다. 그리고 혼인의 선물인 자녀를 통하여 부모라는 새로운 사명을 받습니다. 이렇게 우리의 삶은 하느님과 부모에게서 받은 사랑을 다음 세대에 전하는 사랑의 여정입니다.\n그러나 모든 가정이 늘 이상적이고 평온하지는 않습니다. 어느 가정에나 갈등과 어려움이 있기 마련입니다. 성가정도 이집트로 피난을 떠나야 하였고, 낯선 땅에서 이방인으로 살아야 하였습니다. 요셉 성인은 임신한 마리아를 믿음으로 받아들여야 하였고, 성모님께서는 아드님의 죽음을 지켜보셔야 하였습니다. 사람의 힘으로는 감당하기 어려운 고통 앞에서도 성가정은 언제나, 함께 어려움을 견디며 하느님의 뜻을 찾고자 하였습니다.\n우리는 아무런 문제가 없는 가정을 꿈꾸기보다 어려움 속에서도 사랑과 신뢰를 잃지 않는 가정을 이루도록 기도해야 할 것입니다. 오늘 제2독서의 말씀을 천천히 묵상하며, ‘서로 참아 주고 서로 용서하며 사랑으로 하나 되는’ 삶을 우리 가정에서부터 실천하도록 합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261228":{"d":"2026년 12월 28일 월요일","c":"홍","t":"죄 없는 아기 순교자들 축일","o":[],"n":"","g":"대영광송","i":"헤로데는 권력을 유지하려고 자신의 정적들을 살해하는 잔인한 임금이었다. 그는 예수님의 탄생 무렵 왕권에 위협을 느껴 베들레헴과 그 일대에 사는 두 살 이하의 사내아이들을 모조리 죽여 버렸다. 이때 억울하게 죽은 아기들의 희생을 교회는 오래전부터 순교로 보고 기억해 오다가 중세 이후에는 더욱 성대한 축일로 지내고 있다. 아기 예수님을 대신하여 죄 없이 희생되었기 때문이다.","s":{"입당송":"그리스도 때문에 살해된 죄 없는 아기들은 흠 없는 어린양을 따르며 영원히 외치네. 주님, 영광받으소서.","본기도":"하느님,\n죄 없이 살해된 아기 순교자들이 말도 배우기 전에\n죽음으로 주님을 찬미하였으니\n저희도 오늘 입으로 고백하는 믿음을 삶으로 드러내게 하소서.\n성부와 성령과 …….","제1독서":"<예수님의 피가 우리를 모든 죄에서 깨끗하게 해 줍니다.>\n▥ 요한 1서의 말씀입니다.\n1,5―2,2\n사랑하는 여러분, 우리가 예수 그리스도에게서 5 듣고\n이제 여러분에게 전하는 말씀은 이것입니다.\n곧 하느님은 빛이시며 그분께는 어둠이 전혀 없다는 것입니다.\n6 만일 우리가 하느님과 친교를 나눈다고 말하면서 어둠 속에서 살아간다면,\n우리는 거짓말을 하는 것이고 진리를 실천하지 않는 것입니다.\n7 그러나 그분께서 빛 속에 계신 것처럼 우리도 빛 속에서 살아가면,\n우리는 서로 친교를 나누게 되고,\n그분의 아드님이신 예수님의 피가\n우리를 모든 죄에서 깨끗하게 해 줍니다.\n8 만일 우리가 죄 없다고 말한다면,\n우리는 자신을 속이는 것이고 우리 안에 진리가 없는 것입니다.\n9 우리가 우리 죄를 고백하면,\n그분은 성실하시고 의로우신 분이시므로\n우리의 죄를 용서하시고 우리를 모든 불의에서 깨끗하게 해 주십니다.\n10 만일 우리가 죄를 짓지 않았다고 말한다면,\n우리는 그분을 거짓말쟁이로 만드는 것이고\n우리 안에 그분의 말씀이 없는 것입니다.\n2,1 나의 자녀 여러분, 내가 여러분에게 이 글을 쓰는 까닭은\n여러분이 죄를 짓지 않게 하려는 것입니다.\n그러나 누가 죄를 짓더라도 하느님 앞에서\n우리를 변호해 주시는 분이 계십니다.\n곧 의로우신 예수 그리스도이십니다.\n2 그분은 우리 죄를 위한 속죄 제물이십니다.\n우리 죄만이 아니라 온 세상의 죄를 위한 속죄 제물이십니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 124(123),2-3.4-5.7ㄷㄹ-8(◎ 7ㄱㄴ)\n◎ 사냥꾼의 그물에서 우리는 새처럼 벗어났네.\n○ 사람들이 우리에게 맞서 일어났을 때, 주님이 우리와 함께하지 않으셨던들, 우리를 거슬러 저들의 분노가 타올랐을 때, 우리를 산 채로 삼켜 버렸으리라. ◎\n○ 물살이 우리를 덮치고, 급류가 우리를 휩쓸었으리라. 거품을 뿜어내는 물살이 우리를 휩쓸었으리라. ◎\n○ 그물은 찢어지고, 우리는 벗어났네. 우리 구원은 주님 이름에 있네. 하늘과 땅을 만드신 분이시네. ◎","복음 환호송":"◎ 알렐루야.\n○ 찬미하나이다, 주 하느님. 주님이신 하느님을 찬양하나이다. 눈부신 순교자들의 무리가 주님을 기리나이다.\n◎ 알렐루야.","복음":"<헤로데는 베들레헴에 사는 사내아이들을 모조리 죽여 버렸다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n2,13-18\n13 박사들이 돌아간 뒤,\n꿈에 주님의 천사가 요셉에게 나타나서 말하였다.\n“일어나 아기와 그 어머니를 데리고 이집트로 피신하여,\n내가 너에게 일러 줄 때까지 거기에 있어라.\n헤로데가 아기를 찾아 없애 버리려고 한다.”\n14 요셉은 일어나 밤에 아기와 그 어머니를 데리고 이집트로 가서,\n15 헤로데가 죽을 때까지 거기에 있었다.\n주님께서 예언자를 통하여,\n“내가 내 아들을 이집트에서 불러내었다.”\n하신 말씀이 이루어지려고 그리된 것이다.\n16 그때에 헤로데는 박사들에게 속은 것을 알고 크게 화를 내었다.\n그리고 사람들을 보내어, 박사들에게서 정확히 알아낸 시간을 기준으로,\n베들레헴과 그 온 일대에 사는 두 살 이하의 사내아이들을 모조리 죽여 버렸다.\n17 그리하여 예레미야 예언자를 통하여 하신 말씀이 이루어졌다.\n18 “라마에서 소리가 들린다. 울음소리와 애끊는 통곡 소리.\n라헬이 자식들을 잃고 운다. 자식들이 없으니 위로도 마다한다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n철모르는 아기들도 거룩하게 하신 그 신비로\n이 종들이 정성껏 바치는 예물을 받으시고\n깨끗한 마음으로 주님을 섬기게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"묵시 14,4 참조\n이들은 하느님과 어린양께 바친 맏물로 사람들 가운데에서 속량되었으니, 어린양이 가는 곳이면 어디든지 따라가리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 거룩하신 성체로 저희를 기르시니\n성자의 탄생으로\n말도 못하는 죄 없는 아기들이 순교한 이 축일에\n저희에게도 구원의 은혜를 풍성히 내려 주소서.\n성자께서는 영원히 …….","오늘의 묵상":"“소가 마신 물은 젖이 되고 뱀이 마신 물은 독이 된다.”라는 말이 있습니다. 같은 것을 경험하더라도 어떤 이는 좋은 열매를 맺지만, 어떤 이는 나쁜 결과를 만들어 낸다는 뜻입니다. 복음에서도 이를 볼 수 있습니다. 메시아가 태어나셨다는 소식에 동방 박사들은 아기 예수님을 만나 뵙고 큰 기쁨에 차 돌아가지만, 헤로데는 끔찍한 악행을 저지릅니다.\n헤로데의 모습은 탈출기의 파라오를 떠올리게 합니다. 파라오가 새로 태어나는 이스라엘의 사내아이들을 죽이려 하였듯이(1,16.22 참조), 헤로데는 베들레헴과 그 일대에 사는 두 살 이하의 사내아이들을 죽이라고 명령합니다. 그 위협 속에서 세상의 빛으로 오신 예수님께서는 어두운 밤에 이집트로 피신하셔야만 하였습니다. 헤로데는 죄 없는 아기들을 죽음으로 내몰았습니다. 그 아기들은 그리스도를 증언하지도 못하였습니다. 오늘 본기도의 표현처럼 말도 배우기 전에 죽임을 당하였기 때문입니다. 그럼에도 교회는 그들을 순교자로 공경합니다. 예수님 때문에 죽임을 당하였기 때문입니다. 하느님께서는 아기들과 그 어머니들이 겪은 고통을 잊으시지 않고 그들의 울음을 들어 주십니다.\n인간의 죄가 빛을 어둠으로, 기쁨을 슬픔으로 바꾸더라도 그것이 끝은 아닙니다. 이집트에서 이스라엘 민족을 이끌고 탈출한 모세처럼 이집트에서 돌아오신 예수님께서는 우리를 죄와 죽음에서 이끌어 내시고 십자가와 부활로 새로운 파스카를 완성하십니다. 예수님의 구유가 십자가와 연결되어 있음을 기억합시다. 그리고 예수님을 죽이려 한 헤로데가 아니라 주님 앞에서 자신을 낮추어 경배한 동방 박사들처럼 살아갑시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261229":{"d":"2026년 12월 29일 화요일","c":"백","t":"성탄 팔일 축제 제5일","o":[],"n":"","g":"대영광송","i":"","s":{"입당송":"요한 3,16\n하느님은 세상을 너무나 사랑하신 나머지 외아들을 내주시어, 그를 믿는 사람은 누구나 멸망하지 않고 영원한 생명을 얻게 하셨네.","본기도":"전능하신 하느님,\n하느님의 눈부신 빛으로 세상의 어둠을 밝혀 주셨으니\n저희를 인자로이 굽어보시어\n외아드님의 영광스러운 탄생을 저희가 한목소리로 찬미하게 하소서.\n성자께서는 성부와 …….","제1독서":"<자기 형제를 사랑하는 사람은 빛 속에 머무릅니다.>\n▥ 요한 1서의 말씀입니다.\n2,3-11\n사랑하는 여러분, 3 우리가 하느님의 계명을 지키면,\n그것으로 우리가 예수님을 알고 있음을 알게 됩니다.\n4 “나는 그분을 안다.” 하면서 그분의 계명을 지키지 않는 자는 거짓말쟁이고,\n그에게는 진리가 없습니다.\n5 그러나 누구든지 그분의 말씀을 지키면,\n그 사람 안에서는 참으로 하느님 사랑이 완성됩니다.\n그것으로 우리가 그분 안에 있음을 알게 됩니다.\n6 그분 안에 머무른다고 말하는 사람은\n자기도 그리스도께서 살아가신 것처럼 그렇게 살아가야 합니다.\n7 사랑하는 여러분, 내가 여러분에게 써 보내는 것은 새 계명이 아니라,\n여러분이 처음부터 지녀 온 옛 계명입니다.\n이 옛 계명은 여러분이 들은 그 말씀입니다.\n8 그러면서도 내가 여러분에게 써 보내는 것은 새 계명입니다.\n그것은 그리스도께도 또 여러분에게도 참된 사실입니다.\n어둠이 지나가고 이미 참빛이 비치고 있기 때문입니다.\n9 빛 속에 있다고 말하면서 자기 형제를 미워하는 사람은\n아직도 어둠 속에 있는 자입니다.\n10 자기 형제를 사랑하는 사람은 빛 속에 머무르고,\n그에게는 걸림돌이 없습니다.\n11 그러나 자기 형제를 미워하는 자는 어둠 속에 있습니다.\n그는 어둠 속에서 살아가면서 자기가 어디로 가는지 모릅니다.\n어둠이 그의 눈을 멀게 하였기 때문입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 96(95),1-2ㄱ.2ㄴ-3.5ㄴ-6(◎ 11ㄱ)\n◎ 하늘은 기뻐하고 땅은 즐거워하여라.\n○ 주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 주님께 노래하여라, 그 이름 찬미하여라. ◎\n○ 나날이 선포하여라, 그분의 구원을. 전하여라, 겨레들에게 그분의 영광을, 모든 민족들에게 그분의 기적을. ◎\n○ 주님은 하늘을 지으셨네. 존귀와 위엄이 그분 앞에 있고, 권능과 영화가 그분 성소에 있네. ◎","복음 환호송":"루카 2,32 참조\n◎ 알렐루야.\n○ 그리스도 다른 민족들에게는 계시의 빛이요 당신 백성 이스라엘에게는 영광이시네.\n◎ 알렐루야.","복음":"<그리스도는 다른 민족들에게는 계시의 빛이십니다.>\n✠ 루카가 전한 거룩한 복음입니다.\n2,22-35\n22 모세의 율법에 따라 정결례를 거행할 날이 되자,\n예수님의 부모는 아기를 예루살렘으로 데리고 올라가 주님께 바쳤다.\n23 주님의 율법에 “태를 열고 나온 사내아이는 모두\n주님께 봉헌해야 한다.”고 기록된 대로 한 것이다.\n24 그들은 또한 주님의 율법에서\n“산비둘기 한 쌍이나 어린 집비둘기 두 마리를” 바치라고 명령한 대로\n제물을 바쳤다.\n25 그런데 예루살렘에 시메온이라는 사람이 있었다.\n이 사람은 의롭고 독실하며 이스라엘이 위로받을 때를 기다리는 이였는데,\n성령께서 그 위에 머물러 계셨다.\n26 성령께서는 그에게 주님의 그리스도를 뵙기 전에는\n죽지 않으리라고 알려 주셨다.\n27 그가 성령에 이끌려 성전으로 들어갔다.\n그리고 아기에 관한 율법의 관례를 준수하려고\n부모가 아기 예수님을 데리고 들어오자,\n28 그는 아기를 두 팔에 받아 안고 이렇게 하느님을 찬미하였다.\n29 “주님, 이제야 말씀하신 대로 당신 종을 평화로이 떠나게 해 주셨습니다.\n30 제 눈이 당신의 구원을 본 것입니다.\n31 이는 당신께서 모든 민족들 앞에서 마련하신 것으로\n32 다른 민족들에게는 계시의 빛이며\n당신 백성 이스라엘에게는 영광입니다.”\n33 아기의 아버지와 어머니는 아기를 두고 하는 이 말에 놀라워하였다.\n34 시메온은 그들을 축복하고 나서 아기 어머니 마리아에게 말하였다.\n“보십시오,\n이 아기는 이스라엘에서 많은 사람을 쓰러지게도 하고 일어나게도 하며,\n또 반대를 받는 표징이 되도록 정해졌습니다.\n35 그리하여 당신의 영혼이 칼에 꿰찔리는 가운데,\n많은 사람의 마음속 생각이 드러날 것입니다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 이 예물을 받으시고\n놀라운 교환의 신비를 이루시어\n주님께 받은 것을 바치는 저희가 주님을 합당히 모시게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<주님 성탄 감사송 2 : 강생으로 온 세상이 새로워짐>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도의 신비로운 성탄을 경축하는 오늘\n보이지 않는 하느님께서 보이는 인간으로 나타나시고\n영원하신 분께서 이제는 이 세상에 들어오셨나이다.\n그분께서는 타락한 만물을 당신 안에 일으키시어 온전히 회복시키시고\n버림받은 인류를 하늘 나라로 다시 불러 주셨나이다.\n그러므로 저희도 모든 천사와 함께 주님을 찬미하며\n기쁨에 넘쳐 큰 소리로 노래하나이다.","영성체송":"루카 1,78\n우리 하느님이 크신 자비를 베푸시니, 떠오르는 태양이 높은 데서 우리를 찾아오셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n거룩하고 신비로운 이 성사의 힘으로\n언제나 저희 생명을 보호하여 주소서.\n우리 주 …….","오늘의 묵상":"“당신을 몰랐더라면 더욱 편했을지도 모르는 그런 세상이지만, 당신을 알게 됨으로 얻어진 자유 평화 어떤 것과도 바꿀 순 없네.” 김태진 신부님의 성가 “마음을 드높이”에 나오는 가사입니다. 이 성가를 부를 때마다 그 뜻을 곱씹게 됩니다. 그리스도인으로 살아가기에 우리에게는 포기할 수 없는 것들이 있습니다.\n율법 교사 한 사람이 율법에서 가장 큰 계명이 무엇이냐고 묻자, 예수님께서는 사랑의 이중 계명을 말씀하십니다(마태 22,34-40 참조). 하느님을 사랑하고 이웃을 사랑하는 일입니다. 그러나 이 계명은 때로는 손에 박힌 가시처럼 우리를 불편하게 만들기도 합니다. 오늘 제1독서에서는 이런 우리에게 딱딱하게 굳어 버린 마음을 다시 들여다보라고 권고합니다. “빛 속에 있다고 말하면서 자기 형제를 미워하는 사람은 아직도 어둠 속에 있는 자입니다”(1요한 2,9).\n예수님의 계명을 지키며 그분을 따르는 삶은 아무런 어려움 없는 편안한 삶일 수 없습니다. 자신의 목숨까지 내놓으신 예수님을 닮아, 우리도 받은 은총을 나누고 자신을 내주어야 합니다. 이것이 예수님을 참으로 알아 가는 길입니다. 그러나 사랑의 실천은 나 혼자만의 힘으로는 할 수 없습니다. 먼저 사랑이신 분을 바라보고 그분의 사랑을 깨달을 때 비로소 가능합니다.\n그리스도인은 사랑하기를 포기할 수 없기에 불편함을 받아들이는 사람입니다. 그렇기에 우리 이웃은 구원의 길을 함께 걷도록 하느님께서 보내 주신 선물입니다. 세상의 빛으로 오시어 우리를 빛으로 불러 주시는 주님께 감사드리며, 우리 이웃을 사랑함으로써 세상에 그리스도의 빛을 증언합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261230":{"d":"2026년 12월 30일 수요일","c":"백","t":"성탄 팔일 축제 제6일","o":[],"n":"","g":"대영광송","i":"","s":{"입당송":"지혜 18,14-15 참조\n부드러운 정적이 만물을 뒤덮고, 시간은 흘러 한밤중이 되었을 때, 주님, 당신의 전능한 말씀이 하늘의 왕좌에서 내려왔나이다.","본기도":"전능하신 하느님,\n성자께서 사람이 되시어 세상에 오셨으니\n옛 종살이를 하며 죄악의 멍에에 짓눌려 신음하는 저희를 구원하여 주소서.\n성부와 성령과 …….","제1독서":"<하느님의 뜻을 실천하는 사람은 영원히 남습니다.>\n▥ 요한 1서의 말씀입니다.\n2,12-17\n12 자녀 여러분, 내가 여러분에게 이 글을 쓰는 까닭은\n여러분이 그분의 이름 덕분에 죄를 용서받았기 때문입니다.\n13 아버지 여러분, 내가 여러분에게 이 글을 쓰는 까닭은\n처음부터 계신 그분을 여러분이 알고 있기 때문입니다.\n젊은이 여러분, 내가 여러분에게 이 글을 쓰는 까닭은\n여러분이 악한 자를 이겼기 때문입니다.\n14 자녀 여러분, 내가 여러분에게 이 글을 쓴 까닭은\n여러분이 아버지를 알고 있기 때문입니다.\n아버지 여러분, 내가 여러분에게 이 글을 쓴 까닭은\n처음부터 계신 그분을 여러분이 알고 있기 때문입니다.\n젊은이 여러분, 내가 여러분에게 이 글을 쓴 까닭은\n여러분이 강하고, 하느님의 말씀이 여러분 안에 머무르며\n여러분이 악한 자를 이겼기 때문입니다.\n15 여러분은 세상도 또 세상 안에 있는 것들도 사랑하지 마십시오.\n누가 세상을 사랑하면, 그 사람 안에는 아버지 사랑이 없습니다.\n16 세상에 있는 모든 것,\n곧 육의 욕망과 눈의 욕망과 살림살이에 대한 자만은\n아버지에게서 온 것이 아니라 세상에서 온 것입니다.\n17 세상은 지나가고 세상의 욕망도 지나갑니다.\n그러나 하느님의 뜻을 실천하는 사람은 영원히 남습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 96(95),7-8ㄱ.8ㄴ-9.10(◎ 11ㄱ)\n◎ 하늘은 기뻐하고 땅은 즐거워하여라.\n○ 주님께 드려라, 뭇 민족의 가문들아. 주님께 드려라, 영광과 권능을. 주님께 드려라, 그 이름의 영광을. ◎\n○ 제물 들고 그분 앞뜰로 들어가라. 거룩한 차림으로 주님께 경배하여라. 온 세상아, 그분 앞에서 무서워 떨어라. ◎\n○ 겨레들에게 말하여라. “주님은 임금이시다. 누리는 정녕 굳게 세워져 흔들리지 않고, 그분은 민족들을 올바르게 심판하신다.” ◎","복음 환호송":"◎ 알렐루야.\n○ 거룩한 날이 우리에게 밝았네. 민족들아, 어서 와 주님을 경배하여라. 오늘 큰 빛이 땅 위에 내린다.\n◎ 알렐루야.","복음":"<예루살렘의 속량을 기다리는 모든 이에게 그 아기에 대하여 이야기하였다.>\n✠ 루카가 전한 거룩한 복음입니다.\n2,36-40\n그때에 36 한나라는 예언자가 있었는데,\n프누엘의 딸로서 아세르 지파 출신이었다.\n나이가 매우 많은 이 여자는 혼인하여 남편과 일곱 해를 살고서는,\n37 여든네 살이 되도록 과부로 지냈다.\n그리고 성전을 떠나는 일 없이 단식하고 기도하며 밤낮으로 하느님을 섬겼다.\n38 그런데 이 한나도 같은 때에 나아와 하느님께 감사드리며,\n예루살렘의 속량을 기다리는 모든 이에게 그 아기에 대하여 이야기하였다.\n39 주님의 법에 따라 모든 일을 마치고 나서,\n예수님의 부모는 갈릴래아에 있는 고향 나자렛으로 돌아갔다.\n40 아기는 자라면서 튼튼해지고 지혜가 충만해졌으며, 하느님의 총애를 받았다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 예물을 인자로이 받으시고\n저희가 경건한 마음으로 고백하는 것을 천상 성사로 깨닫게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<주님 성탄 감사송 2 : 강생으로 온 세상이 새로워짐>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도의 신비로운 성탄을 경축하는 오늘\n보이지 않는 하느님께서 보이는 인간으로 나타나시고\n영원하신 분께서 이제는 이 세상에 들어오셨나이다.\n그분께서는 타락한 만물을 당신 안에 일으키시어 온전히 회복시키시고\n버림받은 인류를 하늘 나라로 다시 불러 주셨나이다.\n그러므로 저희도 모든 천사와 함께 주님을 찬미하며\n기쁨에 넘쳐 큰 소리로 노래하나이다.","영성체송":"요한 1,16 참조\n주님의 충만함에서 우리 모두 은총에 은총을 받았네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"하느님,\n성체성사로 저희에게 오셨으니\n이 성사의 힘으로 저희 마음을 움직이시어\n저희가 모신 성체에 더욱 맞갖은 삶을 살아가게 하소서.\n우리 주 …….","오늘의 묵상":"우리 삶은 시간 속에 있으며, 주어진 시간을 대하는 태도에 따라 우리 삶이 달라집니다. 그러니 단순히 얼마나 오래 살지가 삶의 목표가 될 수 없습니다. 하느님께서 허락하신 시간 안에서 어떻게 살아가느냐가 훨씬 더 중요하기 때문입니다.\n오늘 제1독서에서는 이렇게 말합니다. “세상은 지나가고 세상의 욕망도 지나갑니다. 그러나 하느님의 뜻을 실천하는 사람은 영원히 남습니다”(1요한 2,17). 죽음을 넘어 영원한 생명으로 부름받은 우리는, 지금부터 그 부르심에 맞갖은 방식으로 살아가도록 초대받은 셈입니다. 그러므로 하느님의 뜻을 알아듣고 실천하는 것은 우리에게 맡겨진 중요한 소명입니다.\n오늘 복음에서 그러한 본보기인 한나 예언자를 만납니다. 성경이 이 예언자에 대하여 많은 것을 전하지는 않지만, 가장 중요한 사실은 놓치지 않았습니다. 한나가 짧은 혼인 생활 뒤 오랫동안 과부로 지내며 단식과 기도로 하느님을 섬겼다는 점입니다. 그는 단순한 삶을 살았지만 가장 중요한 일을 한결같이 이어 갔습니다. 한나는 오랜 기다림 끝에 예수님을 만나는 가장 큰 기쁨을 체험하였고, 그 기쁨을 다른 이들에게 전할 줄 아는 사람이었습니다.\n“영원하신 분께서 이제는 이 세상에 들어오셨나이다”(주님 성탄 감사송 2). 이 기도문은 우리의 시간을 영원으로 이끌어 주시고자 예수님께서 오셨음을 일깨워 줍니다. 우리에게 시간을 허락하신 분이 누구이신지를 깨닫고, 영원으로 이끌어 주시는 주님께서 언제나 함께하심을 기억합시다. 그리고 한나처럼 우리에게 주어진 시간을 기도와 감사로 채워 가며, 우리가 만난 예수님을 이웃에게 기쁘게 전합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261231":{"d":"2026년 12월 31일 목요일","c":"백","t":"성탄 팔일 축제 제7일","o":[],"n":"","g":"대영광송","i":"","s":{"입당송":"이사 9,5\n우리에게 한 아기가 태어났고, 우리에게 한 아들이 주어졌네. 왕권이 그의 어깨에 놓이고, 그의 이름은 놀라운 경륜가라 불리리라.","본기도":"전능하시고 영원하신 하느님,\n성자의 탄생으로 참된 믿음을 일으키시고 완성하셨으니\n저희를 인류 구원의 샘이신 성자의 지체가 되게 하소서.\n성자께서는 성부와 …….","제1독서":"<여러분은 거룩하신 분에게서 기름부음을 받았습니다. 그래서 여러분은 모두 알고 있습니다.>\n▥ 요한 1서의 말씀입니다.\n2,18-21\n18 자녀 여러분, 지금이 마지막 때입니다.\n‘그리스도의 적’이 온다고 여러분이 들은 그대로,\n지금 많은 ‘그리스도의 적들’이 나타났습니다.\n그래서 우리는 지금이 마지막 때임을 압니다.\n19 그들은 우리에게서 떨어져 나갔지만 우리에게 속한 자들은 아니었습니다.\n그들이 우리에게 속하였다면 우리와 함께 남아 있었을 것입니다.\n그러나 결국에는 그들이 아무도 우리에게 속하지 않는다는 사실이 드러났습니다.\n20 여러분은 거룩하신 분에게서 기름부음을 받았습니다.\n그래서 여러분은 모두 알고 있습니다.\n21 내가 여러분에게 이 글을 쓰는 까닭은,\n여러분이 진리를 모르기 때문이 아니라 진리를 알기 때문입니다.\n또 진리에서는 어떠한 거짓말도 나오지 않기 때문입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 96(95),1-2.11-12.13(◎ 11ㄱ)\n◎ 하늘은 기뻐하고 땅은 즐거워하여라.\n○ 주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 주님께 노래하여라, 그 이름 찬미하여라. 나날이 선포하여라, 그분의 구원을. ◎\n○ 하늘은 기뻐하고 땅은 즐거워하여라. 바다와 그 안에 가득 찬 것들은 소리쳐라. 들과 그 안에 있는 것도 모두 기뻐 뛰고, 숲속의 나무들도 모두 환호하여라. ◎\n○ 그분이 오신다. 주님 앞에서 환호하여라. 세상을 다스리러 그분이 오신다. 그분은 누리를 의롭게, 민족들을 진리로 다스리신다. ◎","복음 환호송":"요한 1,14.12 참조\n◎ 알렐루야.\n○ 말씀이 사람이 되시어 우리 가운데 사셨네. 그분은 당신을 받아들이는 모든 이를 하느님의 자녀가 되게 하셨네.\n◎ 알렐루야.","복음":"<말씀이 사람이 되셨다.>\n✠ 요한이 전한 거룩한 복음의 시작입니다.\n1,1-18\n1 한처음에 말씀이 계셨다.\n말씀은 하느님과 함께 계셨는데 말씀은 하느님이셨다.\n2 그분께서는 한처음에 하느님과 함께 계셨다.\n3 모든 것이 그분을 통하여 생겨났고 그분 없이 생겨난 것은 하나도 없다.\n4 그분 안에 생명이 있었으니 그 생명은 사람들의 빛이었다.\n5 그 빛이 어둠 속에서 비치고 있지만 어둠은 그를 깨닫지 못하였다.\n6 하느님께서 보내신 사람이 있었는데 그의 이름은 요한이었다.\n7 그는 증언하러 왔다.\n빛을 증언하여 자기를 통해 모든 사람이 믿게 하려는 것이었다.\n8 그 사람은 빛이 아니었다. 빛을 증언하러 왔을 따름이다.\n9 모든 사람을 비추는 참빛이 세상에 왔다.\n10 그분께서 세상에 계셨고 세상이 그분을 통하여 생겨났지만\n세상은 그분을 알아보지 못하였다.\n11 그분께서 당신 땅에 오셨지만 그분의 백성은 그분을 맞아들이지 않았다.\n12 그분께서는 당신을 받아들이는 이들, 당신의 이름을 믿는 모든 이에게\n하느님의 자녀가 되는 권한을 주셨다.\n13 이들은 혈통이나 육욕이나 남자의 욕망에서 난 것이 아니라\n하느님에게서 난 사람들이다.\n14 말씀이 사람이 되시어 우리 가운데 사셨다. 우리는 그분의 영광을 보았다.\n은총과 진리가 충만하신 아버지의 외아드님으로서 지니신 영광을 보았다.\n15 요한은 그분을 증언하여 외쳤다. “그분은 내가 이렇게 말한 분이시다.\n‘내 뒤에 오시는 분은 내가 나기 전부터 계셨기에 나보다 앞서신 분이시다.’”\n16 그분의 충만함에서 우리 모두 은총에 은총을 받았다.\n17 율법은 모세를 통하여 주어졌지만\n은총과 진리는 예수 그리스도를 통하여 왔다.\n18 아무도 하느님을 본 적이 없다.\n아버지와 가장 가까우신 외아드님, 하느님이신 그분께서 알려 주셨다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"하느님, 저희에게 참된 믿음과 평화를 주셨으니\n저희가 예물을 바쳐 지극히 높으신 하느님을 합당히 공경하고\n거룩한 제사에 참여하여 온 마음으로 이 신비와 하나 되게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<주님 성탄 감사송 2 : 강생으로 온 세상이 새로워짐>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도의 신비로운 성탄을 경축하는 오늘\n보이지 않는 하느님께서 보이는 인간으로 나타나시고\n영원하신 분께서 이제는 이 세상에 들어오셨나이다.\n그분께서는 타락한 만물을 당신 안에 일으키시어 온전히 회복시키시고\n버림받은 인류를 하늘 나라로 다시 불러 주셨나이다.\n그러므로 저희도 모든 천사와 함께 주님을 찬미하며\n기쁨에 넘쳐 큰 소리로 노래하나이다.","영성체송":"1요한 4,9\n하느님은 당신 외아드님을 세상에 보내시어, 우리가 그분을 통하여 살게 해 주셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 주님의 백성을 온갖 은혜로 다스리시니\n오늘도 내일도 자비를 베푸시어\n저희가 덧없는 현세에서도 위안을 받고\n영원한 세상을 향하여 더욱 힘차게 나아가게 하소서.\n우리 주 …….","오늘의 묵상":"한 해를 마무리하는 날입니다. 한 해를 돌아보면 기쁜 일도 있고 아쉬움이 남는 일도 있을 것입니다. 우리는 삶에서 일어나는 다양한 일들에 대하여 기도합니다. 좋은 일에는 감사 기도를 드리고, 괴로운 일에는 주님께 위로를 청합니다. 이처럼 우리는 삶의 모든 순간을 예수님과 함께 살아갑니다.\n“모든 사람을 비추는, 참빛이 세상에 왔다”(요한 1,9). 빛은 어둠을 밝혀 우리가 볼 수 있게 합니다. 빛으로 세상에 오신 예수님께서는 우리 삶의 참된 의미를 밝혀 주십니다. 많은 사람이 자기 자신을 삶의 주인으로 여기며 자기 생각과 의지와 노력으로 모든 것이 정해진다고 생각하기도 합니다. 그러나 지나온 삶을 돌이켜 보면 자신의 뜻보다 훨씬 더 큰 은총으로 함께하신 하느님의 손길을 깨닫게 됩니다.\n하느님께서는 당신의 외아드님이신 예수 그리스도를 우리에게 보내 주셨습니다. 예수님께서는 떠나시기 전 성령을 약속하셨고, 약속하신 대로 우리에게 성령을 보내 주셨습니다. 성령께서는 교회 안에서 활동하시며 우리가 하느님에게서 난 사람으로 살아가도록 이끌어 주십니다. 이처럼 우리는 모두 삼위일체 하느님의 사랑과 은총 안에서 살아가는 하느님의 자녀입니다.\n전통적으로 교회는 한 해의 마지막 날에 지난 일 년 동안 베풀어 주신 하느님의 은총에 감사드리며 ‘성 암브로시오의 사은 찬미가’를 바칩니다. 우리도 주님께서 베풀어 주신 사랑과 은총에 감사드리며 온 마음으로 찬미 노래를 부릅시다. “찬미하나이다, 주 하느님. / 주님이신 하느님을 찬양하나이다. / 영원하신 아버지를 / 온 세상이 받들어 모시나이다.”\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20270101":{"d":"2027년 01월 01일 금요일","c":"백","t":"천주의 성모 마리아 대축일","o":[],"n":"세계 평화의 날","g":"대영광송 · 신경 · 교중","i":"교회는 1월 1일을 ‘천주의 성모 마리아 대축일’로 지내고 있다. 성모 마리아께 ‘하느님의 어머니’를 뜻하는 ‘천주의 성모’라는 칭호를 공식적으로 부여한 것은 에페소 공의회(431년)이다. 지역마다 서로 다른 날짜에 기념해 오던 이 축일은 에페소 공의회 1500주년인 1931년부터 보편 교회의 축일이 되었고, 1970년부터 모든 교회에서 1월 1일에 지내고 있다. 또한 성 바오로 6세 교황이 1968년에 천주의 성모 마리아 대축일을 세계 평화를 위하여 기도하는 ‘세계 평화의 날’로 정함에 따라 교회는 이후 해마다 이를 기념하고 있다.","s":{"입당송":"거룩하신 어머니, 찬미받으소서. 당신은 하늘과 땅을 영원히 다스리시는 임금님을 낳으셨나이다.\n<또는>\n이사 9,1.5; 루카 1,33 참조\n오늘 우리 위에 빛이 비치고, 주님이 우리에게 태어나셨네. 주님은 놀라운 하느님, 평화의 임금님, 영원한 아버지라 불리시리니, 그분의 나라는 끝이 없으리라.","본기도":"하느님,\n복되신 동정 마리아의 출산을 통하여\n인류에게 영원한 구원의 은혜를 베푸셨으니\n언제나 저희를 위하여 빌어 주시는 성모 마리아의 전구로\n저희가 생명의 근원이신 성자, 우리 주 예수 그리스도를 따라 살게 하소서.\n성자께서는 성부와 …….","제1독서":"<이스라엘 자손들 위로 나의 이름을 부르면 내가 그들에게 복을 내리겠다.>\n▥ 민수기의 말씀입니다.\n6,22-27\n22 주님께서 모세에게 이르셨다.\n23 “아론과 그의 아들들에게 일러라.\n‘너희는 이렇게 말하면서 이스라엘 자손들에게 축복하여라.\n24 ′주님께서 그대에게 복을 내리시고 그대를 지켜 주시리라.\n25 주님께서 그대에게 당신 얼굴을 비추시고 그대에게 은혜를 베푸시리라.\n26 주님께서 그대에게 당신 얼굴을 들어 보이시고\n그대에게 평화를 베푸시리라.′’\n27 그들이 이렇게 이스라엘 자손들 위로 나의 이름을 부르면,\n내가 그들에게 복을 내리겠다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 67(66),2-3.5.6과 8(◎ 2ㄱ)\n◎ 하느님은 자비를 베푸시고 저희에게 복을 내리소서.\n○ 하느님은 자비를 베푸시고 저희에게 복을 내리소서. 당신 얼굴을 저희에게 비추소서. 당신의 길을 세상이 알고, 당신의 구원을 만민이 알게 하소서. ◎\n○ 당신이 민족들을 올바로 심판하시고 세상의 겨레들을 이끄시니, 겨레들이 기뻐하고 환호하리이다. ◎\n○ 하느님, 민족들이 당신을 찬송하게 하소서. 모든 민족들이 당신을 찬송하게 하소서. 하느님은 우리에게 복을 내리시리라. 세상 끝 모든 곳이 그분을 경외하리라. ◎","제2독서":"<하느님께서 당신의 아드님을 보내시어 여인에게서 태어나게 하셨다.>\n▥ 사도 바오로의 갈라티아서 말씀입니다.\n4,4-7\n형제 여러분, 4 때가 차자 하느님께서 당신의 아드님을 보내시어\n여인에게서 태어나 율법 아래 놓이게 하셨습니다.\n5 율법 아래 있는 이들을 속량하시어\n우리가 하느님의 자녀 되는 자격을 얻게 하시려는 것이었습니다.\n6 진정 여러분이 자녀이기 때문에\n하느님께서 당신 아드님의 영을 우리 마음 안에 보내 주셨습니다.\n그 영께서 “아빠! 아버지!” 하고 외치고 계십니다.\n7 그러므로 그대는 더 이상 종이 아니라 자녀입니다.\n그리고 자녀라면 하느님께서 세워 주신 상속자이기도 합니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"히브 1,1-2 참조\n◎ 알렐루야.\n○ 하느님이 예전에는 예언자들을 통하여 조상들에게 여러 번 말씀하셨지만 이 마지막 때에는 아드님을 통하여 우리에게 말씀하셨네.\n◎ 알렐루야.","복음":"<목자들은 마리아와 요셉과 아기를 찾아냈다. 여드레 뒤 그 아기는 이름을 예수라고 하였다.>\n✠ 루카가 전한 거룩한 복음입니다.\n2,16-21\n그때에 목자들이 베들레헴으로 16 서둘러 가서,\n마리아와 요셉과 구유에 누운 아기를 찾아냈다.\n17 목자들은 아기를 보고 나서, 그 아기에 관하여 들은 말을 알려 주었다.\n18 그것을 들은 이들은 모두 목자들이 자기들에게 전한 말에 놀라워하였다.\n19 그러나 마리아는 이 모든 일을 마음속에 간직하고 곰곰이 되새겼다.\n20 목자들은 천사가 자기들에게 말한 대로 듣고 본 모든 것에 대하여\n하느님을 찬양하고 찬미하며 돌아갔다.\n21 여드레가 차서 아기에게 할례를 베풀게 되자 그 이름을 예수라고 하였다.\n그것은 아기가 잉태되기 전에 천사가 일러 준 이름이었다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>","예물 기도":"하느님,\n온갖 좋은 일을 시작하시고 완성하시니\n저희가 즐거운 마음으로 천주의 성모 마리아 대축일을 지내며\n새 시대를 열어 주신 하느님의 은총을 찬양하고\n그 은총의 완성을 기뻐하게 하소서.\n우리 주 …….","감사송":"<복되신 동정 마리아 감사송 1 : 어머니이신 마리아>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사하고\n복되신 평생 동정 마리아 ( ) 축일에\n아버지를 찬송하고 찬양하고 찬미함은\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n성모님께서는 성령으로 외아들을 잉태하시고\n동정의 영광을 간직한 채\n영원한 빛이신 우리 주 예수 그리스도를 이 세상에 낳으셨나이다.\n그리스도를 통하여 천사들이 주님의 위엄을 찬미하고\n주품천사들이 흠숭하며 권품천사들이 두려워하고\n하늘 위 하늘의 능품천사들과 복된 세라핌이\n다 함께 예배하며 환호하오니\n저희도 그들과 소리를 모아 삼가 주님을 찬양하나이다.","영성체송":"히브 13,8\n예수 그리스도는 어제도 오늘도 또 영원히 같은 분이시다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 즐거운 마음으로 천상 성사를 받고 비오니\n평생 동정이신 성모 마리아를\n성자의 어머니요 교회의 어머니로 공경하는 저희가\n영원한 생명을 얻게 하소서.\n우리 주 ……."}},"20270102":{"d":"2027년 01월 02일 토요일","c":"백","t":"성 대 바실리오와 나지안조의 성 그레고리오 주교 학자 기념일 / 주님 공현 대축일 전야 미사","o":[],"n":"","g":"","i":"바실리오 성인은 330년 무렵 소아시아의 카파도키아 지방 카이사리아의 그리스도인 가정에서 태어났다. 은수 생활을 하기도 한 바실리오는 학문과 덕행에서 뛰어났다. 370년 무렵 카이사리아의 주교가 된 그는 특히 이단 아리우스파에 맞서 싸웠다. 바실리오 주교는 많은 저서를 남겼는데, 그 가운데 『수도 규칙』은 오늘날까지도 동방 교회의 많은 수도자가 참고하며 따르고 있다. 성인은 379년 무렵 세상을 떠났다.\n그레고리오 성인 또한 330년 무렵 바실리오 성인과 같은 지역의 나지안조 근처에서 태어났다. 그는 동료 바실리오를 따라 은수 생활을 하다가 381년 무렵 콘스탄티노폴리스의 주교가 되었다. 그레고리오 주교도 바실리오 주교처럼 교리와 설교에 탁월하여 ‘신학자’라고 불렸다. 성인은 390년 무렵 세상을 떠났다.","m":[{"l":"기념일 미사","s":{"입당송":"집회 44,15.14 참조\n뭇 백성이 성인들의 지혜를 기리고 회중이 그들을 칭송하리라. 그들의 이름은 대대로 살아 있으리라.","본기도":"하느님,\n복된 바실리오와 그레고리오 주교의 삶과 가르침으로\n교회를 빛내셨으니\n저희가 겸손한 마음으로 하느님의 진리를 배우고\n사랑으로 충실히 실천하게 하소서.\n성부와 성령과 …….","제1독서":"<여러분은 처음부터 들은 것을 여러분 안에 간직하십시오.>\n▥ 요한 1서의 말씀입니다.\n2,22-28\n사랑하는 여러분,\n22 누가 거짓말쟁이입니까?\n예수님께서 그리스도이심을 부인하는 사람이 아닙니까?\n아버지와 아드님을 부인하는 자가 곧 ‘그리스도의 적’입니다.\n23 아드님을 부인하는 자는\n아무도 아버지를 모시고 있지 않습니다.\n아드님을 믿는다고 고백하는 사람이라야 아버지도 모십니다.\n24 여러분은 처음부터 들은 것을 여러분 안에 간직하십시오.\n처음부터 들은 것을 여러분 안에 간직하면,\n여러분도 아드님과 아버지 안에 머무르게 될 것입니다.\n25 이것이 그분께서 우리에게 하신 약속, 곧 영원한 생명입니다.\n26 나는 여러분을 속이는 자들과 관련하여 이 글을 씁니다.\n27 그러나 여러분은 그분에게서 기름부음을 받았고\n지금도 그 상태를 보존하고 있으므로,\n누가 여러분을 가르칠 필요가 없습니다.\n그분께서 기름부으심으로 여러분에게 모든 것을 가르치십니다.\n기름부음은 진실하고 거짓이 없습니다.\n여러분은 그 가르침대로 그분 안에 머무르십시오.\n28 그러니 이제 자녀 여러분, 그분 안에 머무르십시오.\n그래야 그분께서 나타나실 때에 우리가 확신을 가질 수 있고,\n그분의 재림 때에 그분 앞에서 부끄러운 일을 당하지 않을 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 98(97),1.2-3ㄱㄴ.3ㄷㄹ-4(◎ 3ㄷㄹ)\n◎ 우리 하느님의 구원을 온 세상 땅끝마다 모두 보았네.\n○ 주님께 노래하여라, 새로운 노래. 그분이 기적들을 일으키셨네. 그분의 오른손이, 거룩한 그 팔이, 승리를 가져오셨네. ◎\n○ 주님은 당신 구원을 알리셨네. 민족들의 눈앞에 당신 정의를 드러내셨네. 이스라엘 집안을 위하여, 당신 자애와 진실을 기억하셨네. ◎\n○ 우리 하느님의 구원을 온 세상 땅끝마다 모두 보았네. 주님께 환성 올려라, 온 세상아. 즐거워하며 환호하여라, 찬미 노래 불러라. ◎","복음 환호송":"히브 1,1-2 참조\n◎ 알렐루야.\n○ 하느님이 예전에는 예언자들을 통하여 조상들에게 여러 번 말씀하셨지만 이 마지막 때에는 아드님을 통하여 우리에게 말씀하셨네.\n◎ 알렐루야.","복음":"<그리스도는 내 뒤에 오시는 분이시다.>\n✠ 요한이 전한 거룩한 복음입니다.\n1,19-28\n19 요한의 증언은 이러하다.\n유다인들이 예루살렘에서 사제들과 레위인들을 요한에게 보내어,\n“당신은 누구요?” 하고 물었을 때, 20 요한은 서슴지 않고 고백하였다.\n“나는 그리스도가 아니다.” 하고 고백한 것이다.\n21 그들이 “그러면 누구란 말이오? 엘리야요?” 하고 묻자,\n요한은 “아니다.” 하고 대답하였다.\n“그러면 그 예언자요?” 하고 물어도 다시 “아니다.” 하고 대답하였다.\n22 그래서 그들이 물었다.\n“당신은 누구요? 우리를 보낸 이들에게 우리가 대답을 해야 하오.\n당신은 자신을 무엇이라고 말하는 것이오?”\n23 요한이 말하였다.\n“나는 이사야 예언자가 말한 대로 ‘너희는 주님의 길을 곧게 내어라.’ 하고\n광야에서 외치는 이의 소리다.”\n24 그들은 바리사이들이 보낸 사람들이었다.\n25 이들이 요한에게 물었다.\n“당신이 그리스도도 아니고 엘리야도 아니고 그 예언자도 아니라면,\n세례는 왜 주는 것이오?”\n26 그러자 요한이 그들에게 대답하였다. “나는 물로 세례를 준다.\n그런데 너희 가운데에는 너희가 모르는 분이 서 계신다.\n27 내 뒤에 오시는 분이신데,\n나는 그분의 신발 끈을 풀어 드리기에도 합당하지 않다.”\n28 이는 요한이 세례를 주던 요르단 강 건너편 베타니아에서 일어난 일이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(에페 4,1-7.11-13)와 복음(마태 23,8-12)을 봉독할 수 있다.>","예물 기도":"주님,\n주님의 백성이 복된 바실리오와 그레고리오를 기리며\n제사를 바치오니\n이 제사가 주님께는 영광이 되고\n저희에게는 영원한 구원이 되게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<성인 감사송 1 : 성인들의 영광>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 성인들 가운데서 찬미를 받으시며\n그들의 공로를 갚아 주시어 주님의 은총을 빛내시나이다.\n또 성인들의 삶을 저희에게 모범으로 주시고\n저희가 성인들과 하나 되게 하시며 그 기도의 도움을 받게 하시나이다.\n저희는 이 위대한 증인에게서 힘을 얻고\n악과 싸워서 승리를 거두고 나아갈 길을 끝까지 달려\n우리 주 그리스도를 통하여\n그들과 함께 영원히 시들지 않는 영광의 월계관을 받나이다.\n그러므로 천사와 대천사와 성인들의 무리와 함께\n저희도 주님을 찬미하며 끝없이 노래하나이다.","영성체송":"1코린 1,23-24\n우리는 십자가에 못 박히신 그리스도를 선포하노라. 그리스도는 하느님의 힘이시며 하느님의 지혜이시다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n복된 바실리오와 그레고리오를 기리며 받아 모신 천상 음식으로\n저희가 힘을 얻어 믿음을 온전히 간직하며\n구원의 길을 충실히 걷게 하소서.\n우리 주 ……."}},{"l":"공현 전야 미사","s":{"입당송":"바룩 5,5 참조\n예루살렘아, 일어나서 동쪽을 바라보아라. 네 자녀들이 해 지는 데에서 해뜨는 데까지 사방에서 몰려드는 것을 보아라.","본기도":"주님,\n주님의 찬란한 빛으로 저희 마음을 밝혀 주시어\n저희가 이 세상의 어둠에서 벗어나\n영원한 빛의 나라에 이르게 하소서.\n성부와 성령과 …….","제1독서":"<주님의 영광이 네 위에 떠올랐다.>\n▥ 이사야서의 말씀입니다.\n60,1-6\n예루살렘아, 1 일어나 비추어라. 너의 빛이 왔다.\n주님의 영광이 네 위에 떠올랐다.\n2 자 보라, 어둠이 땅을 덮고 암흑이 겨레들을 덮으리라.\n그러나 네 위에는 주님께서 떠오르시고 그분의 영광이 네 위에 나타나리라.\n3 민족들이 너의 빛을 향하여, 임금들이 떠오르는 너의 광명을 향하여 오리라.\n4 네 눈을 들어 주위를 둘러보아라. 그들이 모두 모여 네게로 온다.\n너의 아들들이 먼 곳에서 오고 너의 딸들이 팔에 안겨 온다.\n5 그때 이것을 보는 너는 기쁜 빛으로 가득하고\n너의 마음은 두근거리며 벅차오르리라.\n바다의 보화가 너에게로 흘러들고 민족들의 재물이 너에게로 들어온다.\n6 낙타 무리가 너를 덮고 미디안과 에파의 수낙타들이 너를 덮으리라.\n그들은 모두 스바에서 오면서 금과 유향을 가져와\n주님께서 찬미받으실 일들을 알리리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.7-8.10-11.12-13(◎ 11 참조)\n◎ 주님, 세상 모든 민족들이 당신을 경배하리이다.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 저 달이 다할 그때까지, 정의와 큰 평화가 그의 시대에 꽃피게 하소서. 그가 바다에서 바다까지, 강에서 땅끝까지 다스리게 하소서. ◎\n○ 타르시스와 섬나라 임금들이 예물을 가져오고, 세바와 스바의 임금들이 조공을 바치게 하소서. 모든 임금들이 그에게 경배하고, 모든 민족들이 그를 섬기게 하소서. ◎\n○ 그는 하소연하는 불쌍한 이를, 도와줄 사람 없는 가련한 이를 구원하나이다. 약한 이, 불쌍한 이에게 동정을 베풀고, 불쌍한 이들의 목숨을 살려 주나이다. ◎","제2독서":"<지금은 그리스도의 신비가 계시되었습니다. 곧 다른 민족들도 약속의 공동 상속자가 된다는 것입니다.>\n▥ 사도 바오로의 에페소서 말씀입니다.\n3,2.3ㄴ.5-6\n형제 여러분,\n2 하느님께서 여러분을 위하여 나에게 주신 은총의 직무를\n여러분은 들었을 줄 압니다.\n3 나는 계시를 통하여 그 신비를 알게 되었습니다.\n5 그 신비가 과거의 모든 세대에서는 사람들에게 알려지지 않았지만,\n지금은 성령을 통하여 그분의 거룩한 사도들과 예언자들에게 계시되었습니다.\n6 곧 다른 민족들도 그리스도 예수님 안에서 복음을 통하여,\n공동 상속자가 되고 한 몸의 지체가 되며\n약속의 공동 수혜자가 된다는 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마태 2,2 참조\n◎ 알렐루야.\n○ 우리는 동방에서 주님의 별을 보고 그분께 경배하러 왔노라.\n◎ 알렐루야.","복음":"<우리는 동방에서 임금님께 경배하러 왔습니다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n2,1-12\n1 예수님께서는 헤로데 임금 때에 유다 베들레헴에서 태어나셨다.\n그러자 동방에서 박사들이 예루살렘에 와서,\n2 “유다인들의 임금으로 태어나신 분이 어디 계십니까?\n우리는 동방에서 그분의 별을 보고 그분께 경배하러 왔습니다.” 하고 말하였다.\n3 이 말을 듣고 헤로데 임금을 비롯하여 온 예루살렘이 깜짝 놀랐다.\n4 헤로데는 백성의 수석 사제들과 율법 학자들을 모두 모아 놓고,\n메시아가 태어날 곳이 어디인지 물어보았다.\n5 그들이 헤로데에게 말하였다.\n“유다 베들레헴입니다. 사실 예언자가 이렇게 기록해 놓았습니다.\n6 ‘유다 땅 베들레헴아,\n너는 유다의 주요 고을 가운데 결코 가장 작은 고을이 아니다.\n너에게서 통치자가 나와 내 백성 이스라엘을 보살피리라.’”\n7 그때에 헤로데는 박사들을 몰래 불러\n별이 나타난 시간을 정확히 알아내고서는,\n8 그들을 베들레헴으로 보내면서 말하였다.\n“가서 그 아기에 관하여 잘 알아보시오.\n그리고 그 아기를 찾거든 나에게 알려 주시오. 나도 가서 경배하겠소.”\n9 그들은 임금의 말을 듣고 길을 떠났다.\n그러자 동방에서 본 별이 그들을 앞서가다가,\n아기가 있는 곳 위에 이르러 멈추었다.\n10 그들은 그 별을 보고 더없이 기뻐하였다.\n11 그리고 그 집에 들어가 어머니 마리아와 함께 있는 아기를 보고\n땅에 엎드려 경배하였다.\n또 보물 상자를 열고 아기에게 황금과 유향과 몰약을 예물로 드렸다.\n12 그들은 꿈에 헤로데에게 돌아가지 말라는 지시를 받고,\n다른 길로 자기 고장에 돌아갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>","예물 기도":"주님,\n외아드님께서 인류의 맏이로 드러나심을 경축하며 비오니\n저희가 바치는 이 예물을 받으시어\n주님께는 찬미의 제사가 되고\n저희에게는 영원한 구원이 되게 하소서.\n우리 주 …….","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"묵시 21,23.24 참조\n하느님의 영광이 거룩한 도성 예루살렘을 비추고, 민족들이 그 빛 속에서 거닐었네.","영성체 후 기도":"주님,\n저희가 거룩한 양식으로 힘을 얻고 주님의 자비를 청하오니\n언제나 저희 마음을 정의의 별로 비추시어\n가장 고귀한 예물로 주님을 경배하게 하소서.\n우리 주 ……."}}]},"20270103":{"d":"2027년 01월 03일 일요일","c":"백","t":"주님 공현 대축일","o":[],"n":"","g":"대영광송 · 신경 · 교중","i":"‘주님 공현 대축일’은 또 하나의 ‘주님 성탄 대축일’이라고도 한다. 동방의 세 박사가 아기 예수님께 경배하러 간 것을 기념하는 날로, 이를 통하여 인류의 구세주이신 예수님의 탄생이 세상에 드러났기 때문이다. 우리나라에서는 주님 공현 대축일을 해마다 1월 2일과 8일 사이의 주일에 지내고 있다.","s":{"입당송":"말라 3,1; 1역대 29,12 참조\n보라, 만군의 주님이 오신다. 그분께 나라와 권능과 권세가 있다.","본기도":"하느님,\n오늘, 별의 인도로 성자를 이민족들에게 드러내 보이셨으니\n믿음으로 하느님을 알게 된 저희도 자비로이 이끄시어\n지극히 높으신 하느님을 직접 뵈옵게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<주님의 영광이 네 위에 떠올랐다.>\n▥ 이사야서의 말씀입니다.\n60,1-6\n예루살렘아, 1 일어나 비추어라. 너의 빛이 왔다.\n주님의 영광이 네 위에 떠올랐다.\n2 자 보라, 어둠이 땅을 덮고 암흑이 겨레들을 덮으리라.\n그러나 네 위에는 주님께서 떠오르시고 그분의 영광이 네 위에 나타나리라.\n3 민족들이 너의 빛을 향하여, 임금들이 떠오르는 너의 광명을 향하여 오리라.\n4 네 눈을 들어 주위를 둘러보아라. 그들이 모두 모여 네게로 온다.\n너의 아들들이 먼 곳에서 오고 너의 딸들이 팔에 안겨 온다.\n5 그때 이것을 보는 너는 기쁜 빛으로 가득하고\n너의 마음은 두근거리며 벅차오르리라.\n바다의 보화가 너에게로 흘러들고 민족들의 재물이 너에게로 들어온다.\n6 낙타 무리가 너를 덮고 미디안과 에파의 수낙타들이 너를 덮으리라.\n그들은 모두 스바에서 오면서 금과 유향을 가져와\n주님께서 찬미받으실 일들을 알리리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.7-8.10-11.12-13(◎ 11 참조)\n◎ 주님, 세상 모든 민족들이 당신을 경배하리이다.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 저 달이 다할 그때까지, 정의와 큰 평화가 그의 시대에 꽃피게 하소서. 그가 바다에서 바다까지, 강에서 땅끝까지 다스리게 하소서. ◎\n○ 타르시스와 섬나라 임금들이 예물을 가져오고, 세바와 스바의 임금들이 조공을 바치게 하소서. 모든 임금들이 그에게 경배하고, 모든 민족들이 그를 섬기게 하소서. ◎\n○ 그는 하소연하는 불쌍한 이를, 도와줄 사람 없는 가련한 이를 구원하나이다. 약한 이, 불쌍한 이에게 동정을 베풀고, 불쌍한 이들의 목숨을 살려 주나이다. ◎","제2독서":"<지금은 그리스도의 신비가 계시되었습니다. 곧 다른 민족들도 약속의 공동 상속자가 된다는 것입니다.>\n▥ 사도 바오로의 에페소서 말씀입니다.\n3,2.3ㄴ.5-6\n형제 여러분,\n2 하느님께서 여러분을 위하여 나에게 주신 은총의 직무를\n여러분은 들었을 줄 압니다.\n3 나는 계시를 통하여 그 신비를 알게 되었습니다.\n5 그 신비가 과거의 모든 세대에서는 사람들에게 알려지지 않았지만,\n지금은 성령을 통하여 그분의 거룩한 사도들과 예언자들에게 계시되었습니다.\n6 곧 다른 민족들도 그리스도 예수님 안에서 복음을 통하여,\n공동 상속자가 되고 한 몸의 지체가 되며\n약속의 공동 수혜자가 된다는 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마태 2,2 참조\n◎ 알렐루야.\n○ 우리는 동방에서 주님의 별을 보고 그분께 경배하러 왔노라.\n◎ 알렐루야.","복음":"<우리는 동방에서 임금님께 경배하러 왔습니다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n2,1-12\n1 예수님께서는 헤로데 임금 때에 유다 베들레헴에서 태어나셨다.\n그러자 동방에서 박사들이 예루살렘에 와서,\n2 “유다인들의 임금으로 태어나신 분이 어디 계십니까?\n우리는 동방에서 그분의 별을 보고 그분께 경배하러 왔습니다.” 하고 말하였다.\n3 이 말을 듣고 헤로데 임금을 비롯하여 온 예루살렘이 깜짝 놀랐다.\n4 헤로데는 백성의 수석 사제들과 율법 학자들을 모두 모아 놓고,\n메시아가 태어날 곳이 어디인지 물어보았다.\n5 그들이 헤로데에게 말하였다.\n“유다 베들레헴입니다. 사실 예언자가 이렇게 기록해 놓았습니다.\n6 ‘유다 땅 베들레헴아,\n너는 유다의 주요 고을 가운데 결코 가장 작은 고을이 아니다.\n너에게서 통치자가 나와 내 백성 이스라엘을 보살피리라.’”\n7 그때에 헤로데는 박사들을 몰래 불러\n별이 나타난 시간을 정확히 알아내고서는,\n8 그들을 베들레헴으로 보내면서 말하였다.\n“가서 그 아기에 관하여 잘 알아보시오.\n그리고 그 아기를 찾거든 나에게 알려 주시오. 나도 가서 경배하겠소.”\n9 그들은 임금의 말을 듣고 길을 떠났다.\n그러자 동방에서 본 별이 그들을 앞서가다가,\n아기가 있는 곳 위에 이르러 멈추었다.\n10 그들은 그 별을 보고 더없이 기뻐하였다.\n11 그리고 그 집에 들어가 어머니 마리아와 함께 있는 아기를 보고\n땅에 엎드려 경배하였다.\n또 보물 상자를 열고 아기에게 황금과 유향과 몰약을 예물로 드렸다.\n12 그들은 꿈에 헤로데에게 돌아가지 말라는 지시를 받고,\n다른 길로 자기 고장에 돌아갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>","예물 기도":"주님,\n이제 황금과 유향과 몰약이 아니라\n그 예물을 받으신 예수 그리스도를 봉헌하고 받아 모시오니\n저희가 바치는 이 제물을 자비로이 굽어보시고 받아들이소서.\n성자께서는 영원히 살아 계시며 다스리시나이다.","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"마태 2,2 참조\n우리는 동방에서 주님의 별을 보고, 예물을 가지고 그분께 경배하러 왔노라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n언제나 어디서나 저희를 천상 빛으로 이끄시니\n저희가 받아 모신 이 성체의 신비를 올바로 깨닫고\n성자 그리스도와 온전히 하나 되게 하소서.\n우리 주 그리스도를 통하여 비나이다."}},"20270104":{"d":"2027년 01월 04일 월요일","c":"백","t":"주님 공현 대축일 후 월요일","o":[],"n":"","g":"","i":"","s":{"입당송":"거룩한 날이 우리에게 밝았네. 민족들아, 어서 와 주님을 경배하여라. 큰 빛이 땅 위에 내린다.","본기도":"하느님,\n하늘을 꾸미신 영원한 말씀이\n동정 마리아의 몸에서 나약한 인간이 되셨으니\n저희에게 나타난 이 진리의 빛이\n세상의 구원을 위하여 힘찬 권능을 펼치게 하소서.\n성자께서는 성부와 …….","제1독서":"<그 영이 하느님께 속한 것인지 시험해 보십시오.>\n▥ 요한 1서의 말씀입니다.\n3,22―4,6\n사랑하는 여러분, 22 우리가 청하는 것은 다 그분에게서 받게 됩니다.\n우리가 그분의 계명을 지키고 그분 마음에 드는 것을 하기 때문입니다.\n23 그분의 계명은 이렇습니다.\n그분께서 우리에게 명령하신 대로,\n그분의 아드님이신 예수 그리스도의 이름을 믿고\n서로 사랑하라는 것입니다.\n24 그분의 계명을 지키는 사람은 그분 안에 머무르고,\n그분께서도 그 사람 안에 머무르십니다.\n그리고 그분께서 우리 안에 머무르신다는 것을\n우리는 바로 그분께서 우리에게 주신 성령으로 알고 있습니다.\n4,1 사랑하는 여러분, 아무 영이나 다 믿지 말고\n그 영이 하느님께 속한 것인지 시험해 보십시오.\n거짓 예언자들이 세상으로 많이 나갔기 때문입니다.\n2 여러분은 하느님의 영을 이렇게 알 수 있습니다.\n예수 그리스도께서 사람의 몸으로 오셨다고 고백하는 영은\n모두 하느님께 속한 영입니다.\n3 그러나 예수님을 믿는다고 고백하지 않는 영은\n모두 하느님께 속하지 않는 영입니다.\n그것은 ‘그리스도의 적’의 영입니다.\n그 영이 오리라고 여러분이 전에 들었는데, 이제 이미 세상에 와 있습니다.\n4 자녀 여러분, 여러분은 하느님께 속한 사람으로서\n거짓 예언자들을 이미 이겼습니다.\n여러분 안에 계시는 그분께서 세상에 있는 그자보다 더 위대하시기 때문입니다.\n5 그들은 이 세상에 속한 자들입니다.\n그런 까닭에 그들은 세상에 속한 것을 말하고 세상은 그들의 말을 듣습니다.\n6 우리는 하느님께 속한 사람입니다.\n하느님을 아는 사람은 우리의 말을 듣고,\n하느님께 속하지 않는 사람은 우리의 말을 듣지 않습니다.\n이것으로 우리는 진리의 영을 알고 또 사람을 속이는 영을 압니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 2,7-8.10-11(◎ 8ㄴ)\n◎ 내가 민족들을 너의 재산으로 주리라.\n○ 주님의 결정을 나는 선포하리라. 주님이 나에게 말씀하셨다. “너는 내 아들, 내가 오늘 너를 낳았노라. 나에게 청하여라. 내가 민족들을 너의 재산으로, 땅끝까지 너의 소유로 주리라.” ◎\n○ 임금들아, 이제는 깨달아라. 세상 통치자들아, 경고를 받아들여라. 경외하며 주님을 섬기고, 떨며 그분 발에 입 맞추어라. ◎","복음 환호송":"마태 4,23 참조\n◎ 알렐루야.\n○ 예수님은 하늘 나라의 복음을 선포하시고 백성 가운데 병자들을 모두 고쳐 주셨네.\n◎ 알렐루야.","복음":"<하늘 나라가 가까이 왔다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n4,12-17.23-25\n그때에 12 예수님께서는 요한이 잡혔다는 말을 들으시고 갈릴래아로 물러가셨다.\n13 그리고 나자렛을 떠나 즈불룬과 납탈리 지방 호숫가에 있는\n카파르나움으로 가시어 자리를 잡으셨다.\n14 이사야 예언자를 통하여 하신 말씀이 이루어지려고 그리된 것이다.\n15 “즈불룬 땅과 납탈리 땅, 바다로 가는 길, 요르단 건너편, 이민족들의 갈릴래아,\n16 어둠 속에 앉아 있는 백성이 큰 빛을 보았다.\n죽음의 그림자가 드리운 고장에 앉아 있는 이들에게 빛이 떠올랐다.”\n17 그때부터 예수님께서는 “회개하여라. 하늘 나라가 가까이 왔다.” 하고\n선포하기 시작하셨다.\n23 예수님께서는 온 갈릴래아를 두루 다니시며\n회당에서 가르치시고 하늘 나라의 복음을 선포하시며,\n백성 가운데에서 병자와 허약한 이들을 모두 고쳐 주셨다.\n24 그분의 소문이 온 시리아에 퍼졌다.\n그리하여 사람들이 갖가지 질병과 고통에 시달리는 환자들과 마귀 들린 이들,\n간질 병자들과 중풍 병자들을 그분께 데려왔다.\n예수님께서는 그들을 고쳐 주셨다.\n25 그러자 갈릴래아, 데카폴리스, 예루살렘, 유다,\n그리고 요르단 건너편에서 온 많은 군중이 그분을 따랐다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 이 예물을 받으시고\n놀라운 교환의 신비를 이루시어\n주님께 받은 것을 바치는 저희가 주님을 합당히 모시게 하소서.\n우리 주 …….","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"요한 1,14 참조\n우리는 주님의 영광을 보았네. 아버지의 외아드님, 은총과 진리가 충만하신 분의 영광을 보았네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n거룩하고 신비로운 이 성사의 힘으로\n언제나 저희 생명을 보호하여 주소서.\n우리 주 ……."}},"20270105":{"d":"2027년 01월 05일 화요일","c":"백","t":"주님 공현 대축일 후 화요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 118(117),26.27 참조\n주님의 이름으로 오시는 분, 찬미받으소서.\n주님은 하느님, 우리를 비추시네.","본기도":"하느님,\n외아드님께서 저희와 같은 사람의 모습으로 나타나셨으니\n겉모습만이 아니라 내면에서도\n저희가 그분을 닮아 새로워지게 하소서.\n성자께서는 성부와 …….","제1독서":"<하느님은 사랑이십니다.>\n▥ 요한 1서의 말씀입니다.\n4,7-10\n7 사랑하는 여러분, 서로 사랑합시다.\n사랑은 하느님에게서 오는 것이기 때문입니다.\n사랑하는 이는 모두 하느님에게서 태어났으며 하느님을 압니다.\n8 사랑하지 않는 사람은 하느님을 알지 못합니다.\n하느님은 사랑이시기 때문입니다.\n9 하느님의 사랑은 우리에게 이렇게 나타났습니다.\n곧 하느님께서 당신의 외아드님을 세상에 보내시어\n우리가 그분을 통하여 살게 해 주셨습니다.\n10 그 사랑은 이렇습니다.\n우리가 하느님을 사랑한 것이 아니라, 그분께서 우리를 사랑하시어\n당신의 아드님을 우리 죄를 위한 속죄 제물로 보내 주신 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.3-4ㄱㄴ.7-8(◎ 11 참조)\n◎ 주님, 세상 모든 민족들이 당신을 경배하리이다.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 산들은 백성에게 평화를, 언덕들은 정의를 가져오게 하소서. 그가 가련한 백성의 권리를 보살피고, 불쌍한 이에게 도움을 베풀게 하소서. ◎\n○ 저 달이 다할 그때까지, 정의와 큰 평화가 그의 시대에 꽃피게 하소서. 그가 바다에서 바다까지, 강에서 땅끝까지 다스리게 하소서. ◎","복음 환호송":"루카 4,18\n◎ 알렐루야.\n○ 주님이 나를 보내시어 가난한 이들에게 기쁜 소식을 전하고 잡혀간 이들에게 해방을 선포하게 하셨다.\n◎ 알렐루야.","복음":"<빵을 많게 하신 기적으로 예수님께서는 예언자로 나타나셨다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n6,34-44\n그때에 예수님께서는 34 많은 군중을 보시고\n가엾은 마음이 드셨다.\n그들이 목자 없는 양들 같았기 때문이다.\n그래서 그들에게 많은 것을 가르쳐 주기 시작하셨다.\n35 어느덧 늦은 시간이 되자 제자들이 예수님께 다가와 말하였다.\n“여기는 외딴곳이고 시간도 이미 늦었습니다.\n36 그러니 저들을 돌려보내시어,\n주변 촌락이나 마을로 가서 스스로 먹을 것을 사게 하십시오.”\n37 예수님께서 “너희가 그들에게 먹을 것을 주어라.” 하고 이르시니,\n제자들은 “그러면 저희가 가서 빵을 이백 데나리온어치나 사다가\n그들을 먹이라는 말씀입니까?” 하고 물었다.\n38 예수님께서 그들에게,\n“너희에게 빵이 몇 개나 있느냐? 가서 보아라.” 하고 이르셨다.\n그들이 알아보고서,\n“빵 다섯 개, 그리고 물고기 두 마리가 있습니다.” 하고 대답하였다.\n39 예수님께서는 제자들에게 명령하시어,\n모두 푸른 풀밭에 한 무리씩 어울려 자리 잡게 하셨다.\n40 그래서 사람들은 백 명씩 또는 쉰 명씩 떼를 지어 자리를 잡았다.\n41 예수님께서는 빵 다섯 개와 물고기 두 마리를 손에 들고\n하늘을 우러러 찬미를 드리신 다음 빵을 떼어 제자들에게 주시며,\n사람들에게 나누어 주도록 하셨다.\n물고기 두 마리도 모든 사람에게 나누어 주셨다.\n42 사람들은 모두 배불리 먹었다.\n43 그리고 남은 빵 조각과 물고기를 모으니 열두 광주리에 가득 찼다.\n44 빵을 먹은 사람은 장정만도 오천 명이었다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 예물을 인자로이 받으시고\n저희가 경건한 마음으로 고백하는 것을 천상 성사로 깨닫게 하소서.\n우리 주 …….","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"에페 2,4; 로마 8,3 참조\n자비가 풍성하신 하느님은 우리를 사랑하신 그 큰 사랑으로, 당신 아드님을 죄 많은 육의 모습으로 보내셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"하느님,\n성체성사로 저희에게 오셨으니\n이 성사의 힘으로 저희 마음을 움직이시어\n저희가 모신 성체에 더욱 맞갖은 삶을 살아가게 하소서.\n우리 주 ……."}},"20270106":{"d":"2027년 01월 06일 수요일","c":"백","t":"주님 공현 대축일 후 수요일","o":[],"n":"","g":"","i":"","s":{"입당송":"이사 9,1\n어둠 속을 걷던 백성이 큰 빛을 보고, 암흑의 땅에 사는 이들에게 빛이 비치네.","본기도":"온 인류를 비추시는 하느님,\n하느님의 백성이 한결같은 평화를 누리게 하시고\n저희 조상의 정신을 밝히시던 그 빛으로\n저희 마음도 비추어 주소서.\n성부와 성령과 …….","제1독서":"<우리가 서로 사랑하면, 하느님께서 우리 안에 머무르십니다.>\n▥ 요한 1서의 말씀입니다.\n4,11-18\n11 사랑하는 여러분, 하느님께서 우리를 이렇게 사랑하셨으니\n우리도 서로 사랑해야 합니다.\n12 지금까지 하느님을 본 사람은 없습니다.\n그러나 우리가 서로 사랑하면,\n하느님께서 우리 안에 머무르시고 그분 사랑이 우리에게서 완성됩니다.\n13 하느님께서는 우리에게 당신의 영을 나누어 주셨습니다.\n우리는 이 사실로 우리가 그분 안에 머무르고\n그분께서 우리 안에 머무르신다는 것을 압니다.\n14 그리고 우리는 아버지께서 아드님을 세상의 구원자로\n보내신 것을 보았고 또 증언합니다.\n15 누구든지 예수님께서 하느님의 아드님이심을 고백하면,\n하느님께서 그 사람 안에 머무르시고 그 사람도 하느님 안에 머무릅니다.\n16 하느님께서 우리에게 베푸시는 사랑을 우리는 알게 되었고 또 믿게 되었습니다.\n하느님은 사랑이십니다.\n사랑 안에 머무르는 사람은 하느님 안에 머무르고\n하느님께서도 그 사람 안에 머무르십니다.\n17 사랑이 우리에게서 완성되었다는 것은,\n우리도 이 세상에서 그분처럼 살고 있기에\n우리가 심판 날에 확신을 가질 수 있다는 사실에서 드러납니다.\n18 사랑에는 두려움이 없습니다.\n완전한 사랑은 두려움을 쫓아냅니다.\n두려움은 벌과 관련되기 때문입니다.\n두려워하는 이는 아직 자기의 사랑을 완성하지 못한 사람입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.10-11.12-13(◎ 11 참조)\n◎ 주님, 세상 모든 민족들이 당신을 경배하리이다.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 타르시스와 섬나라 임금들이 예물을 가져오고, 세바와 스바의 임금들이 조공을 바치게 하소서. 모든 임금들이 그에게 경배하고, 모든 민족들이 그를 섬기게 하소서. ◎\n○ 그는 하소연하는 불쌍한 이를, 도와줄 사람 없는 가련한 이를 구원하나이다. 약한 이, 불쌍한 이에게 동정을 베풀고, 불쌍한 이들의 목숨을 살려 주나이다. ◎","복음 환호송":"1티모 3,16 참조\n◎ 알렐루야.\n○ 모든 민족들에게 선포되신 그리스도님, 영광받으소서. 온 세상이 믿게 된 그리스도님, 영광받으소서.\n◎ 알렐루야.","복음":"<제자들은 예수님께서 호수 위를 걸으시는 것을 보았다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n6,45-52\n예수님께서는 오천 명을 배불리 먹이신 뒤, 45 곧 제자들을 재촉하시어\n배를 타고 건너편 벳사이다로 먼저 가게 하시고,\n그동안에 당신께서는 군중을 돌려보내셨다.\n46 그들과 작별하신 뒤에 예수님께서는 기도하시려고 산에 가셨다.\n47 저녁이 되었을 때, 배는 호수 한가운데에 있었고\n예수님께서는 혼자 뭍에 계셨다.\n48 마침 맞바람이 불어 노를 젓느라고 애를 쓰는 제자들을 보시고,\n예수님께서는 새벽녘에 호수 위를 걸으시어 그들 쪽으로 가셨다.\n그분께서는 그들 곁을 지나가려고 하셨다.\n49 제자들은 예수님께서 호수 위를 걸으시는 것을 보고,\n유령인 줄로 생각하여 비명을 질렀다.\n50 모두 그분을 보고 겁에 질렸던 것이다.\n예수님께서는 곧 그들에게 말씀하셨다.\n“용기를 내어라. 나다. 두려워하지 마라.”\n51 그러고 나서 그들이 탄 배에 오르시니 바람이 멎었다.\n그들은 너무 놀라 넋을 잃었다.\n52 그들은 빵의 기적을 깨닫지 못하고 오히려 마음이 완고해졌던 것이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"하느님,\n저희에게 참된 믿음과 평화를 주셨으니\n저희가 예물을 바쳐 지극히 높으신 하느님을 합당히 공경하고\n거룩한 제사에 참여하여 온 마음으로 이 신비와 하나 되게 하소서.\n우리 주 …….","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"1요한 1,2 참조\n생명이 나타나셨네. 아버지와 함께 계시다가 우리에게 나타나셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n주님의 백성을 온갖 은혜로 다스리시니\n오늘도 내일도 자비를 베푸시어\n저희가 덧없는 현세에서도 위안을 받고\n영원한 세상을 향하여 더욱 힘차게 나아가게 하소서.\n우리 주 ……."}},"20270107":{"d":"2027년 01월 07일 목요일","c":"백","t":"주님 공현 대축일 후 목요일","o":[{"c":"백","t":"페냐포르트의 성 라이문도 사제"}],"n":"","g":"","i":"","s":{"입당송":"요한 1,1 참조\n한처음 시간이 생기기 전, 말씀은 하느님이셨네. 그 말씀이 세상의 구원자로 태어나셨네.","본기도":"하느님,\n성자를 통하여 온 인류에게 영원한 빛을 보여 주셨으니\n하느님 백성이 구세주의 찬란한 빛을 받아\n영원한 영광의 빛에 이르게 하소서.\n성부와 성령과 …….","제1독서":"<하느님을 사랑하는 사람은 자기 형제도 사랑해야 합니다.>\n▥ 요한 1서의 말씀입니다.\n4,19―5,4\n사랑하는 여러분,\n우리가 하느님을 19 사랑하는 것은\n그분께서 먼저 우리를 사랑하셨기 때문입니다.\n20 누가 “나는 하느님을 사랑한다.” 하면서\n자기 형제를 미워하면, 그는 거짓말쟁이입니다.\n눈에 보이는 자기 형제를 사랑하지 않는 사람이\n보이지 않는 하느님을 사랑할 수는 없습니다.\n21 우리가 그분에게서 받은 계명은 이것입니다.\n하느님을 사랑하는 사람은 자기 형제도 사랑해야 한다는 것입니다.\n5,1 예수님께서 그리스도이심을 믿는 사람은 모두 하느님에게서 태어났습니다.\n아버지를 사랑하는 사람은 모두 그 자녀도 사랑합니다.\n2 우리가 하느님을 사랑하고 그분의 계명을 실천하면,\n그로써 우리가 하느님의 자녀들을 사랑한다는 것을 알게 됩니다.\n3 하느님을 사랑하는 것은 바로 그분의 계명을 지키는 것입니다.\n그리고 그분의 계명은 힘겹지 않습니다.\n4 하느님에게서 태어난 사람은 모두 세상을 이기기 때문입니다.\n세상을 이긴 그 승리는 바로 우리 믿음의 승리입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.14와 15ㄷㄹ.17(◎ 11 참조)\n◎ 주님, 세상 모든 민족들이 당신을 경배하리이다.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 그의 눈에는 그들의 피가 소중하기에, 그는 억압과 폭행에서 그들의 목숨을 구하리이다. 사람들이 그를 위하여 늘 기도하며, 날마다 축복하게 하소서. ◎\n○ 그의 이름 영원히 이어지며, 그의 이름 해처럼 솟아오르게 하소서. 세상 모든 민족들이 그를 통해 복을 받고, 그를 칭송하게 하소서. ◎","복음 환호송":"루카 4,18\n◎ 알렐루야.\n○ 주님이 나를 보내시어 가난한 이들에게 기쁜 소식을 전하고 잡혀간 이들에게 해방을 선포하게 하셨다.\n◎ 알렐루야.","복음":"<오늘 이 성경 말씀이 이루어졌다.>\n✠ 루카가 전한 거룩한 복음입니다.\n4,14-22ㄱ\n그때에 14 예수님께서 성령의 힘을 지니고 갈릴래아로 돌아가시니,\n그분의 소문이 그 주변 모든 지방에 퍼졌다.\n15 예수님께서는 그곳의 여러 회당에서 가르치시며\n모든 사람에게 칭송을 받으셨다.\n16 예수님께서는 당신이 자라신 나자렛으로 가시어,\n안식일에 늘 하시던 대로 회당에 들어가셨다.\n그리고 성경을 봉독하려고 일어서시자,\n17 이사야 예언자의 두루마리가 그분께 건네졌다.\n그분께서는 두루마리를 펴시고 이러한 말씀이 기록된 부분을 찾으셨다.\n18 “주님께서 나에게 기름을 부어 주시니 주님의 영이 내 위에 내리셨다.\n주님께서 나를 보내시어\n가난한 이들에게 기쁜 소식을 전하고 잡혀간 이들에게 해방을 선포하며\n눈먼 이들을 다시 보게 하고 억압받는 이들을 해방시켜 내보내며\n19 주님의 은혜로운 해를 선포하게 하셨다.”\n20 예수님께서 두루마리를 말아 시중드는 이에게 돌려주시고 자리에 앉으시니,\n회당에 있던 모든 사람의 눈이 예수님을 주시하였다.\n21 예수님께서 그들에게 말씀하기 시작하셨다.\n“오늘 이 성경 말씀이 너희가 듣는 가운데에서 이루어졌다.”\n22 그러자 모두 그분을 좋게 말하며,\n그분의 입에서 나오는 은총의 말씀에 놀라워하였다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 이 예물을 받으시고\n놀라운 교환의 신비를 이루시어\n주님께 받은 것을 바치는 저희가 주님을 합당히 모시게 하소서.\n우리 주 …….","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"요한 3,16\n하느님은 세상을 너무나 사랑하신 나머지 외아들을 내주시어, 그를 믿는 사람은 누구나 멸망하지 않고 영원한 생명을 얻게 하셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n거룩하고 신비로운 이 성사의 힘으로\n언제나 저희 생명을 보호하여 주소서.\n우리 주 ……."}},"20270108":{"d":"2027년 01월 08일 금요일","c":"백","t":"주님 공현 대축일 후 금요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 112(111),4 참조\n올곧은 이들에게는 어둠 속에서 빛이 솟으리라. 주님은 너그럽고 자비로우며 의로우시다.","본기도":"전능하신 하느님,\n별의 인도로 구세주의 탄생을 알려 주셨으니\n저희가 언제나 구세주를 믿고\n구원의 신비를 더욱 깊이 깨닫게 하소서.\n성부와 성령과 …….","제1독서":"<성령과 물과 피>\n▥ 요한 1서의 말씀입니다.\n5,5-13\n사랑하는 여러분, 5 세상을 이기는 사람은 누구입니까?\n예수님께서 하느님의 아드님이심을 믿는 사람이 아닙니까?\n6 그분께서 바로 물과 피를 통하여 세상에 오신 예수 그리스도이십니다.\n물만이 아니라 물과 피로써 오신 것입니다.\n이것을 증언하시는 분은 성령이십니다. 성령은 곧 진리이십니다.\n7 그래서 증언하는 것이 셋입니다.\n8 성령과 물과 피인데, 이 셋은 하나로 모아집니다.\n9 우리가 사람들의 증언을 받아들인다면, 하느님의 증언은 더욱 중대하지 않습니까?\n그것이 하느님의 증언이기 때문입니다.\n바로 하느님께서 당신 아드님에 관하여 친히 증언해 주셨습니다.\n10 하느님의 아드님을 믿는 사람은 이 증언을 자신 안에 간직하고 있습니다.\n하느님을 믿지 않는 자는 하느님을 거짓말쟁이로 만들어 버렸습니다.\n하느님께서 당신의 아드님에 관하여 하신 증언을 믿지 않았기 때문입니다.\n11 그 증언은 이렇습니다.\n하느님께서 우리에게 영원한 생명을 주셨고\n그 생명이 당신 아드님에게 있다는 것입니다.\n12 아드님을 모시고 있는 사람은 그 생명을 지니고 있고,\n하느님의 아드님을 모시고 있지 않는 사람은\n그 생명을 지니고 있지 않습니다.\n13 내가 여러분에게,\n곧 하느님의 아드님의 이름을 믿는 이들에게 이 글을 쓰는 까닭은,\n여러분이 영원한 생명을 지니고 있음을 알게 하려는 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 147(146─147),12-13.14-15.19-20ㄱㄴ(◎ 12ㄱ)\n◎ 예루살렘아, 주님을 찬미하여라.\n○ 예루살렘아, 주님을 찬미하여라. 시온아, 네 하느님을 찬양하여라. 그분은 네 성문의 빗장을 튼튼하게 하시고, 네 안에 사는 아들들에게 복을 내리신다. ◎\n○ 주님은 네 강토에 평화를 주시고, 기름진 밀로 너를 배불리신다. 당신 말씀 세상에 보내시니, 그 말씀 빠르게도 달려가네. ◎\n○ 주님은 당신 말씀 야곱에게, 규칙과 계명 이스라엘에게 알리신다. 어느 민족에게 이같이 하셨던가? 그들은 계명을 알지 못하네. ◎","복음 환호송":"마태 4,23 참조\n◎ 알렐루야.\n○ 예수님은 하늘 나라의 복음을 선포하시고 백성 가운데 병자들을 모두 고쳐 주셨네.\n◎ 알렐루야.","복음":"<곧 그의 나병이 가셨다.>\n✠ 루카가 전한 거룩한 복음입니다.\n5,12-16\n12 예수님께서 어느 한 고을에 계실 때, 온몸에 나병이 걸린 사람이 다가왔다.\n그는 예수님을 보자 얼굴을 땅에 대고 엎드려 이렇게 청하였다.\n“주님! 주님께서는 하고자 하시면 저를 깨끗하게 하실 수 있습니다.”\n13 예수님께서 손을 내밀어 그에게 대시며 말씀하셨다.\n“내가 하고자 하니 깨끗하게 되어라.”그러자 곧 나병이 가셨다.\n14 예수님께서는 아무에게도 말하지 말라고 그에게 분부하시고,\n“다만 사제에게 가서 네 몸을 보이고,\n모세가 명령한 대로 네가 깨끗해진 것에 대한 예물을 바쳐,\n그들에게 증거가 되게 하여라.” 하셨다.\n15 그래도 예수님의 소문은 점점 더 퍼져,\n많은 군중이 말씀도 듣고 병도 고치려고 모여 왔다.\n16 그러나 예수님께서는 외딴곳으로 물러가 기도하셨다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 예물을 인자로이 받으시고\n저희가 경건한 마음으로 고백하는 것을 천상 성사로 깨닫게 하소서.\n우리 주 …….","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"1요한 4,9\n하느님의 사랑이 우리에게 나타났네. 하느님이 당신 외아드님을 세상에 보내시어, 우리가 그분을 통하여 살게 해 주셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"하느님,\n성체성사로 저희에게 오셨으니\n이 성사의 힘으로 저희 마음을 움직이시어\n저희가 모신 성체에 더욱 맞갖은 삶을 살아가게 하소서.\n우리 주 ……."}},"20270109":{"d":"2027년 01월 09일 토요일","c":"백","t":"주님 공현 대축일 후 토요일","o":[],"n":"","g":"","i":"","s":{"입당송":"갈라 4,4-5 참조\n하느님은 당신 아드님을 보내시어 여인에게서 태어나게 하시고, 우리를 하느님의 자녀로 삼으셨네.","본기도":"전능하시고 영원하신 하느님,\n외아드님을 통하여 저희를 새사람이 되게 하셨으니\n하느님의 은총으로\n저희가 그분의 모습을 지니게 하소서.\n성자께서는 성부와 …….","제1독서":"<우리가 무엇을 청하든지 그분께서 들어 주신다.>\n▥ 요한 1서의 말씀입니다.\n5,14-21\n사랑하는 여러분, 우리가 하느님의 아드님에 14 대하여 가지는 확신은 이것입니다.\n우리가 무엇이든지 그분의 뜻에 따라 청하면\n그분께서 우리의 청을 들어 주신다는 것입니다.\n15 우리가 무엇을 청하든지 그분께서 들어 주신다는 것을 알면,\n우리가 그분께 청한 것을 받는다는 것도 압니다.\n16 누구든지 자기 형제가 죄를 짓는 것을 볼 때에\n그것이 죽을죄가 아니면, 그를 위하여 청하십시오.\n하느님께서 그에게 생명을 주실 것입니다.\n이는 죽을죄가 아닌 죄를 짓는 이들에게 해당됩니다.\n죽을죄가 있는데, 그러한 죄 때문에 간구하라고 말하는 것은 아닙니다.\n17 모든 불의는 죄입니다. 그러나 죽을죄가 아닌 것도 있습니다.\n18 하느님에게서 태어난 사람은 아무도 죄를 짓지 않는다는 것을 우리는 압니다.\n하느님에게서 태어나신 분께서 그를 지켜 주시어\n악마가 그에게 손을 대지 못합니다.\n19 우리는 하느님께 속한 사람들이고\n온 세상은 악마의 지배 아래 놓여 있다는 것을 압니다.\n20 또한 하느님의 아드님께서 오시어\n우리에게 참되신 분을 알도록 이해력을 주신 것도 압니다.\n우리는 참되신 분 안에 있고 그분의 아드님이신 예수 그리스도 안에 있습니다.\n이분께서 참하느님이시며 영원한 생명이십니다.\n21 자녀 여러분, 우상을 조심하십시오.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 149,1ㄴㄷ-2.3-4.5-6ㄱ과 9ㄴ(◎ 4ㄱ)\n◎ 주님은 당신 백성을 좋아하신다.\n○ 주님께 노래하여라, 새로운 노래. 충실한 이들의 모임에서 찬양 노래 불러라. 이스라엘은 자기를 지으신 분을 모시고 기뻐하고, 시온의 아들들은 임금님을 모시고 즐거워하여라. ◎\n○ 춤추며 그분 이름을 찬양하고, 손북 치고 비파 타며 찬미 노래 드려라. 주님은 당신 백성을 좋아하시고, 가난한 이들을 구원하여 높이신다. ◎\n○ 충실한 이들은 영광 속에 기뻐 뛰며, 그 자리에서 환호하여라. 그들은 목청껏 하느님을 찬송하리라. 그분께 충실한 모든 이에게 영광이어라. ◎","복음 환호송":"마태 4,16\n◎ 알렐루야.\n○ 어둠 속에 앉아 있는 백성이 큰 빛을 보았네. 죽음의 그림자가 드리운 고장에 앉아 있는 이들에게 빛이 떠올랐네.\n◎ 알렐루야.","복음":"<신랑 친구는 신랑의 목소리를 듣게 되면 크게 기뻐한다.>\n✠ 요한이 전한 거룩한 복음입니다.\n3,22-30\n그때에 22 예수님께서는 제자들과 함께 유다 땅으로 가시어,\n그곳에서 제자들과 함께 머무르시며 세례를 주셨다.\n23 요한도 살림에 가까운 애논에 물이 많아, 거기에서 세례를 주고 있었다.\n그리하여 사람들이 가서 세례를 받았다.\n24 그때는 요한이 감옥에 갇히기 전이었다.\n25 그런데 요한의 제자들과 어떤 유다인 사이에 정결례를 두고 말다툼이 벌어졌다.\n26 그래서 그 제자들이 요한에게 가서 말하였다.\n“스승님, 요르단 강 건너편에서 스승님과 함께 계시던 분,\n스승님께서 증언하신 분, 바로 그분이 세례를 주시는데\n사람들이 모두 그분께 가고 있습니다.”\n27 그러자 요한이 대답하였다.\n“하늘로부터 주어지지 않으면 사람은 아무것도 받을 수 없다.\n28 ‘나는 그리스도가 아니라 그분에 앞서 파견된 사람일 따름이다.’\n하고 내가 말한 사실에 관하여, 너희 자신이 내 증인이다.\n29 신부를 차지하는 이는 신랑이다.\n신랑 친구는 신랑의 소리를 들으려고 서 있다가,\n그의 목소리를 듣게 되면 크게 기뻐한다. 내 기쁨도 그렇게 충만하다.\n30 그분은 커지셔야 하고 나는 작아져야 한다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"하느님,\n저희에게 참된 믿음과 평화를 주셨으니\n저희가 예물을 바쳐 지극히 높으신 하느님을 합당히 공경하고\n거룩한 제사에 참여하여 온 마음으로 이 신비와 하나 되게 하소서.\n우리 주 …….","감사송":"<주님 공현 감사송 : 인류의 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 오늘 그리스도를 통하여\n저희 구원의 신비를 밝혀 주시고\n그분을 인류의 빛으로 드러내 주셨나이다.\n또한 그리스도를 죽음의 운명을 지닌 인간으로 나타나게 하시어\n그분께서 지니신 불사불멸의 힘으로\n저희에게 새 생명을 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"요한 1,16 참조\n주님의 충만함에서 우리 모두 은총에 은총을 받았네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n주님의 백성을 온갖 은혜로 다스리시니\n오늘도 내일도 자비를 베푸시어\n저희가 덧없는 현세에서도 위안을 받고\n영원한 세상을 향하여 더욱 힘차게 나아가게 하소서.\n우리 주 ……."}},"20270110":{"d":"2027년 01월 10일 일요일","c":"백","t":"주님 세례 축일","o":[],"n":"","g":"대영광송 · 신경 · 교중","i":"공현 대축일을 1월 7일이나 8일에 오는 주일로 옮겨 지내는 곳에서는, 주님 세례 축일은 바로 다음 월요일에 지낸다. 이때 신경은 바치지 않는다.\n\n‘주님 세례 축일’은 예수님께서 세례자 요한에게 세례 받으신 일을 기념하는 날이다. 주님의 세례는 예수님께서 누구신지를 드러낸 사건으로 주님 공현 대축일과 깊은 관련이 있다. 전례력으로는 주님 세례 축일로 성탄 시기가 끝나고, 다음 날부터 연중 시기가 시작된다.","s":{"입당송":"마태 3,16-17 참조\n주님이 세례를 받으시자 하늘이 열렸네. 성령이 비둘기처럼 그분 위에 머무르시고, 아버지의 목소리가 들려왔네. 이는 내가 사랑하는 아들, 내 마음에 드는 아들이다.","본기도":"전능하시고 영원하신 하느님,\n요르단 강에서 세례를 받으신 그리스도께 성령을 보내시어\n하느님의 사랑하시는 아들로 선포하셨으니\n물과 성령으로 새로 난 저희도\n언제나 하느님 마음에 드는 자녀로 살아가게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.\n<또는>\n하느님, 외아드님께서 저희와 같은 사람의 모습으로 나타나셨으니\n겉모습만이 아니라 내면에서도 저희가 그분을 닮아 새로워지게 하소서.\n성자께서는 성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시나이다.","제1독서":"<여기에 나의 종이 있다. 그는 내 마음에 드는 이다.>\n▥ 이사야서의 말씀입니다.\n42,1-4.6-7\n주님께서 이렇게 말씀하신다. 1 “여기에 나의 종이 있다.\n그는 내가 붙들어 주는 이, 내가 선택한 이, 내 마음에 드는 이다.\n내가 그에게 나의 영을 주었으니 그는 민족들에게 공정을 펴리라.\n2 그는 외치지도 않고 목소리를 높이지도 않으며\n그 소리가 거리에서 들리게 하지도 않으리라.\n3 그는 부러진 갈대를 꺾지 않고 꺼져 가는 심지를 끄지 않으리라.\n그는 성실하게 공정을 펴리라.\n4 그는 지치지 않고 기가 꺾이는 일 없이 마침내 세상에 공정을 세우리니\n섬들도 그의 가르침을 고대하리라.\n6 ‘주님인 내가 의로움으로 너를 부르고 네 손을 붙잡아 주었다.\n내가 너를 빚어 만들어 백성을 위한 계약이 되고 민족들의 빛이 되게 하였으니\n7 보지 못하는 눈을 뜨게 하고 갇힌 이들을 감옥에서,\n어둠 속에 앉아 있는 이들을 감방에서 풀어 주기 위함이다.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n<물가로 오너라. 들어라. 너희가 살리라.>\n▥ 이사야서의 말씀입니다.\n55,1-11\n주님께서 이렇게 말씀하신다.\n1 “자, 목마른 자들아, 모두 물가로 오너라.\n돈이 없는 자들도 와서 사 먹어라. 와서 돈 없이 값 없이 술과 젖을 사라.\n2 너희는 어찌하여 양식도 못 되는 것에 돈을 쓰고\n배불리지도 못하는 것에 수고를 들이느냐?\n들어라, 내 말을 들어라. 너희가 좋은 것을 먹고 기름진 음식을 즐기리라.\n3 너희는 귀를 기울이고 나에게 오너라. 들어라. 너희가 살리라.\n내가 너희와 영원한 계약을 맺으리니\n이는 다윗에게 베푼 나의 변치 않는 자애이다.\n4 보라, 내가 그를 민족들을 위한 증인으로,\n민족들의 지배자와 명령자로 만들었다.\n5 보라, 네가 알지 못하는 나라를 네가 부르고\n너를 알지 못하는 나라가 너에게 달려오리니\n주 너의 하느님, 이스라엘의 거룩하신 분\n그분께서 너를 영화롭게 하신 까닭이다.\n6 만나 뵐 수 있을 때에 주님을 찾아라. 가까이 계실 때에 그분을 불러라.\n7 죄인은 제 길을, 불의한 사람은 제 생각을 버리고 주님께 돌아오너라.\n그분께서 그를 가엾이 여기시리라.\n우리 하느님께 돌아오너라. 그분께서는 너그러이 용서하신다.\n8 내 생각은 너희 생각과 같지 않고 너희 길은 내 길과 같지 않다.\n주님의 말씀이다.\n9 하늘이 땅 위에 드높이 있듯이 내 길은 너희 길 위에,\n내 생각은 너희 생각 위에 드높이 있다.\n10 비와 눈은 하늘에서 내려와 그리로 돌아가지 않고\n오히려 땅을 적시어 기름지게 하고 싹이 돋아나게 하여\n씨 뿌리는 사람에게 씨앗을 주고 먹는 이에게 양식을 준다.\n11 이처럼 내 입에서 나가는 나의 말도 나에게 헛되이 돌아오지 않고\n반드시 내가 뜻하는 바를 이루며 내가 내린 사명을 완수하고야 만다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 29(28),1ㄱ과 2.3ㄱㄷ과 4.3ㄴ과 9ㄷ-10(◎ 11ㄴ)\n◎ 주님이 당신 백성에게 강복하여 평화를 주시리라.\n○ 하느님의 아들들아, 주님께 드려라. 그 이름의 영광 주님께 드려라. 거룩한 차림으로 주님께 경배하여라. ◎\n○ 주님의 소리 물 위에 머무네. 주님이 넓은 물 위에 계시네. 주님의 소리는 힘차고, 주님의 소리는 장엄도 하네. ◎\n○ 영광의 하느님 천둥 치시네. 그분의 성전에서 모두 외치네. “영광이여!” 주님이 큰 물 위에 앉아 계시네. 주님이 영원한 임금으로 앉으셨네. ◎","제2독서":"<하느님께서 예수님께 성령을 부어 주셨습니다.>\n▥ 사도행전의 말씀입니다.\n10,34-38\n그 무렵 34 베드로가 입을 열어 말하였다.\n“나는 이제 참으로 깨달았습니다.\n하느님께서는 사람을 차별하지 않으시고,\n35 어떤 민족에서건\n당신을 경외하며 의로운 일을 하는 사람은 다 받아 주십니다.\n36 하느님께서 예수 그리스도 곧 만민의 주님을 통하여\n평화의 복음을 전하시면서 이스라엘 자손들에게 보내신 말씀을\n37 여러분은 알고 있습니다.\n그리고 요한이 세례를 선포한 이래 갈릴래아에서 시작하여\n온 유다 지방에 걸쳐 일어난 일과,\n38 하느님께서 나자렛 출신 예수님께 성령과 힘을 부어 주신 일도 알고 있습니다.\n이 예수님께서 두루 다니시며 좋은 일을 하시고\n악마에게 짓눌리는 이들을 모두 고쳐 주셨습니다.\n하느님께서 그분과 함께 계셨기 때문입니다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n<성령과 물과 피>\n▥ 요한 1서의 말씀입니다.\n5,1-9\n사랑하는 여러분,\n1 예수님께서 그리스도이심을 믿는 사람은 모두 하느님에게서 태어났습니다.\n아버지를 사랑하는 사람은 모두 그 자녀도 사랑합니다.\n2 우리가 하느님을 사랑하고 그분의 계명을 실천하면,\n그로써 우리가 하느님의 자녀들을 사랑한다는 것을 알게 됩니다.\n3 하느님을 사랑하는 것은 바로 그분의 계명을 지키는 것입니다.\n그리고 그분의 계명은 힘겹지 않습니다.\n4 하느님에게서 태어난 사람은 모두 세상을 이기기 때문입니다.\n세상을 이긴 그 승리는 바로 우리 믿음의 승리입니다.\n5 세상을 이기는 사람은 누구입니까?\n예수님께서 하느님의 아드님이심을 믿는 사람이 아닙니까?\n6 그분께서 바로 물과 피를 통하여 세상에 오신 예수 그리스도이십니다.\n물만이 아니라 물과 피로써 오신 것입니다.\n이것을 증언하시는 분은 성령이십니다.\n성령은 곧 진리이십니다.\n7 그래서 증언하는 것이 셋입니다.\n8 성령과 물과 피인데, 이 셋은 하나로 모아집니다.\n9 우리가 사람들의 증언을 받아들인다면,\n하느님의 증언은 더욱 중대하지 않습니까?\n그것이 하느님의 증언이기 때문입니다.\n바로 하느님께서 당신 아드님에 관하여 친히 증언해 주셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마르 9,7 참조\n◎ 알렐루야.\n○ 하늘이 열리고 하느님 아버지의 목소리가 들려왔네.\n이는 내가 사랑하는 아들이니 너희는 그의 말을 들어라.\n◎ 알렐루야.","복음":"<너는 내가 사랑하는 아들, 내 마음에 드는 아들이다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n1,7-11\n그때에 요한은 7 이렇게 선포하였다.\n“나보다 더 큰 능력을 지니신 분이 내 뒤에 오신다.\n나는 몸을 굽혀 그분의 신발 끈을 풀어 드릴 자격조차 없다.\n8 나는 너희에게 물로 세례를 주었지만,\n그분께서는 너희에게 성령으로 세례를 주실 것이다.”\n9 그 무렵에 예수님께서 갈릴래아 나자렛에서 오시어,\n요르단에서 요한에게 세례를 받으셨다.\n10 그리고 물에서 올라오신 예수님께서는\n곧 하늘이 갈라지며 성령께서 비둘기처럼 당신께 내려오시는 것을 보셨다.\n11 이어 하늘에서 소리가 들려왔다.\n“너는 내가 사랑하는 아들, 내 마음에 드는 아들이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>","예물 기도":"주님,\n사랑하시는 성자께서 세상에 드러나셨음을 기념하며 드리는\n이 예물을 받으시어\n저희가 바치는 이 예물이\n세상의 죄를 씻으신 성자의 희생 제사가 되게 하소서.\n성자께서는 영원히 살아 계시며 다스리시나이다.","감사송":"<주님의 축일과 신비 감사송 3 : 주님 세례(주님 세례 축일)>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 요르단 강에서 새로운 세례의 신비를 드러내시고\n하늘의 소리로 주님의 말씀이 사람들 가운데 계심을 믿게 하셨나이다.\n또한 비둘기 모양으로 성령을 보내시어\n주님의 종 그리스도에게 기쁨의 기름을 바르시고\n가난한 이들에게 복음을 전하게 하셨나이다.\n그러므로 하늘의 능품천사들과 함께\n저희도 땅에서 주님의 위엄을 찬미하며 끝없이 외치나이다.","영성체송":"요한 1,32.34 참조\n보라, 요한이 말하였다. 나는 보았다. 그래서 이분이 하느님의 아드님이시라고 증언하였다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n거룩한 양식을 가득히 받고 주님의 자비를 간청하오니\n저희가 성자의 말씀을 충실히 따르며\n주님의 참된 자녀가 되게 하소서.\n우리 주 그리스도를 통하여 비나이다."}},"20270111":{"d":"2027년 01월 11일 월요일","c":"녹","t":"연중 제1주간 월요일","o":[],"n":"","g":"","i":"","s":{"입당송":"나는 드높은 어좌에 앉아 계신 분을 보았네. 천사들의 무리가 그분을 흠숭하며 함께 노래하네. 보라, 그분의 나라는 영원하리라.","본기도":"주님,\n주님 백성의 간절한 기도를 자애로이 들으시어\n저희가 해야 할 일을 깨닫고 깨달은 것을 실천하게 하소서.\n성부와 성령과 …….","제1독서":"<하느님께서 아드님을 통하여 우리에게 말씀하셨습니다.>\n▥ 히브리서의 시작입니다.\n1,1-6\n1 하느님께서 예전에는 예언자들을 통하여\n여러 번에 걸쳐 여러 가지 방식으로 조상들에게 말씀하셨지만,\n2 이 마지막 때에는 아드님을 통하여 우리에게 말씀하셨습니다.\n하느님께서는 아드님을 만물의 상속자로 삼으셨을 뿐만 아니라,\n그분을 통하여 온 세상을 만들기까지 하셨습니다.\n3 아드님은 하느님 영광의 광채이시며 하느님 본질의 모상으로서,\n만물을 당신의 강력한 말씀으로 지탱하십니다.\n그분께서 죄를 깨끗이 없애신 다음,\n하늘 높은 곳에 계신 존엄하신 분의 오른쪽에 앉으셨습니다.\n4 그분께서는 천사들보다 뛰어난 이름을 상속받으시어,\n그만큼 그들보다 위대하게 되셨습니다.\n5 하느님께서 천사들 가운데 그 누구에게\n“너는 내 아들. 내가 오늘 너를 낳았노라.” 하고 말씀하신 적이 있습니까?\n또 “나는 그의 아버지가 되고 그는 나의 아들이 되리라.” 하고\n말씀하신 적이 있습니까?\n6 또 맏아드님을 저세상에 데리고 들어가실 때에는 이렇게 말씀하십니다.\n“하느님의 천사들은 모두 그에게 경배하여라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 97(96),1과 2ㄴ.6과 7ㄷ.9(◎ 7ㄷ 참조)\n◎ 모든 천사들아, 하느님께 경배하여라.\n○ 주님은 임금이시다. 땅은 즐거워하고, 수많은 섬들도 기뻐하여라. 정의와 공정은 그분 어좌의 바탕이라네. ◎\n○ 하늘은 그분 의로움을 널리 알리고, 만백성 그분 영광을 우러러보네. 모든 신들이 그분께 경배드리네. ◎\n○ 주님, 당신은 온 땅 위에 지극히 높으신 분, 모든 신들 위에 아득히 높으시옵니다. ◎","복음 환호송":"마르 1,15\n◎ 알렐루야.\n○ 하느님 나라가 가까이 왔다. 회개하고 복음을 믿어라.\n◎ 알렐루야.","복음":"<회개하고 복음을 믿어라.>\n✠ 마르코가 전한 거룩한 복음입니다.\n1,14-20\n14 요한이 잡힌 뒤에 예수님께서는 갈릴래아에 가시어,\n하느님의 복음을 선포하시며 15 이렇게 말씀하셨다.\n“때가 차서 하느님의 나라가 가까이 왔다. 회개하고 복음을 믿어라.”\n16 예수님께서 갈릴래아 호숫가를 지나가시다가,\n호수에 그물을 던지고 있는 시몬과 그의 동생 안드레아를 보셨다.\n그들은 어부였다.\n17 예수님께서 그들에게 이르셨다.\n“나를 따라오너라. 내가 너희를 사람 낚는 어부가 되게 하겠다.”\n18 그러자 그들은 곧바로 그물을 버리고 예수님을 따랐다.\n19 예수님께서 조금 더 가시다가,\n배에서 그물을 손질하는 제베대오의 아들 야고보와 그의 동생 요한을 보시고,\n20 곧바로 그들을 부르셨다.\n그러자 그들은 아버지 제베대오를 삯꾼들과 함께 배에 버려두고\n그분을 따라나섰다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 이 제물을 기꺼이 받으시고\n저희를 거룩하게 하시어\n저희가 간절히 바라는 것을 이루어 주소서.\n우리 주 …….","영성체송":"시편 36(35),10 참조\n주님, 당신께는 생명의 샘이 있고, 저희는 당신 빛으로 빛을 보나이다.\n<또는>\n요한 10,10 참조\n주님이 말씀하신다. 나는 양들이 생명을 얻고 또 얻어 넘치게 하려고 왔다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성체로 새로운 힘을 얻고 간절히 바라오니\n저희가 하느님의 뜻에 따라 살며 하느님을 충실히 섬기게 하소서.\n우리 주 ……."}},"20270112":{"d":"2027년 01월 12일 화요일","c":"녹","t":"연중 제1주간 화요일","o":[],"n":"","g":"","i":"","s":{"입당송":"나는 드높은 어좌에 앉아 계신 분을 보았네. 천사들의 무리가 그분을 흠숭하며 함께 노래하네. 보라, 그분의 나라는 영원하리라.","본기도":"주님,\n주님 백성의 간절한 기도를 자애로이 들으시어\n저희가 해야 할 일을 깨닫고 깨달은 것을 실천하게 하소서.\n성부와 성령과 …….","제1독서":"<하느님께서 구원의 영도자를 고난으로 완전하게 만드신 것은 당연한 일이었습니다.>\n▥ 히브리서의 말씀입니다.\n2,5-12\n5 하느님께서는 우리가 지금 말하고 있는,\n곧 앞으로 올 세상을 천사들의 지배 아래 두신 것이 아닙니다.\n6 어떤 이가 어디에선가 이렇게 증언하였습니다.\n“인간이 무엇이기에 그를 기억해 주십니까?\n사람이 무엇이기에 그를 돌보아 주십니까?\n7 천사들보다 잠깐 낮추셨다가 영광과 존귀의 관을 씌워 주시고\n8 만물을 그의 발아래 두셨습니다.”\n하느님께서는 이렇게 만물을 그의 지배 아래 두시면서,\n그 아래 들지 않는 것은 하나도 남겨 놓지 않으셨습니다.\n그런데도 우리가 보기에는\n만물이 아직도 그의 지배 아래 들지 않았습니다.\n9 그러나 우리는 “천사들보다 잠깐 낮아지셨다가”\n죽음의 고난을 통하여 “영광과 존귀의 관을 쓰신”\n예수님을 보고 있습니다.\n이렇게 그분께서는 하느님의 은총으로 모든 사람을 위하여\n죽음을 겪으셔야 했습니다.\n10 만물은 하느님을 위하여 또 그분을 통하여 존재합니다.\n이러한 하느님께서 많은 자녀들을 영광으로 이끌어 들이시면서,\n그들을 위한 구원의 영도자를\n고난으로 완전하게 만드신 것은 당연한 일이었습니다.\n11 사람들을 거룩하게 해 주시는 분이나\n거룩하게 되는 사람들이나 모두 한 분에게서 나왔습니다.\n그러한 까닭에 예수님께서는 그들을 형제라고 부르기를\n부끄러워하지 않으시고, 12 이렇게 말씀하십니다.\n“저는 당신 이름을 제 형제들에게 전하고\n모임 한가운데에서 당신을 찬양하오리다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 8,2ㄱㄴ과 5.6-7ㄱ.7ㄴ-9(◎ 7ㄱ 참조)\n◎ 당신 손으로 지으신 작품들을 아드님이 다스리게 하셨나이다.\n○ 주님, 저희 주님, 온 땅에 당신 이름, 이 얼마나 크시옵니까! 인간이 무엇이기에 이토록 기억해 주시나이까? 사람이 무엇이기에 이토록 돌보아 주시나이까? ◎\n○ 천사보다는 조금 못하게 만드셨어도, 영광과 존귀의 관을 씌워 주셨나이다. 당신 손으로 지으신 작품들을 다스리게 하셨나이다. ◎\n○ 만물을 그 발아래 두셨나이다. 저 모든 양 떼와 소 떼, 들짐승하며, 하늘의 새와 바다의 물고기, 물속 길을 다니는 것들을 다스리게 하셨나이다. ◎","복음 환호송":"1테살 2,13 참조\n◎ 알렐루야.\n○ 하느님 말씀을 사람의 말로 받아들이지 말고 사실 그대로 하느님의 말씀으로 받아들여라.\n◎ 알렐루야.","복음":"<예수님께서는 권위를 가지고 가르치셨다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n1,21ㄴ-28\n카파르나움에서,\n21 예수님께서는 안식일에 회당에 들어가 가르치셨는데,\n22 사람들은 그분의 가르침에 몹시 놀랐다.\n그분께서 율법 학자들과 달리 권위를 가지고 가르치셨기 때문이다.\n23 마침 그 회당에 더러운 영이 들린 사람이 있었는데,\n그가 소리를 지르며 24 말하였다.\n“나자렛 사람 예수님, 당신께서 저희와 무슨 상관이 있습니까?\n저희를 멸망시키러 오셨습니까? 저는 당신이 누구신지 압니다.\n당신은 하느님의 거룩하신 분이십니다.”\n25 예수님께서 그에게 “조용히 하여라.\n그 사람에게서 나가라.” 하고 꾸짖으시니,\n26 더러운 영은 그 사람에게 경련을 일으켜 놓고 큰 소리를 지르며 나갔다.\n27 그러자 사람들이 모두 놀라,\n“이게 어찌 된 일이냐? 새롭고 권위 있는 가르침이다.\n저이가 더러운 영들에게 명령하니 그것들도 복종하는구나.” 하며\n서로 물어보았다.\n28 그리하여 그분의 소문이 곧바로\n갈릴래아 주변 모든 지방에 두루 퍼져 나갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 이 제물을 기꺼이 받으시고\n저희를 거룩하게 하시어\n저희가 간절히 바라는 것을 이루어 주소서.\n우리 주 …….","영성체송":"시편 36(35),10 참조\n주님, 당신께는 생명의 샘이 있고, 저희는 당신 빛으로 빛을 보나이다.\n<또는>\n요한 10,10 참조\n주님이 말씀하신다. 나는 양들이 생명을 얻고 또 얻어 넘치게 하려고 왔다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성체로 새로운 힘을 얻고 간절히 바라오니\n저희가 하느님의 뜻에 따라 살며 하느님을 충실히 섬기게 하소서.\n우리 주 ……."}},"20270113":{"d":"2027년 01월 13일 수요일","c":"녹","t":"연중 제1주간 수요일","o":[{"c":"백","t":"성 힐라리오 주교 학자"}],"n":"","g":"","i":"","s":{"입당송":"나는 드높은 어좌에 앉아 계신 분을 보았네. 천사들의 무리가 그분을 흠숭하며 함께 노래하네. 보라, 그분의 나라는 영원하리라.","본기도":"주님,\n주님 백성의 간절한 기도를 자애로이 들으시어\n저희가 해야 할 일을 깨닫고 깨달은 것을 실천하게 하소서.\n성부와 성령과 …….","제1독서":"<자비로우신 그분께서는 모든 점에서 형제들과 같아지셔야 했습니다.>\n▥ 히브리서의 말씀입니다.\n2,14-18\n14 자녀들이 피와 살을 나누었듯이,\n예수님께서도 그들과 함께 피와 살을 나누어 가지셨습니다.\n그것은 죽음의 권능을 쥐고 있는 자\n곧 악마를 당신의 죽음으로 파멸시키시고,\n15 죽음의 공포 때문에 한평생 종살이에 얽매여 있는 이들을\n풀어 주시려는 것이었습니다.\n16 그분께서는 분명 천사들을 보살펴 주시는 것이 아니라,\n아브라함의 후손들을 보살펴 주십니다.\n17 그렇기 때문에 그분께서는 모든 점에서 형제들과 같아지셔야 했습니다.\n자비로울 뿐만 아니라 하느님을 섬기는 일에 충실한 대사제가 되시어,\n백성의 죄를 속죄하시려는 것이었습니다.\n18 그분께서는 고난을 겪으시면서 유혹을 받으셨기 때문에,\n유혹을 받는 이들을 도와주실 수가 있습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 105(104),1-2.3-4.6-7.8-9(◎ 8ㄴ 참조)\n◎ 주님은 당신의 계약 영원히 기억하셨네.\n○ 주님을 찬송하여라, 그 이름 높이 불러라. 그분 업적 민족들에게 알려라. 그분께 노래하여라, 찬미 노래 불러라. 그 모든 기적 이야기하여라. ◎\n○ 거룩하신 그 이름 자랑하여라. 주님을 찾는 마음은 기뻐하여라. 주님과 그 권능을 구하여라. 언제나 그 얼굴을 찾아라. ◎\n○ 그분의 종 아브라함의 후손들아, 그분이 뽑으신 야곱의 자손들아! 그분은 주 우리 하느님, 그분의 판결이 온 세상에 미치네. ◎\n○ 명령하신 말씀 천대에 이르도록, 당신의 계약 영원히 기억하시니, 아브라함과 맺으신 계약이며, 이사악에게 내리신 맹세라네. ◎","복음 환호송":"요한 10,27 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 내 양들은 내 목소리를 알아듣는다. 나는 그들을 알고 그들은 나를 따른다.\n◎ 알렐루야.","복음":"<예수님께서는 갖가지 질병을 앓는 많은 사람을 고쳐 주셨다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n1,29-39\n그 무렵 예수님께서 29 회당에서 나오시어,\n야고보와 요한과 함께 곧바로 시몬과 안드레아의 집으로 가셨다.\n30 그때에 시몬의 장모가 열병으로 누워 있어서,\n사람들이 곧바로 예수님께 그 부인의 사정을 이야기하였다.\n31 예수님께서 그 부인에게 다가가시어 손을 잡아 일으키시니 열이 가셨다.\n그러자 부인은 그들의 시중을 들었다.\n32 저녁이 되고 해가 지자,\n사람들이 병든 이들과 마귀 들린 이들을 모두 예수님께 데려왔다.\n33 온 고을 사람들이 문 앞에 모여들었다.\n34 예수님께서는 갖가지 질병을 앓는 많은 사람을 고쳐 주시고\n많은 마귀를 쫓아내셨다.\n그러면서 마귀들이 말하는 것을 허락하지 않으셨다.\n그들이 당신을 알고 있었기 때문이다.\n35 다음 날 새벽 아직 캄캄할 때,\n예수님께서는 일어나 외딴곳으로 나가시어 그곳에서 기도하셨다.\n36 시몬과 그 일행이 예수님을 찾아 나섰다가\n37 그분을 만나자, “모두 스승님을 찾고 있습니다.” 하고 말하였다.\n38 예수님께서 그들에게 말씀하셨다.\n“다른 이웃 고을들을 찾아가자. 그곳에도 내가 복음을 선포해야 한다.\n사실 나는 그 일을 하려고 떠나온 것이다.”\n39 그러고 나서 예수님께서는 온 갈릴래아를 다니시며,\n회당에서 복음을 선포하시고 마귀들을 쫓아내셨다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 이 제물을 기꺼이 받으시고\n저희를 거룩하게 하시어\n저희가 간절히 바라는 것을 이루어 주소서.\n우리 주 …….","영성체송":"시편 36(35),10 참조\n주님, 당신께는 생명의 샘이 있고, 저희는 당신 빛으로 빛을 보나이다.\n<또는>\n요한 10,10 참조\n주님이 말씀하신다. 나는 양들이 생명을 얻고 또 얻어 넘치게 하려고 왔다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성체로 새로운 힘을 얻고 간절히 바라오니\n저희가 하느님의 뜻에 따라 살며 하느님을 충실히 섬기게 하소서.\n우리 주 ……."}},"20270114":{"d":"2027년 01월 14일 목요일","c":"녹","t":"연중 제1주간 목요일","o":[],"n":"","g":"","i":"","s":{"입당송":"나는 드높은 어좌에 앉아 계신 분을 보았네. 천사들의 무리가 그분을 흠숭하며 함께 노래하네. 보라, 그분의 나라는 영원하리라.","본기도":"주님,\n주님 백성의 간절한 기도를 자애로이 들으시어\n저희가 해야 할 일을 깨닫고 깨달은 것을 실천하게 하소서.\n성부와 성령과 …….","제1독서":"<“오늘”이라는 말이 들리는 한 여러분은 서로 격려하십시오.>\n▥ 히브리서의 말씀입니다.\n3,7-14\n형제 여러분, 7 성령께서 말씀하시는 그대로입니다.\n“오늘 너희가 그분의 소리를 듣거든\n8 마음을 완고하게 갖지 마라, 광야에서 시험하던 날처럼, 반항하던 때처럼.\n9 거기에서 너희 조상들은 내가 한 일을 보고서도 나를 떠보며 시험하였다.\n10 사십 년 동안 그리하였다. 그래서 나는 그 세대에게 화가 나 말하였다.\n‘언제나 마음이 빗나간 자들, 그들은 내 길을 깨닫지 못하였다.’\n11 그리하여 나는 분노하며 맹세하였다.\n‘그들은 내 안식처에 들어가지 못하리라.’”\n12 형제 여러분, 여러분 가운데에는 믿지 않는 악한 마음을 품고서\n살아 계신 하느님을 저버리는 사람이 없도록 조심하십시오.\n13 “오늘”이라는 말이 들리는 한 여러분은 날마다 서로 격려하여,\n죄의 속임수에 넘어가 완고해지는 사람이 하나도 없도록 하십시오.\n14 우리는 그리스도의 동료가 된 사람들입니다.\n처음의 결심을 끝까지 굳건히 지니는 한 그렇습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 95(94),6-7ㄱㄴㄷ.7ㄹ-9.10-11(◎ 7ㄹ과 8ㄴ)\n◎ 오늘 주님 목소리에 귀를 기울여라. 너희 마음을 무디게 하지 마라.\n○ 어서 와 엎드려 경배드리세. 우리를 내신 주님 앞에 무릎 꿇으세. 그분은 우리의 하느님, 우리는 그분 목장의 백성, 그분 손이 이끄시는 양 떼로세. ◎\n○ 오늘 너희는 주님 목소리에 귀를 기울여라. “므리바에서처럼, 마싸의 그날 광야에서처럼, 너희 마음을 무디게 하지 마라. 거기에서 너희 조상들은 나를 시험하였고, 내가 한 일을 보고서도 나를 떠보았다.” ◎\n○ 사십 년 그 세대에 나는 진저리가 나서 말하였다. “마음이 빗나간 백성이다. 그들은 내 길을 깨닫지 못하였다.” 나는 화가 치밀어 맹세하였다. “그들은 내 안식처에 들지 못하리라.” ◎","복음 환호송":"마태 4,23 참조\n◎ 알렐루야.\n○ 예수님은 하늘 나라의 복음을 선포하시고 백성 가운데 병자들을 모두 고쳐 주셨네.\n◎ 알렐루야.","복음":"<그는 나병이 가시고 깨끗하게 되었다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n1,40-45\n그때에 40 어떤 나병 환자가 예수님께 와서 도움을 청하였다.\n그가 무릎을 꿇고 이렇게 말하였다.\n“스승님께서는 하고자 하시면 저를 깨끗하게 하실 수 있습니다.”\n41 예수님께서 가엾은 마음이 드셔서 손을 내밀어 그에게 대시며 말씀하셨다.\n“내가 하고자 하니 깨끗하게 되어라.”\n42 그러자 바로 나병이 가시고 그가 깨끗하게 되었다.\n43 예수님께서는 그를 곧 돌려보내시며 단단히 이르셨다.\n44 그에게 이렇게 말씀하셨다.\n“누구에게든 아무 말도 하지 않도록 조심하여라.\n다만 사제에게 가서 네 몸을 보이고,\n네가 깨끗해진 것과 관련하여 모세가 명령한 예물을 바쳐,\n그들에게 증거가 되게 하여라.”\n45 그러나 그는 떠나가서 이 이야기를 널리 알리고 퍼뜨리기 시작하였다.\n그리하여 예수님께서는 더 이상 드러나게 고을로 들어가지 못하시고,\n바깥 외딴곳에 머무르셨다.\n그래도 사람들은 사방에서 그분께 모여들었다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 백성이 드리는 이 제물을 기꺼이 받으시고\n저희를 거룩하게 하시어\n저희가 간절히 바라는 것을 이루어 주소서.\n우리 주 …….","영성체송":"시편 36(35),10 참조\n주님, 당신께는 생명의 샘이 있고, 저희는 당신 빛으로 빛을 보나이다.\n<또는>\n요한 10,10 참조\n주님이 말씀하신다. 나는 양들이 생명을 얻고 또 얻어 넘치게 하려고 왔다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n성체로 새로운 힘을 얻고 간절히 바라오니\n저희가 하느님의 뜻에 따라 살며 하느님을 충실히 섬기게 하소서.\n우리 주 ……."}},"20270115":{"d":"2027년 01월 15일 금요일","c":"녹","t":"연중 제1주간 금요일","o":[],"n":"","g":"","i":"","s":{"입당송":"나는 드높은 어좌에 앉아 계신 분을 보았네. 천사들의 무리가 그분을 흠숭하며 함께 노래하네. 보라, 그분의 나라는 영원하리라.","본기도":"주님,\n주님 백성의 간절한 기도를 자애로이 들으시어\n저희가 해야 할 일을 깨닫고 깨달은 것을 실천하게 하소서.\n성부와 성령과 …….","제1독서":"<우리 모두 저 안식처에 들어가도록 힘씁시다.>\n▥ 히브리서의 말씀입니다.\n4,1-5.11\n형제 여러분, 1 하느님의 안식처에 들어갈 수 있다는 약속이 계속 유효한데도,\n여러분 가운데 누가 이미 탈락하였다고 여겨지는 일이 없도록,\n우리 모두 주의를 기울입시다.\n2 사실 그들이나 우리나 마찬가지로 기쁜 소식을 들었습니다.\n그러나 그들이 들은 그 말씀은 그들에게 아무런 이득이 되지 못하였습니다.\n그 말씀을 귀여겨들은 이들과 믿음으로 결합되지 못하였기 때문입니다.\n3 믿음을 가진 우리는 안식처로 들어갑니다.\n그것은 하느님께서 “그리하여 나는 분노하며 맹세하였다.\n‘그들은 내 안식처에 들어가지 못하리라.’” 하고 말씀하신 그대로입니다.\n안식처는 물론 하느님께서 만드신 것들은 세상 창조 때부터\n이미 다 이루어져 있었습니다.\n4 사실 일곱째 날에 관하여 어디에선가 이렇게 말하였습니다.\n“하느님께서는 하시던 일을 모두 마치시고 이렛날에 쉬셨다.”\n5 또 여기에서는, “그들은 내 안식처에 들어가지 못하리라.” 하였습니다.\n11 그러니 그와 같은 불순종의 본을 따르다가 떨어져 나가는 사람이 없게,\n우리 모두 저 안식처에 들어가도록 힘씁시다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 78(77),3과 4ㄱㄹ.6ㄴ-7.8(◎ 7ㄴ)\n◎ 하느님의 업적을 잊지 마라.\n○ 우리가 이미 들어 아는 것을, 조상들이 우리에게 들려준 것을 전하리라. 주님의 영광스러운 행적과 권능을, 다가올 세대에게 들려주려 하노라. ◎\n○ 그들이 일어나서, 제 자손들에게 들려주라 하심이네. 하느님께 희망을 두고, 하느님의 업적을 잊지 않으며, 당신 계명을 지키라 하심이네. ◎\n○ 고집부리고 반항하던 세대, 그 조상들처럼 되지 말라 하심이네. 마음이 흔들렸던 그 세대, 그들의 정신은 하느님께 충실하지 않았네. ◎","복음 환호송":"루카 7,16\n◎ 알렐루야.\n○ 우리 가운데에 큰 예언자가 나타나셨네. 하느님이 당신 백성을 찾아오셨네.\n◎ 알렐루야.","복음":"<사람의 아들이 땅에서 죄를 용서하는 권한을 가지고 있다.>\n✠ 마르코가 전한 거룩한 복음입니다.\n2,1-12\n1 며칠 뒤에 예수님께서 카파르나움으로 들어가셨다.\n그분께서 집에 계시다는 소문이 퍼지자,\n2 문 앞까지 빈자리가 없을 만큼 많은 사람이 모여들었다.\n예수님께서는 그들에게 복음 말씀을 전하셨다.\n3 그때에 사람들이 어떤 중풍 병자를 그분께 데리고 왔다.\n그 병자는 네 사람이 들것에 들고 있었는데,\n4 군중 때문에 그분께 가까이 데려갈 수가 없었다.\n그래서 그분께서 계신 자리의 지붕을 벗기고 구멍을 내어,\n중풍 병자가 누워 있는 들것을 달아 내려보냈다.\n5 예수님께서 그들의 믿음을 보시고 중풍 병자에게 말씀하셨다.\n“얘야, 너는 죄를 용서받았다.”\n6 율법 학자 몇 사람이 거기에 앉아 있다가 마음속으로 의아하게 생각하였다.\n7 ‘이자가 어떻게 저런 말을 할 수 있단 말인가? 하느님을 모독하는군.\n하느님 한 분 외에 누가 죄를 용서할 수 있단 말인가?’\n8 예수님께서는 곧바로 그들이 속으로 의아하게 생각하는 것을\n당신 영으로 아시고 말씀하셨다.\n“너희
