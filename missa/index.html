◎","복음 환호송":"요한 8,12 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 나는 세상의 빛이다. 나를 따르는 이는 생명의 빛을 얻으리라.\n◎ 알렐루야.","복음":"<내가 너에게 무엇을 해 주기를 바라느냐? 주님, 볼 수 있게 해 주십시오.>\n✠ 루카가 전한 거룩한 복음입니다.\n18,35-43\n35 예수님께서 예리코에 가까이 이르셨을 때의 일이다.\n어떤 눈먼 이가 길가에 앉아 구걸하고 있다가,\n36 군중이 지나가는 소리를 듣고 무슨 일이냐고 물었다.\n37 사람들이 그에게 “나자렛 사람 예수님께서 지나가신다.” 하고 알려 주자,\n38 그가 “예수님, 다윗의 자손이시여,\n저에게 자비를 베풀어 주십시오.” 하고 부르짖었다.\n39 앞서 가던 이들이 그에게 잠자코 있으라고 꾸짖었지만,\n그는 더욱 큰 소리로\n“다윗의 자손이시여, 저에게 자비를 베풀어 주십시오.” 하고 외쳤다.\n40 예수님께서 걸음을 멈추시고 그를 데려오라고 분부하셨다.\n그가 가까이 다가오자 예수님께서 그에게 물으셨다.\n41 “내가 너에게 무엇을 해 주기를 바라느냐?”\n그가 “주님, 제가 다시 볼 수 있게 해 주십시오.” 하였다.\n42 예수님께서 그에게 “다시 보아라. 네 믿음이 너를 구원하였다.” 하고 이르시니,\n43 그가 즉시 다시 보게 되었다. 그는 하느님을 찬양하며 예수님을 따랐다.\n군중도 모두 그것을 보고 하느님께 찬미를 드렸다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n지극히 높으신 주님께 바치는 이 예물을 굽어보시어\n저희가 오롯이 주님을 사랑하며 살다가 영원한 생명을 얻게 하소서.\n우리 주 …….","영성체송":"시편 73(72),28\n저는 하느님 곁에 있어 행복하옵니다. 주 하느님을 피신처로 삼으리이다.\n<또는>\n마르 11,23.24 참조\n주님이 말씀하신다. 내가 진실로 너희에게 말한다. 너희가 기도하며 청하는 것은 무엇이든 이미 받은 줄로 믿어라. 너희에게 그대로 이루어지리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 거룩하신 성체를 받아 모시고 간절히 비오니\n성자께서 당신 자신을 기억하여 거행하라 명하신 이 성사로\n저희가 언제나 주님의 사랑을 실천하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음은 눈먼 이와 그를 고쳐 주시는 예수님에 대한 이야기입니다. 처음 복음을 읽었을 때는 느끼지 못하였지만, 복음을 두 번, 세 번 읽고 묵상하다 보니 ‘다시 본다’는 표현이 복음에서 여러 번 강조된다는 것을 발견하게 되었습니다.\n눈먼 이는 본디 앞을 볼 수 있다가 어떤 일로 눈이 멀게 되었기에 예수님께 ‘다시’ 보게 해 달라고 간청하는 것일 수 있습니다. 그런데 예수님께서도 그에게 굳이 “다시 보아라.”(루카 18,42)라고 말씀하십니다. 저는 이 부분을 묵상하면서 이런 생각이 들었습니다. 눈먼 이가 말한 ‘다시’는 ‘예전과 같이’라는 뜻이지만, 예수님의 ‘다시’는 예전과 달리 새롭게 보라는 뜻이 아닐까 하고 말입니다. 그렇게 예수님의 말씀처럼 새롭게 다시 보게 된 눈먼 이는, 전에는 사람들에게 구걸하는 사람이었지만, 이제는 하느님을 찬양하고 사람들도 하느님을 찬미하게 하는 사람으로 바뀝니다.\n우리는 날마다 잠에서 깨어 눈을 뜹니다. 이렇게 시작된 하루가 어제와 같은 날이 아니라 새로운 날이 되도록 아침에 눈을 뜰 때마다, 언제나 나와 함께해 주시는 하느님께 우리의 굳건한 믿음을 고백해 보는 것은 어떨까요? 구원은 우리를 어둠에서 빛으로 이끌어 줍니다. 비록 어제가 조금 어두웠다 해도 오늘 다시 하느님과 함께 숨 쉬고 있는 나를 발견한다면 그것이 바로 구원의 은총을 발견하는 것이 아닐까요? 그렇게 하느님과 함께 날마다 새롭게 보고, 새롭게 들으며, 새롭게 희망하는 날들이 되었으면 좋겠습니다. 그 기쁨 가운데 우리는 분명 우리를 빛으로 구원하시는 하느님을 뵙게 될 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261117":{"d":"2026년 11월 17일 화요일","c":"백","t":"헝가리의 성녀 엘리사벳 수도자 기념일","o":[],"n":"","g":"","i":"엘리사벳 성녀는 1207년 헝가리에서 공주로 태어났다. 어려서부터 신심이 깊었던 그는 남부럽지 않게 안락한 생활을 할 수 있었지만, 참회와 고행의 생활을 하며 많은 사람에게 자선을 베풀었다. 그는 남편이 전쟁에서 사망하자 재속 프란치스코회에 들어가 가난한 사람들을 도와주고 병원을 세워 직접 병자들을 돌보았다. 1231년 스물네 살에 선종한 그는 자선 사업의 수호성인이자, 재속 프란치스코회의 수호성인으로 공경받고 있다.","s":{"입당송":"마태 25,34.36.40 참조\n주님이 말씀하신다. 내 아버지께 복을 받은 이들아, 오너라. 너희는 내가 병들었을 때에 돌보아 주었다. 내가 진실로 너희에게 말한다. 너희가 가장 작은 내 형제 하나에게 해 준 것이 바로 나에게 해 준 것이다.\n<또는>\n시편 112(111),9\n그는 가난한 이에게 넉넉히 나누어 주니, 그의 의로움은 길이 이어지고, 그의 뿔은 영광 속에 높이 들리리라.","본기도":"하느님, 복된 엘리사벳에게\n가난한 이들 안에서 그리스도를 알아보고 공경하게 하셨으니\n그의 전구를 들으시어\n저희도 가난하고 고통받는 이들을 한결같은 사랑으로 섬기게 하소서.\n성부와 성령과 …….","제1독서":"<누구든지 문을 열면, 나는 그의 집에 들어가 그와 함께 먹을 것이다.>\n▥ 요한 묵시록의 말씀입니다.\n3,1-6.14-22\n나 요한은 주님께서 나에게 말씀하시는 것을 들었습니다.\n1 “사르디스 교회의 천사에게 써 보내라.\n‘하느님의 일곱 영과 일곱 별을 가진 이가 말한다.\n나는 네가 한 일을 안다. 너는 살아 있다고 하지만 사실은 죽은 것이다.\n2 깨어 있어라. 아직 남아 있지만 죽어 가는 것들을 튼튼하게 만들어라.\n나는 네가 한 일들이 나의 하느님 앞에서 완전하다고 보지 않는다.\n3 그러므로 네가 가르침을 어떻게 받아들이고 어떻게 들었는지 되새겨,\n그것을 지키고 또 회개하여라.\n네가 깨어나지 않으면 내가 도둑처럼 가겠다.\n너는 내가 어느 때에 너에게 갈지 결코 알지 못할 것이다.\n4 그러나 사르디스에는 자기 옷을 더럽히지 않은 사람이 몇 있다.\n그들은 흰옷을 입고, 나와 함께 다닐 것이다. 그럴 자격이 있기 때문이다.\n5 승리하는 사람은 이처럼 흰옷을 입을 것이다.\n그리고 나는 생명의 책에서 그의 이름을 지우지 않을 것이고,\n내 아버지와 그분의 천사들 앞에서 그의 이름을 안다고 증언할 것이다.\n6 귀 있는 사람은 성령께서 여러 교회에 하시는 말씀을 들어라.’\n14 라오디케이아 교회의 천사에게 써 보내라.\n‘아멘 그 자체이고 성실하고 참된 증인이며 하느님 창조의 근원인 이가 말한다.\n15 나는 네가 한 일을 안다. 너는 차지도 않고 뜨겁지도 않다.\n네가 차든지 뜨겁든지 하면 좋으련만!\n16 네가 이렇게 미지근하여 뜨겁지도 않고 차지도 않으니,\n나는 너를 입에서 뱉어 버리겠다.\n17 ′나는 부자로서 풍족하여 모자람이 없다.′ 하고 네가 말하지만,\n사실은 비참하고 가련하고 가난하고 눈멀고 벌거벗은 것을 깨닫지 못한다.\n18 내가 너에게 권한다.\n나에게서 불로 정련된 금을 사서 부자가 되고,\n흰옷을 사 입어 너의 수치스러운 알몸이 드러나지 않게 하고,\n안약을 사서 눈에 발라 제대로 볼 수 있게 하여라.\n19 내가 사랑하는 사람들을 나는 책망도 하고 징계도 한다.\n그러므로 열성을 다하고 회개하여라.\n20 보라, 내가 문 앞에 서서 문을 두드리고 있다.\n누구든지 내 목소리를 듣고 문을 열면,\n나는 그의 집에 들어가 그와 함께 먹고 그 사람도 나와 함께 먹을 것이다.\n21 승리하는 사람은,\n내가 승리한 뒤에 내 아버지의 어좌에 그분과 함께 앉은 것처럼,\n내 어좌에 나와 함께 앉게 해 주겠다.\n22 귀 있는 사람은 성령께서 여러 교회에 하시는 말씀을 들어라.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 15(14),2-3ㄱ.3ㄴㄷ-4ㄱㄴ.5(◎ 묵시 3,21 참조)\n◎ 승리하는 사람은 내 어좌에 나와 함께 앉으리라.\n○ 흠 없이 걸어가고, 의로운 일을 하며, 마음속 진실을 말하는 이, 함부로 혀를 놀리지 않는 이라네. ◎\n○ 친구를 해치지 않으며, 이웃을 모욕하지 않는 이라네. 그는 악인을 업신여기지만, 주님을 경외하는 이들은 존중한다네. ◎\n○ 이자를 받으려 돈놀이 않으며, 죄 없는 이를 해치는 뇌물 받지 않는다네. 이 모든 것 행하는 그 사람, 영원토록 흔들림 없으리라. ◎","복음 환호송":"1요한 4,10\n◎ 알렐루야.\n○ 하느님은 우리를 사랑하시어 당신 아드님을 우리 죄를 위한 속죄 제물로 보내 주셨네.\n◎ 알렐루야.","복음":"<사람의 아들은 잃은 이들을 찾아 구원하러 왔다.>\n✠ 루카가 전한 거룩한 복음입니다.\n19,1-10\n그때에 1 예수님께서 예리코에 들어가시어 거리를 지나가고 계셨다.\n2 마침 거기에 자캐오라는 사람이 있었는데, 그는 세관장이고 또 부자였다.\n3 그는 예수님께서 어떠한 분이신지 보려고 애썼지만\n군중에 가려 볼 수가 없었다. 키가 작았기 때문이다.\n4 그래서 앞질러 달려가 돌무화과나무로 올라갔다.\n그곳을 지나시는 예수님을 보려는 것이었다.\n5 예수님께서 거기에 이르러 위를 쳐다보시며 그에게 이르셨다.\n“자캐오야, 얼른 내려오너라. 오늘은 내가 네 집에 머물러야 하겠다.”\n6 자캐오는 얼른 내려와 예수님을 기쁘게 맞아들였다.\n7 그것을 보고 사람들은 모두\n“저이가 죄인의 집에 들어가 묵는군.” 하고 투덜거렸다.\n8 그러나 자캐오는 일어서서 주님께 말하였다.\n“보십시오, 주님! 제 재산의 반을 가난한 이들에게 주겠습니다.\n그리고 제가 다른 사람 것을 횡령하였다면 네 곱절로 갚겠습니다.”\n9 그러자 예수님께서 그에게 이르셨다.\n“오늘 이 집에 구원이 내렸다. 이 사람도 아브라함의 자손이기 때문이다.\n10 사람의 아들은 잃은 이들을 찾아 구원하러 왔다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(1요한 3,14-18)와 복음(루카 6,27-38)을 봉독할 수 있다.>","예물 기도":"주님,\n성자의 무한하신 사랑의 업적을 기리며 바치는 이 예물을 받으시고\n저희가 복된 엘리사벳을 본받아\n주님과 이웃을 더욱 열심히 사랑하게 하소서.\n우리 주 …….","영성체송":"요한 15,13\n친구들을 위하여 목숨을 내놓는 것보다 더 큰 사랑은 없다.\n<또는>\n요한 13,35 참조\n주님이 말씀하신다. 너희가 서로 사랑하면, 모든 사람이 보고 너희가 내 제자임을 알게 되리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 거룩한 신비로 힘을 얻고 비오니\n복된 엘리사벳을 본받아\n정성을 다하여 주님을 섬기며\n주님의 백성을 힘껏 사랑하게 하소서.\n우리 주 …….\n<또는>\n주님,\n구원의 잔치에서 성체를 받아 모시고 비오니\n저희를 어여삐 여기시어\n저희가 복된 엘리사벳의 사랑을 본받아\n그와 함께 주님의 영광에 참여하게 하소서.\n우리 주 …….","오늘의 묵상":"우리는 가끔씩 편을 가를 때가 있습니다. 비슷한 색깔을 가진 사람하고만 친해지려 하고, 성격도 맞지 않고 조금 다른 세상에 사는 것 같은 사람은 친교의 울타리 밖으로 손쉽게 밀어냅니다. ‘유유상종’이라는 말도 있듯이, 이는 인간의 자연스러운 본성에 따른 행동일 것입니다.\n그런데 오늘 복음 속 예수님께서는 이러한 인간의 본성을 넘어서는 모습을 보여 주십니다. 예수님과 자캐오는 서로 너무나 다른 존재입니다. 예수님께서는 군중에 둘러싸여 계시고, 자캐오는 외면당합니다. 예수님께서는 죄가 없으신 분이시지만, 자캐오는 죄인이라고 손가락질을 받습니다. 이처럼 예수님과 자캐오는 마치 물과 기름처럼 서로 섞일 수 없어 보이지만, 예수님께서는 당신과 자캐오 사이에 있는 견고한 경계를 허무십니다. 심지어 그의 집으로 들어가시지요.\n예수님께서 그렇게 하신 까닭은, 우리가 하느님 나라의 약속을 되새기며 띄울 무지개는 하나의 색깔로 만들 수 없고, 하느님 나라의 거룩함을 노래하는 화음은 하나의 음표만으로는 만들 수 없기 때문입니다. 토마스 아퀴나스 성인이 『신학 대전』에서 말한 것처럼 하느님의 아름다움은 우리의 다양한 모습을 통하여 드러납니다.\n그러니 우리도 우리가 누군가와 가지게 된 경계를 허물 수 있으면 좋겠습니다. 경계의 가시덤불을 걷어 내고, 하느님의 자녀라면, 나의 이웃이라면 누구나 들어올 수 있는 문을 만들어 주는 것이 바로 오늘 복음에 나오는 예수님, 누군가의 집에 구원을 베푸시는 예수님의 따듯하고 거룩한 모습을 닮는 길일 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261118":{"d":"2026년 11월 18일 수요일","c":"녹","t":"연중 제33주간 수요일","o":[{"c":"백","t":"성 베드로 대성전과 성 바오로 대성전 봉헌"}],"n":"","g":"","i":"","s":{"입당송":"예레 29,11.12.14 참조\n주님이 말씀하신다. 나는 재앙이 아니라 평화를 주노라. 나를 부르면 너희 기도를 들어 주고, 사로잡힌 너희를 모든 곳에서 데려오리라.","본기도":"주 하느님,\n저희를 도와주시어\n언제나 모든 선의 근원이신 주님을 기쁜 마음으로 섬기며\n완전하고 영원한 행복을 누리게 하소서.\n성부와 성령과 …….","제1독서":"<거룩하시다, 전능하신 주 하느님 전에도 계셨고 지금도 계시며 또 앞으로 오실 분!>\n▥ 요한 묵시록의 말씀입니다.\n4,1-11\n나 요한이 1 보니 하늘에 문이 하나 열려 있었습니다.\n그리고 처음에 들었던 그 목소리,\n곧 나팔 소리같이 울리며 나에게 말하던 그 목소리가, “이리 올라오너라.\n이다음에 일어나야 할 일들을 너에게 보여 주겠다.” 하고 말하였습니다.\n2 나는 곧바로 성령께 사로잡히게 되었습니다.\n하늘에는 또 어좌 하나가 놓여 있고 그 어좌에는 어떤 분이 앉아 계셨습니다.\n3 거기에 앉아 계신 분은 벽옥과 홍옥같이 보이셨고,\n어좌 둘레에는 취옥같이 보이는 무지개가 있었습니다.\n4 그 어좌 둘레에는 또 다른 어좌 스물네 개가 있는데,\n거기에는 흰옷을 입고 머리에 금관을 쓴 원로 스물네 명이 앉아 있었습니다.\n5 그 어좌에서는 번개와 요란한 소리와 천둥이 터져 나왔습니다.\n그리고 어좌 앞에서는 일곱 횃불이 타고 있었습니다.\n그것은 하느님의 일곱 영이십니다.\n6 또 그 어좌 앞에는 수정처럼 보이는 유리 바다 같은 것이 있었습니다.\n그리고 어좌 한가운데와 그 둘레에는\n앞뒤로 눈이 가득 달린 네 생물이 있었습니다.\n7 첫째 생물은 사자 같고 둘째 생물은 황소 같았으며,\n셋째 생물은 얼굴이 사람 같고 넷째 생물은 날아가는 독수리 같았습니다.\n8 그 네 생물은 저마다 날개를 여섯 개씩 가졌는데,\n사방으로 또 안으로 눈이 가득 달려 있었습니다.\n그리고 밤낮 쉬지 않고 외치고 있었습니다.\n“거룩하시다, 거룩하시다, 거룩하시다, 전능하신 주 하느님\n전에도 계셨고 지금도 계시며 또 앞으로 오실 분!”\n9 어좌에 앉아 계시며 영원무궁토록 살아 계신 그분께\n생물들이 영광과 영예와 감사를 드릴 때마다,\n10 스물네 원로는 어좌에 앉아 계신 분 앞에 엎드려,\n영원무궁토록 살아 계신 그분께 경배하였습니다.\n그리고 자기들의 금관을 어좌 앞에 던지며 외쳤습니다.\n11 “주님, 저희의 하느님, 주님은 영광과 영예와 권능을 받기에 합당한 분이십니다.\n주님께서는 만물을 창조하셨고\n주님의 뜻에 따라 만물이 생겨나고 창조되었습니다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 150,1ㄴㄷ-2.3-4.5-6ㄱ(◎ 묵시 4,8ㄷ)\n◎ 거룩하시다, 거룩하시다, 거룩하시다, 전능하신 주 하느님.\n○ 거룩한 성소에서 하느님을 찬양하여라. 웅대한 창공에서 주님을 찬양하여라. 위대한 일 이루시니 주님을 찬양하여라. 그지없이 크시오니 주님을 찬양하여라. ◎\n○ 뿔 나팔 불며 주님을 찬양하여라. 수금과 비파 타며 주님을 찬양하여라. 손북 치고 춤추며 주님을 찬양하여라. 거문고 뜯고 피리 불며 주님을 찬양하여라. ◎\n○ 바라 소리 낭랑하게 주님을 찬양하여라. 바라 소리 우렁차게 주님을 찬양하여라. 숨 쉬는 것 모두 다 주님을 찬양하여라. ◎","복음 환호송":"요한 15,16 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 내가 너희를 세상에서 뽑아 세웠으니, 가서 열매를 맺어라. 너희 열매는 길이 남으리라.\n◎ 알렐루야.","복음":"<그렇다면 어찌하여 내 돈을 은행에 넣지 않았더냐?>\n✠ 루카가 전한 거룩한 복음입니다.\n19,11ㄴ-28\n그때에 11 예수님께서는 비유 하나를 말씀하셨다.\n예수님께서 예루살렘에 가까이 이르신 데다,\n사람들이 하느님의 나라가 당장 나타나는 줄로 생각하고 있었기 때문이다.\n12 그리하여 예수님께서 이르셨다.\n“어떤 귀족이 왕권을 받아 오려고 먼 고장으로 떠나게 되었다.\n13 그래서 그는 종 열 사람을 불러 열 미나를 나누어 주며,\n‘내가 올 때까지 벌이를 하여라.’ 하고 그들에게 일렀다.\n14 그런데 그 나라 백성은 그를 미워하고 있었으므로 사절을 뒤따라 보내어,\n‘저희는 이 사람이 저희 임금이 되는 것을 바라지 않습니다.’\n하고 말하게 하였다.\n15 그러나 그는 왕권을 받고 돌아와,\n자기가 돈을 준 종들이 벌이를 얼마나 하였는지 알아볼 생각으로\n그들을 불러오라고 분부하였다.\n16 첫째 종이 들어와서,\n‘주인님, 주인님의 한 미나로 열 미나를 벌어들였습니다.’ 하고 말하였다.\n17 그러자 주인이 그에게 일렀다.\n‘잘하였다, 착한 종아! 네가 아주 작은 일에 성실하였으니\n열 고을을 다스리는 권한을 가져라.’\n18 그다음에 둘째 종이 와서,\n‘주인님, 주인님의 한 미나로 다섯 미나를 만들었습니다.’ 하고 말하였다.\n19 주인은 그에게도 일렀다. ‘너도 다섯 고을을 다스려라.’\n20 그런데 다른 종은 와서 이렇게 말하였다.\n‘주인님, 주인님의 한 미나가 여기에 있습니다.\n저는 이것을 수건에 싸서 보관해 두었습니다.\n21 주인님께서 냉혹하신 분이어서\n가져다 놓지 않은 것을 가져가시고 뿌리지 않은 것을 거두어 가시기에,\n저는 주인님이 두려웠습니다.’\n22 그러자 주인이 그에게 말하였다.\n‘이 악한 종아, 나는 네 입에서 나온 말로 너를 심판한다.\n내가 냉혹한 사람이어서 가져다 놓지 않은 것을 가져가고\n뿌리지 않은 것을 거두어 가는 줄로 알고 있었다는 말이냐?\n23 그렇다면 어찌하여 내 돈을 은행에 넣지 않았더냐?\n그리하였으면 내가 돌아왔을 때 내 돈에 이자를 붙여 되찾았을 것이다.’\n24 그러고 나서 곁에 있는 이들에게 일렀다.\n‘저자에게서 그 한 미나를 빼앗아 열 미나를 가진 이에게 주어라.’\n25 ─ 그러자 그들이 주인에게 말하였다.\n‘주인님, 저이는 열 미나나 가지고 있습니다.’ ─\n26 ‘내가 너희에게 말한다. 누구든지 가진 자는 더 받고,\n가진 것이 없는 자는 가진 것마저 빼앗길 것이다.\n27 그리고 내가 저희들의 임금이 되는 것을 바라지 않은 그 원수들을\n이리 끌어다가, 내 앞에서 처형하여라.’”\n28 예수님께서는 이 말씀을 하시고 앞장서서 예루살렘으로 오르는 길을 걸어가셨다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n지극히 높으신 주님께 바치는 이 예물을 굽어보시어\n저희가 오롯이 주님을 사랑하며 살다가 영원한 생명을 얻게 하소서.\n우리 주 …….","영성체송":"시편 73(72),28\n저는 하느님 곁에 있어 행복하옵니다. 주 하느님을 피신처로 삼으리이다.\n<또는>\n마르 11,23.24 참조\n주님이 말씀하신다. 내가 진실로 너희에게 말한다. 너희가 기도하며 청하는 것은 무엇이든 이미 받은 줄로 믿어라. 너희에게 그대로 이루어지리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 거룩하신 성체를 받아 모시고 간절히 비오니\n성자께서 당신 자신을 기억하여 거행하라 명하신 이 성사로\n저희가 언제나 주님의 사랑을 실천하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음은 지난 주일 복음에 나온 탈렌트의 비유와 병행 구절인 미나의 비유입니다. 이 두 구절은 거의 같은 구조이지만 내용 면에서 큰 차이가 있습니다. 탈렌트의 비유에서 주인은 종들에게 저마다의 능력에 따라 ‘다른 양의 탈렌트’를 나누어 주지만, 오늘 복음에서 귀족은 종들에게 ‘같은 양의 미나’를 나누어 준다는 것입니다. 그래서 저는 우리가 하느님께 똑같이 받은 것이 무엇이 있을까 생각해 보았습니다. 그것은 바로 스물네 시간으로 이루어진 ‘하루’입니다.\n우리는 모두 하느님께 이 하루를 똑같이 선물받았습니다. 그러나 그 시간을 채우는 방식은 저마다 다를 것입니다. 오늘 복음에 나오는 종들이 똑같이 한 미나씩을 받고도 서로 다르게 쓴 것처럼 말이지요.\n어느 날 펜을 들고 글을 쓰다가 문득 인생을 살아간다는 것은 하느님의 펜이 되어 이 하루라는 종이에 자신만의 글을 써 내려가는 것이 아닐까 하는 생각이 들었습니다. 물론 이 하루라는 종이에 하느님의 펜이 아니라 세상의 펜이 되어 글을 쓸 때도 있을 것입니다. 그러나 세상의 펜은 쓰임이 다하면 그것으로 끝이지만, 하느님의 펜은 그 쓰임이 다하면 하느님 나라로 들어간다는 것을 기억해야 합니다.\n뒷날 우리가 하느님께 오늘 하루, 우리 인생이라는 종이를 자랑스럽게 보여 드릴 수 있도록, 글귀는 저마다 다르지만 그 결말은 모두 사랑이면 좋겠습니다. 오늘 복음의 내용처럼 사랑을 더 많이 실천한 사람이 더욱 큰 사랑을 경험하게 될 것이기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261119":{"d":"2026년 11월 19일 목요일","c":"녹","t":"연중 제33주간 목요일","o":[],"n":"","g":"","i":"","s":{"입당송":"예레 29,11.12.14 참조\n주님이 말씀하신다. 나는 재앙이 아니라 평화를 주노라. 나를 부르면 너희 기도를 들어 주고, 사로잡힌 너희를 모든 곳에서 데려오리라.","본기도":"주 하느님,\n저희를 도와주시어\n언제나 모든 선의 근원이신 주님을 기쁜 마음으로 섬기며\n완전하고 영원한 행복을 누리게 하소서.\n성부와 성령과 …….","제1독서":"<어린양은 살해되시고 자신의 피로 모든 민족 가운데에서 사람들을 속량하셨습니다.>\n▥ 요한 묵시록의 말씀입니다.\n5,1-10\n나 요한은 1 어좌에 앉아 계신 분의 오른손에,\n안팎으로 글이 적힌 두루마리 하나가 들려 있는 것을 보았습니다.\n그 두루마리는 일곱 번 봉인된 것이었습니다.\n2 나는 또 큰 능력을 지닌 천사 하나가 큰 소리로,\n“이 봉인을 뜯고 두루마리를 펴기에 합당한 자 누구인가?” 하고\n외치는 것을 보았습니다.\n3 그러나 하늘에도 땅 위에도 땅 아래에도\n두루마리를 펴거나 그것을 들여다볼 수 있는 이가 하나도 없었습니다.\n4 두루마리를 펴거나 그것을 들여다보기에 합당하다고 인정된 이가\n아무도 없었기 때문에, 나는 슬피 울었습니다.\n5 그런데 원로 가운데 하나가 나에게 말하였습니다.\n“울지 마라. 보라, 유다 지파에서 난 사자, 곧 다윗의 뿌리가 승리하여\n일곱 봉인을 뜯고 두루마리를 펼 수 있게 되었다.”\n6 나는 또 어좌와 네 생물과 원로들 사이에,\n살해된 것처럼 보이는 어린양이 서 계신 것을 보았습니다.\n그 어린양은 뿔이 일곱이고 눈이 일곱이셨습니다.\n그 일곱 눈은 온 땅에 파견된 하느님의 일곱 영이십니다.\n7 그 어린양이 나오시어,\n어좌에 앉아 계신 분의 오른손에서 두루마리를 받으셨습니다.\n8 어린양이 두루마리를 받으시자,\n네 생물과 스물네 원로가 그 앞에 엎드렸습니다.\n그들은 저마다 수금과, 또 향이 가득 담긴 금 대접을 가지고 있었습니다.\n향이 가득 담긴 금 대접들은 성도들의 기도입니다.\n9 그들이 새 노래를 불렀습니다.\n“주님께서는 두루마리를 받아 봉인을 뜯기에 합당하십니다.\n주님께서 살해되시고\n또 주님의 피로 모든 종족과 언어와 백성과 민족 가운데에서\n사람들을 속량하시어 하느님께 바치셨기 때문입니다.\n10 주님께서는 그들이 우리 하느님을 위하여\n한 나라를 이루고 사제들이 되게 하셨으니\n그들이 땅을 다스릴 것입니다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 149,1ㄴㄷ-2.3-4.5-6ㄱ과 9ㄴ(◎ 묵시 5,10 참조)\n◎ 주님은 우리가 하느님을 위하여 한 나라를 이루고 사제들이 되게 하셨네.\n○ 주님께 노래하여라, 새로운 노래. 충실한 이들의 모임에서 찬양 노래 불러라. 이스라엘은 자기를 지으신 분을 모시고 기뻐하고, 시온의 아들들은 임금님을 모시고 즐거워하여라. ◎\n○ 춤추며 그분 이름을 찬양하고, 손북 치고 비파 타며 찬미 노래 드려라. 주님은 당신 백성을 좋아하시고, 가난한 이들을 구원하여 높이신다. ◎\n○ 충실한 이들은 영광 속에 기뻐 뛰며, 그 자리에서 환호하여라. 그들은 목청껏 하느님을 찬송하리라. 그분께 충실한 모든 이에게 영광이어라. ◎","복음 환호송":"시편 95(94),7.8\n◎ 알렐루야.\n○ 오늘 너희는 주님 목소리에 귀를 기울여라. 너희 마음을 무디게 하지 마라.\n◎ 알렐루야.","복음":"<너도 평화를 가져다주는 것이 무엇인지 알았더라면 … … !>\n✠ 루카가 전한 거룩한 복음입니다.\n19,41-44\n그때에 41 예수님께서 예루살렘에 가까이 이르시어\n그 도성을 보고 우시며 42 말씀하셨다.\n“오늘 너도 평화를 가져다주는 것이 무엇인지 알았더라면 …… !\n그러나 지금 네 눈에는 그것이 감추어져 있다.\n43 그때가 너에게 닥쳐올 것이다.\n그러면 너의 원수들이 네 둘레에 공격 축대를 쌓은 다음,\n너를 에워싸고 사방에서 조여들 것이다.\n44 그리하여 너와 네 안에 있는 자녀들을 땅바닥에 내동댕이치고,\n네 안에 돌 하나도 다른 돌 위에 남아 있지 않게 만들어 버릴 것이다.\n하느님께서 너를 찾아오신 때를 네가 알지 못하였기 때문이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n지극히 높으신 주님께 바치는 이 예물을 굽어보시어\n저희가 오롯이 주님을 사랑하며 살다가 영원한 생명을 얻게 하소서.\n우리 주 …….","영성체송":"시편 73(72),28\n저는 하느님 곁에 있어 행복하옵니다. 주 하느님을 피신처로 삼으리이다.\n<또는>\n마르 11,23.24 참조\n주님이 말씀하신다. 내가 진실로 너희에게 말한다. 너희가 기도하며 청하는 것은 무엇이든 이미 받은 줄로 믿어라. 너희에게 그대로 이루어지리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 거룩하신 성체를 받아 모시고 간절히 비오니\n성자께서 당신 자신을 기억하여 거행하라 명하신 이 성사로\n저희가 언제나 주님의 사랑을 실천하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음은 종말에 대한 분위기로 가득합니다. 전례력으로 보면 우리는 연중 시기의 마지막 주일을 향하고 있고, 오늘 복음에서 예수님께서도 죽음으로 당신의 사명을 완수하실 곳인 예루살렘에 가까이 이르셨습니다.\n일반적으로 종말이라는 말에는 결국 마지막에 이르러 끝난다는 뜻이 담겨 있어 어둡고 무거운 느낌을 줍니다. 오늘 복음에서도 예수님께서 예루살렘 도성이 “돌 하나도 다른 돌 위에 남아 있지 않게”(루카 19,44) 될 것이라고 말씀하시니, 종말이라는 표현이 더욱 어둡고 서글프게 느껴집니다.\n그러나 사실 우리 그리스도교 신앙 안에서 종말은 끝맺음보다는 더욱 풍요로운 완성이라는 뜻이 강합니다. 심지어 ‘새로운 시작’이라는 뜻도 담고 있지요. 세상이 말하는 종말은 절망적이지만 우리 신앙이 말하는 종말이 희망적인 까닭은, 그 한가운데에 예수님께서 계시기 때문입니다. 오늘 독서는 예수님의 모습을 “주님께서 살해되시고, 또 주님의 피로 모든 종족과 언어와 백성과 민족 가운데에서, 사람들을 속량하시어 하느님께 바치셨[다.]”(묵시 5,9)라고 노래합니다.\n세상의 도성은 무너져도 하느님의 도성인 우리는 결코 무너지지 않을 것이라 자신 있게 희망할 수 있는 까닭은, 예수님께서 우리를 위하여 목숨을 바치셨고, 우리는 예수님의 피로 이미 구원받은 백성이기 때문입니다. 우리의 마지막 날은 끝이 아니라 그리스도 안에서 오히려 더 풍요롭게 완성될 것이라는 진리를 잊지 말아야 합니다. 우리가 완성될 마지막 날을 위하여 예수님께서는 오늘도 미사 중에 당신의 몸과 피를 기꺼이 우리에게 내주고 계십니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261120":{"d":"2026년 11월 20일 금요일","c":"녹","t":"연중 제33주간 금요일","o":[],"n":"","g":"","i":"","s":{"입당송":"예레 29,11.12.14 참조\n주님이 말씀하신다. 나는 재앙이 아니라 평화를 주노라. 나를 부르면 너희 기도를 들어 주고, 사로잡힌 너희를 모든 곳에서 데려오리라.","본기도":"주 하느님,\n저희를 도와주시어\n언제나 모든 선의 근원이신 주님을 기쁜 마음으로 섬기며\n완전하고 영원한 행복을 누리게 하소서.\n성부와 성령과 …….","제1독서":"<나는 작은 두루마리를 받아 삼켰습니다.>\n▥ 요한 묵시록의 말씀입니다.\n10,8-11\n하늘에서 들려온 목소리가 나 요한에게 8 말하였습니다.\n“가서 바다와 땅을 디디고 서 있는 그 천사의 손에 펼쳐진 두루마리를 받아라.”\n9 그래서 내가 그 천사에게 가서 작은 두루마리를 달라고 하자,\n그가 나에게 말하였습니다.\n“이것을 받아 삼켜라.\n이것이 네 배를 쓰리게 하겠지만 입에는 꿀같이 달 것이다.”\n10 그래서 나는 그 천사의 손에서 작은 두루마리를 받아 삼켰습니다.\n과연 그것이 입에는 꿀같이 달았지만 먹고 나니 배가 쓰렸습니다.\n11 그때에, “너는 많은 백성과 민족과 언어와 임금들에 관하여\n다시 예언해야 한다.” 하는 소리가 나에게 들려왔습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 119(118),14.24.72.103.111.131(◎ 103ㄱ 참조)\n◎ 주님, 당신 말씀 제 혀에 달콤하옵니다.\n○ 온갖 재산 다 얻은 듯, 당신 법의 길 걸으며 기뻐하나이다. ◎\n○ 당신 법이 저의 즐거움, 그 법은 저의 조언자이옵니다. ◎\n○ 당신 입에서 나온 가르침, 수천 냥 금은보다 제게는 값지옵니다. ◎\n○ 당신 말씀 제 혀에 얼마나 달콤한지! 그 말씀 제 입에 꿀보다 다옵니다. ◎\n○ 당신 법은 제 마음의 기쁨, 영원히 저의 재산이옵니다. ◎\n○ 당신 계명을 열망하기에, 저는 입을 벌리고 헐떡이나이다. ◎","복음 환호송":"요한 10,27 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 내 양들은 내 목소리를 알아듣는다. 나는 그들을 알고 그들은 나를 따른다.\n◎ 알렐루야.","복음":"<너희는 하느님의 집을 ‘강도들의 소굴’로 만들어 버렸다.>\n✠ 루카가 전한 거룩한 복음입니다.\n19,45-48\n그때에 45 예수님께서 성전에 들어가시어\n물건을 파는 이들을 쫓아내기 시작하시며,\n46 그들에게 말씀하셨다.\n“‘나의 집은 기도의 집이 될 것이다.’라고 기록되어 있다.\n그런데 너희는 이곳을 ‘강도들의 소굴’로 만들어 버렸다.”\n47 예수님께서는 날마다 성전에서 가르치셨다.\n수석 사제들과 율법 학자들과 백성의 지도자들은\n예수님을 없앨 방법을 찾았다.\n48 그러나 어떻게 해야 하는지 그 방도를 찾지 못하였다.\n온 백성이 그분의 말씀을 듣느라고 곁을 떠나지 않았기 때문이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n지극히 높으신 주님께 바치는 이 예물을 굽어보시어\n저희가 오롯이 주님을 사랑하며 살다가 영원한 생명을 얻게 하소서.\n우리 주 …….","영성체송":"시편 73(72),28\n저는 하느님 곁에 있어 행복하옵니다. 주 하느님을 피신처로 삼으리이다.\n<또는>\n마르 11,23.24 참조\n주님이 말씀하신다. 내가 진실로 너희에게 말한다. 너희가 기도하며 청하는 것은 무엇이든 이미 받은 줄로 믿어라. 너희에게 그대로 이루어지리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 거룩하신 성체를 받아 모시고 간절히 비오니\n성자께서 당신 자신을 기억하여 거행하라 명하신 이 성사로\n저희가 언제나 주님의 사랑을 실천하게 하소서.\n우리 주 …….","오늘의 묵상":"신학생 때 시험이 끝나고 피정에 들어갈 때면, 가장 먼저 하는 일이 주변을 깔끔하게 정리하는 것이었습니다. 시험을 준비하느라 정신없이 지내며 생긴 주변의 어지러움이 정리되어야 하느님을 더 고요히 만나는 피정을 순조롭게 시작할 수 있었기 때문입니다. 우리 인생도 비슷하다고 생각합니다. 너무 바쁘고 정신없이 앞만 보고 달리다 보면 정작 중요한 것을 놓칠 때가 많습니다. 그래서 가끔 우리 인생에도 선택과 집중을 통한 정리가 필요합니다.\n오늘 복음에서 예수님께서는 성전을 “기도의 집”(루카 19,46)이라고 부르시며, “강도들의 소굴”(19,46)로 변해 버린 성전을 정화하십니다. 이 성전 정화는 한마디로 중요한 것과 그렇지 못한 것을 나누어 정리하는 것이라 할 수 있습니다. 이 정화의 과정에서 예수님께서는 우리에게 ‘강도들의 소굴’과 ‘기도의 집’을 대조하시며 인간의 탐욕보다 하느님의 거룩함이, 그리고 그분을 만나고 기다리는 시간이 훨씬 더 중요하다고 가르치십니다.\n기도는 우리의 두 손을 모아 하늘을 향하게 하지만, 탐욕은 두 손을 움켜쥐게 하여 땅에 묶어 둡니다. 기도는 “하느님이면 충분합니다.”라고 말하게 하지만, 탐욕은 우리에게 “아직도 부족하다.”라고 교묘히 속삭입니다. 이렇게 탐욕은 우리 마음을 어지럽게 만들어 정말 중요한 것을 놓치게 하지만, 기도는 하느님과 대화를 나누게 하여 우리가 나아가야 할 방향을 비추어 주고, 우리 영혼을 맑게 하여 인생에서 정말 중요한 것이 무엇인지 바라보게 해 줍니다. 이 순간, 두 손을 모아 기도하며 주님께서 우리 영혼을 깨끗하게 해 주시기를 간청해 봅시다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261121":{"d":"2026년 11월 21일 토요일","c":"백","t":"복되신 동정 마리아의 자헌 기념일","o":[],"n":"","g":"","i":"이날은 동방 교회의 신자들과 함께, 성모님께서 원죄 없이 잉태되실 때 은총을 가득히 채워 주신 그 성령의 감도로 성모님께서 아기 때부터 하느님께 봉헌되신 것을 기리는 날이다. 성모님의 부모인 요아킴과 안나는 성모님께서 세 살 되시던 해에 성전에서 하느님께 성모님을 바쳤다고 전해 온다. 이날은 본디 6세기 중엽 예루살렘 성전 가까이에 세워진 새로운 성모 성당의 봉헌을 기념하는 날이었는데, 1472년 식스토 4세 교황께서 ‘복되신 동정 마리아의 자헌 기념일’로 선포하셨다.","s":{"입당송":"거룩하신 어머니, 찬미받으소서. 당신은 하늘과 땅을 영원히 다스리시는 임금님을 낳으셨나이다.","본기도":"주님,\n지극히 거룩하신 동정 마리아를 영광스럽게 기념하며 공경하오니\n저희가 그분의 전구로\n주님께 풍성한 은총을 받게 하소서.\n성부와 성령과 …….","제1독서":"<딸 시온아, 즐거워하여라. 내가 이제 가서 머무르리라.>\n▥ 즈카르야 예언서의 말씀입니다.\n2,14-17\n14 “딸 시온아, 기뻐하며 즐거워하여라.\n정녕 내가 이제 가서 네 한가운데에 머무르리라.\n주님의 말씀이다.\n15 그날에 많은 민족이 주님과 결합하여 그들은 내 백성이 되고\n나는 그들 한가운데에 머무르리라.”\n그때에 너는 만군의 주님께서 나를 너에게 보내셨음을 알게 되리라.\n16 주님께서는 이 거룩한 땅에서 유다를 당신 몫으로 삼으시고\n예루살렘을 다시 선택하시리라.\n17 모든 인간은 주님 앞에서 조용히 하여라.\n그분께서 당신의 거룩한 처소에서 일어나셨다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"루카 1,46ㄴ-47.48-49.50-51.52-53.54-55\n◎ 영원하신 성부의 아드님을 잉태하신 동정 마리아는 복되시다!\n○ 내 영혼이 주님을 찬양하고, 내 구원자 하느님 안에서 내 마음 기뻐 뛰노네. ◎\n○ 그분은 비천한 당신 종을 굽어보셨네. 이제부터 과연 모든 세대가 나를 복되다 하리라. 전능하신 분이 나에게 큰일을 하셨으니, 그 이름은 거룩하신 분이시다. ◎\n○ 그분 자비는 세세 대대로, 그분을 두려워하는 이들에게 미치리라. 그분은 당신 팔로 권능을 떨치시어, 마음이 교만한 자들을 흩으셨네. ◎\n○ 권세 있는 자를 자리에서 내치시고, 비천한 이를 들어 올리셨네. 굶주린 이를 좋은 것으로 채워 주시고, 부유한 자를 빈손으로 돌려보내셨네. ◎\n○ 당신 자비를 기억하시어, 당신 종 이스라엘을 돌보셨으니, 우리 조상들에게 말씀하신 대로, 아브라함과 그 후손에게 그분의 자비 영원하리라. ◎","복음 환호송":"루카 11,28 참조\n◎ 알렐루야.\n○ 하느님 말씀을 듣고 지키는 이들은 행복하여라.\n◎ 알렐루야.","복음":"<예수님께서 제자들을 가리키시며 이르셨다. “이들이 내 어머니고 내 형제들이다.”>\n✠ 마태오가 전한 거룩한 복음입니다.\n12,46-50\n그때에 46 예수님께서 군중에게 말씀하고 계시는데,\n그분의 어머니와 형제들이 그분과 이야기하려고 밖에 서 있었다.\n47 그래서 어떤 이가 예수님께, “보십시오, 스승님의 어머님과 형제들이\n스승님과 이야기하려고 밖에 서 계십니다.” 하고 말하였다.\n48 그러자 예수님께서 당신께 말한 사람에게,\n“누가 내 어머니고 누가 내 형제들이냐?” 하고 반문하셨다.\n49 그리고 당신의 제자들을 가리키시며 이르셨다.\n“이들이 내 어머니고 내 형제들이다.\n50 하늘에 계신 내 아버지의 뜻을 실행하는 사람이 내 형제요 누이요 어머니다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님 백성의 기도와 희생 제물을 받으시고\n성자의 어머니 복되신 동정 마리아의 전구를 들으시어\n봉헌하는 이는 모두 은총을 받고\n청원하는 이는 모두 응답을 얻게 하소서.\n우리 주 …….\n<또는>\n주님,\n동정녀에게서 태어나신 성자께서\n어머니의 순결을 손상하지 않으시고 오히려 거룩하게 하셨으니\n저희가 성자의 인성으로 도움을 받고 죄에서 벗어나\n주님 마음에 드는 제물을 바치게 하소서.\n우리 주 …….","감사송":"<복되신 동정 마리아 감사송 1 : 어머니이신 마리아>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사하고\n복되신 평생 동정 마리아 ( ) 축일에\n아버지를 찬송하고 찬양하고 찬미함은\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n성모님께서는 성령으로 외아들을 잉태하시고\n동정의 영광을 간직한 채\n영원한 빛이신 우리 주 예수 그리스도를 이 세상에 낳으셨나이다.\n그리스도를 통하여 천사들이 주님의 위엄을 찬미하고\n주품천사들이 흠숭하며 권품천사들이 두려워하고\n하늘 위 하늘의 능품천사들과 복된 세라핌이\n다 함께 예배하며 환호하오니\n저희도 그들과 소리를 모아 삼가 주님을 찬양하나이다.","영성체송":"루카 11,27 참조\n영원하신 아버지의 아들을 잉태하신 동정 마리아의 모태는 복되시나이다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"인자하신 주님,\n천상 성사를 받고 간절히 비오니\n동정 마리아를 기리는 저희가 그분을 본받아\n주님을 충실히 섬기며 구원의 신비에 참여하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘은 복되신 동정 마리아의 자헌 기념일입니다. 오늘 전례에서 ‘자헌’, 곧 성모님께서 ‘자신을 스스로 봉헌함’이라는 말을 쓰는 까닭은 교회의 전승에서 성모님의 부모인 요아킴과 안나가 어린 마리아를 성전에 바쳤다고 전해질 뿐만 아니라, 구세주의 어머니이신 성모님께서 하느님께 온전히 속하신 분으로서 스스로 그 봉헌에 내적으로 응답하셨기 때문입니다.\n오늘 복음에서 예수님께서는 성모님께서 밖에 서 계신다는 말을 듣고, “누가 내 어머니고 누가 내 형제들이냐?”(마태 12,48)라고 되물으십니다. 얼핏 듣기에 예수님의 이 말씀은 매몰차고, 심지어 성모님께서 당신의 어머니시라는 사실을 부정하시는 것 같아 보입니다. 그러나 사실은 그 반대입니다. 예수님께서는 오늘 복음에서 우리에게 당신의 참가족이 될 수 있는 조건에 대하여 말씀하시면서 그 조건으로 “하늘에 계신 내 아버지의 뜻을 실행하는 사람”(12,50)을 제시하시는데, 사실 성모님께서는 그 조건에 가장 잘 들어맞는 분이시기 때문입니다.\n따라서 예수님께서 “누가 내 어머니고 누가 내 형제들이냐?”라고 하신 말씀은 성모님께서 당신의 어머니이심을 부정하시는 것이 아니라, 우리가 가장 닮아야 할 본보기로 성모님을 바라보라고 선언하시는 것입니다.\n오늘 우리가 기념하는 ‘자헌’이란 하느님의 뜻을 이루고자, 그분께 내 생명과 삶의 주도권을 온전히 맡겨 드리는 것입니다. 그러니 우리도 “저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다.”(루카 1,38)라고 말씀하신 성모님을 바라보며, 순간마다 우리 자신을 하느님께 봉헌하며 살면 좋겠습니다. 오늘 우리의 봉헌으로 우리는 하느님의 참가족이라 불릴 것이기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261122":{"d":"2026년 11월 22일 일요일","c":"백","t":"온 누리의 임금이신 우리 주 예수 그리스도 왕 대축일","o":[],"n":"성서 주간","g":"대영광송 · 신경 · 교중","i":"전례력으로 연중 시기의 마지막 주일인 오늘은 ‘온 누리의 임금이신 우리 주 예수 그리스도 왕 대축일’이다. 축일명대로, 인간을 구원하러 오신 예수 그리스도께서 왕(임금)이심을 기리는 날이다. 예수님께서는 정치권력을 장악하여 백성을 억누르는 임금이 아니라, 당신의 목숨까지도 희생하시며 백성을 섬기시는 메시아의 모습을 실현하셨다. 스스로 낮추심으로써 높아지신 것이다. 1925년 비오 11세 교황이 연중 시기의 마지막 주일을 ‘그리스도 왕 대축일’로 정하였다.\n\n\n\n\n한국 천주교회는 1985년부터 해마다 연중 시기의 마지막 주간을 ‘성서 주간’으로 정하여, 신자들이 일상생활 가운데 성경을 더욱 가까이하고 자주 읽으며 묵상하기를 권장하고 있다. 하느님 말씀은 그리스도인 생활의 등불이기 때문이다.","s":{"오늘 전례":"오늘은 온 누리의 임금이신 우리 주 예수 그리스도 왕 대축일입니다. 하느님 아버지께서는 모든 사람을 위하여 성자를 하나뿐인 임금이시며 목자로 삼으시어, 비탄의 역사 속에서도 사랑의 나라를 세우셨습니다. 성자께서 아버지께 구원의 업적을 바치시는 날, 아버지께서 모든 것 안에서 모든 것이심을 고백할 수 있도록 우리 안에 확고한 믿음을 심어 주시기를 청합시다.","입당송":"묵시 5,12; 1,6 참조\n죽임을 당하신 어린양은 권능과 신성과 지혜와 힘과 영예를 받으시기에 합당하옵니다. 영광과 권능을 영원무궁토록 받으소서.","본기도":"전능하시고 영원하신 하느님,\n사랑하시는 성자를 온 누리의 임금으로 세우시어 만물을 새롭게 하셨으니\n모든 피조물이 종살이에서 벗어나 하느님을 섬기며\n끝없이 하느님을 찬미하게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<너희 나의 양 떼야. 나 이제 양과 양 사이의 시비를 가리겠다.>\n▥ 에제키엘 예언서의 말씀입니다.\n34,11-12.15-17\n11 주 하느님이 이렇게 말한다.\n나 이제 내 양 떼를 찾아서 보살펴 주겠다.\n12 자기 가축이 흩어진 양 떼 가운데에 있을 때,\n목자가 그 가축을 보살피듯, 나도 내 양 떼를 보살피겠다.\n캄캄한 구름의 날에, 흩어진 그 모든 곳에서 내 양 떼를 구해 내겠다.\n15 내가 몸소 내 양 떼를 먹이고, 내가 몸소 그들을 누워 쉬게 하겠다.\n주 하느님의 말이다.\n16 잃어버린 양은 찾아내고 흩어진 양은 도로 데려오며,\n부러진 양은 싸매 주고 아픈 것은 원기를 북돋아 주겠다.\n그러나 기름지고 힘센 양은 없애 버리겠다.\n나는 이렇게 공정으로 양 떼를 먹이겠다.\n17 너희 나의 양 떼야, 주 하느님이 이렇게 말한다.\n나 이제 양과 양 사이, 숫양과 숫염소 사이의 시비를 가리겠다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 23(22),1-2ㄱ.2ㄴ-3.5.6(◎ 1)\n◎ 주님은 나의 목자, 아쉬울 것 없어라.\n○ 주님은 나의 목자, 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시네. ◎\n○ 잔잔한 물가로 나를 이끄시어, 내 영혼에 생기 돋우어 주시고, 당신 이름 위하여, 나를 바른길로 이끌어 주시네. ◎\n○ 원수들 보는 앞에서 제게 상을 차려 주시고, 머리에 향유를 발라 주시니, 제 술잔 넘치도록 가득하옵니다. ◎\n○ 제 한평생 모든 날에, 은총과 자애만이 따르리니, 저는 오래오래 주님 집에 사오리다. ◎","제2독서":"<그리스도께서는 나라를 하느님 아버지께 넘겨 드리셨습니다. 하느님께서는 모든 것 안에서 모든 것이 되실 것입니다.>\n▥ 사도 바오로의 코린토 1서 말씀입니다.\n15,20-26.28\n형제 여러분,\n20 그리스도께서는 죽은 이들 가운데에서 되살아나셨습니다.\n죽은 이들의 맏물이 되셨습니다.\n21 죽음이 한 사람을 통하여 왔으므로 부활도 한 사람을 통하여 온 것입니다.\n22 아담 안에서 모든 사람이 죽는 것과 같이\n그리스도 안에서 모든 사람이 살아날 것입니다.\n23 그러나 각각 차례가 있습니다. 맏물은 그리스도이십니다.\n그다음은 그리스도께서 재림하실 때, 그분께 속한 이들입니다.\n24 그러고는 종말입니다.\n그때에 그리스도께서는 모든 권세와 모든 권력과 권능을 파멸시키시고 나서\n나라를 하느님 아버지께 넘겨드리실 것입니다.\n25 하느님께서 모든 원수를 그리스도의 발아래 잡아다 놓으실 때까지는\n그리스도께서 다스리셔야 합니다.\n26 마지막으로 파멸되어야 하는 원수는 죽음입니다.\n28 그러나 아드님께서도 모든 것이 당신께 굴복할 때에는,\n당신께 모든 것을 굴복시켜 주신 분께 굴복하실 것입니다.\n그리하여 하느님께서는 모든 것 안에서 모든 것이 되실 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마르 11,9.10 참조\n◎ 알렐루야.\n○ 주님의 이름으로 오시는 분, 찬미받으소서! 다가오는 우리 조상 다윗의 나라는 복되어라!\n◎ 알렐루야.","복음":"<사람의 아들이 자기의 영광스러운 옥좌에 앉아 모든 민족들을 가를 것이다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n25,31-46\n그때에 예수님께서 제자들에게 말씀하셨다.\n31 “사람의 아들이 영광에 싸여 모든 천사와 함께 오면,\n자기의 영광스러운 옥좌에 앉을 것이다.\n32 그리고 모든 민족들이 사람의 아들 앞으로 모일 터인데,\n그는 목자가 양과 염소를 가르듯이 그들을 가를 것이다.\n33 그렇게 하여 양들은 자기 오른쪽에, 염소들은 왼쪽에 세울 것이다.\n34 그때에 임금이 자기 오른쪽에 있는 이들에게 이렇게 말할 것이다.\n‘내 아버지께 복을 받은 이들아,\n와서, 세상 창조 때부터 너희를 위하여 준비된 나라를 차지하여라.\n35 너희는 내가 굶주렸을 때에 먹을 것을 주었고,\n내가 목말랐을 때에 마실 것을 주었으며,\n내가 나그네였을 때에 따뜻이 맞아들였다.\n36 또 내가 헐벗었을 때에 입을 것을 주었고,\n내가 병들었을 때에 돌보아 주었으며, 내가 감옥에 있을 때에 찾아 주었다.’\n37 그러면 그 의인들이 이렇게 말할 것이다.\n‘주님, 저희가 언제 주님께서 굶주리신 것을 보고 먹을 것을 드렸고,\n목마르신 것을 보고 마실 것을 드렸습니까?\n38 언제 주님께서 나그네 되신 것을 보고 따뜻이 맞아들였고,\n헐벗으신 것을 보고 입을 것을 드렸습니까?\n39 언제 주님께서 병드시거나 감옥에 계신 것을 보고 찾아가 뵈었습니까?’\n40 그러면 임금이 대답할 것이다.\n‘내가 진실로 너희에게 말한다.\n너희가 내 형제들인 이 가장 작은 이들 가운데 한 사람에게 해 준 것이\n바로 나에게 해 준 것이다.’\n41 그때에 임금은 왼쪽에 있는 자들에게도 이렇게 말할 것이다.\n‘저주받은 자들아, 나에게서 떠나\n악마와 그 부하들을 위하여 준비된 영원한 불 속으로 들어가라.\n42 너희는 내가 굶주렸을 때에 먹을 것을 주지 않았고,\n내가 목말랐을 때에 마실 것을 주지 않았으며,\n43 내가 나그네였을 때에 따뜻이 맞아들이지 않았다.\n또 내가 헐벗었을 때에 입을 것을 주지 않았고,\n내가 병들었을 때와 감옥에 있을 때에 돌보아 주지 않았다.’\n44 그러면 그들도 이렇게 말할 것이다.\n‘주님, 저희가 언제 주님께서 굶주리시거나 목마르시거나\n나그네 되신 것을 보고,\n또 헐벗으시거나 병드시거나 감옥에 계신 것을 보고\n시중들지 않았다는 말씀입니까?’\n45 그때에 임금이 대답할 것이다.\n‘내가 진실로 너희에게 말한다.\n너희가 이 가장 작은 이들 가운데 한 사람에게 해 주지 않은 것이\n바로 나에게 해 주지 않은 것이다.’\n46 이렇게 하여 그들은 영원한 벌을 받는 곳으로 가고\n의인들은 영원한 생명을 누리는 곳으로 갈 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n창조주이신 주님, 사람이 되신 말씀의 배필인 교회를 이끌어 주시어, 교회가 늘 성경을 가까이하고 더 깊이 이해하는 데 온 힘을 다하며, 말씀으로 성장하게 하소서.\n\n2. 공직자들을 위하여 기도합시다.\n\n보호자이신 주님, 나라와 국민을 위하여 일하는 공직자들에게 지혜와 절제의 은총을 주시어, 그들이 봉사의 정신으로 맡은 일에 최선을 다하며 살아가게 하소서.\n\n3. 세상의 모든 부모를 위하여 기도합시다.\n\n생명이신 주님, 자녀를 낳아 기르며 주님 뜻에 응답하는 부모들에게 힘과 용기를 주시어, 자녀들에게 큰 울타리가 되고, 그들과 함께 성장하며 참기쁨을 누리게 하소서.\n\n4. 장애로 고통받는 젊은이들을 위하여 기도합시다.\n\n인도자이신 주님, 장애로 고통받는 젊은이들을 굽어살피시어, 그들이 절망에 빠지지 않게 하시고, 하늘의 은총으로 힘을 얻어 모든 어려움을 이겨 내게 하소서.","예물 기도":"주님, 인류 화해의 제물을 바치며 간절히 비오니\n모든 민족들이 성자를 통하여\n일치와 평화의 은혜를 받게 하소서.\n성자께서는 영원히 살아 계시며 다스리시나이다.","감사송":"<주님의 축일과 신비 감사송 8 : 온 누리의 임금이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서 외아드님 우리 주 예수 그리스도께\n기쁨의 기름을 바르시어\n영원한 사제와 온 누리의 임금으로 세우셨으며\n그리스도께서는 몸소 십자가 제대 위에서\n티 없는 평화의 제물로 당신을 봉헌하시어 인류 구원을 이룩하시고\n만물을 당신 친히 다스리시어\n그 영원하고 보편된 나라를\n지극히 높으신 아버지께 바치셨나이다.\n그 나라는 진리와 생명의 나라요 거룩함과 은총의 나라이며\n정의와 사랑과 평화의 나라이옵니다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"시편 29(28),10-11\n주님이 영원한 임금으로 앉으셨네. 주님이 당신 백성에게 강복하여 평화를 주시리라.","영성체 후 묵상":"“너희가 내 형제들인 이 가장 작은 이들 가운데 한 사람에게 해 준 것이 바로 나에게 해 준 것이다.” 주님을 섬기듯 ‘내 형제’인 가장 작은 이들을 섬기는 것이, 영원한 벌과 영원한 생명을 가르는 기준임을 명심합시다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n불멸의 양식인 성체를 받아 모시고 비오니\n저희가 온 누리의 임금이신 그리스도의 계명을 지켜\n그리스도와 함께 하늘 나라에서 끝없이 살게 하소서.\n성자께서는 영원히 살아 계시며 다스리시나이다.","오늘의 묵상":"오늘은 전례력으로 한 해의 마지막 주일인 온 누리의 임금이신 우리 주 예수 그리스도 왕 대축일입니다. 오늘 복음에서 우리의 임금이신 예수님께서는 당신께서 가장 작은 이들 안에 현존하신다는 진리를 가르치십니다.\n예전에 어떤 신부님이 본당에서 사목할 때 신자들이 미지근한 태도를 보여 답답하였는데, 신자들이 그러한 태도를 보인 것은 자신의 부족함 때문이었다고 하였던 것이 생각납니다. 그 부족한 모습이란 가난하고 소외된 이웃들을 더 진심으로 챙기지 못한 것이었습니다.\n신부님은 예수님을 따르는 사제가 있어야 하는 자리는 그러한 이웃들 가운데라는 것을 깨닫고, 그날부터 본당 안에서 어려운 처지에 놓인 사람들에게 더 가까이 다가갔다고 합니다. 그랬더니 신기하게도 더 많은 신자가 신부님의 열정에 적극적으로 따르며 본당이 사랑 넘치는 곳으로 달라졌다고 합니다.\n우리의 임금이신 예수님께서 이룩하시려는 나라는 바로 이런 나라입니다. 당신을 따르는 이들이 더 높고 영광스러운 자리로 올라가는 나라가 아니라 여러 상황으로 어렵고 도움이 필요한 이웃 가운데로 내려가는 나라입니다. 예수님께서는 참하느님이시지만 우리를 구원하시고자 참사람의 모습으로 이 땅에 내려오신 것처럼 말입니다. 한 해를 마무리하는 오늘, 우리도 이러한 진리를 깨달으면 좋겠습니다. 그리스도의 왕좌는 높고 화려한 궁전에 자리하지 않고, 가장 가난하고 소외된 이들의 곁에 놓여 있으며, 우리가 그리스도를 임금으로 모신다는 것은 그분께서 계시는 가난한 이들의 곁으로 내려간다는 뜻이라는 사실을 말입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261123":{"d":"2026년 11월 23일 월요일","c":"녹","t":"연중 제34주간 월요일","o":[{"c":"홍","t":"성 클레멘스 1세 교황 순교자"},{"c":"백","t":"성 골룸바노 아빠스"}],"n":"","g":"","i":"","s":{"입당송":"시편 85(84),9 참조\n당신 백성, 당신께 충실한 이, 당신께 돌아오는 이에게 주님은 진정 평화를 말씀하신다.","본기도":"주님,\n믿는 이들의 마음을 일깨우시어\n저희가 거룩한 구원의 열매를 풍성히 거두며\n주님의 자비로 더욱 큰 은총을 받게 하소서.\n성부와 성령과 …….","제1독서":"<그들의 이마에는 그리스도와 그 아버지의 이름이 적혀 있었습니다.>\n▥ 요한 묵시록의 말씀입니다.\n14,1-3.4ㄴ-5\n나 요한이 1 보니 어린양이 시온산 위에 서 계셨습니다.\n그와 함께 십사만 사천 명이 서 있는데,\n그들의 이마에는 어린양의 이름과 그 아버지의 이름이 적혀 있었습니다.\n2 그리고 큰 물 소리 같기도 하고 요란한 천둥소리 같기도 한 목소리가\n하늘에서 울려오는 것을 들었습니다.\n내가 들은 그 목소리는 또 수금을 타며 노래하는 이들의 목소리 같았습니다.\n3 그들은 어좌와 네 생물과 원로들 앞에서 새 노래를 부르고 있었습니다.\n그 노래는 땅으로부터 속량된 십사만 사천 명 말고는\n아무도 배울 수 없었습니다.\n4 그들은 어린양이 가는 곳이면 어디든지 따라가는 이들입니다.\n그들은 하느님과 어린양을 위한 맏물로\n사람들 가운데에서 속량되었습니다.\n5 그들의 입에서는 거짓을 찾아볼 수가 없었습니다.\n그들은 흠 없는 사람들입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 24(23),1-2.3-4ㄱㄴ.5-6(◎ 6 참조)\n◎ 주님, 이들이 당신 얼굴을 찾는 세대이옵니다.\n○ 주님의 것이라네, 온 땅과 그 안에 가득 찬 것들, 온 누리와 그 안에 사는 것들. 그분이 물 위에 세우시고, 강 위에 굳히셨네. ◎\n○ 누가 주님의 산에 오를 수 있으랴? 누가 그 거룩한 곳에 설 수 있으랴? 손이 깨끗하고 마음이 결백한 이, 헛된 것에 정신을 팔지 않는 이라네. ◎\n○ 그는 주님께 복을 받으리라. 구원의 하느님께 의로움을 얻으리라. 이들이 야곱이라네. 그분을 찾는 세대, 그분 얼굴을 찾는 세대라네. ◎","복음 환호송":"마태 24,42.44 참조\n◎ 알렐루야.\n○ 깨어 준비하고 있어라. 생각하지도 않은 때에 사람의 아들이 오리라.\n◎ 알렐루야.","복음":"<예수님께서는 빈곤한 과부가 렙톤 두 닢을 넣는 것을 보셨다.>\n✠ 루카가 전한 거룩한 복음입니다.\n21,1-4\n그때에 1 예수님께서 눈을 들어\n헌금함에 예물을 넣는 부자들을 보고 계셨다.\n2 그러다가 어떤 빈곤한 과부가\n렙톤 두 닢을 거기에 넣는 것을 보시고 3 이르셨다.\n“내가 참으로 너희에게 말한다.\n저 가난한 과부가 다른 모든 사람보다 더 많이 넣었다.\n4 저들은 모두 풍족한 데에서 얼마씩을 예물로 넣었지만,\n저 과부는 궁핍한 가운데에서 가지고 있던 생활비를 다 넣었기 때문이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 명에 따라 바치는 이 거룩한 예물을 받으시고\n저희가 언제나 주님의 계명을 지켜\n주님의 사랑에 합당한 제물이 되게 하소서.\n우리 주 …….","영성체송":"시편 117(116),1-2\n주님을 찬양하여라, 모든 민족들아. 우리 위한 주님 사랑 굳건하여라.\n<또는>\n마태 28,20\n주님이 말씀하신다. 보라, 내가 세상 끝 날까지 언제나 너희와 함께 있으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n이 거룩한 제사에서 성체를 모시고 기뻐하오니\n저희가 언제나 하느님 곁에 머무르게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음은 가난한 과부의 렙톤 두 닢에 대한 이야기입니다. 이 복음을 묵상하면서 저는 풍족한 사람들과 과부가 봉헌한 예물의 많고 적음이 아니라 그 마음에 집중해 보고 싶습니다.\n꼭 재물이 아니더라도 무엇인가를 하느님께 봉헌한다는 것은 그것의 주인을 명확히 하는 일이라고 할 수 있습니다. 봉헌이란 온전히 내 소유인 것을 하느님께 드리는 것이 아니라 하느님께서 나에게 잠시 맡겨 두신 것을 하느님께 다시 돌려드리는 것이기 때문이지요. 그런데 중요한 것은 하느님께서는 우리의 봉헌을 필요로 하시지 않는다는 점입니다. 역설적이게도 봉헌은 우리 자신을 위한 일입니다. 왜냐하면 하느님께서 무엇이 부족해서 요구하시는 것이 아니라, 우리가 봉헌함으로써 그분께서 우리 삶의 참된 주인이심을 고백하는 것이기 때문입니다.\n이러한 의미에서 오늘 복음 속 예수님께서 가난한 과부의 봉헌을 칭찬하시는 까닭은 빈곤한 가운데 상대적으로 많은 양의 재물을 봉헌하였기 때문만은 아닙니다. 과부가 자신의 온 마음을 다하여 하느님께서 나의 주님이심을 고백하는 것으로 볼 수 있기 때문입니다.\n우리 가운데 그 누구도 하느님께 무엇인가를 받지 않은 사람은 없습니다. 그러니 ‘지금은 가진 것이 부족해서’, ‘지금은 시간이 없어서’, ‘지금은 여유가 없어서’ 등의 이유를 앞세우지 않으면 좋겠습니다. 하느님께서는 바치는 것의 무게보다 우리가 가지고 있는 것의 주인을 알아보고 그분께서 주인이시라고 고백하는 마음의 무게를 바라보시기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261124":{"d":"2026년 11월 24일 화요일","c":"홍","t":"성 안드레아 둥락 사제와 동료 순교자들 기념일","o":[],"n":"","g":"","i":"안드레아 둥락 성인은 1795년 베트남 박닌의 이교인 가정에서 태어났다. 1823년 사제가 된 그는 베트남의 여러 지역에서 열정적으로 사목 활동을 펼쳤다. 1833년 박해가 시작되자 베트남 교회의 주요 인물이었던 그는 관헌들의 끈질긴 추적으로 체포되어, 1839년 참수형으로 순교하였다. 1988년 성 요한 바오로 2세 교황이 그를 비롯한 116명의 베트남 순교자들을 시성하였다.","s":{"입당송":"갈라 6,14; 1코린 1,18 참조\n우리는 우리 주 예수 그리스도의 십자가 외에는 어떠한 것도 자랑하지 않으리라. 십자가의 말씀이 구원받은 우리에게는 하느님의 힘이다.","본기도":"만물의 기원이시며 아버지이신 하느님,\n복된 안드레아와 동료 순교자들이\n피를 흘리기까지 성자의 십자가를 충실히 따르게 하셨으니\n그들의 전구를 들으시어\n저희가 하느님의 사랑을 형제들에게 전하며\n하느님의 참된 자녀로 살아가게 하소서.\n성부와 성령과 …….","제1독서":"<땅의 곡식이 무르익어 수확할 때가 왔습니다.>\n▥ 요한 묵시록의 말씀입니다.\n14,14-19\n나 요한이 14 보니 흰 구름이 있고\n그 구름 위에는 사람의 아들 같은 분이 앉아 계셨는데,\n머리에는 금관을 쓰고 손에는 날카로운 낫을 들고 계셨습니다.\n15 또 다른 천사가 성전에서 나와, 구름 위에 앉아 계신 분께 큰 소리로 외쳤습니다.\n“낫을 대어 수확을 시작하십시오. 땅의 곡식이 무르익어 수확할 때가 왔습니다.”\n16 그러자 구름 위에 앉아 계신 분이 땅 위로 낫을 휘두르시어\n땅의 곡식을 수확하셨습니다.\n17 또 다른 천사가 하늘에 있는 성전에서 나왔는데,\n그도 날카로운 낫을 들고 있었습니다.\n18 또 다른 천사가 제단에서 나왔는데, 그는 불에 대한 권한을 지닌 천사였습니다.\n그가 날카로운 낫을 든 천사에게 큰 소리로 외쳤습니다.\n“그 날카로운 낫을 대어 땅의 포도나무에서 포도송이들을 거두어들이십시오.\n포도가 다 익었습니다.”\n19 그러자 그 천사가 땅 위로 낫을 휘둘러 땅의 포도를 거두어들이고서는,\n하느님 분노의 큰 포도 확에다 던져 넣었습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 96(95),10.11-12.13(◎ 13ㄴ 참조)\n◎ 세상을 다스리러 주님이 오신다.\n○ 겨레들에게 말하여라. “주님은 임금이시다. 누리는 정녕 굳게 세워져 흔들리지 않고, 그분은 민족들을 올바르게 심판하신다.” ◎\n○ 하늘은 기뻐하고 땅은 즐거워하여라. 바다와 그 안에 가득 찬 것들은 소리쳐라. 들과 그 안에 있는 것도 모두 기뻐 뛰고, 숲속의 나무들도 모두 환호하여라. ◎\n○ 그분이 오신다. 주님 앞에서 환호하여라. 세상을 다스리러 그분이 오신다. 그분은 누리를 의롭게, 민족들을 진리로 다스리신다. ◎","복음 환호송":"묵시 2,10 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 너는 죽을 때까지 충실하여라. 내가 생명의 화관을 너에게 주리라.\n◎ 알렐루야.","복음":"<돌 하나도 다른 돌 위에 남아 있지 않을 것이다.>\n✠ 루카가 전한 거룩한 복음입니다.\n21,5-11\n그때에 5 몇몇 사람이 성전을 두고,\n그것이 아름다운 돌과 자원 예물로 꾸며졌다고 이야기하자,\n예수님께서 이르셨다.\n6 “너희가 보고 있는 저것들이,\n돌 하나도 다른 돌 위에 남아 있지 않고 다 허물어질 때가 올 것이다.”\n7 그들이 예수님께 물었다.\n“스승님, 그러면 그런 일이 언제 일어나겠습니까?\n또 그 일이 벌어지려고 할 때에 어떤 표징이 나타나겠습니까?”\n8 예수님께서 이르셨다.\n“너희는 속는 일이 없도록 조심하여라. 많은 사람이 내 이름으로 와서,\n‘내가 그리스도다.’, 또 ‘때가 가까웠다.’ 하고 말할 것이다.\n그들 뒤를 따라가지 마라.\n9 그리고 너희는 전쟁과 반란이 일어났다는 소문을 듣더라도 무서워하지 마라.\n그러한 일이 반드시 먼저 벌어지겠지만 그것이 바로 끝은 아니다.”\n10 이어서 그들에게 말씀하셨다.\n“민족과 민족이 맞서 일어나고 나라와 나라가 맞서 일어나며,\n11 큰 지진이 발생하고 곳곳에 기근과 전염병이 생길 것이다.\n그리고 하늘에서는 무서운 일들과 큰 표징들이 일어날 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(지혜 3,1-9)와 복음(마태 10,17-22)을 봉독할 수 있다.>","예물 기도":"거룩하신 아버지,\n거룩한 순교자들의 수난을 공경하며 바치는 이 예물을 받으시고\n저희가 세상의 어려움 속에서도 언제나 주님께 충실하며\n저희 자신을 주님께서 기꺼워하시는 제물로 바치게 하소서.\n우리 주 …….","영성체송":"마태 5,10\n행복하여라, 의로움 때문에 박해를 받는 사람들! 하늘 나라가 그들의 것이다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n거룩한 순교자들을 기억하며 하나의 빵을 함께 나누고 간절히 청하오니\n저희가 주님의 사랑 안에서 한마음이 되고\n끝까지 인내하여 영원한 상을 받게 하소서.\n우리 주 …….","오늘의 묵상":"성 안드레아 둥락 사제와 동료 순교자들 기념일인 오늘 복음은 예루살렘 성전의 파괴, 곧 종말에 대한 이야기입니다. 이 기념일과 오늘 복음 내용의 연관성을 묵상하면서 순교는 자신의 삶을 아름다운 돌과 자원 예물로 꾸미는 것이 아니라, 마지막 날에 하느님의 성전이 드러날 수 있도록 ‘나를 허물어 가는 숭고함’이 아닐까 하는 생각이 들었습니다.\n순교는 자신의 목숨으로 하느님을 증언하는 일입니다. 그러한 뜻에서 오늘 우리가 기념하는 순교자들은 하느님을 증언하는 삶으로 우리를 초대합니다. 꼭 목숨을 바쳐서가 아니라, 삶을 통하여 하느님께서 현존하심을 빛으로 드러낸다는 점에서 말입니다. 꼭 피를 흘리지 않아도, 어떤 방식으로든 누군가에게 하느님의 빛을 전한다면 순교자의 삶을 본받으며 사는 것이라고 할 수 있을 것입니다.\n순교자들은 미래에 찾아올 마지막 날을 오늘로 앞당겨 살아간 이들입니다. 그렇다면 우리도 오늘이 남은 인생 가운데 가장 힘 있고 젊은 날임을 생각하며, 미래의 하느님 나라에서 살아가는 사람들처럼 오늘을 보내면 어떨까요?\n그 누구도 아무 의미 없이 자신의 목숨을 잃는 것을 바라지 않습니다. 그러나 저마다 날짜와 시간이 다를 뿐 모두 언젠가는 하느님께 돌아간다는 것을 기억하고, 이 땅에 하느님의 뜻과 구원을 증언하고자 시간과 생명을 바친다면 가장 의미 있는 일이 될 것입니다. 그러한 삶으로 내가 허물어진다 하여도 그것은 결코 나를 잃는 삶이 아닙니다. 이 땅에서 하느님의 성전을 드러내는 삶이며, 우리의 구원은 그 성전 안에서 완성될 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261125":{"d":"2026년 11월 25일 수요일","c":"녹","t":"연중 제34주간 수요일","o":[{"c":"홍","t":"알렉산드리아의 성녀 가타리나 동정 순교자"}],"n":"","g":"","i":"","s":{"입당송":"시편 85(84),9 참조\n당신 백성, 당신께 충실한 이, 당신께 돌아오는 이에게 주님은 진정 평화를 말씀하신다.","본기도":"주님,\n믿는 이들의 마음을 일깨우시어\n저희가 거룩한 구원의 열매를 풍성히 거두며\n주님의 자비로 더욱 큰 은총을 받게 하소서.\n성부와 성령과 …….","제1독서":"<그들은 모세와 어린양의 노래를 부르고 있었습니다.>\n▥ 요한 묵시록의 말씀입니다.\n15,1-4\n나 요한은 1 크고 놀라운 다른 표징이 하늘에 나타난 것을 보았습니다.\n일곱 천사가 마지막 일곱 재앙을 가지고 있었는데,\n그것으로 하느님의 분노가 끝나게 될 것입니다.\n2 나는 또 불이 섞인 유리 바다 같은 것을 보았습니다.\n그 유리 바다 위에는 짐승과 그 상과 그 이름을 뜻하는 숫자를\n무찌르고 승리한 이들이 서 있었습니다. 그들은 하느님의 수금을 들고,\n3 하느님의 종 모세와 어린양의 노래를 부르고 있었습니다.\n“전능하신 주 하느님, 주님께서 하신 일은 크고도 놀랍습니다.\n민족들의 임금님, 주님의 길은 의롭고 참되십니다.\n4 주님, 주님을 경외하지 않을 자 누구이며\n주님의 이름을 찬양하지 않을 자 누구입니까?\n정녕 주님 홀로 거룩하십니다. 모든 민족들이 와서 주님 앞에 경배할 것입니다.\n주님의 의로운 처사가 드러났기 때문입니다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 98(97),1.2-3ㄱㄴ.7-8.9(◎ 묵시 15,3ㄴㄷ 참조)\n◎ 전능하신 주 하느님, 당신이 하신 일 크고도 놀랍사옵니다.\n○ 주님께 노래하여라, 새로운 노래. 그분이 기적들을 일으키셨네. 그분의 오른손이, 거룩한 그 팔이, 승리를 가져오셨네. ◎\n○ 주님은 당신 구원을 알리셨네. 민족들의 눈앞에, 당신 정의를 드러내셨네. 이스라엘 집안을 위하여, 당신 자애와 진실을 기억하셨네. ◎\n○ 소리쳐라, 바다와 그 안에 가득 찬 것들, 누리와 그 안에 사는 것들. 강들은 손뼉 치고, 산들도 함께 환호하여라. ◎\n○ 주님 앞에서 환호하여라. 세상을 다스리러 그분이 오신다. 그분은 누리를 의롭게, 백성들을 올바르게 다스리신다. ◎","복음 환호송":"묵시 2,10 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 너는 죽을 때까지 충실하여라. 내가 생명의 화관을 너에게 주리라.\n◎ 알렐루야.","복음":"<너희는 내 이름 때문에 모든 사람에게 미움을 받을 것이다. 그러나 너희는 머리카락 하나도 잃지 않을 것이다.>\n✠ 루카가 전한 거룩한 복음입니다.\n21,12-19\n그때에 예수님께서 제자들에게 말씀하셨다.\n12 “사람들이 너희에게 손을 대어 박해할 것이다.\n너희를 회당과 감옥에 넘기고,\n내 이름 때문에 너희를 임금들과 총독들 앞으로 끌고 갈 것이다.\n13 이러한 일이 너희에게는 증언할 기회가 될 것이다.\n14 그러나 너희는 명심하여, 변론할 말을 미리부터 준비하지 마라.\n15 어떠한 적대자도 맞서거나 반박할 수 없는 언변과 지혜를\n내가 너희에게 주겠다.\n16 부모와 형제와 친척과 친구들까지도 너희를 넘겨\n더러는 죽이기까지 할 것이다.\n17 그리고 너희는 내 이름 때문에 모든 사람에게 미움을 받을 것이다.\n18 그러나 너희는 머리카락 하나도 잃지 않을 것이다.\n19 너희는 인내로써 생명을 얻어라.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 명에 따라 바치는 이 거룩한 예물을 받으시고\n저희가 언제나 주님의 계명을 지켜\n주님의 사랑에 합당한 제물이 되게 하소서.\n우리 주 …….","영성체송":"시편 117(116),1-2\n주님을 찬양하여라, 모든 민족들아. 우리 위한 주님 사랑 굳건하여라.\n<또는>\n마태 28,20\n주님이 말씀하신다. 보라, 내가 세상 끝 날까지 언제나 너희와 함께 있으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n이 거룩한 제사에서 성체를 모시고 기뻐하오니\n저희가 언제나 하느님 곁에 머무르게 하소서.\n우리 주 …….","오늘의 묵상":"『한국 천주교 예비 신자 교리서』에서는 인간은 본디 ‘종교적 심성’을 지니고 있다고 가르칩니다. 또한 ‘종교’라는 말의 어원에는 ‘다시 묶는다’, ‘다시 잇는다’는 뜻이 있다고 합니다. 종교란 ‘하느님과 인간을 다시 이어 주는 것’으로 이해할 수 있습니다. 따라서 종교적 삶이란 우리가 하느님께 속한 사람들임을 드러내는 삶이라고 할 수 있습니다.\n사실 일상이 평온하고 여유로울 때에는 하느님께 속한 사람임을 드러내기 쉽습니다. 그러나 삶이 힘들고 불행하여 신앙이 짐처럼 느껴질 때에 하느님을 따르기란 매우 어렵습니다.\n오늘 복음에서 예수님께서는 당신께 속한 제자들에게 앞으로 일어날 극한 상황에 대하여 말씀하십니다. 사람들이 박해하고, 심지어는 모든 사람에게 미움을 받는 상황이 생길 것이라고 말이지요. 그러나 예수님께서는 또 분명히 말씀하십니다. “이러한 일이 너희에게는 증언할 기회가 될 것이다”(루카 21,13).\n그러니 삶이 버겁고 지치고, 그래서 예수님이 원망스럽고, 그분을 따르지 못하겠다 싶을 때가 온다면 바로 그때야말로 예수님을 증언할 기회라는 것을 잊지 않으면 좋겠습니다. 아무리 힘든 상황이 찾아오더라도 예수님의 손을 끝까지 놓지 않는다면 예수님께서는 이렇게 말씀하실 것입니다. “누구든지 사람들 앞에서 나를 안다고 증언하면, 나도 하늘에 계신 내 아버지 앞에서 그를 안다고 증언할 것이다”(마태 10,32).\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261126":{"d":"2026년 11월 26일 목요일","c":"녹","t":"연중 제34주간 목요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 85(84),9 참조\n당신 백성, 당신께 충실한 이, 당신께 돌아오는 이에게 주님은 진정 평화를 말씀하신다.","본기도":"주님,\n믿는 이들의 마음을 일깨우시어\n저희가 거룩한 구원의 열매를 풍성히 거두며\n주님의 자비로 더욱 큰 은총을 받게 하소서.\n성부와 성령과 …….","제1독서":"<무너졌다, 대바빌론이!>\n▥ 요한 묵시록의 말씀입니다.\n18,1-2.21-23; 19,1-3.9ㄱㄴ\n나 요한은 1 큰 권한을 가진 다른 천사가 하늘에서 내려오는 것을 보았는데,\n그의 광채로 땅이 환해졌습니다.\n2 그가 힘찬 소리로 외쳤습니다.\n“무너졌다, 무너졌다, 대바빌론이! 바빌론이 마귀들의 거처가 되고\n온갖 더러운 영들의 소굴, 온갖 더러운 새들의 소굴,\n더럽고 미움받는 온갖 짐승들의 소굴이 되고 말았다.”\n21 또 큰 능력을 지닌 한 천사가 맷돌처럼 큰 돌을 들어 바다에 던지며 말하였습니다.\n“큰 도성 바빌론이 이처럼 세차게 던져질 터이니\n다시는 그 모습을 찾아볼 수 없을 것이다.\n22 수금 타는 이들과 노래 부르는 이들,\n피리 부는 이들과 나팔 부는 이들의 소리가 다시는 네 안에서 들리지 않고\n어떠한 기술을 가진 장인도 다시는 네 안에서 찾아볼 수 없으며\n맷돌 소리도 다시는 네 안에서 들리지 않을 것이다.\n23 등불의 빛도 다시는 네 안에서 비치지 않고\n신랑과 신부의 목소리도 다시는 네 안에서 들리지 않을 것이다.\n너의 상인들이 땅의 세력가였기 때문이며\n모든 민족들이 너의 마술에 속아 넘어갔기 때문이다.”\n19,1 그 뒤에 나는 하늘에 있는 많은 무리가 내는 큰 목소리 같은 것을 들었습니다.\n“할렐루야! 구원과 영광과 권능은 우리 하느님의 것.\n2 과연 그분의 심판은 참되고 의로우시다.\n자기 불륜으로 땅을 파멸시킨 대탕녀를 심판하시고\n그 손에 묻은 당신 종들의 피를 되갚아 주셨다.”\n3 그들이 또 말하였습니다.\n“할렐루야! 그 여자가 타는 연기가 영원무궁토록 올라간다.”\n9 또 그 천사가 나에게 말하였습니다.\n“‘어린양의 혼인 잔치에 초대받은 이들은 행복하다.’고 기록하여라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 100(99),1-2.3.4.5(◎ 묵시 19,9ㄴ)\n◎ 어린양의 혼인 잔치에 초대받은 이들은 행복하여라.\n○ 온 세상아, 주님께 환성 올려라. 기뻐하며 주님을 섬겨라. 환호하며 그분 앞에 나아가라. ◎\n○ 너희는 알아라, 주님은 하느님이시다. 그분이 우리를 지으셨으니 우리는 그분의 것, 그분의 백성, 그분 목장의 양 떼라네. ◎\n○ 감사하며 그분 문으로 들어가라. 찬양하며 그분 앞뜰로 들어가라. 그분을 찬송하며 그 이름 찬미하여라. ◎\n○ 주님은 참으로 좋으시고, 그분 자애는 영원하시며, 그분 진실은 대대에 이르신다. ◎","복음 환호송":"루카 21,28 참조\n◎ 알렐루야.\n○ 허리를 펴고 머리를 들어라. 너희의 속량이 가까웠다.\n◎ 알렐루야.","복음":"<예루살렘은 다른 민족들의 시대가 다 찰 때까지 그들에게 짓밟힐 것이다.>\n✠ 루카가 전한 거룩한 복음입니다.\n21,20-28\n그때에 예수님께서 제자들에게 말씀하셨다.\n20 “예루살렘이 적군에게 포위된 것을 보거든,\n그곳이 황폐해질 때가 가까이 왔음을 알아라.\n21 그때에 유다에 있는 이들은 산으로 달아나고,\n예루살렘에 있는 이들은 거기에서 빠져나가라.\n시골에 있는 이들은 예루살렘으로 들어가지 마라.\n22 그때가 바로 성경에 기록된 모든 말씀이 이루어지는 징벌의 날이기 때문이다.\n23 불행하여라, 그 무렵에 임신한 여자들과 젖먹이가 딸린 여자들!\n이 땅에 큰 재난이, 이 백성에게 진노가 닥칠 것이기 때문이다.\n24 사람들은 칼날에 쓰러지고 포로가 되어 모든 민족들에게 끌려갈 것이다.\n그리고 예루살렘은 다른 민족들의 시대가 다 찰 때까지\n그들에게 짓밟힐 것이다.\n25 그리고 해와 달과 별들에는 표징들이 나타나고,\n땅에서는 바다와 거센 파도 소리에 자지러진 민족들이 공포에 휩싸일 것이다.\n26 사람들은 세상에 닥쳐오는 것들에 대한 두려운 예감으로 까무러칠 것이다.\n하늘의 세력들이 흔들릴 것이기 때문이다.\n27 그때에 ‘사람의 아들이’ 권능과 큰 영광을 떨치며\n‘구름을 타고 오는 것을’ 사람들이 볼 것이다.\n28 이러한 일들이 일어나기 시작하거든 허리를 펴고 머리를 들어라.\n너희의 속량이 가까웠기 때문이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 명에 따라 바치는 이 거룩한 예물을 받으시고\n저희가 언제나 주님의 계명을 지켜\n주님의 사랑에 합당한 제물이 되게 하소서.\n우리 주 …….","영성체송":"시편 117(116),1-2\n주님을 찬양하여라, 모든 민족들아. 우리 위한 주님 사랑 굳건하여라.\n<또는>\n마태 28,20\n주님이 말씀하신다. 보라, 내가 세상 끝 날까지 언제나 너희와 함께 있으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n이 거룩한 제사에서 성체를 모시고 기뻐하오니\n저희가 언제나 하느님 곁에 머무르게 하소서.\n우리 주 …….","오늘의 묵상":"일반적으로 네 복음서 가운데 루카 복음서가 하느님께서 자비하심을 가장 잘 드러낸다고 알려져 있습니다. 특히 루카 복음서 15장에 나오는 ‘되찾은 아들의 비유’에는 하느님의 자비가 잘 표현되어 있습니다. 그런데 21장은 예수님께서 앞으로 펼쳐질 굉장히 두렵고 혼란스러운 상황, 곧 ‘징벌의 날’에 대하여 경고하시는 내용으로 하느님의 자비와는 거리가 멀어 보입니다.\n그러나 우리가 오늘 복음에 나오는 “이러한 일들이 일어나기 시작하거든 허리를 펴고 머리를 들어라. 너희의 속량이 가까웠기 때문이다.”(루카 21,28)라는 구절을 기억한다면 이 ‘징벌의 날’에도 하느님의 자비로우신 얼굴을 희망할 수 있게 됩니다. ‘징벌의 날’이란 단순히 하느님의 진노가 내리는 날을 뜻하는 것이 아니라, 하느님의 자비와 정의가 함께 드러나고 이를 통하여 인간의 역사가 완성되는 날을 뜻하기 때문입니다.\n머리를 숙인다는 것은 떳떳하지 못해서 자신이 받을 벌을 두려워하는 사람들이 보이는 행동입니다. 그러나 오늘 복음 속 예수님께서는 우리에게 그러한 날이 오더라도 허리를 펴고 머리를 들라고 말씀하십니다.\n이처럼 신앙인은 종말이 우리에게는 일어나지 않으리라고 믿는 사람이 아니라, 그 순간에도 우리를 저버리시지 않을 자비의 하느님을 보고자 허리를 펴고 머리를 드는 사람들입니다. 믿음이 없는 사람에게 종말은 두려움이지만, 믿는 우리에게는 구원의 완성을 향한 희망이기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261127":{"d":"2026년 11월 27일 금요일","c":"녹","t":"연중 제34주간 금요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 85(84),9 참조\n당신 백성, 당신께 충실한 이, 당신께 돌아오는 이에게 주님은 진정 평화를 말씀하신다.","본기도":"주님,\n믿는 이들의 마음을 일깨우시어\n저희가 거룩한 구원의 열매를 풍성히 거두며\n주님의 자비로 더욱 큰 은총을 받게 하소서.\n성부와 성령과 …….","제1독서":"<그들은 저마다 자기 행실에 따라 심판을 받았습니다. 나는 새 예루살렘이 하늘로부터 내려오는 것을 보았습니다.>\n▥ 요한 묵시록의 말씀입니다.\n20,1-4.11―21,2\n나 요한은 1 한 천사가 하늘에서 내려오는 것을 보았습니다.\n그는 지하의 열쇠와 큰 사슬을 손에 들고 있었습니다.\n2 그 천사가 용을, 곧 악마이며 사탄인 그 옛날의 뱀을 붙잡아\n천 년 동안 움직이지 못하도록 결박하였습니다.\n3 그리고 그를 지하로 던지고서는 그곳을 잠그고 그 위에다 봉인을 하여,\n천 년이 끝날 때까지 다시는 민족들을 속이지 못하게 하였습니다.\n그 뒤에 사탄은 잠시 풀려나게 되어 있습니다.\n4 나는 또 어좌들을 보았는데, 그 위에 앉은 이들에게 심판할 권한이 주어졌습니다.\n그리고 예수님에 대한 증언과 하느님의 말씀 때문에\n목이 잘린 이들의 영혼을 보았습니다.\n그들은 그 짐승이나 그의 상에 경배하지도 않고\n이마와 손에 표를 받지도 않은 사람들입니다.\n그들은 살아나서 그리스도와 함께 천 년 동안 다스렸습니다.\n11 나는 또 크고 흰 어좌와 그 위에 앉아 계신 분을 보았습니다.\n땅과 하늘이 그분 앞에서 달아나 그 흔적조차 찾을 수가 없었습니다.\n12 그리고 죽은 이들이 높은 사람 낮은 사람 할 것 없이\n모두 어좌 앞에 서 있는 것을 보았습니다. 책들이 펼쳐졌습니다.\n또 다른 책 하나가 펼쳐졌는데, 그것은 생명의 책이었습니다.\n죽은 이들은 책에 기록된 대로 자기들의 행실에 따라 심판을 받았습니다.\n13 바다가 그 안에 있는 죽은 이들을 내놓고,\n죽음과 저승도 그 안에 있는 죽은 이들을 내놓았습니다.\n그들은 저마다 자기 행실에 따라 심판을 받았습니다.\n14 그리고 죽음과 저승이 불 못에 던져졌습니다. 이 불 못이 두 번째 죽음입니다.\n15 생명의 책에 기록되어 있지 않은 사람은 누구나 불 못에 던져졌습니다.\n21,1 나는 또 새 하늘과 새 땅을 보았습니다.\n첫 번째 하늘과 첫 번째 땅은 사라지고 바다도 더 이상 없었습니다.\n2 그리고 거룩한 도성 새 예루살렘이 신랑을 위하여 단장한 신부처럼 차리고\n하늘로부터 하느님에게서 내려오는 것을 보았습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 84(83),3.4.5와 6과 8ㄱ(◎ 묵시 21,3ㄴ 참조)\n◎ 보라, 하느님의 거처는 사람들 가운데에 있다.\n○ 주님의 뜨락을 그리워하며, 이 영혼 여위어 가나이다. 살아 계신 하느님을 향하여, 이 몸과 이 마음 환성을 올리나이다. ◎\n○ 당신 제단 곁에 참새도 집을 짓고, 제비도 둥지를 틀어, 거기에 새끼를 치나이다. 만군의 주님, 저의 임금님, 저의 하느님! ◎\n○ 행복하옵니다, 당신 집에 사는 이들! 그들은 영원토록 당신을 찬양하리이다. 행복하옵니다, 당신께 힘을 얻는 사람들! 그들은 더욱더 힘차게 나아가리이다. ◎","복음 환호송":"루카 21,28 참조\n◎ 알렐루야.\n○ 허리를 펴고 머리를 들어라. 너희의 속량이 가까웠다.\n◎ 알렐루야.","복음":"<너희는 이러한 일들이 일어나는 것을 보거든 하느님의 나라가 가까이 온 줄 알아라.>\n✠ 루카가 전한 거룩한 복음입니다.\n21,29-33\n그때에 예수님께서는 제자들에게\n29 비유 하나를 말씀하셨다.\n“무화과나무와 다른 모든 나무를 보아라.\n30 잎이 돋자마자,\n너희는 그것을 보고 여름이 이미 가까이 온 줄을 저절로 알게 된다.\n31 이와 같이 너희도 이러한 일들이 일어나는 것을 보거든,\n하느님의 나라가 가까이 온 줄 알아라.\n32 내가 진실로 너희에게 말한다.\n이 세대가 지나기 전에 모든 일이 일어날 것이다.\n33 하늘과 땅은 사라질지라도 내 말은 결코 사라지지 않을 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 명에 따라 바치는 이 거룩한 예물을 받으시고\n저희가 언제나 주님의 계명을 지켜\n주님의 사랑에 합당한 제물이 되게 하소서.\n우리 주 …….","영성체송":"시편 117(116),1-2\n주님을 찬양하여라, 모든 민족들아. 우리 위한 주님 사랑 굳건하여라.\n<또는>\n마태 28,20\n주님이 말씀하신다. 보라, 내가 세상 끝 날까지 언제나 너희와 함께 있으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n이 거룩한 제사에서 성체를 모시고 기뻐하오니\n저희가 언제나 하느님 곁에 머무르게 하소서.\n우리 주 …….","오늘의 묵상":"철학에서 ‘변화한다’는 말에는 ‘아직 완전하지 않음’ 또는 ‘영원하지 않음’이라는 뜻이 담겨 있습니다. 변화는 아직 완전하지 않기 때문에 완전해지고자 더 좋아지는 방향으로 움직이거나 완전해지는 방향이 아닌 소멸하는 방향으로 진행됩니다. 그래서 우리는 신앙 안에서 가장 완전하시고 영원하신 하느님만이 ‘불변하시는 분’이라고 고백합니다.\n오늘 복음에서도 예수님께서는 “하늘과 땅은 사라질지라도 내 말은 결코 사라지지 않을 것이다.”(루카 21,33)라고 말씀하십니다. 이 말씀은 세상 모든 것이 변하고, 또한 언젠가 소멸할지라도, 하느님의 말씀 그 자체이신 예수님께서는 영원히 살아 계시며 하느님 나라를 다스리실 것이라는 뜻입니다.\n전례력으로 한 해를 마무리하는 요즘, 우리가 가져야 할 희망은 바로 이것입니다. 지금 우리가 사는 이 땅, 그리고 우리 육신은 언젠가 사라질지라도, 우리가 부활하여 예수님과 함께 영원한 하느님 나라로 가게 되면, 우리의 생명과 행복 또한 결코 사라지지 않고 영원할 것이라는 희망입니다.\n영원하지 않은 것은 우리 마음을 이곳저곳으로 흔들지만, 영원한 하느님의 말씀은 우리 마음을 갈림 없이 굳건하게 합니다. 언젠가 사라져 버릴 것에 마음을 두면 우리에게 남는 것은 두려움이지만, 영원하신 하느님께 눈길을 돌리면 희망이 찾아옵니다. 그러니 세상이 아니라 불변하시는 하느님, 영원하신 하느님께만 우리의 희망을 둘 수 있으면 좋겠습니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261128":{"d":"2026년 11월 28일 토요일","c":"녹","t":"연중 제34주간 토요일","o":[{"c":"백","t":"복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"시편 85(84),9 참조\n당신 백성, 당신께 충실한 이, 당신께 돌아오는 이에게 주님은 진정 평화를 말씀하신다.","본기도":"주님,\n믿는 이들의 마음을 일깨우시어\n저희가 거룩한 구원의 열매를 풍성히 거두며\n주님의 자비로 더욱 큰 은총을 받게 하소서.\n성부와 성령과 …….","제1독서":"<다시는 밤이 없습니다. 주님께서 그들의 빛이 되어 주실 것이기 때문입니다.>\n▥ 요한 묵시록의 말씀입니다.\n22,1-7\n주님의 천사는 수정처럼 빛나는 생명수의 강을\n나 요한에게 1 보여 주었습니다.\n그 강은 하느님과 어린양의 어좌에서 나와,\n2 도성의 거리 한가운데를 흐르고 있었습니다.\n강 이쪽저쪽에는 열두 번 열매를 맺는 생명나무가 있어서\n다달이 열매를 내놓습니다.\n그리고 그 나뭇잎은 민족들을 치료하는 데에 쓰입니다.\n3 그곳에는 더 이상 하느님의 저주를 받는 것이 없을 것입니다.\n도성 안에는 하느님과 어린양의 어좌가 있어,\n그분의 종들이 그분을 섬기며 4 그분의 얼굴을 뵐 것입니다.\n그리고 그들의 이마에는 그분의 이름이 적혀 있을 것입니다.\n5 다시는 밤이 없고 등불도 햇빛도 필요 없습니다.\n주 하느님께서 그들의 빛이 되어 주실 것이기 때문입니다.\n그들은 영원무궁토록 다스릴 것입니다.\n6 그 천사가 또 나에게 말하였습니다.\n“이 말씀은 확실하고 참된 말씀이다.\n주님, 곧 예언자들에게 영을 내려 주시는 하느님께서\n머지않아 반드시 일어날 일들을 당신 종들에게 보여 주시려고\n당신 천사를 보내신 것이다.\n7 보라, 내가 곧 간다.\n이 책에 기록된 예언의 말씀을 지키는 사람은 행복하다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 95(94),1-2.3-5.6-7ㄱㄴㄷ(◎ 1코린 16,22ㄴ과 묵시 22,20ㄷ)\n◎ 마라나 타! 오소서, 주 예수님!\n○ 어서 와 주님께 노래 부르세. 구원의 바위 앞에 환성 올리세. 감사하며 그분 앞에 나아가세. 노래하며 그분께 환성 올리세. ◎\n○ 주님은 위대하신 하느님, 모든 신들보다 위대하신 임금님. 땅속 깊은 곳도 그분 손안에. 높은 산봉우리도 그분 것이네. 바다도 그분 것, 몸소 만드셨네. 마른땅도 당신 손수 빚으셨네. ◎\n○ 어서 와 엎드려 경배드리세. 우리를 내신 주님 앞에 무릎 꿇으세. 그분은 우리의 하느님, 우리는 그분 목장의 백성, 그분 손이 이끄시는 양 떼로세. ◎","복음 환호송":"루카 21,36 참조\n◎ 알렐루야.\n○ 너희는 사람의 아들 앞에 설 수 있도록 늘 깨어 기도하여라.\n◎ 알렐루야.","복음":"<너희는 앞으로 일어날 이 모든 일에서 벗어날 수 있도록 깨어 있어라.>\n✠ 루카가 전한 거룩한 복음입니다.\n21,34-36\n그때에 예수님께서 제자들에게 말씀하셨다.\n34 “너희는 스스로 조심하여,\n방탕과 만취와 일상의 근심으로\n너희 마음이 물러지는 일이 없게 하여라.\n그리고 그날이 너희를 덫처럼 갑자기 덮치지 않게 하여라.\n35 그날은 온 땅 위에 사는 모든 사람에게 들이닥칠 것이다.\n36 너희는 앞으로 일어날 이 모든 일에서 벗어나\n사람의 아들 앞에 설 수 있는 힘을 지니도록\n늘 깨어 기도하여라.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 명에 따라 바치는 이 거룩한 예물을 받으시고\n저희가 언제나 주님의 계명을 지켜\n주님의 사랑에 합당한 제물이 되게 하소서.\n우리 주 …….","영성체송":"시편 117(116),1-2\n주님을 찬양하여라, 모든 민족들아. 우리 위한 주님 사랑 굳건하여라.\n<또는>\n마태 28,20\n주님이 말씀하신다. 보라, 내가 세상 끝 날까지 언제나 너희와 함께 있으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n이 거룩한 제사에서 성체를 모시고 기뻐하오니\n저희가 언제나 하느님 곁에 머무르게 하소서.\n우리 주 …….","오늘의 묵상":"교구청에 같이 사는 신부님들이 제 방에 커피를 마시러 자주 찾아오시기 때문에 전날 손님을 맞이할 준비를 해 두는 습관이 생겼습니다. 방이 정리되어 있지 않고 준비되지 않은 채로 누군가 갑자기 방문하면 부담스럽지만, 모든 것을 미리 준비해 두면 신부님들과 담소를 나누는 그 시간이 기다려지기 때문입니다.\n오늘 복음에서 예수님께서는 우리에게 마지막 날이 갑자기 덮치지 않게 하라고 권고하십니다. 그리고 그날을 미리 준비하라는 뜻으로 “너희는 앞으로 일어날 이 모든 일에서 벗어나 사람의 아들 앞에 설 수 있는 힘을 지니도록 늘 깨어 기도하여라.”(루카 21,36)라고 말씀하십니다. 예수님의 이 말씀을 묵상하면서 모든 일에서 벗어나 기도하여라는 말씀에 집중해 보았습니다.\n마지막 날에 다시 오실 예수님을 맞이하려면 지금부터 우리를 둘러싼 세상의 근심스러운 일들과 영적 게으름에서 멀어져야 합니다. 이는 세상의 일과 현실에 무관심해야 한다는 뜻이 아닙니다. 사실 우리는 생각보다 많은 일을 미리 걱정합니다. 그러나 실제로 일어나는 일은 그 가운데 극히 일부입니다. 따라서 일어나지도 않을 일에 미리 마음을 쓰기보다는 그 마음의 눈을 돌려 기도하며 하느님께 집중해야 합니다.\n세상이 주는 혼란에서 벗어나 하느님께 마음을 모으는 사람은 그날이 갑자기 오더라도 당황하지 않고, 하느님 앞에 당당히 설 그 시간을 손꼽아 기다리는 사람이 될 것입니다. 깨어 기도하는 사람은 아직 오지 않은 세상의 두려움에 사로잡히기보다 분명히 다가올 마지막 날을 당당히 맞이할 준비를 할 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261129":{"d":"2026년 11월 29일 일요일","c":"자","t":"대림 제1주일","o":[],"n":"","g":"신경 · 교중","i":"","s":{"오늘 전례":"오늘은 전례력으로 새해를 시작하는 대림 제1주일입니다. 하느님 아버지께서는 우리를 언제나 한결같이 기억하시고 아버지의 풍요로운 은총의 손길을 펼치십니다. 우리 모두 사랑을 실천하며, 영광스럽게 다시 오실 아드님, 구세주 예수 그리스도를 깨어 기다립시다.","입당송":"시편 25(24),1-3 참조\n하느님, 당신께 제 영혼 들어 올리나이다. 저의 하느님, 당신께 저를 맡기오니 수치를 당하지 않게 하소서. 원수들이 저를 보고 좋아라 날뛰지 못하게 하소서. 당신께 바라는 이는 아무도 수치를 당하지 않으리이다.","본기도":"전능하신 하느님, 저희 마음을 이끄시어\n저희가 이 세상에서 옳은 일을 하며\n다시 오시는 그리스도를 맞이하게 하시고\n마침내 하늘 나라에 들어가 그리스도 곁에서 영광을 누리게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<아, 주님께서 하늘을 찢고 내려오신다면!>\n▥ 이사야서의 말씀입니다.\n63,16ㄹ-17.19ㄷㄹ; 64,2ㄴ-7\n16 주님, 당신만이 저희 아버지시고\n예로부터 당신 이름은 ‘우리의 구원자’이십니다.\n17 주님, 어찌하여 저희를 당신의 길에서 벗어나게 하십니까?\n어찌하여 저희 마음이 굳어져 당신을 경외할 줄 모르게 만드십니까?\n당신 종들을 생각하시어,\n당신의 재산인 이 지파들을 생각하시어 돌아오소서.\n19 아, 당신께서 하늘을 찢고 내려오신다면!\n당신 앞에서 산들이 뒤흔들리리이다.\n64,2 당신께서 내려오셨을 때 산들이 당신 앞에서 뒤흔들렸습니다.\n3 당신 아닌 다른 신이 자기를 고대하는 이들을 위하여 이런 일을 한다는 것은\n예로부터 아무도 들어 보지 못하였고 아무도 귀로 듣지 못하였으며\n어떠한 눈도 보지 못하였습니다.\n4 당신께서는 의로운 일을 즐겨 하는 이들을,\n당신의 길을 걸으며 당신을 기억하는 이들을 받아들이셨습니다.\n그러나 저희는 죄를 지었고 당신께서는 진노하셨습니다.\n당신의 길 위에서 저희가 늘 구원을 받았건만\n5 이제 저희는 모두 부정한 자처럼 되었고\n저희의 의로운 행동이라는 것들도 모두 개짐과 같습니다.\n저희는 모두 나뭇잎처럼 시들어\n저희의 죄악이 바람처럼 저희를 휩쓸어 갔습니다.\n6 당신 이름 부르며 경배드리는 자 없고\n당신을 붙잡으려고 움직이는 자도 없습니다.\n당신께서 저희를 외면하시고\n저희 죄악의 손에 내버리셨기 때문입니다.\n7 그러나 주님, 당신은 저희 아버지십니다.\n저희는 진흙, 당신은 저희를 빚으신 분\n저희는 모두 당신 손의 작품입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 80(79),2ㄱㄷㄹ과 3ㄴㄷ.15-16.18-19(◎ 4)\n◎ 하느님, 저희를 다시 일으켜 주소서. 당신 얼굴을 비추소서. 저희가 구원되리이다.\n○ 이스라엘의 목자시여, 귀를 기울이소서. 커룹들 위에 좌정하신 분, 광채와 함께 나타나소서. 당신 권능을 떨치시어 저희를 도우러 오소서. ◎\n○ 만군의 하느님, 어서 돌아오소서. 하늘에서 굽어살피시고 이 포도나무를 찾아오소서. 당신 오른손이 심으신 나뭇가지를, 당신 위해 키우신 아들을 찾아오소서. ◎\n○ 당신 오른쪽에 있는 사람에게, 당신 위해 키우신 인간의 아들에게 손을 얹으소서. 저희는 당신을 떠나지 않으오리다. 저희를 살려 주소서. 당신 이름을 부르오리다. ◎","제2독서":"<우리 주 예수 그리스도께서 나타나시기를 기다리고 있습니다.>\n▥ 사도 바오로의 코린토 1서 말씀입니다.\n1,3-9\n형제 여러분,\n3 하느님 우리 아버지와 주 예수 그리스도에게서\n은총과 평화가 여러분에게 내리기를 빕니다.\n4 나는 하느님께서 그리스도 예수님 안에서 여러분에게 베푸신 은총을 생각하며,\n여러분을 두고 늘 나의 하느님께 감사를 드립니다.\n5 여러분은 그리스도 안에서 어느 모로나 풍요로워졌습니다.\n어떠한 말에서나 어떠한 지식에서나 그렇습니다.\n6 그리스도에 관한 증언이 여러분 가운데에 튼튼히 자리를 잡은 것입니다.\n7 그리하여 여러분은 어떠한 은사도 부족함이 없이,\n우리 주 예수 그리스도께서 나타나시기를 기다리고 있습니다.\n8 그분께서는 또한 여러분을 끝까지 굳세게 하시어,\n우리 주 예수 그리스도의 날에 흠잡을 데가 없게 해 주실 것입니다.\n9 하느님은 성실하신 분이십니다.\n그분께서 당신의 아드님 우리 주 예수 그리스도와 친교를 맺도록\n여러분을 불러 주셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"시편 85(84),8\n◎ 알렐루야.\n○ 주님, 저희에게 당신 자애를 보여 주시고 당신 구원을 베풀어 주소서.\n◎ 알렐루야.","복음":"<집주인이 언제 돌아올지 모르니 깨어 있어라.>\n✠ 마르코가 전한 거룩한 복음입니다.\n13,33-37\n그때에 예수님께서 제자들에게 말씀하셨다.\n33 “너희는 조심하고 깨어 지켜라. 그때가 언제 올지 너희가 모르기 때문이다.\n34 그것은 먼 길을 떠나는 사람의 경우와 같다.\n그는 집을 떠나면서 종들에게 권한을 주어 각자에게 할 일을 맡기고,\n문지기에게는 깨어 있으라고 분부한다.\n35 그러니 깨어 있어라.\n집주인이 언제 돌아올지, 저녁일지, 한밤중일지,\n닭이 울 때일지, 새벽일지 너희가 모르기 때문이다.\n36 주인이 갑자기 돌아와 너희가 잠자는 것을 보는 일이 없게 하여라.\n37 내가 너희에게 하는 이 말은 모든 사람에게 하는 말이다. 깨어 있어라.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n인류의 빛이신 주님, 대림 시기를 시작하는 교회를 굽어살피시어, 어둠의 행실을 벗어 버리고 빛의 갑옷을 입고, 깨끗한 마음으로 구세주를 기다리게 하소서.\n\n2. 경제인들을 위하여 기도합시다.\n\n인도자이신 주님, 인공 지능의 개발로 사회가 급속하게 바뀌어 가는 가운데 경제인들이 오직 이윤만을 좇지 않고 인간 존중과 공동선을 먼저 생각하며, 기술 발전의 결실을 소외된 이웃과 나눌 수 있도록 이끌어 주소서.\n\n3. 질병으로 고통받는 노인들을 위하여 기도합시다.\n\n치유의 주님, 질병과 외로움으로 힘들게 지내는 노인들을 살피시어, 그들을 몸소 위로하시고, 가족과 이웃의 보살핌 속에서 삶에 대한 희망을 잃지 않게 하소서.\n\n4. 본당 사도직 단체들을 위하여 기도합시다.\n\n사랑이신 주님, 주님 이름으로 모인 본당 단체들을 굽어살피시어, 자신들의 활동으로 주님의 말씀과 사랑이 전파됨을 깨닫고, 서로 화목하며 기쁜 마음으로 활동하게 하소서.","예물 기도":"주님, 저희에게 온갖 선물을 베풀어 주셨으니\n그 가운데에서 저희가 모아 바치는 이 제물을 받아들이시고\n현세에서 저희 믿음을 북돋아 주시어\n후세에서 영원한 구원의 상급을 받게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"시편 85(84),13\n주님이 복을 베푸시어, 우리 땅이 열매를 내리라.","영성체 후 묵상":"“내가 너희에게 하는 이 말은 모든 사람에게 하는 말이다. 깨어 있어라.” 예수님께서는 우리에게 깨어 있으라고 거듭 말씀하십니다. 우리는 주님의 작품입니다. 우리에게 넘치도록 은총을 베푸시는 하느님께 감사드리며, 예수 그리스도의 성탄을 깨어 기다립시다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 이 성찬에 참여한 저희가\n덧없이 지나가는 현세를 살면서도\n지금부터 천상 양식에 맛들여 영원한 것을 사랑하게 하소서.\n우리 주 그리스도를 통하여 비나이다.","오늘의 묵상":"오늘 우리는 대림 제1주일을 보내고 있습니다. 전례력으로 한 해를 다시 새롭게 시작하는 이날에, 예수님께서는 우리에게 늘 깨어 있으라고 여러 차례 강조하여 말씀하십니다. 여기서 깨어 있다는 말은 단순히 잠들지 않은 상태가 아니라 정신을 차리고 늘 주의 깊게 살피는 상태를 뜻합니다.\n학생 시절, 새 학기가 시작되면 열심히 공부하겠다고 다짐하면서 교과서에 열심히 밑줄을 쳤습니다. 그런데 교과서의 앞부분은 밑줄도 많고 열심히 공부한 티가 나지만, 뒤로 갈수록 깨끗하였던 기억이 납니다. 처음의 다짐이 무뎌졌던 것이지요. 이처럼 우리에게 무엇인가가 새롭게 주어지면 처음에는 신선하지만, 점차 일상의 반복에 가려지면서 그 신선함은 무심함으로 변하기 쉽습니다.\n오늘 예수님께서 우리에게 깨어 있으라고 하신 말씀, 곧 정신을 차리고 늘 주의 깊게 살피라는 말씀은 날마다 되풀이되는 일상에서 하느님의 손길을 새롭게 느끼고 그분의 목소리를 새롭게 들어야 한다는 말씀입니다. 오늘 우리가 받은 새로움을 날마다 간직하라는 것입니다.\n하느님께서는 오늘 우리에게 다시 새로운 한 해를 선물로 주셨습니다. 이 새로움을 익숙함과 무심함으로 물들이지 않도록 주님과 함께 깨어 있기를 다짐합시다. 깨어 있지 않은 사람에게는 오늘이 익숙한 어제의 되풀이일 뿐이지만, 깨어 있는 사람에게는 하느님께서 또 다시 새롭게 찾아오시는 자리가 될 것이기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261130":{"d":"2026년 11월 30일 월요일","c":"홍","t":"성 안드레아 사도 축일","o":[],"n":"","g":"대영광송","i":"안드레아 사도는 예수님의 열두 제자 가운데 한 사람으로 베드로 사도의 동생이다. 갈릴래아의 벳사이다에서 태어난 그는 형과 함께 고기잡이를 하던 어부였다(마태 4,18 참조). 안드레아 사도는 세례자 요한의 제자였고 그리스도를 따랐으며 자신의 형 베드로를 예수님께 이끌었다(요한 1,40-42 참조). 그는 그리스 북부 지방에서 복음을 전파한 것으로 전해지며, 십자가 위에서 순교하였다고 알려져 있다.","s":{"입당송":"마태 4,18-19 참조\n주님이 갈릴래아 호숫가에서 베드로와 안드레아 형제를 보시고 부르셨다. 나를 따라오너라. 내가 너희를 사람 낚는 어부로 만들리라.","본기도":"주님,\n지극히 높으신 주님께 간절히 비오니\n일찍이 복된 안드레아 사도가 주님의 교회를 가르치고 다스렸듯이\n이제는 주님 곁에서 저희를 위하여 영원한 전구자가 되게 하소서.\n성부와 성령과 …….","제1독서":"<믿음은 들음에서 오고 들음은 그리스도의 말씀으로 이루어집니다.>\n▥ 사도 바오로의 로마서 말씀입니다.\n10,9-18\n형제 여러분, 9 예수님은 주님이시라고 입으로 고백하고\n하느님께서 예수님을 죽은 이들 가운데에서 일으키셨다고\n마음으로 믿으면 구원을 받을 것입니다.\n10 곧 마음으로 믿어 의로움을 얻고, 입으로 고백하여 구원을 얻습니다.\n11 성경도 “그를 믿는 이는 누구나\n부끄러운 일을 당하지 않으리라.” 하고 말합니다.\n12 유다인과 그리스인 사이에 차별이 없습니다.\n같은 주님께서 모든 사람의 주님으로서,\n당신을 받들어 부르는 모든 이에게 풍성한 은혜를 베푸십니다.\n13 과연 “주님의 이름을 받들어 부르는 이는\n모두 구원을 받을 것입니다.”\n14 그런데 자기가 믿지 않는 분을 어떻게 받들어 부를 수 있겠습니까?\n자기가 들은 적이 없는 분을 어떻게 믿을 수 있겠습니까?\n선포하는 사람이 없으면 어떻게 들을 수 있겠습니까?\n15 파견되지 않았으면 어떻게 선포할 수 있겠습니까?\n이는 성경에 기록된 그대로입니다.\n“기쁜 소식을 전하는 이들의 발이 얼마나 아름다운가!”\n16 그러나 모든 사람이 복음에 순종한 것은 아닙니다.\n사실 이사야도 “주님, 저희가 전한 말을 누가 믿었습니까?” 하고 말합니다.\n17 그러므로 믿음은 들음에서 오고\n들음은 그리스도의 말씀으로 이루어집니다.\n18 그러나 나는 묻습니다.\n그들이 들은 적이 없다는 것입니까?\n물론 들었습니다.\n“그들의 소리는 온 땅으로, 그들의 말은 누리 끝까지 퍼져 나갔다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 19(18),2-3.4-5ㄱㄴ(◎ 5ㄱ)\n◎ 그 소리 온 누리에 퍼져 나가네.\n○ 하늘은 하느님의 영광을 말하고, 창공은 그분의 솜씨를 알리네. 낮은 낮에게 말을 건네고, 밤은 밤에게 앎을 전하네. ◎\n○ 말도 없고 이야기도 없으며, 목소리조차 들리지 않지만, 그 소리 온 누리에 퍼져 나가고, 그 말은 땅끝까지 번져 나가네. ◎","복음 환호송":"마태 4,19 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 나를 따라오너라. 내가 너희를 사람 낚는 어부로 만들리라.\n◎ 알렐루야.","복음":"<그들은 곧바로 그물을 버리고 예수님을 따랐다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n4,18-22\n그때에 18 예수님께서는 갈릴래아 호숫가를 지나가시다가\n두 형제, 곧 베드로라는 시몬과 그의 동생 안드레아가\n호수에 어망을 던지는 것을 보셨다.\n그들은 어부였다.\n19 예수님께서 그들에게 이르셨다.\n“나를 따라오너라. 내가 너희를 사람 낚는 어부로 만들겠다.”\n20 그러자 그들은 곧바로 그물을 버리고 예수님을 따랐다.\n21 거기에서 더 가시다가 예수님께서 다른 두 형제,\n곧 제베대오의 아들 야고보와 그의 동생 요한이 배에서\n아버지 제베대오와 함께 그물을 손질하는 것을 보시고 그들을 부르셨다.\n22 그들은 곧바로 배와 아버지를 버려두고 그분을 따랐다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"전능하신 하느님,\n복된 안드레아 축일에 바치는 이 예물을 기꺼이 받으시어\n저희가 자신을 제물로 바치고 영원한 생명을 얻게 하소서.\n우리 주 …….","감사송":"<사도 감사송 1 : 하느님 백성의 목자인 사도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n영원한 목자이신 아버지께서는 양 떼를 버려두지 않으시고\n끊임없이 보호하며 지켜 주시려고\n복된 사도들을 목자로 세우시어\n성자를 대리하여 양 떼를 다스리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<사도 감사송 2 : 교회의 기초이며 증거자인 사도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사도들을 기초로 삼아 그 위에 교회를 세우시어\n지상에서 주님의 거룩하고 영원한 표지가 되게 하시고\n모든 사람에게 구원의 복음을 전하게 하셨나이다.\n그러므로 이제와 영원히 모든 천사와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"요한 1,41-42 참조\n안드레아는 자기 형 시몬에게 “우리는 그리스도라 불리는 메시아를 만났소.” 하고 그를 예수님께 데려갔다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 거룩한 성사로 저희에게 힘을 주시어\n저희가 복된 안드레아 사도를 본받아\n언제나 그리스도의 십자가를 지고 살다가\n그와 함께 영원한 생명을 얻게 하소서.\n성자께서는 영원히 …….","오늘의 묵상":"오늘은 성 안드레아 사도 축일로 오늘 복음에는 사도들이 예수님의 부르심을 받는 장면이 나옵니다. 이 장면에서 사도들은 그물과 배 그리고 아버지를 “버려두고”(마태 4,22) 예수님을 따랐다는 표현이 나옵니다. 여기서 ‘버린다’는 말은 더 이상 필요하지 않기에 버려서 없앤다는 뜻이라기보다, 두 손에 꼭 붙잡고 있던 것을 놓아둔다는 뜻입니다. 필요하지 않은 것을 꼭 붙들고 있는 사람은 없습니다. 두 손으로 꼭 붙잡고 있는 것은 자신의 삶에서 아주 중요하다고 여기는 것입니다.\n사도들이 자신의 삶에서 중요하게 여기던 가치들임에도 온전히 내려놓은 까닭은, 그들의 삶 자체를 중요하게 만드실 예수님을 만났기 때문입니다. 이처럼 예수님을 만나고 그분을 따른다는 것은 삶의 방식을 조금 바꾸는 것이 아니라 삶 전체를 다시 쓰는 사건입니다. 그렇기에 예수님을 진심으로 만나고 마음을 다하여 그분을 따르는 사람은 이전과 같은 방식으로 살아가지 않습니다.\n오늘 복음 속 사도들의 모습처럼, 예수님을 따르는 이들은 자기에게 중요한 것들을 포기함에 초점을 두기보다, 부르심을 받은 사람으로서 어떻게 살아가야 하는지를 새롭게 발견하는 것에 초점을 둡니다. 삶을 둘러싸고 있는 여러 포장지를 중요하게 여기는 것이 아니라 삶 그 자체를 의미 있게 만드는 것이 예수님을 따를 때 주어지는 선물입니다.\n오늘도 예수님께서는 “나를 따라오너라.”(4,19)라고 말씀하시며, 우리를 부르십니다. 예수님을 따를 때 우리는 많은 것을 잃는 것처럼 느낄 수 있지만, 결국 가장 소중한 것을 얻게 됩니다. 바로 구원이라는 열매입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261201":{"d":"2026년 12월 01일 화요일","c":"자","t":"대림 제1주간 화요일","o":[],"n":"","g":"","i":"","s":{"입당송":"즈카 14,5.7 참조\n보라, 주님이 거룩한 이들을 모두 데리고 오시리니, 그날에는 큰 빛이 비치리라.","본기도":"주 하느님,\n저희의 간청을 자비로이 들으시어\n시련을 겪는 저희를 인자로이 도와주시고\n이 세상에 오시는 성자께 힘을 얻어\n다시는 옛 악습에 떨어지지 않게 하소서.\n성부와 성령과 …….","제1독서":"<그 위에 주님의 영이 머무르리라.>\n▥ 이사야서의 말씀입니다.\n11,1-10\n그날 1 이사이의 그루터기에서 햇순이 돋아나고 그 뿌리에서 새싹이 움트리라.\n2 그 위에 주님의 영이 머무르리니\n지혜와 슬기의 영, 경륜과 용맹의 영, 지식의 영과 주님을 경외함이다.\n3 그는 주님을 경외함으로 흐뭇해하리라.\n그는 자기 눈에 보이는 대로 판결하지 않고\n자기 귀에 들리는 대로 심판하지 않으리라.\n4 힘없는 이들을 정의로 재판하고\n이 땅의 가련한 이들을 정당하게 심판하리라.\n그는 자기 입에서 나오는 막대로 무뢰배를 내리치고\n자기 입술에서 나오는 바람으로 악인을 죽이리라.\n5 정의가 그의 허리를 두르는 띠가 되고\n신의가 그의 몸을 두르는 띠가 되리라.\n6 늑대가 새끼 양과 함께 살고 표범이 새끼 염소와 함께 지내리라.\n송아지가 새끼 사자와 더불어 살쪄 가고 어린아이가 그들을 몰고 다니리라.\n7 암소와 곰이 나란히 풀을 뜯고 그 새끼들이 함께 지내리라.\n사자가 소처럼 여물을 먹고\n8 젖먹이가 독사 굴 위에서 장난하며\n젖 떨어진 아이가 살무사 굴에 손을 디밀리라.\n9 나의 거룩한 산 어디에서도\n사람들은 악하게도 패덕하게도 행동하지 않으리니\n바다를 덮는 물처럼 땅이 주님을 앎으로 가득할 것이기 때문이다.\n10 그날에 이러한 일이 일어나리라.\n이사이의 뿌리가 민족들의 깃발로 세워져\n겨레들이 그에게 찾아들고 그의 거처는 영광스럽게 되리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.7-8.12-13.17(◎ 7ㄴㄷ 참조)\n◎ 주님, 이 시대에 정의와 평화가 꽃피게 하소서.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 저 달이 다할 그때까지, 정의와 큰 평화가 그의 시대에 꽃피게 하소서. 그가 바다에서 바다까지, 강에서 땅끝까지 다스리게 하소서. ◎\n○ 그는 하소연하는 불쌍한 이를, 도와줄 사람 없는 가련한 이를 구원하나이다. 약한 이, 불쌍한 이에게 동정을 베풀고, 불쌍한 이들의 목숨을 살려 주나이다. ◎\n○ 그의 이름 영원히 이어지며, 그의 이름 해처럼 솟아오르게 하소서. 세상 모든 민족들이 그를 통해 복을 받고, 그를 칭송하게 하소서. ◎","복음 환호송":"◎ 알렐루야.\n○ 보라, 우리 주님이 권능을 떨치며 오시어 당신 종들의 눈을 밝혀 주시리라.\n◎ 알렐루야.","복음":"<예수님께서 성령 안에서 즐거워하신다.>\n✠ 루카가 전한 거룩한 복음입니다.\n10,21-24\n21 그때에 예수님께서 성령 안에서 즐거워하며 말씀하셨다.\n“아버지, 하늘과 땅의 주님,\n지혜롭다는 자들과 슬기롭다는 자들에게는 이것을 감추시고\n철부지들에게는 드러내 보이시니, 아버지께 감사를 드립니다.\n그렇습니다, 아버지! 아버지의 선하신 뜻이 이렇게 이루어졌습니다.”\n22 “나의 아버지께서는 모든 것을 나에게 넘겨주셨다.\n그래서 아버지 외에는 아들이 누구인지 아무도 알지 못한다.\n또 아들 외에는,\n그리고 그가 아버지를 드러내 보여 주려는 사람 외에는\n아버지께서 누구이신지 아무도 알지 못한다.”\n23 그리고 예수님께서는 돌아서서 제자들에게 따로 이르셨다.\n“너희가 보는 것을 보는 눈은 행복하다.\n24 내가 너희에게 말한다.\n많은 예언자와 임금이 너희가 보는 것을 보려고 하였지만 보지 못하였고,\n너희가 듣는 것을 들으려고 하였지만 듣지 못하였다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n비천한 저희가 드리는 기도와 제물을 굽어보시어\n아무런 공덕이 없는 저희를 너그러이 보호하시며 도와주소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"2티모 4,8 참조\n의로운 심판관은 당신이 나타나기를 애타게 기다린 사람에게 의로움의 화관을 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 신비로운 제사에 참여한 저희를 생명의 양식으로 기르시니\n저희가 지상 것을 슬기롭게 헤아리며\n끊임없이 천상 것을 찾도록 가르쳐 주소서.\n우리 주 …….","오늘의 묵상":"우리는 계획을 세울 때 처음부터 대단한 계획을 세워 한 번에 큰 목표를 이루고 싶어 합니다. 그러나 성경은 하느님의 방식이 꼭 그렇지는 않음을 보여 줍니다.\n오늘 제1독서에서 이사야 예언자는 말합니다. “이사이의 그루터기에서 햇순이 돋아나고, 그 뿌리에서 새싹이 움트리라”(이사 11,1). 쇠퇴한 다윗 왕조를 상징하는 그루터기에서 새싹이 돋아난다는 말씀은, 절망처럼 보이는 상황에서도 하느님의 손길이 멈추지 않고 날마다 계속되고 있음을 보여 줍니다. 그리고 작은 새싹에서 시작되는 그 약속은 인류를 구원하시고자 아기의 모습으로 이 세상에 오신 예수 그리스도 안에서 완성됩니다.\n오늘 복음에서 예수님께서는 성령 안에서 즐거워하시며 하느님 아버지께 감사드리십니다. 예수님께서는 하느님께서 ‘철부지들’에게 당신을 드러내 보이셨다고 말씀하십니다. 여기서 철부지는 하느님 앞에서 자신이 작고 부족한 존재임을 인정하며 겸손하게 살아가는 사람을 가리킵니다. “너희가 보는 것을 보는 눈은 행복하다”(루카 10,23). 철부지들에게 주어진 특권은 바로 예수님을 아는 것입니다.\n예수님을 알려면 예수님을 바라보고 그분의 말씀에 귀를 기울여야 합니다. 단순해 보이지만 신앙생활에서 가장 중요하고도 기본적인 일입니다. 하느님의 자녀로 살아가는 우리는 지금 무엇을 바라보며, 무엇에 귀를 기울이는지 돌아보아야 하겠습니다. 처음부터 거창한 계획으로 한 번에 큰 목표를 이루는 것보다 더 중요한 것은 주님을 향한 작은 발걸음을 날마다 성실하게 내디디는 일임을 기억합시다. 그 발걸음 안에서 우리를 찾아오시는 주님을 기쁘게 맞이하며, 희망 가득한 대림 시기를 보내기를 바랍니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261202":{"d":"2026년 12월 02일 수요일","c":"자","t":"대림 제1주간 수요일","o":[],"n":"","g":"","i":"","s":{"입당송":"하바 2,3; 1코린 4,5 참조\n주님은 지체하지 않고 오시어, 어둠 속에 숨은 것을 밝히시고, 모든 민족들 앞에 당신을 드러내시리라.","본기도":"주 하느님,\n주님의 권능으로 저희가 마음을 가다듬어\n성자 그리스도께서 오실 때에\n영원한 생명에 참여할 자격을 갖추고\n성자께서 베푸시는 천상 잔치에 들게 하소서.\n성자께서는 성부와 …….","제1독서":"<주님께서 모든 사람에게 잔치를 베푸시고 그들의 얼굴에서 눈물을 닦아내신다.>\n▥ 이사야서의 말씀입니다.\n25,6-10ㄱ\n그날 6 만군의 주님께서는 이 산 위에서 모든 민족들을 위하여\n살진 음식과 잘 익은 술로 잔치를,\n살지고 기름진 음식과 잘 익고 잘 거른 술로 잔치를 베푸시리라.\n7 그분께서는 이 산 위에서\n모든 겨레들에게 씌워진 너울과 모든 민족들에게 덮인 덮개를 없애시리라.\n8 그분께서는 죽음을 영원히 없애 버리시리라.\n주 하느님께서는 모든 사람의 얼굴에서 눈물을 닦아 내시고\n당신 백성의 수치를 온 세상에서 치워 주시리라.\n정녕 주님께서 말씀하셨다.\n9 그날에 이렇게들 말하리라. “보라, 이분은 우리의 하느님이시다.\n우리는 이분께 희망을 걸었고 이분께서는 우리를 구원해 주셨다.\n이분이야말로 우리가 희망을 걸었던 주님이시다.\n이분의 구원으로 우리 기뻐하고 즐거워하자.\n10 주님의 손이 이 산 위에 머무르신다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 23(22),1-3ㄱ.3ㄴㄷ-4.5.6(◎ 6ㄷㄹ)\n◎ 저는 오래오래 주님 집에 사오리다.\n○ 주님은 나의 목자, 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시고, 잔잔한 물가로 나를 이끄시어, 내 영혼에 생기 돋우어 주시네. ◎\n○ 당신 이름 위하여 나를 바른길로 이끌어 주시네. 어둠의 골짜기를 간다 하여도, 당신 함께 계시오니 두려울 것 없나이다. 당신의 막대와 지팡이, 저에게 위안이 되나이다. ◎\n○ 원수들 보는 앞에서 제게 상을 차려 주시고, 머리에 향유를 발라 주시니, 제 술잔 넘치도록 가득하옵니다. ◎\n○ 제 한평생 모든 날에 은총과 자애만이 따르리니, 저는 오래오래 주님 집에 사오리다. ◎","복음 환호송":"◎ 알렐루야.\n○ 보라, 당신 백성 구원하러 주님이 오시리니 주님을 맞이하러 달려가는 이는 복되어라.\n◎ 알렐루야.","복음":"<예수님께서 많은 병자를 고쳐 주시고 빵을 많게 하셨다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n15,29-37\n그때에 29 예수님께서는 갈릴래아 호숫가로 가셨다.\n그리고 산에 오르시어 거기에 자리를 잡고 앉으셨다.\n30 그러자 많은 군중이\n다리저는 이들과 눈먼 이들과 다른 불구자들과 말못하는 이들,\n그리고 또 다른 많은 이들을 데리고 예수님께 다가왔다.\n그들을 그분 발치에 데려다 놓자 예수님께서는 그들을 고쳐 주셨다.\n31 그리하여 말못하는 이들이 말을 하고 불구자들이 온전해지고\n다리저는 이들이 제대로 걸으며 눈먼 이들이 보게 되자,\n군중이 이를 보고 놀라 이스라엘의 하느님을 찬양하였다.\n32 예수님께서 제자들을 가까이 불러 이르셨다. “저 군중이 가엾구나.\n벌써 사흘 동안이나 내 곁에 머물렀는데 먹을 것이 없으니 말이다.\n길에서 쓰러질지도 모르니 그들을 굶겨서 돌려보내고 싶지 않다.”\n33 제자들이 예수님께 “이 광야에서 이렇게 많은 군중을\n배불리 먹일 만한 빵을 어디서 구하겠습니까?” 하고 말하였다.\n34 예수님께서 “너희에게 빵이 몇 개나 있느냐?” 하시자,\n그들이 “일곱 개가 있고 물고기도 조금 있습니다.” 하고 대답하였다.\n35 예수님께서는 군중에게 땅에 앉으라고 분부하셨다.\n36 그리고 빵 일곱 개와 물고기들을 손에 들고 감사를 드리신 다음\n떼어 제자들에게 주시니, 제자들이 군중에게 나누어 주었다.\n37 사람들은 모두 배불리 먹었다.\n그리고 남은 조각을 모았더니 일곱 바구니에 가득 찼다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n이 예물을 정성껏 봉헌하며 비오니\n주님께서 제정하신 거룩한 신비의 거행으로\n저희 구원이 온전히 이루어지게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"이사 40,10; 35,5 참조\n보라, 우리 주님이 권능을 떨치며 오시어, 당신 종들의 눈을 밝혀 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n주님께서는 인자하시니\n이 성사의 힘으로 저희 죄를 깨끗이 씻어 주시어\n다가오는 성탄 축제를 준비하게 하소서.\n우리 주 …….","오늘의 묵상":"어려운 상황에 놓인 사람을 애처롭게 여기는 마음, 곧 ‘측은지심’은 맹자만의 가르침이 아닙니다. 고통을 겪는 사람을 보며 연민을 느끼는 것은 하느님께서 인간에게 주신 마음입니다. 오늘 복음에서 예수님께서도 바로 그러한 연민을 보이십니다.\n“저 군중이 가엾구나. 벌써 사흘 동안이나 내 곁에 머물렀는데 먹을 것이 없으니 말이다. 길에서 쓰러질지도 모르니 그들을 굶겨서 돌려보내고 싶지 않다”(마태 15,32). 예수님께서는 사람들의 육체적 영적 배고픔을 외면하시지 않고 그들을 배불리 먹여 주십니다. 이를 통하여 오늘 제1독서에서 이사야 예언자가 선포한 구원의 잔치를 미리 보여 주십니다.\n복음 앞부분에는 예수님처럼 연민을 느끼며 도움이 필요한 이들과 함께하는 군중의 모습도 나옵니다. “그러자 많은 군중이 다리저는 이들과 눈먼 이들과 다른 불구자들과 말못하는 이들, 그리고 또 다른 많은 이들을 데리고 예수님께 다가왔다”(15,30). 그들은 병든 이들을 외면하지 않았습니다. 그들의 실천에는 고통받는 이들에 대한 공감과 연민이 바탕에 있었을 것입니다.\n그렇다면 예수님을 따르는 우리는 어떻습니까? 우리도 예수님처럼 연민을 느끼며 살아갑니까? 고통을 겪는 이를 단순히 불쌍하게 바라보는 것을 넘어, 다른 이의 고통에 함께하고, 그 아픔을 공동체의 것으로 받아들이며 살아갑니까? 구원 잔치에 초대받은 우리는 기쁨만 함께 나누는 공동체가 아닙니다. 서로의 아픔까지 함께 나누는 공동체입니다. 오늘도 우리 곁에 있는 도움이 필요한 이들과 함께하며, 연민의 마음을 잃지 않도록 합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261203":{"d":"2026년 12월 03일 목요일","c":"백","t":"성 프란치스코 하비에르 사제 기념일","o":[],"n":"","g":"","i":"프란치스코 하비에르 성인은 1506년 에스파냐 바스크 지방의 하비에르성에서 태어났다. 그는 프랑스 파리에서 공부하다가 만난 이냐시오 성인의 영향으로 수도 서원을 하였다. 1537년에 베네치아에서 사제가 된 그는 예수회 첫 번째 회원으로 자선 사업에 헌신하였고, 인도와 일본에서 열정적으로 선교하여 많은 이를 교회로 이끌었다. 프란치스코 하비에르는 선교를 위하여 중국으로 향하던 중 1552년 12월 중국 땅이 바라보이는 상촨섬에서 선종하였다.\n1662년에 시성된 성인은 바오로 사도에 버금가는 위대한 선교사로 불린다. 수많은 위험과 역경을 딛고 먼 거리를 여행하며 선교에 힘썼기 때문이다. 1927년 비오 11세 교황이 성인을 아기 예수의 데레사 성녀와 함께 ‘선교의 수호자’로 선포하였다.","s":{"입당송":"시편 18(17),50; 22(21),23\n주님, 제가 민족들 앞에서 당신을 찬미하고, 당신 이름을 형제들에게 전하오리다.","본기도":"하느님, 복된 프란치스코의 설교로 많은 백성들을 부르셨으니\n모든 신자들이 그 선교 열정으로 불타올라\n거룩한 교회가 세상 어디서나 새로운 자녀들을 많이 얻어 기뻐하게 하소서.\n성부와 성령과 …….","제1독서":"<신의를 지키는 의로운 겨레가 들어간다.>\n▥ 이사야서의 말씀입니다.\n26,1-6\n1 그날 유다 땅에서는 이러한 노래가 불리리라.\n“우리에게는 견고한 성읍이 있네.\n그분께서 우리를 보호하시려고 성벽과 보루를 세우셨네.\n2 신의를 지키는 의로운 겨레가 들어가게 너희는 성문들을 열어라.\n3 한결같은 심성을 지닌 그들에게 당신께서 평화를, 평화를 베푸시니\n그들이 당신을 신뢰하기 때문입니다.\n4 너희는 길이길이 주님을 신뢰하여라. 주 하느님은 영원한 반석이시다.\n5 그분께서는 높은 곳의 주민들을 낮추시고 높은 도시를 헐어 버리셨으며\n그것을 땅바닥에다 헐어 버리시어 먼지 위로 내던지셨다.\n6 발이 그것을 짓밟는다.\n빈곤한 이들의 발이, 힘없는 이들의 발길이 그것을 짓밟는다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 118(117),1과 8-9.19-21.25-27ㄱㄴ(◎ 26ㄱ 참조)\n◎ 주님의 이름으로 오시는 분, 찬미받으소서.\n○ 주님은 좋으신 분, 찬송하여라. 주님의 자애는 영원하시다. 사람을 믿기보다, 주님께 피신함이 훨씬 낫다네. 제후들을 믿기보다, 주님께 피신함이 훨씬 낫다네. ◎\n○ 정의의 문을 열어라. 그리로 들어가 나는 주님을 찬송하리라. 이것은 주님의 문, 의인들이 들어가리라. 당신이 제게 응답하시고 구원이 되어 주셨으니, 제가 당신을 찬송하나이다. ◎\n○ 주님, 구원을 베풀어 주소서. 주님, 번영을 이루어 주소서. 주님의 이름으로 오는 이는 복되어라. 우리는 주님의 집에서 너희에게 축복하노라. 주님은 하느님, 우리를 비추시네. ◎","복음 환호송":"이사 55,6\n◎ 알렐루야.\n○ 만나 뵐 수 있을 때에 주님을 찾아라. 가까이 계실 때에 그분을 불러라.\n◎ 알렐루야.","복음":"<아버지의 뜻을 실행하는 이라야 하늘 나라에 들어간다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n7,21.24-27\n그때에 예수님께서 제자들에게 말씀하셨다.\n21 “나에게 ‘주님, 주님!’ 한다고 모두 하늘 나라에 들어가는 것이 아니다.\n하늘에 계신 내 아버지의 뜻을 실행하는 이라야 들어간다.\n24 그러므로 나의 이 말을 듣고 실행하는 이는 모두\n자기 집을 반석 위에 지은 슬기로운 사람과 같을 것이다.\n25 비가 내려 강물이 밀려오고 바람이 불어 그 집에 들이쳤지만 무너지지 않았다.\n반석 위에 세워졌기 때문이다.\n26 그러나 나의 이 말을 듣고 실행하지 않는 자는 모두\n자기 집을 모래 위에 지은 어리석은 사람과 같다.\n27 비가 내려 강물이 밀려오고 바람이 불어 그 집에 휘몰아치자 무너져 버렸다.\n완전히 무너지고 말았다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(1코린 9,16-19.22-23)와 복음(마르 16,15-20ㄴ)을 봉독할 수 있다.>","예물 기도":"주님,\n온 인류를 구원하려는 열망으로 머나먼 땅에 찾아온\n복된 프란치스코를 기리며 드리는 이 예물을 받으시고\n저희도 복음을 전하고 증언하여\n많은 형제들과 함께 주님께 나아가게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<성인 감사송 1 : 성인들의 영광>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 성인들 가운데서 찬미를 받으시며\n그들의 공로를 갚아 주시어 주님의 은총을 빛내시나이다.\n또 성인들의 삶을 저희에게 모범으로 주시고\n저희가 성인들과 하나 되게 하시며 그 기도의 도움을 받게 하시나이다.\n저희는 이 위대한 증인에게서 힘을 얻고\n악과 싸워서 승리를 거두고 나아갈 길을 끝까지 달려\n우리 주 그리스도를 통하여\n그들과 함께 영원히 시들지 않는 영광의 월계관을 받나이다.\n그러므로 천사와 대천사와 성인들의 무리와 함께\n저희도 주님을 찬미하며 끝없이 노래하나이다.","영성체송":"마태 10,27 참조\n주님이 말씀하신다. 내가 너희에게 어두운 데에서 말하는 것을 너희는 밝은 데에서 말하여라. 너희가 귓속말로 들은 것을 지붕 위에서 선포하여라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"하느님, 성체를 받아 모시고 비오니\n저희가 복된 프란치스코의 불타는 사랑을 본받아\n하느님의 부르심을 따르고 복음에 충실하여\n하느님께서 약속하신 상급을 받게 하소서.\n우리 주 …….","오늘의 묵상":"창세기 11장에는 바벨탑 이야기가 나옵니다. 하느님께서는 하느님 없이 인간의 힘으로 더 높아지려는 교만을 보시고, 그 사람들을 온 땅으로 흩으십니다. 더 높은 곳으로 올라가고, 더 많은 것을 가지며, 더 큰 특권을 누리고자 애쓰는 모습은 오늘날 우리 주변에서도 어렵지 않게 찾아볼 수 있습니다. 이러한 삶의 방식에 우리가 어떤 태도를 지녀야 할지에 대한 답을 오늘 독서와 복음에서 발견합니다.\n오늘 독서에서 이사야 예언자는 말합니다. “너희는 길이길이 주님을 신뢰하여라. 주 하느님은 영원한 반석이시다”(이사 26,4). 우리는 자기의 힘을 믿기보다 주님을 온전히 믿고 자신을 주님께 맡겨야 합니다. 그럴 때 비로소 흔들리지 않고 올바르게 설 수 있습니다. 오늘 복음에서 예수님께서는 말씀하십니다. “비가 내려 강물이 밀려오고 바람이 불어 그 집에 들이쳤지만 무너지지 않았다. 반석 위에 세워졌기 때문이다”(마태 7,25). 우리 삶에 강물이 밀려들고 바람이 들이치며 시련이 찾아올 때도, 반석이신 예수님을 삶의 바탕으로 삼고 그분의 말씀을 실천한다면 우리 믿음의 집은 쉽게 무너지지 않을 것입니다.\n나 자신만 믿는 드높은 교만의 탑을 쌓지 맙시다. 높은 곳을 좇으며 헛된 욕심에 마음을 빼앗기기보다 반석이신 주님 위에 우리 삶을 굳건히 세웁시다. 내 발이 무엇을 디디고 있는지 잊지 않으며 한 걸음씩 내디디는 슬기로운 사람이 되기를 바랍니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261204":{"d":"2026년 12월 04일 금요일","c":"자","t":"대림 제1주간 금요일","o":[{"c":"백","t":"다마스쿠스의 성 요한 사제 학자"}],"n":"","g":"","i":"","s":{"입당송":"보라, 주님이 영화롭게 내려오시리라. 당신 백성을 찾아오시어, 평화를 베푸시고 영원한 생명을 주시리라.","본기도":"주님,\n권능을 떨치며 오시어\n저희를 죄의 위험에서 지켜 주시고\n주님의 도우심으로 구원하여 주소서.\n주님께서는 성부와 …….","제1독서":"<그날, 눈먼 이들의 눈도 보게 되리라.>\n▥ 이사야서의 말씀입니다.\n29,17-24\n주 하느님께서 이렇게 말씀하신다.\n17 “정녕 이제 조금만 있으면 레바논은 과수원으로 변하고\n과수원은 숲으로 여겨지리라.\n18 그날에는 귀먹은 이들도 책에 적힌 말을 듣고\n눈먼 이들의 눈도 어둠과 암흑을 벗어나 보게 되리라.\n19 겸손한 이들은 주님 안에서 기쁨에 기쁨을 더하고\n사람들 가운데 가장 가난한 이들은\n이스라엘의 거룩하신 분 안에서 즐거워하리니\n20 포악한 자가 없어지고 빈정대는 자가 사라지며\n죄지을 기회를 엿보는 자들이 모두 잘려 나가겠기 때문이다.\n21 이들은 소송 때 남을 지게 만들고\n성문에서 재판하는 사람에게 올가미를 씌우며\n무죄한 이의 권리를 까닭 없이 왜곡하는 자들이다.\n22 그러므로 아브라함을 구원하신\n야곱 집안의 하느님이신 주님께서 이렇게 말씀하신다.\n‘야곱은 더 이상 부끄러운 일을 당하지 않고\n더 이상 얼굴이 창백해지는 일이 없으리라.\n23 그들은 자기들 가운데에서 내 손의 작품인 자녀들을 보게 될 때\n나의 이름을 거룩하게 하리라.’\n그들은 이스라엘의 거룩하신 분을 거룩하게 하며\n이스라엘의 하느님을 두려워하게 되리라.\n24 그리고 정신이 혼미한 자들은 슬기를 얻고\n불평하는 자들은 교훈을 배우리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 27(26),1.4.13-14(◎ 1ㄱ)\n◎ 주님은 나의 빛, 나의 구원이시다.\n○ 주님은 나의 빛, 나의 구원. 나 누구를 두려워하랴? 주님은 내 생명의 요새. 나 누구를 무서워하랴? ◎\n○ 주님께 청하는 오직 한 가지, 나 그것을 얻고자 하니, 내 한평생 주님의 집에 살며 주님의 아름다움 바라보고, 그분의 성전 우러러보는 것이라네. ◎\n○ 저는 산 이들의 땅에서, 주님의 어지심을 보리라 믿나이다. 주님께 바라라. 힘내어 마음을 굳게 가져라. 주님께 바라라. ◎","복음 환호송":"◎ 알렐루야.\n○ 보라, 우리 주님이 권능을 떨치며 오시어 당신 종들의 눈을 밝혀 주시리라.\n◎ 알렐루야.","복음":"<예수님을 믿는 눈먼 두 사람의 눈이 열렸다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n9,27-31\n그때에 27 예수님께서 길을 가시는데 눈먼 사람 둘이 따라오면서,\n“다윗의 자손이시여, 저희에게 자비를 베풀어 주십시오.” 하고 외쳤다.\n28 예수님께서 집 안으로 들어가시자 그 눈먼 이들이 그분께 다가왔다.\n예수님께서 그들에게\n“내가 그런 일을 할 수 있다고 너희는 믿느냐?” 하고 물으시자,\n그들이 “예, 주님!” 하고 대답하였다.\n29 그때 예수님께서 그들의 눈에 손을 대시며 이르셨다.\n“너희가 믿는 대로 되어라.”\n30 그러자 그들의 눈이 열렸다.\n예수님께서는 “아무도 이 일을 알지 못하게 조심하여라.” 하고 단단히 이르셨다.\n31 그러나 그들은 나가서 예수님에 관한 이야기를 그 지방에 두루 퍼뜨렸다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n비천한 저희가 드리는 기도와 제물을 굽어보시어\n아무런 공덕이 없는 저희를 너그러이 보호하시며 도와주소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"필리 3,20-21 참조\n우리는 구세주 예수 그리스도를 기다리네. 그분은 우리의 비천한 몸을 당신의 영광스러운 몸과 같이 바꾸어 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 신비로운 제사에 참여한 저희를 생명의 양식으로 기르시니\n저희가 지상 것을 슬기롭게 헤아리며\n끊임없이 천상 것을 찾도록 가르쳐 주소서.\n우리 주 …….","오늘의 묵상":"교회 안에서 우리가 자주 듣는 낱말 가운데 하나가 ‘은총’입니다. 은총은 우리가 선한 삶의 대가로 얻는 것이 아니라 하느님께서 거저 베풀어 주시는 선물입니다. 그리고 그 은총의 시작을 보여 주는 성사가 바로 세례성사입니다. 세례성사는 물과 성령으로 새롭게 태어나는 성사이며, 초대 교회에서는 그리스도의 빛을 받는 성사라는 뜻에서 ‘조명의 성사’라고도 하였습니다. 이 성사를 받고 “모든 사람을 비추는 참빛”(요한 1,9)이신 그리스도를 받아들인 우리는 빛의 자녀로 살아가도록 부름받았습니다.\n오늘 독서와 복음, 화답송과 복음 환호송에서 공통으로 발견하게 되는 상징도 빛입니다. “눈먼 이들의 눈도 어둠과 암흑을 벗어나 보게 되리라.”(이사 29,18)라는 예언은 예수님을 통하여 이루어집니다. 세상의 빛이신 예수님께서는 눈먼 이들의 눈을 열어 주십니다. 여기서 ‘보게 된다’는 것은 육체적 시력을 되찾는 것을 넘어, 하느님의 현존과 그분의 손길을 깨닫는 영적 시력을 얻는다는 뜻일 것입니다.\n우리는 세상 안에서 하느님의 은총과 사랑을 발견하며, 빛을 향하여 나아가도록 초대받은 사람들입니다. 삶의 여정에서 때로는 깊은 어둠을 경험하지만 세례를 통하여 빛의 자녀가 되었음은 결코 변하지 않습니다. 그러므로 삶이 어둡다고 느껴질 때마다 오늘 복음의 눈먼 이들처럼 믿음을 지니고 예수님께 청해야 하겠습니다. “다윗의 자손이시여, 저희에게 자비를 베풀어 주십시오”(마태 9,27). 우리를 세상의 빛으로 불러 주신 주님께 감사드리며, 오늘도 거저 받은 은총의 빛을 이웃과 세상 안에 비추며 살아갑시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261205":{"d":"2026년 12월 05일 토요일","c":"자","t":"대림 제1주간 토요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 80(79),2.4 참조\n커룹들 위에 좌정하신 주님, 오소서. 당신 얼굴을 비추소서. 저희가 구원되리이다.","본기도":"하느님,\n인류를 옛 죄의 굴레에서 해방하시려고 외아드님을 세상에 보내셨으니\n그분을 간절히 기다리는 저희에게 천상 은총을 자비로이 베푸시어\n저희가 참된 자유를 누리게 하소서.\n성부와 성령과 …….","제1독서":"<네가 부르짖으면 주님께서 반드시 자비를 베푸시리라.>\n▥ 이사야서의 말씀입니다.\n30,19-21.23-26\n이스라엘의 거룩하신 주 하느님께서 이렇게 말씀하신다.\n19 “예루살렘에 사는 너희 시온 백성아\n너희는 다시 울지 않아도 되리라.\n네가 부르짖으면 그분께서 반드시 너희에게 자비를 베푸시고\n들으시는 대로 너희에게 응답하시리라.\n20 비록 주님께서 너희에게 곤경의 빵과 고난의 물을 주시지만\n너의 스승이신 그분께서는 더 이상 숨어 계시지 않으리니\n너희 눈이 너희의 스승을 뵙게 되리라.\n21 그리고 너희가 오른쪽으로 돌거나 왼쪽으로 돌 때\n뒤에서 ‘이것이 바른길이니 이리로 가거라.’ 하시는 말씀을\n너희 귀로 듣게 되리라.\n23 그분께서 너희가 밭에 뿌린 씨앗을 위하여 비를 내리시니\n밭에서 나는 곡식이 여물고 기름지리라.\n그날에 너희의 가축은 넓은 초원에서 풀을 뜯고\n24 밭일을 하는 소와 나귀는 삽과 거름대로 까불러 간을 맞춘 사료를 먹으리라.\n25 큰 살육이 일어나는 날, 탑들이 무너질 때\n높은 산 위마다, 솟아오른 언덕 위마다, 물이 흐르는 도랑들이 생기리라.\n26 또 주님께서 당신 백성의 상처를 싸매 주시고\n당신의 매를 맞아 터진 곳을 낫게 해 주시는 날\n달빛은 햇빛처럼 되고 햇빛은 일곱 배나 밝아져\n이레 동안의 빛을 한데 모은 듯하리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 147(146─147),1ㄴㄷ-2.3-4.5-6(◎ 이사 30,18 참조)\n◎ 주님을 기다리는 이는 모두 행복하여라!\n○ 우리 하느님을 찬송하니 좋기도 하여라. 마땅한 찬양을 드리니 즐겁기도 하여라. 주님은 예루살렘을 세우시고 흩어진 이스라엘을 모으시네. ◎\n○ 주님은 마음이 부서진 이를 고치시고 그들의 상처를 싸매 주시네. 별들의 수를 정하시고 낱낱이 그 이름 지어 주시네. ◎\n○ 우리 주님은 위대하시고 권능이 넘치시네. 그 지혜는 헤아릴 길 없네. 주님은 가난한 이를 일으키시고 악인을 땅바닥까지 낮추시네. ◎","복음 환호송":"이사 33,22 참조\n◎ 알렐루야.\n○ 주님은 우리의 통치자, 우리의 지도자, 우리의 임금님 주님이 우리를 구원하시리라.\n◎ 알렐루야.","복음":"<예수님께서는 군중을 보시고 가엾은 마음이 드셨다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n9,35─10,1.6-8\n그때에 35 예수님께서는 모든 고을과 마을을 두루 다니시면서,\n회당에서 가르치시고 하늘 나라의 복음을 선포하시며,\n병자와 허약한 이들을 모두 고쳐 주셨다.\n36 그분은 군중을 보시고 가엾은 마음이 드셨다.\n그들이 목자 없는 양들처럼 시달리며 기가 꺾여 있었기 때문이다.\n37 그래서 제자들에게 말씀하셨다. “수확할 것은 많은데 일꾼은 적다.\n38 그러니 수확할 밭의 주인님께 일꾼들을 보내 주십사고 청하여라.”\n10,1 예수님께서 열두 제자를 가까이 부르시고\n그들에게 더러운 영들에 대한 권한을 주시어,\n그것들을 쫓아내고 병자와 허약한 이들을 모두 고쳐 주게 하셨다.\n5 예수님께서 이 열두 사람을 보내시며 이렇게 분부하셨다.\n6 “이스라엘 집안의 길 잃은 양들에게 가라.\n7 가서 ‘하늘 나라가 가까이 왔다.’ 하고 선포하여라.\n8 앓는 이들을 고쳐 주고 죽은 이들을 일으켜 주어라.\n나병 환자들을 깨끗하게 해 주고 마귀들을 쫓아내어라.\n너희가 거저 받았으니 거저 주어라.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n이 예물을 정성껏 봉헌하며 비오니\n주님께서 제정하신 거룩한 신비의 거행으로\n저희 구원이 온전히 이루어지게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"묵시 22,12 참조\n주님이 말씀하신다. 보라, 내가 곧 간다. 상도 가져가, 사람마다 제 행실대로 갚아 주리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n주님께서는 인자하시니\n이 성사의 힘으로 저희 죄를 깨끗이 씻어 주시어\n다가오는 성탄 축제를 준비하게 하소서.\n우리 주 …….","오늘의 묵상":"교회의 사명 가운데 빼놓을 수 없는 것이 바로 선교입니다. 이 세상에 복음을 전하고 하느님 사랑과 이웃 사랑을 실천하여 사람들이 하느님을 알고 구원의 길로 나아가도록 돕는 일입니다. 오늘 복음은 그 사명이 예수 그리스도의 삶에서 비롯되었음을 보여 줍니다. 성부에게서 파견되신 예수님께서는 가르치시고, 복음을 선포하시며, 병자들을 낫게 하셨습니다.\n오늘 복음은 “예수님께서는 모든 고을과 마을을 두루 다니시면서, …… 병자와 허약한 이들을 모두 고쳐 주셨다.”(마태 9,35)라며 예수님의 선교 방식을 알려 줍니다. 그분께서는 당신의 발길이 닿는 곳마다 만나는 사람들에게 먼저 다가가시며 아버지께서 맡기신 사명에 ‘충실’하셨습니다. 하느님의 일을 하시는 예수님의 충실한 삶은 제자들에게 자연스럽게 본보기가 되었고, 그들 또한 스승님의 뒤를 이어 복음을 선포하고 병자들을 낫게 하는 일을 이어 갔습니다.\n예수님을 본받아 우리도 자신의 자리에서 선교 사명을 실천하며 살아갑니다. 때로는 해야 할 일은 많고 여건은 여의치 않다 보니 결과에만 신경 쓰며 효율적인 방법을 먼저 찾기도 합니다. 그러나 많은 열매를 맺는 일도 중요하지만, 우리가 놓쳐서는 안 될 부분은 바로 예수님께서 보여 주신 충실함을 닮는 일입니다. 하느님의 도구가 되어 선교 활동을 하면서 내디디는 우리의 한 걸음 한 걸음, 우리가 만나는 한 사람 한 사람은 결코 작지 않습니다. 우리가 작은 씨앗을 심어도 풍성한 열매로 맺어 주시는 주님을 늘 믿고 의지합시다. “그분께서 너희가 밭에 뿌린 씨앗을 위하여, 비를 내리시니, 밭에서 나는 곡식이, 여물고 기름지리라”(이사 30,23).\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261206":{"d":"2026년 12월 06일 일요일","c":"자","t":"대림 제2주일","o":[],"n":"인권 주일, 사회 교리 주간","g":"신경 · 교중","i":"인간 존중과 인권 신장은 복음의 요구다. 그럼에도 인간의 존엄성이 무시되고 짓밟히는 경우가 적지 않다. 이에 따라 한국 주교회의는 1982년부터 해마다 대림 제2주일을 ‘인권 주일’로 지내기로 하였다. 교회는 하느님의 모습으로 창조된 존엄한 인간이 그에 맞갖게 살아갈 수 있도록 끊임없이 보살펴야 하기 때문이다.\n또한 인권 주일로 시작하는 대림 제2주간을 2011년부터 ‘사회 교리 주간’으로 지내고 있다. 이는 오늘날 여러 가지 도전에 대응하며 새로운 방식으로 복음을 전해야 할 교회의 ‘새 복음화’ 노력이 바로 사회 교리의 실천이라는 사실을 신자들에게 일깨우려는 것이다.","s":{"오늘 전례":"오늘은 대림 제2주일로 한국 교회가 정한 인권 주일이자 사회 교리 주간의 시작입니다. 모든 위로의 샘이신 주님께서는 이 세상에서 나그넷길을 걷는 우리에게 새 하늘과 새 땅을 약속하셨습니다. 주님께서 우리 마음을 밝히시어, 순수한 믿음과 거룩한 삶으로 주님의 영광스러운 이름이 완전하게 드러나는 그날을 향하여 걸어가게 해 주시기를 청합시다.","입당송":"이사 30,19.30 참조\n보라, 시온 백성아. 주님이 민족들을 구원하러 오신다. 주님의 우렁찬 목소리를 듣고, 너희 마음은 기쁨에 넘치리라.","본기도":"전능하시고 자비로우신 하느님,\n저희가 세상일에 얽매이지 않고 기꺼이 성자를 맞이하여\n천상의 지혜로 성자와 하나 되게 하소서.\n성자께서는 성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시나이다.","제1독서":"<너희는 주님의 길을 닦아라.>\n▥ 이사야서의 말씀입니다.\n40,1-5.9-11\n위로하여라, 위로하여라, 나의 백성을.\n─ 너희의 하느님께서 말씀하신다. ─\n2 예루살렘에게 다정히 말하여라.\n이제 복역 기간이 끝나고 죗값이 치러졌으며\n자기의 모든 죄악에 대하여 주님 손에서 갑절의 벌을 받았다고 외쳐라.\n3 한 소리가 외친다. “너희는 광야에 주님의 길을 닦아라.\n우리 하느님을 위하여 사막에 길을 곧게 내어라.\n4 골짜기는 모두 메워지고 산과 언덕은 모두 낮아져라.\n거친 곳은 평지가 되고 험한 곳은 평야가 되어라.\n5 이에 주님의 영광이 드러나리니 모든 사람이 다 함께 그것을 보리라.\n주님께서 친히 이렇게 말씀하셨다.”\n9 기쁜 소식을 전하는 시온아, 높은 산으로 올라가라.\n기쁜 소식을 전하는 예루살렘아, 너의 목소리를 한껏 높여라.\n두려워 말고 소리를 높여라.\n유다의 성읍들에게 “너희의 하느님께서 여기에 계시다.” 하고 말하여라.\n10 보라, 주 하느님께서 권능을 떨치며 오신다. 당신의 팔로 왕권을 행사하신다.\n보라, 그분의 상급이 그분과 함께 오고 그분의 보상이 그분 앞에 서서 온다.\n11 그분께서는 목자처럼 당신의 가축들을 먹이시고\n새끼 양들을 팔로 모아 품에 안으시며\n젖 먹이는 어미 양들을 조심스럽게 이끄신다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 85(84),9ㄱㄴㄷ과 10.11-12.13-14(◎ 8 참조)\n◎ 주님, 저희에게 자비와 구원을 베풀어 주소서.\n○ 하느님 말씀을 나는 듣고자 하노라. 당신 백성, 당신께 충실한 이에게 주님은 진정 평화를 말씀하신다. 그분을 경외하는 이에게 구원이 가까우니 영광은 우리 땅에 머물리라. ◎\n○ 자애와 진실이 서로 만나고 정의와 평화가 입을 맞추리라. 진실이 땅에서 돋아나고 정의가 하늘에서 굽어보리라. ◎\n○ 주님이 복을 베푸시어 우리 땅이 열매를 내리라. 정의가 그분 앞을 걸어가고 그분은 그 길로 나아가시리라. ◎","제2독서":"<우리는 새 하늘과 새 땅을 기다리고 있습니다.>\n▥ 베드로 2서의 말씀입니다.\n3,8-14\n8 사랑하는 여러분, 이 한 가지를 간과해서는 안 됩니다.\n주님께는 하루가 천 년 같고 천 년이 하루 같습니다.\n9 어떤 이들은 미루신다고 생각하지만 주님께서는 약속을 미루지 않으십니다.\n오히려 여러분을 위하여 참고 기다리시는 것입니다.\n아무도 멸망하지 않고 모두 회개하기를 바라시기 때문입니다.\n10 그러나 주님의 날은 도둑처럼 올 것입니다.\n그날에 하늘은 요란한 소리를 내며 사라지고 원소들은 불에 타 스러지며,\n땅과 그 안에서 이루어진 모든 것이 드러날 것입니다.\n11 이렇게 모든 것이 스러질 터인데,\n여러분은 어떤 사람이 되어야 하겠습니까?\n거룩하고 신심 깊은 생활을 하면서,\n12 하느님의 날이 오기를 기다리고 그날을 앞당기도록 해야 하지 않겠습니까?\n그날이 오면 하늘은 불길에 싸여 스러지고\n원소들은 불에 타 녹아 버릴 것입니다.\n13 그러나 우리는 그분의 언약에 따라,\n의로움이 깃든 새 하늘과 새 땅을 기다리고 있습니다.\n14 그러므로 사랑하는 여러분, 여러분은 이러한 것들을 기다리고 있으니,\n티 없고 흠 없는 사람으로 평화로이 그분 앞에 나설 수 있도록 애쓰십시오.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"루카 3,4.6\n◎ 알렐루야.\n○ 너희는 주님의 길을 마련하여라. 그분의 길을 곧게 내어라. 모든 사람이 하느님의 구원을 보리라.\n◎ 알렐루야.","복음":"<너희는 주님의 길을 곧게 내어라.>\n✠ 마르코가 전한 거룩한 복음의 시작입니다.\n1,1-8\n1 하느님의 아드님 예수 그리스도의 복음의 시작.\n2 이사야 예언자의 글에\n“보라, 내가 네 앞에 내 사자를 보내니 그가 너의 길을 닦아 놓으리라.”\n3 “광야에서 외치는 이의 소리. ‘너희는 주님의 길을 마련하여라.\n그분의 길을 곧게 내어라.’” 하고 기록된 대로,\n4 세례자 요한이 광야에 나타나\n죄의 용서를 위한 회개의 세례를 선포하였다.\n5 그리하여 온 유다 지방 사람들과 예루살렘 주민들이 모두 그에게 나아가,\n자기 죄를 고백하며 요르단 강에서 그에게 세례를 받았다.\n6 요한은 낙타 털 옷을 입고 허리에 가죽띠를 둘렀으며,\n메뚜기와 들꿀을 먹고 살았다.\n7 그리고 이렇게 선포하였다. “나보다 더 큰 능력을 지니신 분이 내 뒤에 오신다.\n나는 몸을 굽혀 그분의 신발 끈을 풀어 드릴 자격조차 없다.\n8 나는 너희에게 물로 세례를 주었지만,\n그분께서는 너희에게 성령으로 세례를 주실 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n참목자이신 주님, 주님의 백성인 교회를 굽어살피시어, 주님께서 교회로 부르신 이들을 보호하고 도우며, 세상 속에서 구원의 희망을 전하고 주님의 사랑을 실천하게 하소서.\n\n2. 인권 주일을 맞아, 인간 존엄성 회복을 위하여 기도합시다.\n\n보호자이신 주님, 주님의 모습으로 지어진 저희를 돌보시어, 이기적인 욕심을 내려놓게 하시며, 편견과 차별의 벽을 허물고 인간의 존엄성을 살리는 데 기쁘게 연대하게 하소서.\n\n3. 어머니나 아버지가 없는 가정을 위하여 기도합시다.\n\n사랑이신 주님, 어머니나 아버지가 없는 가정들을 도와주시어, 그들 곁에 교회가 늘 함께하게 하시고, 그들이 어려울 때마다 신앙 안에서 힘을 얻게 하소서.\n\n4. 교구(대리구, 수도회) 공동체를 위하여 기도합시다.\n\n진리이신 주님, 저희 교구(대리구, 수도회) 공동체를 이끌어 주시어, 사회 교리 주간을 맞아 사회 교리의 중요성을 깊이 깨닫고 그 가르침을 올바로 배우며, 삶의 자리에서 이를 실천하도록 이끌어 주소서.","예물 기도":"주님,\n비천한 저희가 드리는 기도와 제물을 굽어보시어\n아무런 공덕이 없는 저희를 너그러이 보호하시며 도와주소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"바룩 5,5; 4,36\n예루살렘아, 일어나 높은 곳에 서서, 하느님에게서 너에게 오는 기쁨을 바라보아라.","영성체 후 묵상":"새 하늘과 새 땅을 기다리고 있는 우리에게 베드로 사도는 이렇게 말합니다. “여러분은 어떤 사람이 되어야 하겠습니까? 거룩하고 신심 깊은 생활을 하면서, 하느님의 날이 오기를 기다리고 그날을 앞당기도록 해야 하지 않겠습니까?” 우리는 모두 베드로 사도의 권고대로 티 없고 흠 없는 사람으로 평화로이 주님 앞에 나설 수 있도록 힘써야 하겠습니다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 신비로운 제사에 참여한 저희를 생명의 양식으로 기르시니\n저희가 지상 것을 슬기롭게 헤아리며\n끊임없이 천상 것을 찾도록 가르쳐 주소서.\n우리 주 그리스도를 통하여 비나이다.","오늘의 묵상":"존경하는 신부님과 함께 몇 년 동안 생활하면서 사람을 입체적으로 바라보는 시각을 배웠습니다. 어느 한 순간만으로는 그 사람 전체를 알 수 없다는 것입니다. 삶에 굴곡이 없는 사람이 없고, 누구에게나 좋은 때와 어려운 때가 있기 때문입니다.\n대림 제2주일인 오늘 제1독서와 화답송과 복음에서 공통으로 나오는 낱말은 ‘길’입니다. “너희는 주님의 길을 마련하여라. 그분의 길을 곧게 내어라”(마르 1,3). 이사야 예언자는 바빌론 유배의 절망 속에서 희망을 선포하였고, 세례자 요한은 그 말씀을 인용하며 예수님을 맞이할 준비를 하라고 외칩니다.\n주님의 길을 마련한다는 것은 무슨 뜻일까요. 이와 관련하여 오늘 제1독서를 묵상하고 싶습니다. “골짜기는 모두 메워지고, 산과 언덕은 모두 낮아져라. 거친 곳은 평지가 되고, 험한 곳은 평야가 되어라”(이사 40,4). 이는 깊은 골짜기 같은 고통 속에 살아가는 이, 높은 산과 언덕처럼 버거운 목표로 숨이 차는 이, 거칠고 메마른 마음 때문에 하느님께 나아가지 못하는 이들을 일깨우는 말씀으로 이해할 수 있습니다. 삶의 여러 굴곡을 겪으며 살아가는 우리에게 회개하여 주님을 맞이할 길을 마련하라고 초대하는 말씀입니다.\n회개는 주님을 맞이하는 자세에서 시작합니다. 어떤 처지에 있든지 예수님을 바라보고 그분의 뜻을 흔쾌히 따를 때 우리의 길은 곧게 될 것입니다. 우리 노력뿐만 아니라 우리가 기다리는 주님에 대한 희망도 골짜기를 메우고 산과 언덕을 낮추는 힘이 됩니다. 새 하늘과 새 땅은 먼 훗날만의 약속이 아니라 지금부터 살아가야 할 삶의 방식임을 기억하며, 희망을 품고 우리 마음 안에 주님의 길을 마련합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261207":{"d":"2026년 12월 07일 월요일","c":"백","t":"성 암브로시오 주교 학자 기념일","o":[],"n":"","g":"","i":"암브로시오 성인은 340년 무렵 이탈리아 트레비리(현재 독일의 트리어)의 로마인 가문에서 태어나고 자랐다. 일찍부터 법학을 공부한 그는 변호사로 활동하였고, 로마에서 공직 생활도 하였다. 그러다 이탈리아 밀라노의 주교로 선임되고, 그 뒤 아리우스파에 맞서 올바른 신앙 교리를 옹호하였다.\n그는 특히 전례와 성직의 개혁을 꾸준히 실행하였으며, 한편으로는 황제의 간섭을 물리치고자 노력하였다. 암브로시오 주교의 훌륭한 성품과 탁월한 강론은 마니교의 이단에 깊이 빠져 있던 아우구스티노 성인을 교회로 이끌기도 하였다. 성인은 397년에 세상을 떠났는데, 예로니모 성인과 아우구스티노 성인, 그리고 대 그레고리오 성인과 함께 ‘서방 교회의 4대 교회 학자’로 칭송받고 있다.","s":{"입당송":"집회 15,5 참조\n주님이 그를 지혜와 지식의 영으로 충만하게 하시어, 회중 가운데에서 그의 입을 열어 주시고, 영광의 옷을 입혀 주셨네.","본기도":"하느님,\n복된 암브로시오 주교를 가톨릭 신앙의 스승으로 세우시어\n사도의 용기를 보여 주게 하셨으니\n교회 안에서 하느님 마음에 드는 사람들을 뽑으시어\n용감하고 지혜롭게 교회를 이끌어 가게 하소서.\n성부와 성령과 …….","제1독서":"<하느님께서 오시어 너희를 구원하신다.>\n▥ 이사야서의 말씀입니다.\n35,1-10\n1 광야와 메마른 땅은 기뻐하여라. 사막은 즐거워하며 꽃을 피워라.\n2 수선화처럼 활짝 피고 즐거워 뛰며 환성을 올려라.\n레바논의 영광과, 카르멜과 사론의 영화가 그곳에 내려\n그들이 주님의 영광을, 우리 하느님의 영화를 보리라.\n3 너희는 맥 풀린 손에 힘을 불어넣고 꺾인 무릎에 힘을 돋우어라.\n4 마음이 불안한 이들에게 말하여라.\n“굳세어져라, 두려워하지 마라. 보라, 너희의 하느님을!\n복수가 들이닥친다, 하느님의 보복이!\n그분께서 오시어 너희를 구원하신다.”\n5 그때에 눈먼 이들은 눈이 열리고 귀먹은 이들은 귀가 열리리라.\n6 그때에 다리저는 이는 사슴처럼 뛰고 말못하는 이의 혀는 환성을 터뜨리리라.\n광야에서는 물이 터져 나오고 사막에서는 냇물이 흐르리라.\n7 뜨겁게 타오르던 땅은 늪이 되고 바싹 마른 땅은 샘터가 되며\n승냥이들이 살던 곳에는 풀 대신 갈대와 왕골이 자라리라.\n8 그곳에 큰길이 생겨 ‘거룩한 길’이라 불리리니\n부정한 자는 그곳을 지나지 못하리라.\n그분께서 그들을 위해 앞장서 가시니 바보들도 길을 잃지 않으리라.\n9 거기에는 사자도 없고 맹수도 들어서지 못하리라.\n그런 것들을 볼 수 없으리라.\n구원받은 이들만 그곳을 걸어가고\n10 주님께서 해방시키신 이들만 그리로 돌아오리라.\n그들은 환호하며 시온에 들어서리니 끝없는 즐거움이 그들 머리 위에 넘치고\n기쁨과 즐거움이 그들과 함께하여 슬픔과 탄식이 사라지리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 85(84),9ㄱㄴㄷ과 10.11-12.13-14(◎ 이사 35,4ㄷㅂ 참조)\n◎ 보라, 우리 하느님이 오시어 우리를 구원하시리라.\n○ 하느님 말씀을 나는 듣고자 하노라. 당신 백성, 당신께 충실한 이에게, 주님은 진정 평화를 말씀하신다. 그분을 경외하는 이에게 구원이 가까우니, 영광은 우리 땅에 머물리라. ◎\n○ 자애와 진실이 서로 만나고, 정의와 평화가 입을 맞추리라. 진실이 땅에서 돋아나고, 정의가 하늘에서 굽어보리라. ◎\n○ 주님이 복을 베푸시어, 우리 땅이 열매를 내리라. 정의가 그분 앞을 걸어가고, 그분은 그 길로 나아가시리라. ◎","복음 환호송":"◎ 알렐루야.\n○ 보라, 세상의 주인이신 임금님이 오시어 사로잡힌 우리의 멍에를 몸소 벗겨 주시리라.\n◎ 알렐루야.","복음":"<우리가 오늘 신기한 일을 보았다.>\n✠ 루카가 전한 거룩한 복음입니다.\n5,17-26\n17 하루는 예수님께서 가르치고 계셨는데,\n갈릴래아와 유다의 모든 마을과 예루살렘에서 온\n바리사이들과 율법 교사들도 앉아 있었다.\n예수님께서는 주님의 힘으로 병을 고쳐 주기도 하셨다.\n18 그때에 남자 몇이 중풍에 걸린 어떤 사람을 평상에 누인 채 들고 와서,\n예수님 앞으로 들여다 놓으려고 하였다.\n19 그러나 군중 때문에 그를 안으로 들일 길이 없어\n지붕으로 올라가 기와를 벗겨 내고,\n평상에 누인 그 환자를 예수님 앞 한가운데로 내려보냈다.\n20 예수님께서 그들의 믿음을 보시고 말씀하셨다.\n“사람아, 너는 죄를 용서받았다.”\n21 율법 학자들과 바리사이들은 의아하게 생각하기 시작하였다.\n‘저 사람은 누구인데 하느님을 모독하는 말을 하는가?\n하느님 한 분 외에 누가 죄를 용서할 수 있단 말인가?’\n22 예수님께서는 그들의 생각을 아시고 대답하셨다.\n“너희는 어찌하여 마음속으로 의아하게 생각하느냐?\n23 ‘너는 죄를 용서받았다.’ 하고 말하는 것과\n‘일어나 걸어가라.’ 하고 말하는 것 가운데에서 어느 쪽이 더 쉬우냐?\n24 이제 사람의 아들이 땅에서 죄를 용서하는 권한을 가지고 있음을\n너희가 알게 해 주겠다.”\n그러고 나서 중풍에 걸린 이에게 말씀하셨다.\n“내가 너에게 말한다. 일어나 네 평상을 가지고 집으로 가거라.”\n25 그러자 그는 그들 앞에서 즉시 일어나 자기가 누워 있던 것을 들고,\n하느님을
