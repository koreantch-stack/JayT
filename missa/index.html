<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매일미사</title>
<style>
:root{--tfs:22px;--bg:#fffdf6;--ink:#141414;--sub:#555;--line:#cfc8b4;--btn:#1f3a5f;--btnink:#fff;--accent:#8a1c1c;--soft:#f1ecdc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:22px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.7;word-break:keep-all}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
@media (min-width:820px){.wrap{max-width:none;padding:12px 4vw 40px}#app>*{max-width:760px;margin-left:auto;margin-right:auto}#app>.more{display:block}#app>.body{max-width:none}#app>.bh{max-width:none;margin-left:0;margin-right:0}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:1.35rem;margin:0}
.fsbox{display:flex;gap:6px}
.fsbox{flex:none}
.fsbox button{font-size:1rem;line-height:1;padding:0 8px;display:flex;align-items:center;justify-content:center;min-width:54px;height:48px;border:2px solid var(--btn);background:#fff;color:var(--btn);border-radius:10px;font-weight:700}
.btn{display:block;width:100%;min-height:58px;padding:10px 14px;border:0;border-radius:12px;background:var(--btn);color:var(--btnink);font-weight:700;text-align:center;text-decoration:none}
.btn.alt{background:#fff;color:var(--btn);border:2px solid var(--btn)}
.today{margin:6px 0 12px}
.cal{width:100%;border-collapse:separate;border-spacing:5px}
.cal th{font-size:.9rem;padding:4px 0;color:var(--sub)}
.cal th.sun,.cal td.sun .n{color:var(--accent)}
.cal td{padding:0}
.cell{width:100%;height:68px;border:2px solid var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.cell .n{font-size:1.1rem;font-weight:700;line-height:1}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #777;display:block}
.c-백{background:#fff;border-color:#8a8a8a}.c-녹{background:#2e8b3d;border-color:#1f6a2b}.c-홍{background:#c62828;border-color:#8f1d1d}.c-자{background:#6a3fa0;border-color:#4b2b78}
.cell.major{background:#fff3c4;border-color:#b08a00;border-width:3px}
.cell.now{outline:4px solid var(--btn);outline-offset:1px}
.cell.none{opacity:.35}
.cell.past{opacity:.35;background:#eee;border-color:#ccc}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--sub);margin:8px 2px 4px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #777}
.legend b{display:inline-block;width:18px;height:14px;background:#fff3c4;border:2px solid #b08a00;border-radius:4px}
h2.sec{font-size:1.1rem;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{font-size:.9rem;min-height:64px;line-height:1.35}
.note{font-size:.75rem;color:var(--sub);margin-top:6px}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.bar .btn{min-height:54px;font-size:.9rem;padding:6px}
.head .date{font-size:.95rem;color:var(--sub)}
.head .title{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:10px;margin:2px 0}
.head .title .dot{flex:none}
.opt{font-size:.85rem;color:var(--sub)}
.intro{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:10px 0;white-space:pre-line}
.mset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tab{min-height:58px;padding:6px;border:2px solid var(--btn);background:#fff;color:var(--btn);border-radius:12px;font-weight:700;font-size:.92rem;line-height:1.25}
.tab.on{background:var(--btn);color:#fff}
.more{width:100%;margin:2px 0 6px;min-height:50px;border:2px dashed var(--btn);background:transparent;color:var(--btn);border-radius:12px;font-weight:700}
.tabs.small .tab{min-height:50px;font-size:.82rem;border-color:#6b7c93;color:#2c4263}
.tabs.small .tab.on{background:#2c4263;color:#fff}
.body{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 14px 18px;margin-top:8px;font-size:var(--tfs)}
.body h3{margin:0 0 8px;font-size:1.05em;color:var(--btn)}
.body p{margin:0}
.ln{display:block;margin:0 0 .45em}
.lead{color:var(--sub);font-size:.88em}
.kind{font-weight:700;margin-top:.6em}
.ref{font-weight:700;color:var(--accent)}
.rf{font-weight:700;color:var(--accent)}
.vn{font-size:.7em;vertical-align:super;color:var(--sub);margin-right:.25em;font-weight:700}
.gap{height:.6em}
.foot{margin-top:26px;font-size:.72rem;color:var(--sub);line-height:1.5}
.pbig{display:block;width:100%;min-height:84px;margin:0 0 12px;padding:12px 16px;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:1.1rem;line-height:1.4;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.plist{display:block;width:100%;min-height:64px;margin:0 0 10px;padding:12px 16px;border:2px solid var(--line);border-left-width:10px;border-left-color:var(--btn);border-radius:12px;background:#fff;color:var(--ink);font-weight:700;font-size:1rem;line-height:1.4;text-align:left;text-decoration:none}
.prep{margin:18px 16px;padding:28px 18px;border:2px dashed #bbb;border-radius:12px;text-align:center;font-size:1.15rem;font-weight:700;line-height:1.7;color:var(--sub)}
.calhint{margin:0 0 12px;text-align:center;font-size:.95rem;font-weight:700;color:var(--sub);line-height:1.4}
.plist small{display:block;font-weight:400;font-size:.7rem;color:var(--sub)}
.ptitle{font-size:1.25rem;font-weight:700;margin:6px 0 10px;line-height:1.4}
.ptext .ln{margin-bottom:.35em}
.msw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.mnav{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;margin:0 0 10px}
.mnav .mt{text-align:center;font-size:1.3rem;font-weight:700}
.mnav .mb{height:60px;border:2px solid var(--btn);background:#fff;color:var(--btn);border-radius:12px;font-weight:700;font-size:1.1rem}
.mnav .mb:disabled{opacity:.3}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.bh h3,.bh .ptitle{margin:0;flex:1}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = {"20261101":{"d":"2026년 11월 01일 일요일","c":"백","t":"모든 성인 대축일","o":[],"n":"","g":"대영광송 · 신경 · 교중","i":"오늘은 하늘 나라의 모든 성인을 기리는 대축일로, 하느님과 함께 영광을 누리는 성인들의 모범을 본받고자 다짐하는 날이다. 특히 전례력에 축일이 따로 지정되지 않은 성인들을 기억하고 기린다. 이 축일은 동방 교회에서 먼저 시작되어 609년 성 보니파시오 4세 교황 때부터 서방 교회에서도 지내게 되었다. 처음에는 5월 13일이었는데, 9세기 중엽에 11월 1일로 바뀌었다. 교회는 이날 그리스도인들에게 죽음 뒤의 새로운 삶을 바라며 살아가도록 미래의 영광스러운 모습을 보여 주고, 우리와 하늘 나라의 모든 성인 사이의 연대성도 깨우쳐 준다.","s":{"오늘 전례":"오늘은 모든 성인 대축일입니다. 성인들은 하늘 나라에서 하느님을 직접 뵈며 영원한 행복을 누립니다. 하늘 나라의 성인들을 기리며 전구를 청합시다. 예수 그리스도의 죽음과 부활을 굳게 믿는 우리도, 희망을 안고 성인들처럼 하느님을 뵐 그날까지 열심히 살아갑시다.","입당송":"주님 안에서 다 함께 기뻐하세. 모든 성인을 공경하며 축제를 지내세. 천사들도 이 큰 축제를 기뻐하며, 하느님의 아드님을 찬양하네.","본기도":"전능하시고 영원하신 하느님,\n이 성대한 축제로 모든 성인의 공덕을 기리게 하셨으니\n성인들의 전구를 들으시고\n저희가 바라던 하느님의 자비를 풍성히 베풀어 주소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<내가 보니, 아무도 수를 셀 수 없을 만큼 큰 무리가 있었습니다. 그들은 모든 민족과 종족과 백성과 언어권에서 나온 사람들이었습니다.>\n▥ 요한 묵시록의 말씀입니다.\n7,2-4.9-14\n나 요한은 2 다른 한 천사가 살아 계신 하느님의 인장을 가지고\n해 돋는 쪽에서 올라오는 것을 보았습니다.\n그가 땅과 바다를 해칠 권한을 받은 네 천사에게 큰 소리로 외쳤습니다.\n3 “우리가 우리 하느님의 종들의 이마에 인장을 찍을 때까지\n땅도 바다도 나무도 해치지 마라.”\n4 나는 인장을 받은 이들의 수가 십사만 사천 명이라고 들었습니다.\n인장을 받은 이들은\n이스라엘 자손들의 모든 지파에서 나온 사람들이었습니다.\n9 그다음에 내가 보니, 아무도 수를 셀 수 없을 만큼 큰 무리가 있었습니다.\n모든 민족과 종족과 백성과 언어권에서 나온 그들은,\n희고 긴 겉옷을 입고 손에는 야자나무 가지를 들고서\n어좌 앞에 또 어린양 앞에 서 있었습니다.\n10 그들이 큰 소리로 외쳤습니다.\n“구원은 어좌에 앉아 계신 우리 하느님과 어린양의 것입니다.”\n11 그러자 모든 천사가 어좌와 원로들과 네 생물 둘레에 서 있다가,\n어좌 앞에 얼굴을 땅에 대고 엎드려 하느님께 경배하며 12 말하였습니다.\n“아멘. 우리 하느님께 찬미와 영광과 지혜와 감사와 영예와 권능과 힘이\n영원무궁하기를 빕니다. 아멘.”\n13 그때에 원로 가운데 하나가,\n“희고 긴 겉옷을 입은 저 사람들은 누구이며 어디에서 왔느냐?” 하고\n나에게 물었습니다.\n14 “원로님, 원로님께서 알고 계시지 않습니까?” 하고\n내가 대답하였더니, 그가 나에게 말하였습니다.\n“저 사람들은 큰 환난을 겪어 낸 사람들이다.\n저들은 어린양의 피로 자기들의 긴 겉옷을 깨끗이 빨아 희게 하였다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 24(23),1-2.3-4ㄱㄴ.5-6(◎ 6 참조)\n◎ 주님, 이들이 당신 얼굴을 찾는 세대이옵니다.\n○ 주님의 것이라네, 온 땅과 그 안에 가득 찬 것들, 온 누리와 그 안에 사는 것들. 그분이 물 위에 세우시고, 강 위에 굳히셨네. ◎\n○ 누가 주님의 산에 오를 수 있으랴? 누가 그 거룩한 곳에 설 수 있으랴? 손이 깨끗하고 마음이 결백한 이, 헛된 것에 정신을 팔지 않는 이라네. ◎\n○ 그는 주님께 복을 받으리라. 구원의 하느님께 의로움을 얻으리라. 이들이 야곱이라네. 그분을 찾는 세대, 그분 얼굴을 찾는 세대라네. ◎","제2독서":"<우리는 하느님을 있는 그대로 뵙게 될 것입니다.>\n▥ 요한 1서의 말씀입니다.\n3,1-3\n사랑하는 여러분,\n1 아버지께서 우리에게 얼마나 큰 사랑을 주시어\n우리가 하느님의 자녀라 불리게 되었는지 생각해 보십시오.\n과연 우리는 그분의 자녀입니다.\n세상이 우리를 알지 못하는 까닭은\n세상이 그분을 알지 못하였기 때문입니다.\n2 사랑하는 여러분, 이제 우리는 하느님의 자녀입니다.\n우리가 어떻게 될지는 아직 드러나지 않았지만,\n그분께서 나타나시면 우리도 그분처럼 되리라는 것은 알고 있습니다.\n그분을 있는 그대로 뵙게 될 것이기 때문입니다.\n3 그분께 이러한 희망을 두는 사람은 모두,\n그리스도께서 순결하신 것처럼 자신도 순결하게 합니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마태 11,28 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 고생하며 무거운 짐을 진 너희는 모두 나에게 오너라. 내가 너희에게 안식을 주리라.\n◎ 알렐루야.","복음":"<기뻐하고 즐거워하여라. 너희가 하늘에서 받을 상이 크다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n5,1-12ㄴ\n그때에 1 예수님께서는 군중을 보시고 산으로 오르셨다.\n그분께서 자리에 앉으시자 제자들이 그분께 다가왔다.\n2 예수님께서 입을 여시어 그들을 이렇게 가르치셨다.\n3 “행복하여라, 마음이 가난한 사람들! 하늘 나라가 그들의 것이다.\n4 행복하여라, 슬퍼하는 사람들! 그들은 위로를 받을 것이다.\n5 행복하여라, 온유한 사람들! 그들은 땅을 차지할 것이다.\n6 행복하여라, 의로움에 주리고 목마른 사람들! 그들은 흡족해질 것이다.\n7 행복하여라, 자비로운 사람들! 그들은 자비를 입을 것이다.\n8 행복하여라, 마음이 깨끗한 사람들! 그들은 하느님을 볼 것이다.\n9 행복하여라, 평화를 이루는 사람들! 그들은 하느님의 자녀라 불릴 것이다.\n10 행복하여라, 의로움 때문에 박해를 받는 사람들!\n하늘 나라가 그들의 것이다.\n11 사람들이 나 때문에 너희를 모욕하고 박해하며,\n너희를 거슬러 거짓으로 온갖 사악한 말을 하면, 너희는 행복하다!\n12 기뻐하고 즐거워하여라. 너희가 하늘에서 받을 상이 크다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n의로우신 주님, 교회에 진리의 빛을 비추시어, 세상 모든 이가 이기심의 유혹에 빠지지 않고 부를 올바로 사용하며, 언제나 공동선에 봉사하고 가난한 이들과 연대하도록 이끌게 하소서.\n\n2. 세계 평화를 위하여 기도합시다.\n\n인자하신 주님, 평화를 바라면서도 전쟁이 끊이지 않는 이 세계를 굽어보시어, 이해관계와 이익을 좇아 다투기보다, 대화로 갈등을 풀며 평화로이 살아가게 하소서.\n\n3. 부부들을 위하여 기도합시다.\n\n사랑의 근원이신 주님, 세상 부부들을 돌보아 주시어, 주님께서 주시는 생명을 소중히 받아들이고, 주님의 일에 온마음으로 참여하는 주님 사랑의 증인이 되게 하소서.\n\n4. 교구(대리구, 수도회) 공동체를 위하여 기도합시다.\n\n인도자이신 주님, 저희 교구(대리구, 수도회) 공동체를 굽어살피시어, 공동체가 주님만을 바라며 자신을 오롯이 바친 성인들을 본받아, 주님 뜻에 맞갖게 나아가도록 도와주소서.","예물 기도":"주님,\n모든 성인을 공경하며 드리는 이 예물을 기꺼이 받으시고\n언제나 주님과 함께 살고 있는 성인들의 전구로\n저희도 영원한 구원에 이르게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<성인 감사송 3 : 우리의 어머니인 예루살렘의 영광>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서 오늘 저희 어머니인 천상 도읍 예루살렘을 보여 주시니\n거기서 저희 형제들은 이미 승리의 월계관을 받아 쓰고\n아버지를 영원히 기리고 있나이다.\n나약한 저희도 성인들의 뒤를 따라 영광을 기뻐하며\n그들의 도움과 모범으로 힘을 얻어\n활기찬 믿음으로 영원한 고향을 향하여\n나그넷길을 서두르고 있나이다.\n그들의 모범은 나약한 저희에게 힘이 되나이다.\n그러므로 저희도 모든 성인과 천사와 함께\n주님을 찬미하며 기쁨에 넘쳐 큰 소리로 외치나이다.","영성체송":"마태 5,8-10\n행복하여라, 마음이 깨끗한 사람들! 그들은 하느님을 보리라. 행복하여라, 평화를 이루는 사람들! 그들은 하느님의 자녀라 불리리라. 행복하여라, 의로움 때문에 박해를 받는 사람들! 하늘 나라가 그들의 것이다.","영성체 후 묵상":"“행복하여라, 마음이 가난한 사람들! 하늘 나라가 그들의 것이다.” 누구나 알고 있지만 듣는 이에 따라 울림이 다른 예수님의 말씀입니다. 성인들은 예수님의 말씀대로 마음이 가난한 삶을 산 이들입니다. 예수님 때문에 모욕과 박해를 받으면서도 기뻐하고 즐거워한 이들입니다. 우리도 성인들처럼 살아가기로 굳게 다짐하며 성인들의 전구를 청합시다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"홀로 거룩하시고 놀라우신 하느님,\n모든 성인과 함께 하느님을 경배하며 은총을 간청하오니\n저희가 하느님의 넘치는 사랑으로 거룩하게 되어\n현세의 나그네 식탁에서 천상 고향의 잔치로 건너가게 하소서.\n우리 주 그리스도를 통하여 비나이다.","오늘의 묵상":"흔히 “지금 나는 행복한가?”라고 스스로 물을 때, 우리는 먼저 심리적 차원으로 접근하고는 합니다. 예를 들어 내가 지금 만족감을 느끼고 있는지, 또는 지금 기분이 좋은 상태인지를 생각합니다. 우리가 삶에서 느끼는 만족감과 좋은 기분은 분명 인간적으로 중요한 가치입니다. 그러나 오늘 복음 속 예수님께서는 우리에게 ‘참행복’이 무엇인지 새롭게 가르쳐 주십니다. 참행복이란 우리 눈길을 하느님께 돌릴 때 찾을 수 있다고 알려 주십니다.\n고대 그리스 철학자 아리스토텔레스는 행복을 덕을 통하여 인간적 번영을 이룬 상태로 보았습니다. 그러나 오늘 복음은 우리에게 행복이란 하느님을 소유함으로써(민수 18,20 참조) 완전해지는 상태라는 진리를 가르칩니다.\n만일 남들보다 가진 것이 훨씬 많은데, 하느님 나라가 약속되어 있지 않다면? 만일 남들보다 더 큰 힘을 가지고 있는데, 하느님의 자녀라고 불릴 수 없다면? 만일 지금의 삶이 너무나 만족스러운데, 하느님과 멀어져 있다면? 과연 참으로 행복한 사람이라고 할 수 있을까요?\n가난하고, 슬퍼하고, 박해받는 사람들은 행복해 보이지 않습니다. 그럼에도 예수님께서는 그들에게 행복을 선언하십니다. 그 까닭은 현재의 고통이 좋은 것이어서가 아니라, 그들에게 하느님 나라가 약속되어 있기 때문입니다.\n그러니 내가 지금 행복한지를 물을 때, 현재 우리가 놓인 상태에 만족하는지 여부가 아니라, 우리가 하느님의 자녀로서 누리게 될 하느님 나라를 생각할 수 있으면 좋겠습니다. 참행복은 현재의 내 감정 상태가 아니라, 하느님께서 우리의 몫이 되어 주시겠다는 약속에서 오기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261102":{"d":"2026년 11월 02일 월요일","c":"자","t":"죽은 모든 이를 기억하는 위령의 날","o":[],"n":"","g":"","i":"‘죽은 모든 이를 기억하는 위령의 날’은 죽은 모든 이의 영혼, 특히 연옥 영혼들이 하루빨리 하느님 나라에 들어갈 수 있도록 기도하는 날이다. 전통적으로 교회는 오늘 세 대의 위령 미사를 봉헌해 왔다. 이러한 특전은 15세기 에스파냐의 도미니코 수도회에서 시작되었다. 교회는 ‘모든 성인 대축일’인 11월 1일부터 8일까지 묘지를 방문하여 세상을 떠난 이들을 위해서 기도할 것을 권장하고 있다.\n\n<이날의 독서는 『미사 독서』 Ⅳ(‘죽은 이를 위한 미사’)에서 선택하여 봉독할 수도 있다.>","m":[{"l":"첫째 미사","s":{"입당송":"1테살 4,14; 1코린 15,22 참조\n예수님이 돌아가셨다가 다시 살아나셨듯이, 하느님은 예수님을 통하여 죽은 이들을 예수님과 함께 데려가시리라. 아담 안에서는 모든 사람이 죽었지만, 그리스도 안에서는 모든 사람이 살아나리라.","본기도":"주님,\n성자께서 죽음에서 부활하시어 저희의 믿음을 깊게 하셨으니\n저희의 기도를 인자로이 들으시고\n저희도 세상을 떠난 주님의 종들과 더불어\n그리스도와 함께 부활하리라는 굳건한 희망을 지니게 하소서.\n성부와 성령과 …….","제1독서":"<나는 알고 있다네, 나의 구원자께서 살아 계심을.>\n▥ 욥기의 말씀입니다.\n19,1.23-27ㄴ\n1 욥이 말을 받았다.\n23 “아, 제발 누가 나의 이야기를 적어 두었으면!\n제발 누가 비석에다 기록해 주었으면!\n24 철필과 납으로 바위에다 영원히 새겨 주었으면!\n25 그러나 나는 알고 있다네, 나의 구원자께서 살아 계심을.\n그분께서는 마침내 먼지 위에서 일어서시리라.\n26 내 살갗이 이토록 벗겨진 뒤에라도 이 내 몸으로 나는 하느님을 보리라.\n27 내가 기어이 뵙고자 하는 분,\n내 눈은 다른 이가 아니라 바로 그분을 보리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 27(26),1.4.7과 8ㄷ과 9ㄱ.13-14(◎ 1ㄱ 또는 13)\n◎ 주님은 나의 빛, 나의 구원이시다.\n또는\n◎ 저는 산 이들의 땅에서 주님의 어지심을 보리라 믿나이다.\n○ 주님은 나의 빛, 나의 구원. 나 누구를 두려워하랴? 주님은 내 생명의 요새. 나 누구를 무서워하랴? ◎\n○ 주님께 청하는 오직 한 가지, 나 그것을 얻고자 하니, 내 한평생 주님의 집에 살며, 주님의 아름다움 바라보고, 그분의 성전 우러러보는 것이라네. ◎\n○ 주님, 부르짖는 제 소리 들어 주소서. 자비를 베푸시어 응답하소서. 제가 당신 얼굴을 찾고 있나이다. 당신 얼굴 제게서 감추지 마소서. ◎\n○ 저는 산 이들의 땅에서, 주님의 어지심을 보리라 믿나이다. 주님께 바라라. 힘내어 마음을 굳게 가져라. 주님께 바라라. ◎","제2독서":"<그리스도의 피로 의롭게 된 우리는 그분을 통하여 하느님의 진노에서 구원을 받게 될 것입니다.>\n▥ 사도 바오로의 로마서 말씀입니다.\n5,5-11\n형제 여러분, 5 희망은 우리를 부끄럽게 하지 않습니다.\n우리가 받은 성령을 통하여\n하느님의 사랑이 우리 마음에 부어졌기 때문입니다.\n6 우리가 아직 나약하던 시절,\n그리스도께서는 정해진 때에 불경한 자들을 위하여 돌아가셨습니다.\n7 의로운 이를 위해서라도 죽을 사람은 거의 없습니다.\n혹시 착한 사람을 위해서라면 누가 죽겠다고 나설지도 모릅니다.\n8 그런데 우리가 아직 죄인이었을 때에\n그리스도께서 우리를 위하여 돌아가심으로써,\n하느님께서는 우리에 대한 당신의 사랑을 증명해 주셨습니다.\n9 그러므로 이제 그분의 피로 의롭게 된 우리가 그분을 통하여\n하느님의 진노에서 구원을 받게 되리라는 것은 더욱 분명합니다.\n10 우리가 하느님의 원수였을 때에\n그분 아드님의 죽음으로 그분과 화해하게 되었다면,\n화해가 이루어진 지금 그 아드님의 생명으로 구원을 받게 되리라는 것은\n더욱 분명합니다.\n11 그뿐 아니라 우리는 또한 우리 주 예수 그리스도를 통하여 하느님을 자랑합니다.\n이 그리스도를 통하여 이제 화해가 이루어진 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마태 25,34 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 내 아버지께 복을 받은 이들아 와서, 세상 창조 때부터 너희를 위하여 준비된 나라를 차지하여라.\n◎ 알렐루야.","복음":"<기뻐하고 즐거워하여라. 너희가 하늘에서 받을 상이 크다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n5,1-12ㄴ\n그때에 1 예수님께서는 군중을 보시고 산으로 오르셨다.\n그분께서 자리에 앉으시자 제자들이 그분께 다가왔다.\n2 예수님께서 입을 여시어 그들을 이렇게 가르치셨다.\n3 “행복하여라, 마음이 가난한 사람들! 하늘 나라가 그들의 것이다.\n4 행복하여라, 슬퍼하는 사람들! 그들은 위로를 받을 것이다.\n5 행복하여라, 온유한 사람들! 그들은 땅을 차지할 것이다.\n6 행복하여라, 의로움에 주리고 목마른 사람들! 그들은 흡족해질 것이다.\n7 행복하여라, 자비로운 사람들! 그들은 자비를 입을 것이다.\n8 행복하여라, 마음이 깨끗한 사람들! 그들은 하느님을 볼 것이다.\n9 행복하여라, 평화를 이루는 사람들! 그들은 하느님의 자녀라 불릴 것이다.\n10 행복하여라, 의로움 때문에 박해를 받는 사람들!\n하늘 나라가 그들의 것이다.\n11 사람들이 나 때문에 너희를 모욕하고 박해하며,\n너희를 거슬러 거짓으로 온갖 사악한 말을 하면, 너희는 행복하다!\n12 기뻐하고 즐거워하여라. 너희가 하늘에서 받을 상이 크다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n인도자이신 주님, 지상의 나그네인 교회를 굽어보시어, 그리스도의 가르침을 충실히 따르며 하느님 나라의 기쁨을 미리 맛볼 수 있는 은총을 베풀어 주소서.\n\n2. 세계 지도자들을 위하여 기도합시다.\n\n의로우신 주님, 세계 지도자들을 주님의 정의로 이끌어 주시어, 인간의 생명과 자유와 행복을 무엇보다 먼저 생각하고, 창조된 모든 것을 조화롭게 지켜 나가도록 도와주소서.\n\n3. 가족을 잃은 이들을 위하여 기도합시다.\n\n위로자이신 주님, 사랑하는 가족을 떠나보내고 힘겨워하는 이들을 위로하시어, 그들이 십자가 아래 성모님을 기억하며, 부활의 희망으로 고통을 이겨 내게 하소서.\n\n4. 본당 공동체를 위하여 기도합시다.\n\n자비하신 주님, 위령의 날을 맞은 저희 본당 공동체를 살펴 주시어, 공동체 안에서 저희와 함께하다가 세상을 떠난 이들을 기억하며, 더욱더 열심히 기도하고, 다 함께 기쁘게 살아가게 하소서.","예물 기도":"주님,\n성자께서 세우신 사랑의 큰 성사로 하나 되어\n저희가 바치는 이 예물을 자비로이 굽어보시고\n세상을 떠난 주님의 종들이 성자와 함께 천상 영광을 누리게 하소서.\n성자께서는 영원히 …….","감사송":"<위령 감사송 1 : 그리스도 안에서 이루어진 부활의 희망>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 복된 부활의 희망을 주셨기에\n저희는 죽어야 할 운명을 슬퍼하면서도\n다가오는 영생의 약속으로 위로를 받나이다.\n주님, 믿는 이들에게는 죽음이 죽음이 아니요\n새로운 삶으로 옮아감이오니\n세상에서 깃들이던 이 집이 허물어지면\n하늘에 영원한 거처가 마련되나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"요한 11,25-26 참조\n주님이 말씀하신다. 나는 부활이요 생명이다. 나를 믿는 사람은 죽더라도 살고, 또 살아서 나를 믿는 모든 사람은 영원히 죽지 않으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n세상을 떠난 주님의 종들을 위하여 파스카의 신비를 거행하고 비오니\n그들을 빛과 평화의 나라로 이끌어 주소서.\n우리 주 …….","오늘의 묵상":"오늘은 우리보다 앞서 돌아가신 분들을 기억하며 그 영혼을 위하여 기도하는 날입니다. 전통적으로 교회는 이날 세 대의 미사를 봉헌해 왔습니다. 첫째 미사에서는 부활에 대한 굳건한 희망, 둘째 미사에서는 죽은 이들을 위한 하느님의 자비와 안식, 셋째 미사에서는 죽음을 준비하는 깨어 있는 삶에 대하여 묵상하게 됩니다.\n죽음과 관련하여 늘 짝꿍처럼 나오는 말이 ‘인간의 행복’입니다. 가톨릭 교회에서는 인간에게 영원한 행복은 죽음 이후의 삶에서 이루어지므로, 지금 이 땅에서는 그 영원한 행복으로 가는 통로인 죽음을 잘 준비해야 한다고 가르칩니다. 곧 영원한 행복을 기준으로 생각할 때, 삶과 죽음이 서로 관계없는 것이 아니라, 오히려 유기적으로 연결되어 있다는 진리를 알려 줍니다.\n오늘 복음은 우리가 흔히 ‘진복팔단’이라고 하였던 참행복에 관한 말씀입니다. 여기서 첫 번째 “행복하여라.”와 여덟 번째 “행복하여라.”의 결론은 “하늘 나라가 그들의 것이다.”(마태 5,3.10)입니다. 나머지 부분에서는 모두 결론이 미래형인데 이 두 부분의 결론만 현재형이라는 점에 주목해 볼 수 있습니다.\n이는 하늘 나라가 미래의 불투명한 약속이 아니라, 지금 우리가 이미 현세에서 맛볼 수 있으며 동시에 죽음 이후에 완성될 나라임을 뜻합니다. 그러니 사랑하는 형제자매 여러분! 이 첫째 미사를 통하여 지금 이 땅에서부터 부활에 대한 굳건한 희망을 가지면 좋겠습니다. 그 희망은 분명 우리를 하늘 나라의 영원한 행복으로 안내할 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},{"l":"둘째 미사","s":{"입당송":"4에즈 2,34-35 참조\n주님, 그들에게 영원한 안식을 주소서. 영원한 빛을 그들에게 비추소서.","본기도":"믿는 이들의 영광이시며 의로운 이들의 생명이신 하느님,\n성자의 죽음과 부활로 저희를 구원하셨으니\n세상을 떠난 하느님의 종들에게 자비를 베푸시어\n부활의 신비를 믿은 그들이 영원한 행복을 누리게 하소서.\n성부와 성령과 …….","제1독서":"<하느님께서는 번제물처럼 그들을 받아들이셨다.>\n▥ 지혜서의 말씀입니다.\n3,1-9\n1 의인들의 영혼은 하느님의 손안에 있어\n어떠한 고통도 겪지 않을 것이다.\n2 어리석은 자들의 눈에는 의인들이 죽은 것처럼 보이고\n그들의 말로가 고난으로 생각되며\n3 우리에게서 떠나는 것이 파멸로 여겨지지만 그들은 평화를 누리고 있다.\n4 사람들이 보기에 의인들이 벌을 받는 것 같지만\n그들은 불사의 희망으로 가득 차 있다.\n5 그들은 단련을 조금 받은 뒤 은혜를 크게 얻을 것이다.\n하느님께서 그들을 시험하시고\n그들이 당신께 맞갖은 이들임을 아셨기 때문이다.\n6 그분께서는 용광로 속의 금처럼 그들을 시험하시고\n번제물처럼 그들을 받아들이셨다.\n7 그분께서 그들을 찾아오실 때에 그들은 빛을 내고\n그루터기들만 남은 밭의 불꽃처럼 퍼져 나갈 것이다.\n8 그들은 민족들을 통치하고 백성들을 지배할 것이며\n주님께서는 그들을 영원히 다스리실 것이다.\n9 주님을 신뢰하는 이들은 진리를 깨닫고\n그분을 믿는 이들은 그분과 함께 사랑 속에 살 것이다.\n은총과 자비가 주님의 거룩한 이들에게 주어지고\n그분께서는 선택하신 이들을 돌보시기 때문이다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n▥ 지혜서의 말씀입니다.\n3,1-6.9\n1 의인들의 영혼은 하느님의 손안에 있어 어떠한 고통도 겪지 않을 것이다.\n2 어리석은 자들의 눈에는 의인들이 죽은 것처럼 보이고\n그들의 말로가 고난으로 생각되며\n3 우리에게서 떠나는 것이 파멸로 여겨지지만 그들은 평화를 누리고 있다.\n4 사람들이 보기에 의인들이 벌을 받는 것 같지만\n그들은 불사의 희망으로 가득 차 있다.\n5 그들은 단련을 조금 받은 뒤 은혜를 크게 얻을 것이다.\n하느님께서 그들을 시험하시고\n그들이 당신께 맞갖은 이들임을 아셨기 때문이다.\n6 그분께서는 용광로 속의 금처럼 그들을 시험하시고\n번제물처럼 그들을 받아들이셨다.\n9 주님을 신뢰하는 이들은 진리를 깨닫고\n그분을 믿는 이들은 그분과 함께 사랑 속에 살 것이다.\n은총과 자비가 주님의 거룩한 이들에게 주어지고\n그분께서는 선택하신 이들을 돌보시기 때문이다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 116(114─115),5-6.10-11.15와 16ㄱㄴㄹ(◎ 9)\n◎ 나는 주님 앞에서 걸어가리라. 살아 있는 이들의 땅에서 걸으리라.\n○ 주님은 너그럽고 의로우신 분, 우리 하느님은 자비를 베푸시네. 주님은 작은 이들을 지키시는 분, 가엾은 나를 구해 주셨네. ◎\n○ “나 참으로 비참하구나.” 되뇌면서도 나는 믿었네. 문득 놀라 나는 말하였네. “사람은 모두 거짓말쟁이.” ◎\n○ 주님께 성실한 이들의 죽음이, 주님 눈에는 참으로 소중하네. 아, 주님, 저는 당신의 종. 당신이 제 사슬을 풀어 주셨나이다. ◎","제2독서":"<죄가 많아진 그곳에 은총이 충만히 내렸습니다.>\n▥ 사도 바오로의 로마서 말씀입니다.\n5,17-21\n형제 여러분, 17 한 사람의 범죄로\n그 한 사람을 통하여 죽음이 지배하게 되었지만,\n은총과 의로움의 선물을 충만히 받은 이들은\n예수 그리스도 한 분을 통하여 생명을 누리며 지배할 것입니다.\n18 그러므로 한 사람의 범죄로 모든 사람이 유죄 판결을 받았듯이,\n한 사람의 의로운 행위로 모든 사람이 의롭게 되어 생명을 받습니다.\n19 한 사람의 불순종으로 많은 이가 죄인이 되었듯이,\n한 사람의 순종으로 많은 이가 의로운 사람이 될 것입니다.\n20 율법이 들어와 범죄가 많아지게 하였습니다.\n그러나 죄가 많아진 그곳에 은총이 충만히 내렸습니다.\n21 이는 죄가 죽음으로 지배한 것처럼,\n은총이 우리 주 예수 그리스도를 통하여\n영원한 생명을 가져다주는 의로움으로 지배하게 하려는 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마태 11,25 참조\n◎ 알렐루야.\n○ 하늘과 땅의 주님이신 아버지, 찬미받으소서. 아버지는 하늘 나라의 신비를 철부지들에게 드러내 보이셨나이다.\n◎ 알렐루야.","복음":"<나에게 오너라. 내가 너희에게 안식을 주겠다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n11,25-30\n25 그때에 예수님께서 이렇게 말씀하셨다.\n“아버지, 하늘과 땅의 주님,\n지혜롭다는 자들과 슬기롭다는 자들에게는 이것을 감추시고\n철부지들에게는 드러내 보이시니, 아버지께 감사드립니다.\n26 그렇습니다, 아버지! 아버지의 선하신 뜻이 이렇게 이루어졌습니다.”\n27 “나의 아버지께서는 모든 것을 나에게 넘겨주셨다.\n그래서 아버지 외에는 아무도 아들을 알지 못한다.\n또 아들 외에는, 그리고 그가 아버지를 드러내 보여 주려는 사람 외에는\n아무도 아버지를 알지 못한다.\n28 고생하며 무거운 짐을 진 너희는 모두 나에게 오너라.\n내가 너희에게 안식을 주겠다.\n29 나는 마음이 온유하고 겸손하니 내 멍에를 메고 나에게 배워라.\n그러면 너희가 안식을 얻을 것이다.\n30 정녕 내 멍에는 편하고 내 짐은 가볍다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n인도자이신 주님, 지상의 나그네인 교회를 굽어보시어, 그리스도의 가르침을 충실히 따르며 하느님 나라의 기쁨을 미리 맛볼 수 있는 은총을 베풀어 주소서.\n\n2. 세계 지도자들을 위하여 기도합시다.\n\n의로우신 주님, 세계 지도자들을 주님의 정의로 이끌어 주시어, 인간의 생명과 자유와 행복을 무엇보다 먼저 생각하고, 창조된 모든 것을 조화롭게 지켜 나가도록 도와주소서.\n\n3. 가족을 잃은 이들을 위하여 기도합시다.\n\n위로자이신 주님, 사랑하는 가족을 떠나보내고 힘겨워하는 이들을 위로하시어, 그들이 십자가 아래 성모님을 기억하며, 부활의 희망으로 고통을 이겨 내게 하소서.\n\n4. 본당 공동체를 위하여 기도합시다.\n\n자비하신 주님, 위령의 날을 맞은 저희 본당 공동체를 살펴 주시어, 공동체 안에서 저희와 함께하다가 세상을 떠난 이들을 기억하며, 더욱더 열심히 기도하고, 다 함께 기쁘게 살아가게 하소서.","예물 기도":"전능하시고 자비로우신 하느님,\n세상을 떠난 하느님의 종들을 몸소 세례의 물로 씻으시고\n사랑과 자비로 끊임없이 보호해 주셨으니\n이 제사를 받아들이시어\n그들의 죄를 그리스도의 피로 깨끗이 씻어 주소서.\n우리 주 …….","감사송":"<위령 감사송 1 : 그리스도 안에서 이루어진 부활의 희망>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 복된 부활의 희망을 주셨기에\n저희는 죽어야 할 운명을 슬퍼하면서도\n다가오는 영생의 약속으로 위로를 받나이다.\n주님, 믿는 이들에게는 죽음이 죽음이 아니요\n새로운 삶으로 옮아감이오니\n세상에서 깃들이던 이 집이 허물어지면\n하늘에 영원한 거처가 마련되나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"4에즈 2,35.34 참조\n주님, 당신은 자애로우시니, 당신 성인들과 함께 영원한 빛을 그들에게 비추소서.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희를 위하여 희생되시고 영광스럽게 부활하신\n외아드님의 성체를 받아 모시고 간절히 청하오니\n세상을 떠난 주님의 종들이 파스카의 신비로 깨끗해지고\n훗날 부활하여 영광을 누리게 하소서.\n우리 주 …….","오늘의 묵상":"신학교에서 철학을 강의하다 보면, 죽음 이후 삶에 대하여 자주 이야기하게 됩니다. 많은 과학자가 인간 죽음의 신비를 밝히고자 하였지만 ‘경험 과학’, 곧 경험적 사실을 연구 대상으로 하는 이들에게 구체적으로 경험할 수 없는 사후 세계에 대한 과학 이론은 늘 가설로만 남을 뿐입니다.\n이처럼 죽음 이후 부활의 삶은 과학자들의 방식으로는 증명될 수 없습니다. 오히려 죽음은 하느님께서 우리에게 주신 이성의 빛과 신앙이 지닌 겸손함으로 다가갈 수 있는 신비입니다. 오늘 복음에서 예수님께서도 “슬기롭다는 자들에게는 이것을 감추시고 철부지들에게는 드러내 보이시니, 아버지께 감사드립니다.”(마태 11,25)라고 말씀하십니다.\n누구에게나 닥칠 죽음을 앞에 둔 우리에게는 죽음에 대하여 얼마나 알고 있느냐가 아니라, 죽음 앞에서 가져야 할 겸손함과 하느님께 모든 것을 의탁하는 철부지와 같은 순수함이 중요합니다. 죽음에 대하여 많이 안다고 해서 죽음을 피할 수는 없습니다. 그러나 누구도 죽음을 피할 수 없다는 인간의 한계를 받아들이고 하느님께 자비를 간청하는 겸손은, 죽음이 우리의 끝이 아니라 새로운 삶으로 도약하는 과정임을 깨닫게 합니다. 우리는 죽음보다 크신 하느님의 사랑을 믿는 사람들입니다.\n오늘 하루, 우리보다 먼저 떠난 이들을 하느님의 자비와 사랑에 맡겨 드리며, 죽음을 준비하는 여정에 있는 우리의 삶이 어떠해야 하는지 묵상해 봅시다. 언젠가 우리도 주님 앞에 설 것임을 기억합시다. 오늘 하루, 누군가를 더 사랑하고, 더 용서하면서 말입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},{"l":"셋째 미사","s":{"입당송":"로마 8,11 참조\n예수님을 죽은 이들 가운데에서 일으키신 하느님은 우리 안에 사시는 당신의 영을 통하여 우리의 죽을 몸도 다시 살려 주시리라.","본기도":"하느님,\n외아드님께서 죽음을 이기시고 하늘 나라로 건너가게 하셨으니\n세상을 떠난 하느님의 종들도 이 세상의 죽음을 이기고\n창조주요 구원자이신 하느님을 뵈오며 영원히 기뻐하게 하소서.\n성부와 성령과 …….","제1독서":"<티 없는 삶이 곧 원숙한 노년이다.>\n▥ 지혜서의 말씀입니다.\n4,7-15\n7 의인은 때 이르게 죽더라도 안식을 얻는다.\n8 영예로운 나이는 장수로 결정되지 않고 살아온 햇수로 셈해지지 않는다.\n9 사람에게는 예지가 곧 백발이고, 티 없는 삶이 곧 원숙한 노년이다.\n10 하느님 마음에 들어 그분께 사랑받던 그는\n죄인들과 살다가 자리가 옮겨졌다.\n11 악이 그의 이성을 변질시키거나\n거짓이 그의 영혼을 기만하지 못하도록 들어 올려진 것이다.\n12 악의 마력은 좋은 것들을 무색하게 만들고\n솟구치는 욕망은 순수한 정신을 훼손하기 때문이다.\n13 짧은 생애 동안 완성에 다다른 그는 오랜 세월을 채운 셈이다.\n14 주님께서는 그 영혼이 마음에 들어\n그를 악의 한가운데에서 서둘러 데려가셨다.\n그러나 사람들은 그것을 보고도 깨닫지 못하고\n그 일을 마음에 두지도 않았다.\n15 곧 은총과 자비가 주님께 선택된 이들에게 주어지고\n그분께서 당신의 거룩한 이들을 돌보신다는 것이다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 23(22),1-3.4.5.6(◎ 1 또는 4ㄱㄴㄷ)\n◎ 주님은 나의 목자, 아쉬울 것 없어라.\n또는\n◎ 어둠의 골짜기를 간다 하여도 당신 함께 계시오니 두려울 것 없나이다.\n○ 주님은 나의 목자, 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시고, 잔잔한 물가로 나를 이끄시어, 내 영혼에 생기 돋우어 주시고, 당신 이름 위하여, 나를 바른길로 이끌어 주시네. ◎\n○ 어둠의 골짜기를 간다 하여도, 당신 함께 계시오니, 두려울 것 없나이다. 당신의 막대와 지팡이, 저에게 위안이 되나이다. ◎\n○ 원수들 보는 앞에서, 제게 상을 차려 주시고, 머리에 향유를 발라 주시니, 제 술잔 넘치도록 가득하옵니다. ◎\n○ 제 한평생 모든 날에 은총과 자애만이 따르리니, 저는 오래오래 주님 집에 사오리다. ◎","제2독서":"<우리는 새로운 삶을 살아가게 되었습니다.>\n▥ 사도 바오로의 로마서 말씀입니다.\n6,3-9\n형제 여러분,\n3 그리스도 예수님과 하나 되는 세례를 받은 우리가 모두\n그분의 죽음과 하나 되는 세례를 받았다는 사실을 여러분은 모릅니까?\n4 과연 우리는 그분의 죽음과 하나 되는 세례를 통하여\n그분과 함께 묻혔습니다.\n그리하여 그리스도께서 아버지의 영광을 통하여\n죽은 이들 가운데에서 되살아나신 것처럼,\n우리도 새로운 삶을 살아가게 되었습니다.\n5 사실 우리가 그분처럼 죽어 그분과 결합되었다면,\n부활 때에도 분명히 그리될 것입니다.\n6 우리는 압니다.\n우리의 옛 인간이 그분과 함께 십자가에 못 박힘으로써\n죄의 지배를 받는 몸이 소멸하여,\n우리가 더 이상 죄의 종노릇을 하지 않게 되었습니다.\n7 죽은 사람은 죄에서 벗어나기 때문입니다.\n8 그래서 우리가 그리스도와 함께 죽었으니\n그분과 함께 살리라고 우리는 믿습니다.\n9 우리는 그리스도께서 죽은 이들 가운데에서 되살아나시어\n다시는 돌아가시지 않으리라는 것을 압니다.\n죽음은 더 이상 그분 위에 군림하지 못합니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n▥ 사도 바오로의 로마서 말씀입니다.\n6,3-4.8-9\n형제 여러분,\n3 그리스도 예수님과 하나 되는 세례를 받은 우리가 모두\n그분의 죽음과 하나 되는 세례를 받았다는 사실을 여러분은 모릅니까?\n4 과연 우리는 그분의 죽음과 하나 되는 세례를 통하여\n그분과 함께 묻혔습니다.\n그리하여 그리스도께서 아버지의 영광을 통하여\n죽은 이들 가운데에서 되살아나신 것처럼,\n우리도 새로운 삶을 살아가게 되었습니다.\n8 그래서 우리가 그리스도와 함께 죽었으니\n그분과 함께 살리라고 우리는 믿습니다.\n9 우리는 그리스도께서 죽은 이들 가운데에서 되살아나시어\n다시는 돌아가시지 않으리라는 것을 압니다.\n죽음은 더 이상 그분 위에 군림하지 못합니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"필리 3,20 참조\n◎ 알렐루야.\n○ 우리는 하늘의 시민, 하늘에서 구세주로 오실 우리 주 예수 그리스도를 기다리네.\n◎ 알렐루야.","복음":"<신랑이 온다. 신랑을 맞으러 나가라.>\n✠ 마태오가 전한 거룩한 복음입니다.\n25,1-13\n그때에 예수님께서 제자들에게 이런 비유를 들어 말씀하셨다.\n1 “하늘 나라는 저마다 등을 들고 신랑을 맞으러 나간\n열 처녀에 비길 수 있을 것이다.\n2 그 가운데 다섯은 어리석고 다섯은 슬기로웠다.\n3 어리석은 처녀들은 등은 가지고 있었지만 기름은 가지고 있지 않았다.\n4 그러나 슬기로운 처녀들은 등과 함께 기름도 그릇에 담아 가지고 있었다.\n5 신랑이 늦어지자 처녀들은 모두 졸다가 잠이 들었다.\n6 그런데 한밤중에 외치는 소리가 났다.\n‘신랑이 온다. 신랑을 맞으러 나가라.’\n7 그러자 처녀들이 모두 일어나 저마다 등을 챙기는데,\n8 어리석은 처녀들이 슬기로운 처녀들에게\n‘우리 등이 꺼져 가니 너희 기름을 나누어 다오.’ 하고 청하였다.\n9 그러나 슬기로운 처녀들은\n‘안 된다. 우리도 너희도 모자랄 터이니\n차라리 상인들에게 가서 사라.’ 하고 대답하였다.\n10 그들이 기름을 사러 간 사이에 신랑이 왔다.\n준비하고 있던 처녀들은 신랑과 함께 혼인 잔치에 들어가고, 문은 닫혔다.\n11 나중에 나머지 처녀들이 와서\n‘주인님, 주인님, 문을 열어 주십시오.’ 하고 청하였지만,\n12 그는 ‘내가 진실로 너희에게 말한다.\n나는 너희를 알지 못한다.’ 하고 대답하였다.\n13 그러니 깨어 있어라. 너희가 그 날과 그 시간을 모르기 때문이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n인도자이신 주님, 지상의 나그네인 교회를 굽어보시어, 그리스도의 가르침을 충실히 따르며 하느님 나라의 기쁨을 미리 맛볼 수 있는 은총을 베풀어 주소서.\n\n2. 세계 지도자들을 위하여 기도합시다.\n\n의로우신 주님, 세계 지도자들을 주님의 정의로 이끌어 주시어, 인간의 생명과 자유와 행복을 무엇보다 먼저 생각하고, 창조된 모든 것을 조화롭게 지켜 나가도록 도와주소서.\n\n3. 가족을 잃은 이들을 위하여 기도합시다.\n\n위로자이신 주님, 사랑하는 가족을 떠나보내고 힘겨워하는 이들을 위로하시어, 그들이 십자가 아래 성모님을 기억하며, 부활의 희망으로 고통을 이겨 내게 하소서.\n\n4. 본당 공동체를 위하여 기도합시다.\n\n자비하신 주님, 위령의 날을 맞은 저희 본당 공동체를 살펴 주시어, 공동체 안에서 저희와 함께하다가 세상을 떠난 이들을 기억하며, 더욱더 열심히 기도하고, 다 함께 기쁘게 살아가게 하소서.","예물 기도":"주님,\n저희가 바치는 이 제물을 인자로이 받으시고\n그리스도 안에서 고이 잠든 주님의 종들이\n이 특별한 제사로 죽음의 사슬에서 풀려나\n영원한 생명을 얻게 하소서.\n우리 주 …….","감사송":"<위령 감사송 1 : 그리스도 안에서 이루어진 부활의 희망>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 복된 부활의 희망을 주셨기에\n저희는 죽어야 할 운명을 슬퍼하면서도\n다가오는 영생의 약속으로 위로를 받나이다.\n주님, 믿는 이들에게는 죽음이 죽음이 아니요\n새로운 삶으로 옮아감이오니\n세상에서 깃들이던 이 집이 허물어지면\n하늘에 영원한 거처가 마련되나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"필리 3,20-21 참조\n우리는 구세주 예수 그리스도를 기다리네. 그분은 우리의 비천한 몸을 당신의 영광스러운 몸과 같이 바꾸어 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 바친 이 제사를 받으시고\n세상을 떠난 주님의 종들에게 풍성한 자비를 베푸시어\n일찍이 세례의 은총을 받은 그들이\n영원한 기쁨을 충만히 누리게 하소서.\n우리 주 …….","오늘의 묵상":"철학자 세네카의 『인생론』에는 인간 수명의 길고 짧음은 살아간 날수가 아니라, 삶을 어떻게 살았느냐로 정해진다는 내용이 나옵니다. 곧 우리가 어떻게 살았느냐에 따라, 어떤 이에게는 삶이 허망할 만큼 짧고, 어떤 이에게는 많은 것을 이룩할 만큼 삶이 충분히 길다는 말입니다.\n이와 비슷하게 오늘 제1독서도 우리에게 “영예로운 나이는 장수로 결정되지 않고, 살아온 햇수로 셈해지지 않는다.”(지혜 4,8)라는 지혜를 말해 줍니다. 달리 말하여 인생을 살아가는 우리에게 중요한 것은, 삶의 양이 아니라 삶의 방향이라는 것이지요.\n이러한 삶의 방향과 관련하여 철학자 하이데거는 인간을 태어나는 순간부터 ‘죽음을 향한’ 존재로 규정합니다. 생각해 보면 맞는 말입니다. 인간은 그 누구도 죽음을 피할 수 없기 때문입니다. 그러나 우리는 조금 바꾸어 이렇게 말할 수 있습니다. “세례 받은 신앙인들은 성령 안에서 새롭게 태어나는 순간부터 ‘부활을 향한’ 존재다.”라고 말입니다. 우리 신앙인들에게 삶의 방향은 죽음이 아니라, 언제나 부활을 향해 있어야 합니다.\n그러기 위해서 오늘 복음 속 예수님의 말씀처럼 늘 깨어 있어야 합니다. 깨어 있는 동안 내가 서 있는 그곳에서, 나의 삶이 하느님을 향하고 있는지 아니면 하느님과는 관계없는 방향을 향하고 있는지 확인할 수 있기 때문입니다. 하느님께서 언제 찾아오시더라도 당황하지 않고 그분과 함께 그분의 나라로 가려면, 우리는 늘 깨어 하느님을 향하고 있어야 할 것입니다. 그 방향성이 우리가 어둠 속에서도 결코 길을 잃지 않는 충실한 신앙인이 되게 해 줄 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}}]},"20261103":{"d":"2026년 11월 03일 화요일","c":"녹","t":"연중 제31주간 화요일","o":[{"c":"백","t":"성 마르티노 데 포레스 수도자"}],"n":"","g":"","i":"","s":{"입당송":"시편 38(37),22-23 참조\n주님, 저를 버리지 마소서. 저의 하느님, 저를 멀리하지 마소서. 주님, 제 구원의 힘이시여, 어서 저를 도우소서.","본기도":"전능하시고 자비로우신 하느님,\n은총을 베푸시어 저희가 하느님을 합당히 섬기고\n영원한 행복을 바라보며 거침없이 달려가게 하소서.\n성부와 성령과 …….","제1독서":"<그리스도께서는 당신 자신을 낮추셨습니다. 그러므로 하느님께서도 그분을 드높이 올리셨습니다.>\n▥ 사도 바오로의 필리피서 말씀입니다.\n2,5-11\n형제 여러분,\n5 그리스도 예수님께서 지니셨던 바로 그 마음을 여러분 안에 간직하십시오.\n6 그분께서는 하느님의 모습을 지니셨지만\n하느님과 같음을 당연한 것으로 여기지 않으시고\n7 오히려 당신 자신을 비우시어 종의 모습을 취하시고\n사람들과 같이 되셨습니다.\n이렇게 여느 사람처럼 나타나 8 당신 자신을 낮추시어\n죽음에 이르기까지, 십자가 죽음에 이르기까지 순종하셨습니다.\n9 그러므로 하느님께서도 그분을 드높이 올리시고\n모든 이름 위에 뛰어난 이름을 그분께 주셨습니다.\n10 그리하여 예수님의 이름 앞에\n하늘과 땅 위와 땅 아래에 있는 자들이 다 무릎을 꿇고\n11 예수 그리스도는 주님이시라고 모두 고백하며\n하느님 아버지께 영광을 드리게 하셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 22(21),26ㄴ-27.28-30ㄱ.31-32(◎ 26ㄱ 참조)\n◎ 주님, 저는 큰 모임에서 당신을 찬양하나이다.\n○ 주님을 경외하는 이들 앞에서 나의 서원 채우리라. 가난한 이들은 배불리 먹고, 주님 찾는 이들은 그분을 찬양하리라. 너희 마음 길이 살리라! ◎\n○ 온 세상 땅끝마다 생각을 돌이켜 주님께 돌아오고, 만 민족 모든 가문 그분 앞에 경배하리니, 주님께 왕권이 있음이로다. 민족들의 지배자이심이로다. 세상 모든 권세가들 그분께만 경배하리라. ◎\n○ 후손은 그분을 섬기리라. 다가올 세대에게 주님 이야기 전해져, 태어날 백성에게 그 의로움 알리리라. 주님이 이렇게 하셨음이로다. ◎","복음 환호송":"마태 11,28 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 고생하며 무거운 짐을 진 너희는 모두 나에게 오너라. 내가 너희에게 안식을 주리라.\n◎ 알렐루야.","복음":"<큰길과 울타리 쪽으로 나가 사람들을 들어오게 하여, 내 집이 가득 차게 하여라.>\n✠ 루카가 전한 거룩한 복음입니다.\n14,15-24\n그때에 15 예수님과 함께 식탁에 앉아 있던 이들 가운데 어떤 사람이 그분께,\n“하느님의 나라에서 음식을 먹게 될 사람은 행복합니다.” 하고 말하였다.\n16 그러자 예수님께서 그에게 이르셨다.\n“어떤 사람이 큰 잔치를 베풀고 많은 사람을 초대하였다.\n17 그리고 잔치 시간이 되자 종을 보내어 초대받은 이들에게,\n‘이제 준비가 되었으니 오십시오.’ 하고 전하게 하였다.\n18 그런데 그들은 모두 하나같이 양해를 구하기 시작하였다.\n첫째 사람은 ‘내가 밭을 샀는데 나가서 그것을 보아야 하오.\n부디 양해해 주시오.’ 하고 그에게 말하였다.\n19 다른 사람은 ‘내가 겨릿소 다섯 쌍을 샀는데 그것들을 부려 보려고 가는 길이오.\n부디 양해해 주시오.’ 하였다.\n20 또 다른 사람은 ‘나는 방금 장가를 들었소. 그러니 갈 수가 없다오.’ 하였다.\n21 종이 돌아와 주인에게 그대로 알렸다.\n그러자 집주인이 노하여 종에게 일렀다.\n‘어서 고을의 한길과 골목으로 나가 가난한 이들과 장애인들과\n눈먼 이들과 다리저는 이들을 이리로 데려오너라.’\n22 얼마 뒤에 종이\n‘주인님, 분부하신 대로 하였습니다만 아직도 자리가 남았습니다.’ 하자,\n23 주인이 다시 종에게 일렀다.\n‘큰길과 울타리 쪽으로 나가 어떻게 해서라도 사람들을 들어오게 하여,\n내 집이 가득 차게 하여라.’\n24 내가 너희에게 말한다.\n처음에 초대를 받았던 그 사람들 가운데에서는 아무도\n내 잔치 음식을 맛보지 못할 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 이 제물을 거룩한 제사로 받아들이시어\n저희에게 주님의 자비를 가득히 베풀어 주소서.\n우리 주 …….","영성체송":"시편 16(15),11 참조\n주님, 저에게 생명의 길 가르치시니, 당신 얼굴 뵈오며 기쁨에 넘치리이다.\n<또는>\n요한 6,57 참조\n주님이 말씀하신다. 살아 계신 아버지가 나를 보내셨고, 내가 아버지로 말미암아 사는 것과 같이, 나를 먹는 사람도 나로 말미암아 살리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n천상의 성사로 저희를 새롭게 하셨으니\n저희에게 주님의 힘찬 능력을 드러내시어\n주님께서 약속하신 은혜를 얻게 하소서.\n우리 주 …….","오늘의 묵상":"성경에서 ‘잔치’라는 말은 단순히 먹고 마시는 자리가 아니라, 하느님께서 인간을 위하여 마련하신 생명과 친교, 곧 구원으로 초대하시는 자리를 뜻합니다. 이러한 잔치는 예수님의 식탁인 성찬례에서 가장 분명하게 드러납니다. 따라서 오늘날 우리가 미사 안에서 거행하는 성체성사는 오늘 복음에 나오는 하느님 나라의 잔치를 미리 맛보는 구원의 샘입니다.\n오늘 복음에는 큰 잔치에 초대받은 세 사람이 나옵니다. 그들은 저마다 자신이 잔치에 갈 수 없는 이유를 댑니다. 그런데 그 이유를 하나씩 들여다보면 잔치에 가지 못할 만큼 부득이한 사정은 없습니다. 하느님께서 베푸시는 잔치보다 스스로 더 중요하다고 생각한 개인의 일들만 있었을 뿐입니다.\n올해 발행된 『한국 천주교회 통계 2025년』에 따르면, 전체 신자 가운데 주일 미사에 참여하는 신자의 비율은 15.5%라고 합니다. 미사가 하느님께서 우리를 위하여 마련해 주신 구원의 음식을 미리 맛보는 잔치라는 점을 생각해 볼 때 너무도 미약한 숫자입니다.\n지금 여기 눈앞에 있는 것들만 바라보다 보면, 정말 중요한 것이 무엇인지 놓칠 때가 많습니다. 그러니 오늘은 구원의 잔치인 미사에 참여하며, 성찬의 식탁 위에 들어 올려지는 성체를 바라보는 시간을 가져 보면 어떨까요? 일상의 바쁨에서 잠시 벗어나, 우리의 눈을 들어 성체를 바라보는 시간 말입니다. 그러한 시간, 이 성찬의 식탁에 초대받은 우리가 얼마나 복된 사람인지 깨닫는 순간, 우리는 삶에서 가장 중요한 것이 무엇인지 발견하는 눈을 가진 사람이 될 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261104":{"d":"2026년 11월 04일 수요일","c":"백","t":"성 가롤로 보로메오 주교 기념일","o":[],"n":"","g":"","i":"가롤로 보로메오 성인은 1538년 이탈리아 롬바르디아의 아로나 귀족 가문에서 태어났다. 신심 깊은 가정에서 어린 시절을 보낸 그는 일찍부터 학문을 쌓는 데 힘썼다. 1560년 외삼촌인 비오 4세 교황이 평신도인 그를 추기경으로 임명하자, 뒤늦게 성직자 교육을 받고 1563년에 사제가 되었다. 그는 밀라노의 대주교로서 교회 개혁에 크게 이바지하였다. 또한 가난하고 고통받는 이들을 지원하는 제도를 마련하여 널리 보급시켰다. 1584년에 선종한 그를 1610년 바오로 5세 교황이 시성하였다.","s":{"입당송":"에제 34,11.23-24 참조\n주님이 말씀하신다. 나는 내 양 떼를 찾아서, 그들을 먹일 목자를 세우리라. 나 주님이 그들의 하느님이 되리라.\n<또는>\n루카 12,42 참조\n이 사람은 충실하고 슬기로운 종이다. 주님이 그를 세우시어, 당신 가족을 맡겨 제때에 정해진 양식을 내어 주게 하셨다.","본기도":"주님,\n복된 가롤로 주교에게 심어 주신 굳센 정신을\n주님의 백성에게 부어 주시어\n교회가 끊임없이 새로워지고\n저희도 그리스도를 닮아\n그분의 참모습을 세상에 보여 주게 하소서.\n성자께서는 성부와 …….","제1독서":"<여러분 자신의 구원을 위하여 힘쓰십시오. 하느님은 여러분 안에서 활동하시어 의지를 일으키시고 그것을 실천하게도 하시는 분이십니다.>\n▥ 사도 바오로의 필리피서 말씀입니다.\n2,12-18\n12 사랑하는 여러분, 여러분은 늘 순종하였습니다.\n내가 함께 있을 때만이 아니라 지금처럼 떨어져 있을 때에는\n더욱더 그러하였습니다.\n그러므로 두렵고 떨리는 마음으로\n여러분 자신의 구원을 위하여 힘쓰십시오.\n13 하느님은 당신 호의에 따라 여러분 안에서 활동하시어,\n의지를 일으키시고 그것을 실천하게도 하시는 분이십니다.\n14 무슨 일이든 투덜거리거나 따지지 말고 하십시오.\n15 그리하여 비뚤어지고 뒤틀린 이 세대에서\n허물 없는 사람, 순결한 사람, 하느님의 흠 없는 자녀가 되어,\n이 세상에서 별처럼 빛날 수 있도록 하십시오.\n16 생명의 말씀을 굳게 지니십시오.\n그러면 내가 헛되이 달음질하거나 헛되이 애쓴 것이 되지 않아,\n그리스도의 날에 자랑할 수 있게 될 것입니다.\n17 내가 설령 하느님께 올리는 포도주가 되어\n여러분이 봉헌하는 믿음의 제물 위에 부어진다 하여도,\n나는 기뻐할 것입니다.\n여러분 모두와 함께 기뻐할 것입니다.\n18 여러분도 마찬가지로 기뻐하십시오. 나와 함께 기뻐하십시오.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 27(26),1.4.13-14(◎ 1ㄱ)\n◎ 주님은 나의 빛, 나의 구원이시다.\n○ 주님은 나의 빛, 나의 구원. 나 누구를 두려워하랴? 주님은 내 생명의 요새. 나 누구를 무서워하랴? ◎\n○ 주님께 청하는 오직 한 가지, 나 그것을 얻고자 하니, 내 한평생 주님의 집에 살며, 주님의 아름다움 바라보고, 그분의 성전 우러러보는 것이라네. ◎\n○ 저는 산 이들의 땅에서, 주님의 어지심을 보리라 믿나이다. 주님께 바라라. 힘내어 마음을 굳게 가져라. 주님께 바라라. ◎","복음 환호송":"1베드 4,14 참조\n◎ 알렐루야.\n○ 그리스도의 이름 때문에 모욕을 당하면 너희는 행복하리니 하느님의 성령이 너희 위에 머물러 계시리라.\n◎ 알렐루야.","복음":"<자기 소유를 다 버리지 않는 사람은 내 제자가 될 수 없다.>\n✠ 루카가 전한 거룩한 복음입니다.\n14,25-33\n그때에 25 많은 군중이 예수님과 함께 길을 가는데,\n예수님께서 그들에게 돌아서서 이르셨다.\n26 “누구든지 나에게 오면서\n자기 아버지와 어머니, 아내와 자녀, 형제와 자매,\n심지어 자기 목숨까지 미워하지 않으면, 내 제자가 될 수 없다.\n27 누구든지 제 십자가를 짊어지고 내 뒤를 따라오지 않는 사람은\n내 제자가 될 수 없다.\n28 너희 가운데 누가 탑을 세우려고 하면,\n공사를 마칠 만한 경비가 있는지 먼저 앉아서 계산해 보지 않느냐?\n29 그러지 않으면 기초만 놓은 채 마치지 못하여,\n보는 이마다 그를 비웃기 시작하며,\n30 ‘저 사람은 세우는 일을 시작만 해 놓고 마치지는 못하였군.’ 할 것이다.\n31 또 어떤 임금이 다른 임금과 싸우러 가려면,\n이만 명을 거느리고 자기에게 오는 그를 만 명으로 맞설 수 있는지\n먼저 앉아서 헤아려 보지 않겠느냐?\n32 맞설 수 없겠으면,\n그 임금이 아직 멀리 있을 때에 사신을 보내어 평화 협정을 청할 것이다.\n33 이와 같이 너희 가운데에서 누구든지 자기 소유를 다 버리지 않는 사람은\n내 제자가 될 수 없다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(로마 12,3-13)와 복음(요한 10,11-16)을 봉독할 수 있다.>","예물 기도":"주님,\n목자의 열성과 뛰어난 덕행으로 복된 가롤로 주교를 들어 높이셨으니\n그를 기념하여 주님 제대에 바치는 예물을 굽어보시고\n이 제사의 힘으로 저희도 복음을 실천하여\n풍성한 열매를 거두게 하소서.\n우리 주 …….","영성체송":"요한 15,16 참조\n주님이 말씀하신다. 너희가 나를 뽑은 것이 아니라 내가 너희를 뽑아 세웠으니, 가서 열매를 맺어라. 너희 열매는 길이 남으리라.\n<또는>\n루카 12,36-37 참조\n행복하여라, 주인이 와서 문을 두드릴 때에 깨어 있는 종!","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n거룩한 신비에 참여하고 비오니\n저희에게 굳센 정신을 심어 주시어\n저희가 복된 가롤로처럼 형제들을 충실히 섬기며\n온 마음으로 사랑을 실천하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음에서 예수님께서는 “누구든지 나에게 오면서 자기 아버지와 어머니, 아내와 자녀, 형제와 자매, 심지어 자기 목숨까지 미워하지 않으면, 내 제자가 될 수 없다.”(루카 14,26)라는 다소 이해하기 어려운 말씀을 하십니다. 그러나 우리는 예수님께서 하신 이 말씀의 참뜻을 잘 알아들어야 합니다. 이 말씀에 쓰인 ‘미워하다’라는 히브리 말은 단순한 감정 표현 말고도 우선순위에서 ‘덜 중요하게 여긴다’는 뜻으로도 쓰입니다.\n따라서 예수님의 이 말씀은 가족들, 심지어는 자기 목숨을 ‘감정적으로 미워하라’는 뜻이 아닙니다. 누구든지 당신께 향하는 여정에서 무엇보다 우선순위에 두어야 할 것은 다른 무엇도 누구도 아닌 바로 예수님이라는 뜻입니다. 또한 가족이나 친구를 예수님보다 덜 사랑해야 한다는 뜻이 아니라, 우리 모두의 중심에 예수님께서 계시니 만나는 모든 사람을 예수님께 이끌라는 뜻으로 받아들여야 할 것입니다. 예수님께서 삶의 한가운데에 자리하시도록 해야 한다는 것이지요.\n이것이 바로 예수님의 제자가 된 사람들의 모습입니다. 그런데 다른 사람들을 예수님께 이끌려면, 우리의 삶을 판단하고 숙고해 본다는 의미로서 오늘 복음에 나오듯 “헤아려 [볼]”(14,31) 필요가 있습니다. 달리 말하면 우리의 삶이 과연 주변 사람들에게 예수님을 느끼게 하는 향기를 퍼뜨리고 있는지 자주 성찰해 보아야 합니다. 우리 주 예수 그리스도의 빛을 통하여 나 자신을 자주 성찰하는 사람만이 그분의 제자로서 빛을 발산할 수 있기 때문입니다. 그분을 우리 삶의 가장 중심에 두면서 말입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261105":{"d":"2026년 11월 05일 목요일","c":"녹","t":"연중 제31주간 목요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 38(37),22-23 참조\n주님, 저를 버리지 마소서. 저의 하느님, 저를 멀리하지 마소서. 주님, 제 구원의 힘이시여, 어서 저를 도우소서.","본기도":"전능하시고 자비로우신 하느님,\n은총을 베푸시어 저희가 하느님을 합당히 섬기고\n영원한 행복을 바라보며 거침없이 달려가게 하소서.\n성부와 성령과 …….","제1독서":"<나에게 이롭던 것들을, 나는 그리스도 때문에 모두 해로운 것으로 여기게 되었습니다.>\n▥ 사도 바오로의 필리피서 말씀입니다.\n3,3-8ㄱ\n형제 여러분, 3 하느님의 영으로 예배하고 그리스도 예수님 안에서 자랑하며\n육적인 것을 신뢰하지 않는 우리야말로 참된 할례를 받은 사람입니다.\n4 하기야 나에게도 육적인 것을 신뢰할 수 있는 근거가 있기는 합니다.\n다른 어떤 사람이 육적인 것을 신뢰할 수 있다고 생각한다면,\n나는 더욱 그렇습니다.\n5 여드레 만에 할례를 받은 나는 이스라엘 민족으로 벤야민 지파 출신이고,\n히브리 사람에게서 태어난 히브리 사람이며, 율법으로 말하면 바리사이입니다.\n6 열성으로 말하면 교회를 박해하던 사람이었고,\n율법에 따른 의로움으로 말하면 흠잡을 데 없는 사람이었습니다.\n7 그러나 나에게 이롭던 것들을,\n나는 그리스도 때문에 모두 해로운 것으로 여기게 되었습니다.\n8 그뿐만 아니라, 나의 주 그리스도 예수님을 아는 지식의 지고한 가치 때문에,\n다른 모든 것을 해로운 것으로 여깁니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 105(104),2-3.4-5.6-7(◎ 3ㄴ)\n◎ 주님을 찾는 마음은 기뻐하여라.\n○ 그분께 노래하여라, 찬미 노래 불러라. 그 모든 기적 이야기하여라. 거룩하신 그 이름 자랑하여라. 주님을 찾는 마음은 기뻐하여라. ◎\n○ 주님과 그 권능을 구하여라. 언제나 그 얼굴을 찾아라. 그분이 이루신 기적과 이적을, 그분 입으로 내리신 판결을 기억하여라. ◎\n○ 그분의 종 아브라함의 후손들아, 그분이 뽑으신 야곱의 자손들아! 그분은 주 우리 하느님, 그분의 판결이 온 세상에 미치네. ◎","복음 환호송":"마태 11,28 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 고생하며 무거운 짐을 진 너희는 모두 나에게 오너라. 내가 너희에게 안식을 주리라.\n◎ 알렐루야.","복음":"<하늘에서는, 회개하는 죄인 한 사람 때문에 더 기뻐할 것이다.>\n✠ 루카가 전한 거룩한 복음입니다.\n15,1-10\n그때에 1 세리들과 죄인들이 예수님의 말씀을 들으려고\n가까이 모여들고 있었다.\n2 그러자 바리사이들과 율법 학자들이, “저 사람은 죄인들을 받아들이고\n또 그들과 함께 음식을 먹는군.” 하고 투덜거렸다.\n3 예수님께서 그들에게 이 비유를 말씀하셨다.\n4 “너희 가운데 어떤 사람이 양 백 마리를 가지고 있었는데\n그 가운데에서 한 마리를 잃으면,\n아흔아홉 마리를 광야에 놓아둔 채 잃은 양을 찾을 때까지 뒤쫓아 가지 않느냐?\n5 그러다가 양을 찾으면 기뻐하며 어깨에 메고\n6 집으로 가서 친구들과 이웃들을 불러,\n‘나와 함께 기뻐해 주십시오. 잃었던 내 양을 찾았습니다.’ 하고 말한다.\n7 내가 너희에게 말한다. 이와 같이 하늘에서는,\n회개할 필요가 없는 의인 아흔아홉보다\n회개하는 죄인 한 사람 때문에 더 기뻐할 것이다.\n8 또 어떤 부인이 은전 열 닢을 가지고 있었는데 한 닢을 잃으면,\n등불을 켜고 집 안을 쓸며 그것을 찾을 때까지 샅샅이 뒤지지 않느냐?\n9 그러다가 그것을 찾으면 친구들과 이웃들을 불러,\n‘나와 함께 기뻐해 주십시오. 잃었던 은전을 찾았습니다.’ 하고 말한다.\n10 내가 너희에게 말한다.\n이와 같이 회개하는 죄인 한 사람 때문에 하느님의 천사들이 기뻐한다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 이 제물을 거룩한 제사로 받아들이시어\n저희에게 주님의 자비를 가득히 베풀어 주소서.\n우리 주 …….","영성체송":"시편 16(15),11 참조\n주님, 저에게 생명의 길 가르치시니, 당신 얼굴 뵈오며 기쁨에 넘치리이다.\n<또는>\n요한 6,57 참조\n주님이 말씀하신다. 살아 계신 아버지가 나를 보내셨고, 내가 아버지로 말미암아 사는 것과 같이, 나를 먹는 사람도 나로 말미암아 살리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n천상의 성사로 저희를 새롭게 하셨으니\n저희에게 주님의 힘찬 능력을 드러내시어\n주님께서 약속하신 은혜를 얻게 하소서.\n우리 주 …….","오늘의 묵상":"워낙 어릴 때라서 저는 기억이 잘 나지 않는데, 어머니가 어린 저를 데리고 시장에 갔다가 잃어버린 적이 있다고 합니다. 같이 놀던 동네 형과 누나들은 시간이 지나고 다 돌아왔는데 저만 돌아오지 않아서 어머니가 울면서 저를 찾아 헤매었다는 이야기를 들었습니다. 그때 어머니는 정말 가슴이 철렁하고 모든 것을 다 잃은 마음이 들어서 정신 나간 사람처럼 이리저리 저를 찾아다녔다고 합니다.\n길 잃은 양 한 마리를 찾아 나서시는 하느님 마음도 이와 같지 않았을까 묵상해 봅니다. 우리는 살면서 이따금 죄를 지어 하느님의 품에서 멀어질 때가 있습니다. 그럴 때면 하느님께서는 오늘 복음이 보여 주듯이 우리를 뒤쫓으시며 찾아 헤매십니다. 어린 시절의 저를 찾던 어머니와 같이 그 애타는 마음으로 말이지요.\n하느님께서는 바로 그런 분이십니다. 당신 집을 떠나 길을 잃고 방황하는 우리 한 사람 한 사람을 애타게 찾아 나서시는 분이십니다. 하느님께서는 우리를 단 한 명도 빠짐없이, 세상 무엇보다도 소중하게 여기시기 때문입니다.\n하느님께서는 죄를 짓고 숨어 버린 아담과 하와를 “너 어디 있느냐?”(창세 3,9) 하고 찾으십니다. 화가 난 목소리가 아니라 당신 자녀를 찾는 간절한 목소리로 말입니다. 그러니 혹시라도 하느님께 죄를 지어, 갈 길을 잃고 헤매는 처지가 될지라도 두려워하지 말고 걱정하지 맙시다. 왜냐하면 하느님께서는 그런 우리가 행여 어디선가 홀로 다칠세라 눈을 크게 뜨시고 샅샅이 우리를 찾아 헤매시는 분이시며, 그러다 찾게 되시면 그 누구보다도 기뻐하시는 자비로운 아버지이시기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261106":{"d":"2026년 11월 06일 금요일","c":"녹","t":"연중 제31주간 금요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 38(37),22-23 참조\n주님, 저를 버리지 마소서. 저의 하느님, 저를 멀리하지 마소서. 주님, 제 구원의 힘이시여, 어서 저를 도우소서.","본기도":"전능하시고 자비로우신 하느님,\n은총을 베푸시어 저희가 하느님을 합당히 섬기고\n영원한 행복을 바라보며 거침없이 달려가게 하소서.\n성부와 성령과 …….","제1독서":"<우리는 구세주를 고대합니다. 그분께서는 우리의 비천한 몸을 당신의 영광스러운 몸과 같은 모습으로 변화시켜 주실 것입니다.>\n▥ 사도 바오로의 필리피서 말씀입니다.\n3,17―4,1\n17 형제 여러분, 다 함께 나를 본받는 사람이 되십시오.\n여러분이 우리를 본보기로 삼는 것처럼\n그렇게 살아가는 다른 이들도 눈여겨보십시오.\n18 내가 이미 여러분에게 자주 말하였고 지금도 눈물을 흘리며 말하는데,\n많은 사람이 그리스도의 십자가의 원수로 살아가고 있습니다.\n19 그들의 끝은 멸망입니다. 그들은 자기네 배를 하느님으로,\n자기네 수치를 영광으로 삼으며 이 세상 것만 생각합니다.\n20 그러나 우리는 하늘의 시민입니다.\n그리고 그곳에서 구세주로 오실 주 예수 그리스도를 고대합니다.\n21 그리스도께서는 만물을 당신께 복종시키실 수도 있는 그 권능으로,\n우리의 비천한 몸을 당신의 영광스러운 몸과 같은 모습으로\n변화시켜 주실 것입니다.\n4,1 그러므로 내가 사랑하고 그리워하는 형제 여러분,\n나의 기쁨이며 화관인 여러분,\n이렇게 주님 안에 굳건히 서 있으십시오, 사랑하는 여러분!\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 122(121),1-2.3-4ㄱㄴ.4ㄷㄹ-5(◎ 1 참조)\n◎ 기뻐하며 주님의 집으로 가리라.\n○ “주님의 집에 가자!” 할 때, 나는 몹시 기뻤노라. 예루살렘아, 네 성문에, 우리 발이 이미 서 있노라. ◎\n○ 예루살렘은 튼튼한 도성, 견고하게 세워졌네. 그리로 지파들이 올라가네. 주님의 지파들이 올라가네. ◎\n○ 이스라엘의 법을 따라, 주님의 이름을 찬양하네. 그곳에 심판의 왕좌, 다윗 집안의 왕좌가 놓여 있네. ◎","복음 환호송":"1요한 2,5 참조\n◎ 알렐루야.\n○ 누구든지 그리스도의 말씀을 지키면 그 사람 안에서 참으로 하느님의 사랑이 완성되리라.\n◎ 알렐루야.","복음":"<이 세상의 자녀들이 저희끼리 거래하는 데에는 빛의 자녀들보다 영리하다.>\n✠ 루카가 전한 거룩한 복음입니다.\n16,1-8\n그때에 1 예수님께서 제자들에게 말씀하셨다.\n“어떤 부자가 집사를 두었는데, 이 집사가 자기의 재산을 낭비한다는 말을 듣고,\n2 그를 불러 말하였다.\n‘자네 소문이 들리는데 무슨 소린가? 집사 일을 청산하게.\n자네는 더 이상 집사 노릇을 할 수 없네.’\n3 그러자 집사는 속으로 말하였다.\n‘주인이 내게서 집사 자리를 빼앗으려고 하니 어떻게 하지?\n땅을 파자니 힘에 부치고 빌어먹자니 창피한 노릇이다. 4 옳지, 이렇게 하자.\n내가 집사 자리에서 밀려나면\n사람들이 나를 저희 집으로 맞아들이게 해야지.’\n5 그래서 그는 주인에게 빚진 사람들을 하나씩 불러 첫 사람에게 물었다.\n‘내 주인에게 얼마를 빚졌소?’\n6 그가 ‘기름 백 항아리요.’ 하자,\n집사가 그에게 ‘당신의 빚 문서를 받으시오.\n그리고 얼른 앉아 쉰이라고 적으시오.’ 하고 말하였다.\n7 이어서 다른 사람에게 ‘당신은 얼마를 빚졌소?’ 하고 물었다.\n그가 ‘밀 백 섬이오.’ 하자,\n집사가 그에게 ‘당신의 빚 문서를 받아 여든이라고 적으시오.’ 하고 말하였다.\n8 주인은 그 불의한 집사를 칭찬하였다. 그가 영리하게 대처하였기 때문이다.\n사실 이 세상의 자녀들이 저희끼리 거래하는 데에는\n빛의 자녀들보다 영리하다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 이 제물을 거룩한 제사로 받아들이시어\n저희에게 주님의 자비를 가득히 베풀어 주소서.\n우리 주 …….","영성체송":"시편 16(15),11 참조\n주님, 저에게 생명의 길 가르치시니, 당신 얼굴 뵈오며 기쁨에 넘치리이다.\n<또는>\n요한 6,57 참조\n주님이 말씀하신다. 살아 계신 아버지가 나를 보내셨고, 내가 아버지로 말미암아 사는 것과 같이, 나를 먹는 사람도 나로 말미암아 살리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n천상의 성사로 저희를 새롭게 하셨으니\n저희에게 주님의 힘찬 능력을 드러내시어\n주님께서 약속하신 은혜를 얻게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 독서와 복음에서는 세상의 자녀와 그리스도의 자녀를 나누어 설명하고 있습니다. 그렇다고 세상의 것이 모두 나쁘고, 하늘의 것만 좋다고 말하지는 않습니다.\n세상의 것들은 모두 무시하고, 오직 하늘의 가치들에만 관심을 두어야 한다는, 이른바 영지주의적인 사상이 거세게 일어났던 시절이 있었습니다. 그러나 우리는 언제나 이 땅에 발을 디디고 살아가는 사람들임을 잊어서는 안 됩니다. 또한 언제나 고개를 들어 하늘을 바라보는 신앙인이라는 사실도 잊어서는 안 됩니다.\n이처럼 우리 신앙은 우리가 ‘세상을 등지고’가 아니라, ‘세상 안에’ 살아가는 그리스도인임을 강조합니다. 몸은 세상에 있지만 정신은 늘 그리스도 안에 머물러야 한다는 점이 중요합니다. 오늘 독서에서처럼 예수님께서 “우리의 비천한 몸을 당신의 영광스러운 몸과 같은 모습으로 변화시켜 주실 것”(필리 3,21)을 희망하면서 말입니다.\n따라서 이 세상에서 그리스도교 신앙을 지키며 살아간다는 것, 주님 안에 머무른다는 것은 늘 변화하는 삶이라고 할 수 있습니다. 딱딱하게 굳은 것은 죽은 것이지만, 우리 신앙은 우리를 늘 새롭게 변하게 함으로써 더욱 풍요롭게 살아 있게 해 줍니다. 바로 그것이 우리 신앙의 힘입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261107":{"d":"2026년 11월 07일 토요일","c":"녹","t":"연중 제31주간 토요일","o":[{"c":"백","t":"복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"시편 38(37),22-23 참조\n주님, 저를 버리지 마소서. 저의 하느님, 저를 멀리하지 마소서. 주님, 제 구원의 힘이시여, 어서 저를 도우소서.","본기도":"전능하시고 자비로우신 하느님,\n은총을 베푸시어 저희가 하느님을 합당히 섬기고\n영원한 행복을 바라보며 거침없이 달려가게 하소서.\n성부와 성령과 …….","제1독서":"<나에게 힘을 주시는 분 안에서 나는 모든 것을 할 수 있습니다.>\n▥ 사도 바오로의 필리피서 말씀입니다.\n4,10-19\n형제 여러분,\n10 여러분이 나를 생각해 주는 마음을 마침내 다시 한번 보여 주었기에,\n나는 주님 안에서 크게 기뻐합니다.\n사실 여러분은 줄곧 나를 생각해 주었지만\n그것을 보여 줄 기회가 없었던 것입니다.\n11 내가 궁핍해서 이런 말을 하는 것은 아닙니다.\n나는 어떠한 처지에서도 만족하는 법을 배웠습니다.\n12 나는 비천하게 살 줄도 알고 풍족하게 살 줄도 압니다.\n배부르거나 배고프거나 넉넉하거나 모자라거나\n그 어떠한 경우에도 잘 지내는 비결을 알고 있습니다.\n13 나에게 힘을 주시는 분 안에서 나는 모든 것을 할 수 있습니다.\n14 그러나 내가 겪는 환난에 여러분이 동참한 것은 잘한 일입니다.\n15 필리피 신자 여러분,\n복음 선포를 시작할 무렵 내가 마케도니아를 떠날 때,\n여러분 외에는 나와 주고받는 관계에 있는 교회가 하나도 없었음을\n여러분도 알고 있습니다.\n16 내가 테살로니카에 있을 때에도\n여러분은 두어 번 필요한 것을 보내 주었습니다.\n17 물론 내가 선물을 바라는 것은 아닙니다.\n여러분에게 많은 이익이 돌아가기를 바랄 뿐입니다.\n18 나는 모든 것을 다 받아 넉넉하게 되었습니다.\n여러분이 에파프로디토스 편에 보낸 것을 받아 풍족합니다.\n그것은 향기로운 예물이며 하느님 마음에 드는 훌륭한 제물입니다.\n19 나의 하느님께서는 그리스도 예수님 안에서 영광스럽게 베푸시는\n당신의 그 풍요로움으로, 여러분에게 필요한 모든 것을 채워 주실 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 112(111),1ㄴㄷ-2.5-6.8ㄱ과 9(◎ 1ㄴ)\n◎ 행복하여라, 주님을 경외하는 이!\n○ 행복하여라, 주님을 경외하고, 그분 계명을 큰 즐거움으로 삼는 이! 그의 후손은 땅에서 융성하고, 올곧은 세대는 복을 받으리라. ◎\n○ 잘되리라, 후하게 꾸어 주고, 자기 일을 바르게 처리하는 이! 그는 언제나 흔들리지 않으리니, 영원히 의인으로 기억되리라. ◎\n○ 그 마음 굳세어 두려워하지 않네. 가난한 이에게 넉넉히 나누어 주니, 그의 의로움은 길이 이어지고, 그의 뿔은 영광 속에 높이 들리리라. ◎","복음 환호송":"2코린 8,9 참조\n◎ 알렐루야.\n○ 예수 그리스도는 부유하시면서도 우리를 위하여 가난하게 되시어 우리도 그 가난으로 부유해지게 하셨네.\n◎ 알렐루야.","복음":"<너희가 불의한 재물을 다루는 데에 성실하지 못하면 누가 너희에게 참된 것을 맡기겠느냐?>\n✠ 루카가 전한 거룩한 복음입니다.\n16,9ㄴ-15\n그때에 예수님께서 제자들에게 말씀하셨다.\n9 “불의한 재물로 친구들을 만들어라.\n그래서 재물이 없어질 때에\n그들이 너희를 영원한 거처로 맞아들이게 하여라.\n10 아주 작은 일에 성실한 사람은 큰일에도 성실하고,\n아주 작은 일에 불의한 사람은 큰일에도 불의하다.\n11 그러니 너희가 불의한 재물을 다루는 데에 성실하지 못하면,\n누가 너희에게 참된 것을 맡기겠느냐?\n12 또 너희가 남의 것을 다루는 데에 성실하지 못하면,\n누가 너희에게 너희의 몫을 내주겠느냐?\n13 어떠한 종도 두 주인을 섬길 수 없다.\n한쪽은 미워하고 다른 쪽은 사랑하며,\n한쪽은 떠받들고 다른 쪽은 업신여기게 된다.\n너희는 하느님과 재물을 함께 섬길 수 없다.”\n14 돈을 좋아하는 바리사이들이 이 모든 말씀을 듣고 예수님을 비웃었다.\n15 그러자 예수님께서 그들에게 이르셨다.\n“너희는 사람들 앞에서 스스로 의롭다고 하는 자들이다.\n그러나 하느님께서는 너희 마음을 아신다.\n사실 사람들에게 높이 평가되는 것이 하느님 앞에서는 혐오스러운 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 이 제물을 거룩한 제사로 받아들이시어\n저희에게 주님의 자비를 가득히 베풀어 주소서.\n우리 주 …….","영성체송":"시편 16(15),11 참조\n주님, 저에게 생명의 길 가르치시니, 당신 얼굴 뵈오며 기쁨에 넘치리이다.\n<또는>\n요한 6,57 참조\n주님이 말씀하신다. 살아 계신 아버지가 나를 보내셨고, 내가 아버지로 말미암아 사는 것과 같이, 나를 먹는 사람도 나로 말미암아 살리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n천상의 성사로 저희를 새롭게 하셨으니\n저희에게 주님의 힘찬 능력을 드러내시어\n주님께서 약속하신 은혜를 얻게 하소서.\n우리 주 …….","오늘의 묵상":"드라마를 볼 때 처음부터 보지 않고 중간부터 보면 전체 내용을 이해하기 어렵습니다. 예수님께서 “불의한 재물로 친구들을 만들어라.”(루카 16,9)라고 뜻밖의 말씀을 하시는 오늘 복음이 딱 그렇습니다. 오늘 복음은 어제 복음에 뒤이어 나온 말씀입니다. 따라서 어제 복음의 맥락 안에서 오늘 복음을 바라볼 때 예수님께서 하시는 말씀의 참뜻을 깨달을 수 있습니다.\n어제 복음의 맥락으로 오늘 복음을 되새겨 보면, 세상의 재물을 섬기지 말고, 그 세상의 재물로 이웃들에게 사랑과 호의를 베푸는 일, 곧 하느님의 일을 이루라는 뜻으로 묵상할 수 있습니다.\n이렇게 생각하면 오늘 복음에 나오는 ‘불의한 재물’의 참뜻은, 윤리적으로 부당한 재물이라기보다는 세상의 질서에 속한 재물입니다. 그리고 여기에 쓰인 ‘친구들’이라는 말은 단순히 유희를 함께 즐기는 그저 가까운 관계를 뜻하는 것이 아니라 사랑과 호의로 맺어진 진정한 관계를 뜻합니다.\n사랑하는 형제자매 여러분! 우리가 받은 세례가 우리를 빛의 자녀가 되게 하는 것은 사실이지만, 그것만으로는 빛의 자녀가 지닌 품위를 이어 나가기 어렵습니다. 우리가 계속해서 세상이 아닌 빛의 자녀가 되려면 그것이 재물이든 능력이든 우리가 가진 것들로 이웃에게 선을 베풀 줄 알아야 합니다. 사실 우리가 가진 것은 모두 하느님의 것이요, 하느님께서 우리에게 당신의 일을 수행하라고 잠시 맡겨 두신 선물이기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261108":{"d":"2026년 11월 08일 일요일","c":"녹","t":"연중 제32주일","o":[],"n":"평신도 주일","g":"대영광송 · 신경 · 교중","i":"평신도는 예수님께서 선택하신 백성으로서, 성직자가 아닌 모든 신자를 가리킨다. 제2차 바티칸 공의회는 평신도의 역할을 크게 부각하면서, 평신도를 통하여 교회가 세상의 빛과 소금이 될 수 있다고 강조하였다. 한국천주교주교회의는 이러한 공의회의 정신에 따라 1968년 ‘한국 천주교 평신도 사도직 협의회’(지금은 ‘한국 천주교 평신도 사도직 단체 협의회’)를 결성하고 이와 더불어 해마다 대림 제1주일을 ‘평신도 사도직의 날’로 지내기로 하였다. 그 뒤 1970년부터는 연중 마지막 주일의 전 주일을 ‘평신도 주일’로 지내 오다가, 프란치스코 교황이 그 주일을 ‘세계 가난한 이의 날’로 정하면서 2017년부터 한 주 앞당겨 지내고 있다.","s":{"오늘 전례":"오늘은 연중 제32주일이며 평신도 주일입니다. 주 하느님께서는 주님의 목소리를 듣는 이들에게 지혜를 주십니다. 그러므로 우리는 하느님의 잔칫상에 앉는 합당한 준비로, 등잔에 기름을 채워야 합니다. 기다림에 지치지 않고, 주님께서 오실 때에 서둘러 마중하여 혼인 잔치에 함께 들어갈 수 있어야 합니다.","입당송":"시편 88(87),3 참조\n주님, 제 기도 당신 앞에 이르게 하소서. 제 울부짖음에 귀를 기울이소서.","본기도":"전능하시고 자비로우신 하느님,\n저희에게 해로운 것을 모두 물리쳐 주시어\n저희가 평안한 몸과 마음으로\n자유로이 하느님의 뜻을 따르게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<지혜를 찾는 이들은 그를 쉽게 발견할 수 있다.>\n▥ 지혜서의 말씀입니다.\n6,12-16\n12 지혜는 바래지 않고 늘 빛이 나서 그를 사랑하는 이들은 쉽게 알아보고\n그를 찾는 이들은 쉽게 발견할 수 있다.\n13 지혜는 자기를 갈망하는 이들에게 미리 다가가 자기를 알아보게 해 준다.\n14 지혜를 찾으러 일찍 일어나는 이는 수고할 필요도 없이\n자기 집 문간에 앉아 있는 지혜를 발견하게 된다.\n15 지혜를 깊이 생각하는 것 자체가 완전한 예지다.\n지혜를 얻으려고 깨어 있는 이는 곧바로 근심이 없어진다.\n16 지혜는 자기에게 맞갖은 이들을 스스로 찾아 돌아다니고\n그들이 다니는 길에서 상냥하게 모습을 드러내며\n그들의 모든 생각 속에서 그들을 만나 준다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 63(62),2.3-4.5-6.7-8(◎ 2ㄷ 참조)\n◎ 주님, 저의 하느님, 제 영혼 당신을 목말라하나이다.\n○ 하느님, 당신은 저의 하느님. 저는 새벽부터 당신을 찾나이다. 제 영혼 당신을 목말라하나이다. 물기 없이 마르고 메마른 땅에서, 이 몸은 당신을 애타게 그리나이다. ◎\n○ 당신의 권능과 영광을 보려고, 성소에서 당신을 바라보나이다. 당신 자애가 생명보다 낫기에, 제 입술이 당신을 찬미하나이다. ◎\n○ 이렇듯 제 한평생 당신을 찬미하고, 당신 이름 부르며 두 손 높이 올리오리다. 제 영혼이 기름진 음식으로 배불러, 제 입술이 환호하며 당신을 찬양하나이다. ◎\n○ 잠자리에 들어서도 당신을 생각하고, 온밤 지새우며 당신을 묵상하나이다. 정녕 당신은 저를 도우셨으니, 당신 날개 그늘에서 환호하나이다. ◎","제2독서":"<하느님께서는 예수님을 통하여 죽은 이들을 그분과 함께 데려가실 것입니다.>\n▥ 사도 바오로의 테살로니카 1서 말씀입니다.\n4,13-18\n13 형제 여러분, 죽은 이들의 문제를 여러분도 알기를 바랍니다.\n그리하여 희망을 가지지 못하는 다른 사람들처럼 슬퍼하지 말라는 것입니다.\n14 예수님께서 돌아가셨다가 다시 살아나셨음을 우리는 믿습니다.\n이와 같이 하느님께서는 예수님을 통하여\n죽은 이들을 그분과 함께 데려가실 것입니다.\n15 우리는 주님의 말씀을 근거로 이 말을 합니다.\n주님의 재림 때까지 남아 있게 될 우리 산 이들이\n죽은 이들보다 앞서지는 않을 것입니다.\n16 명령의 외침과 대천사의 목소리와 하느님의 나팔 소리가 울리면,\n주님께서 친히 하늘에서 내려오실 것입니다.\n그러면 먼저 그리스도 안에서 죽은 이들이 다시 살아나고,\n17 그다음으로, 그때까지 남아 있게 될 우리 산 이들이\n그들과 함께 구름 속으로 들려 올라가 공중에서 주님을 맞이할 것입니다.\n이렇게 하여 우리는 늘 주님과 함께 있을 것입니다.\n18 그러니 이러한 말로 서로 격려하십시오.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n▥ 사도 바오로의 테살로니카 1서 말씀입니다.\n4,13-14\n13 형제 여러분, 죽은 이들의 문제를 여러분도 알기를 바랍니다.\n그리하여 희망을 가지지 못하는 다른 사람들처럼 슬퍼하지 말라는 것입니다.\n14 예수님께서 돌아가셨다가 다시 살아나셨음을 우리는 믿습니다.\n이와 같이 하느님께서는 예수님을 통하여\n죽은 이들을 그분과 함께 데려가실 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"마태 24,42.44 참조\n◎ 알렐루야.\n○ 깨어 준비하고 있어라. 생각하지도 않은 때에 사람의 아들이 오리라.\n◎ 알렐루야.","복음":"<신랑이 온다. 신랑을 맞으러 나가라.>\n✠ 마태오가 전한 거룩한 복음입니다.\n25,1-13\n그때에 예수님께서 제자들에게 이런 비유를 들어 말씀하셨다.\n1 “하늘 나라는 저마다 등을 들고 신랑을 맞으러 나간\n열 처녀에 비길 수 있을 것이다.\n2 그 가운데 다섯은 어리석고 다섯은 슬기로웠다.\n3 어리석은 처녀들은 등은 가지고 있었지만 기름은 가지고 있지 않았다.\n4 그러나 슬기로운 처녀들은 등과 함께 기름도 그릇에 담아 가지고 있었다.\n5 신랑이 늦어지자 처녀들은 모두 졸다가 잠이 들었다.\n6 그런데 한밤중에 외치는 소리가 났다. ‘신랑이 온다. 신랑을 맞으러 나가라.’\n7 그러자 처녀들이 모두 일어나 저마다 등을 챙기는데,\n8 어리석은 처녀들이 슬기로운 처녀들에게\n‘우리 등이 꺼져 가니 너희 기름을 나누어 다오.’ 하고 청하였다.\n9 그러나 슬기로운 처녀들은 ‘안 된다. 우리도 너희도 모자랄 터이니\n차라리 상인들에게 가서 사라.’ 하고 대답하였다.\n10 그들이 기름을 사러 간 사이에 신랑이 왔다.\n준비하고 있던 처녀들은 신랑과 함께 혼인 잔치에 들어가고, 문은 닫혔다.\n11 나중에 나머지 처녀들이 와서\n‘주인님, 주인님, 문을 열어 주십시오.’ 하고 청하였지만,\n12 그는 ‘내가 진실로 너희에게 말한다.\n나는 너희를 알지 못한다.’ 하고 대답하였다.\n13 그러니 깨어 있어라. 너희가 그 날과 그 시간을 모르기 때문이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n참목자이신 주님, 주님의 백성인 성직자와 수도자와 평신도들을 주님의 진리로 이끌어 주시고, 특히 평신도 주일을 맞이하여, 보편 사제직을 수행하는 평신도들이 자신의 사명을 깨닫고 복음화에 힘쓰게 하소서.\n\n2. 우리나라를 위하여 기도합시다.\n\n보호자이신 주님, 이 나라를 굽어살피시어, 국민들이 물질적 풍요만을 좇기보다 진리와 정의, 사랑의 참된 가치를 소중히 여기며 살아가도록 이끌어 주소서.\n\n3. 가난한 이들을 위하여 기도합시다.\n\n위로자이신 주님, 도움이 필요한 가난한 이들을 살펴 주시어, 몸소 위로하시고, 저희가 주님의 손과 발이 되어 어려운 이웃을 찾아 나눔을 실천하게 하소서.\n\n4. 가정 공동체를 위하여 기도합시다.\n\n자비하신 주님, 저희 가정 공동체를 주님의 은총으로 이끌어 주시어, 주님의 가르침대로 살아가며 참행복과 생명의 가치를 실천하는 본보기가 되게 하소서.","예물 기도":"주님,\n이 제사를 자비로이 굽어보시어\n저희가 성자의 수난을 기념하며\n믿음과 사랑으로 그 신비를 따르게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<연중 주일 감사송 6 : 영원한 파스카의 보증>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n저희는 주님 안에서 숨 쉬고 움직이며 살아가오니\n이 세상에서 날마다 주님의 인자하심을 체험할 뿐 아니라\n영원한 생명을 보장받고 있나이다.\n주님께서는 성령을 통하여\n예수님을 죽은 이들 가운데서 일으키셨으니\n성령의 첫 열매를 지닌 저희에게도\n파스카 신비가 영원히 이어지리라 희망하고 있나이다.\n그러므로 저희도 모든 천사와 함께 주님을 찬미하며\n기쁨에 넘쳐 큰 소리로 노래하나이다.","영성체송":"시편 23(22),1-2\n주님은 나의 목자, 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시고, 잔잔한 물가로 나를 이끄시네.\n<또는>\n루카 24,35 참조\n빵을 나눌 때, 제자들은 주 예수님을 알아보았네.","영성체 후 묵상":"지혜서 저자는, 지혜를 얻으려고 깨어 있는 이는 곧바로 근심이 없어진다고 말합니다. 등을 들고 신랑을 맞으러 나간 처녀들 가운데 다섯은 어리석고 다섯은 슬기로웠습니다. 슬기로운 처녀들처럼 지혜의 기름으로 등을 밝히고 주님께서 오시기를 기다립시다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 성체로 힘을 얻고 감사하며 자비를 바라오니\n저희에게 성령을 보내시어\n성령의 힘으로 저희 삶을 변화시켜 주소서.\n우리 주 그리스도를 통하여 비나이다.","오늘의 묵상":"오늘은 평신도 주일입니다. 제2차 바티칸 공의회 이후 교회는 지속적으로 평신도들의 역할과 소명을 강조해 왔습니다. 그리고 최근에는 ‘시노달리타스’라는 용어와 함께 하느님께 나아가는 여정 안에서 성직자만이 아니라 평신도들도 발맞추어 함께 나아가야 함을 더욱 강조하고 있습니다.\n‘시노달리타스’라는 용어를 우리말로 옮긴 공식 단어가 있는 것은 아니지만 저는 이를 ‘함께 살아감’이라고 표현하고 싶습니다. 하느님께서 그리고 인간이 여기 존재한다는 것, 곧 ‘살아간다’는 말은 가장 원초적이면서 보편적이고, 생동감 있는 표현이기 때문입니다. 그리고 함께 살아간다는 것은 그 자체로 이미, 생명의 주인이신 하느님께 우리가 모두 함께 걸어가는 이 역사의 여정을 그대로 드러내는 표현이라고 생각합니다.\n그런데 함께 살아가려면 성령의 이끄심에 따라 이웃의 말을 경청하고 존중하는 것이 반드시 필요합니다. 자기 이야기만 하는 헛된 똑똑함은 필요하지 않습니다. 우리가 모두 함께 말하고 서로 이야기를 잘 듣는 지혜가 필요합니다. 제1독서에서 말하듯 하느님의 지혜는 “그들의 모든 생각 속에서 그들을 만나 [주기]”(지혜 6,16) 때문입니다.\n오늘 복음에 나오지는 않지만, 어리석은 처녀들이 기름을 가지고 있지 않았던 까닭은 어쩌면 기름을 함께 준비하자는 슬기로운 처녀들의 말을 경청하지 않았고, 깨어 있는 삶의 자세를 존중하지도 않았기 때문이 아닐까 묵상해 봅니다. 평신도 주일을 맞아 슬기로운 신앙인이 되고자 청해야 할 지혜는, 이웃의 모습 안에 살아 계신 예수님을 발견하고 맞이하도록, 늘 깨어 있어야 함을 깨닫는 것이 아닐까요? 성령 안에서 함께 살아가는 이들의 말을 경청하는 겸손한 자세로 말입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261109":{"d":"2026년 11월 09일 월요일","c":"백","t":"라테라노 대성전 봉헌 축일","o":[],"n":"","g":"대영광송","i":"라테라노 대성전은 로마에 있는 최초의 바실리카 양식의 성당으로, 역대 교황이 거주하던 곳을 현재의 베드로 대성전으로 옮기기 전까지 거의 천 년 동안 교회의 중심이었다. 이 축일은 324년 콘스탄티누스 대제가 라테라노 대성전을 지어 봉헌한 것을 기념하는 날이며, 12세기부터 11월 9일에 지내 왔다고 한다. ‘전 세계와 로마의 모든 교회의 어머니요 머리’라고 일컫는 대성전의 영예를 기리는 이 축일은 처음에는 로마에서만 지내다가, 안티오키아의 이냐시오 성인이 기록한 대로 “사랑의 모든 공동체를 이끄는” 베드로 교좌에 대한 사랑과 일치의 표지로서 모든 교회로 확대되어 나갔다.","s":{"입당송":"묵시 21,2\n거룩한 도성 새 예루살렘이, 신랑을 위하여 단장한 신부처럼 차리고 하늘로부터 하느님에게서 내려오는 것을 나는 보았네.\n<또는>\n묵시 21,3 참조\n보라, 이제 하느님의 거처는 사람들 가운데에 있다. 하느님이 사람들과 함께 머무르시고, 그들은 하느님의 백성이 되리라. 하느님 친히 그들의 하느님으로서 그들과 함께 계시리라.","본기도":"하느님,\n몸소 뽑으신 살아 있는 돌로 영원한 거처를 마련하셨으니\n하느님의 교회에 은총의 영을 더욱 풍성히 내려 주시어\n저희가 천상 예루살렘을 향하여 끊임없이 나아가게 하소서.\n성부와 성령과 …….\n<또는>\n하느님,\n하느님의 교회를 배필이라 이르시니\n하느님의 이름을 섬기는 백성이\n하느님을 두려워하고 사랑하며 따르도록 이끌어 주시어\n약속하신 천상 행복에 이르게 하소서.\n성부와 성령과 …….","제1독서":"<성전 오른쪽에서 흘러나오는 물을 보았네. 그 물이 닿는 곳마다 모두 구원을 받았네(따름 노래 “성전 오른쪽에서”).>\n▥ 에제키엘 예언서의 말씀입니다.\n47,1-2.8-9.12\n그 무렵 천사가 1 나를 데리고 주님의 집 어귀로 돌아갔다.\n이 주님의 집 정면은 동쪽으로 나 있었는데,\n주님의 집 문지방 밑에서 물이 솟아 동쪽으로 흐르고 있었다.\n그 물은 주님의 집 오른쪽 밑에서, 제단 남쪽으로 흘러내려 갔다.\n2 그는 또 나를 데리고 북쪽 대문으로 나가서,\n밖을 돌아 동쪽 대문 밖으로 데려갔다.\n거기에서 보니 물이 오른쪽에서 나오고 있었다.\n8 그가 나에게 말하였다.\n“이 물은 동쪽 지역으로 나가, 아라바로 내려가서 바다로 들어간다.\n이 물이 바다로 흘러들어 가면, 그 바닷물이 되살아난다.\n9 그래서 이 강이 흘러가는 곳마다 온갖 생물이 우글거리며 살아난다.\n이 물이 닿는 곳마다 바닷물이 되살아나기 때문에, 고기도 아주 많이 생겨난다.\n이렇게 이 강이 닿는 곳마다 모든 것이 살아난다.\n12 이 강가 이쪽저쪽에는 온갖 과일나무가 자라는데,\n잎도 시들지 않으며 과일도 끊이지 않고 다달이 새 과일을 내놓는다.\n이 물이 성전에서 나오기 때문이다.\n그 과일은 양식이 되고 잎은 약이 된다.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n▥ 사도 바오로의 코린토 1서 말씀입니다.\n3,9ㄴ-11.16-17\n형제 여러분, 9 여러분은 하느님의 건물입니다.\n10 나는 하느님께서 베푸신 은총에 따라 지혜로운 건축가로서 기초를 놓았고,\n다른 사람은 집을 짓고 있습니다.\n그러나 어떻게 집을 지을지 저마다 잘 살펴야 합니다.\n11 아무도 이미 놓인 기초 외에 다른 기초를 놓을 수 없기 때문입니다.\n그 기초는 예수 그리스도이십니다.\n16 여러분이 하느님의 성전이고\n하느님의 영께서 여러분 안에 계시다는 사실을 여러분은 모릅니까?\n17 누구든지 하느님의 성전을 파괴하면 하느님께서도 그자를 파멸시키실 것입니다.\n하느님의 성전은 거룩하기 때문입니다.\n여러분이 바로 하느님의 성전입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 46(45),2-3.5-6.8-9(◎ 5)\n◎ 강물이 줄기줄기 하느님의 도성을, 지극히 높으신 분의 거룩한 거처를 즐겁게 하네.\n○ 하느님은 우리의 피신처, 우리의 힘. 어려울 때마다 늘 도와주셨네. 우리는 두려워하지 않네. 땅이 뒤흔들린다 해도, 산들이 바다 깊이 빠진다 해도. ◎\n○ 강물이 줄기줄기 하느님의 도성을, 지극히 높으신 분의 거룩한 거처를 즐겁게 하네. 하느님이 그 안에 계시니 흔들리지 않네. 하느님이 동틀 녘에 구해 주시네. ◎\n○ 만군의 주님이 우리와 함께 계시네. 야곱의 하느님이 우리의 산성이시네. 와서 보아라, 주님의 업적을, 이 세상에 이루신 놀라운 일을! ◎","복음 환호송":"2역대 7,16 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 내가 이 집을 선택하여 성별하고 이곳에 내 이름을 영원히 있게 하리라.\n◎ 알렐루야.","복음":"<예수님께서 성전이라고 하신 것은 당신 몸을 두고 하신 말씀이었다.>\n✠ 요한이 전한 거룩한 복음입니다.\n2,13-22\n13 유다인들의 파스카 축제가 가까워지자 예수님께서는 예루살렘에 올라가셨다.\n14 그리고 성전에 소와 양과 비둘기를 파는 자들과\n환전꾼들이 앉아 있는 것을 보시고,\n15 끈으로 채찍을 만드시어 양과 소와 함께 그들을 모두 성전에서 쫓아내셨다.\n또 환전상들의 돈을 쏟아 버리시고 탁자들을 엎어 버리셨다.\n16 비둘기를 파는 자들에게는, “이것들을 여기에서 치워라.\n내 아버지의 집을 장사하는 집으로 만들지 마라.” 하고 이르셨다.\n17 그러자 제자들은 “당신 집에 대한 열정이 저를 집어삼킬 것입니다.”라고\n성경에 기록된 말씀이 생각났다.\n18 그때에 유다인들이 예수님께,\n“당신이 이런 일을 해도 된다는 무슨 표징을 보여 줄 수 있소?” 하고 말하였다.\n19 그러자 예수님께서 그들에게 대답하셨다.\n“이 성전을 허물어라. 그러면 내가 사흘 안에 다시 세우겠다.”\n20 유다인들이 말하였다. “이 성전을 마흔여섯 해나 걸려 지었는데,\n당신이 사흘 안에 다시 세우겠다는 말이오?”\n21 그러나 그분께서 성전이라고 하신 것은 당신 몸을 두고 하신 말씀이었다.\n22 예수님께서 죽은 이들 가운데에서 되살아나신 뒤에야,\n제자들은 예수님께서 이 말씀을 하신 것을 기억하고,\n성경과 그분께서 이르신 말씀을 믿게 되었다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희가 바치는 예물을 받으시고\n이 성사의 힘으로 구원의 은총을 누리게 하소서.\n우리 주 …….","감사송":"<주님의 축일과 신비 감사송 10-2 : 그리스도의 배필이며 성령의 성전인 교회의 신비(성당 봉헌)>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 기도하는 집에 자비로이 머무르시며\n끊임없이 은총을 내려 주시어\n저희가 성령의 성전이 되고\n거룩한 생활로 주님 영광의 빛을 드러내게 하시나이다.\n또한 눈에 보이는 이 집으로 교회를 드러내시고\n그리스도의 배필인 교회가 나날이 거룩해져\n무수한 자녀들과 함께 기뻐하며\n하늘 영광에 참여하게 하시나이다.\n그러므로 모든 천사와 성인과 함께\n저희도 주님을 찬미하며 끝없이 노래하나이다.","영성체송":"1베드 2,5 참조\n너희는 영적인 집을 짓는 살아 있는 돌이니, 거룩한 사제단이 되어라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"하느님,\n교회를 통하여 저희에게 천상 예루살렘을 미리 보여 주셨으니\n오늘 이 성사에 참여한 저희가 은총의 성전이 되고\n마침내 영광스러운 하느님의 집에 들어가게 하소서.\n우리 주 …….","오늘의 묵상":"로마에서 유학하던 시절, 라테라노 대성전에 갔던 기억이 납니다. 대성전 한가운데에 있는 제대를 기준으로 양쪽 옆면에 거대하게 세워진 사도들의 성상이 성전으로 들어오는 이들을 감싸는 구조로 되어 있어서, 이곳이 정말 하느님께서 계신 궁전이라는 경외심을 가지게 해 주었습니다.\n부끄럽지만, 그런 멋진 대성전에 방문하다 보니 먼저 조용히 앉아 기도하는 것을 잊고, 핸드폰을 꺼내 사진부터 찍었던 저의 모습을 고백합니다. 제가 성전에 들어와서도 기도하지 않았음을 스스로 깨달은 순간, 핸드폰을 가방에 넣고 조용히 앉아 이렇게 기도하였습니다. “주님! 당신을 찬미하고자 사람들이 만든 이 성전의 아름다움보다 당신께서 손수 창조하신 ‘저’라는 성전의 아름다움을 먼저 발견하게 하소서.”\n바오로 사도도 우리를 “하느님의 성전”(1코린 3,17)이라고 말합니다. 우리가 하느님의 성전이라고 불릴 수 있는 까닭은 무엇보다도 오늘 복음에서 예수님께서 성전이라고 비유하신 예수님의 몸, 곧 성체를 모시는 사람들이기 때문입니다. 따라서 영성체를 하는 우리에게는 자주 자기 자신을 성찰하며 지금 나의 모습이 하느님을 닮았는지 확인하고, 때에 따라 고해성사를 통하여 우리를 정화시킬 의무가 있습니다.\n깨끗해진 우리 안에 예수님 사랑이 가득해서 아름다운 사람이 되면 좋겠습니다. 오늘 제1독서에서 성전에서 나온 물이 닿는 곳마다 모든 것이 살아나듯, 우리 안에 흘러넘치는 예수님의 사랑이 닿는 곳마다 모든 사람을 살아나게 만들 우리의 모습을 상상해 보십시오. 이 얼마나 귀하고 아름다운 사람의 모습인가요.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261110":{"d":"2026년 11월 10일 화요일","c":"백","t":"성 대 레오 교황 학자 기념일","o":[],"n":"","g":"","i":"성 대 레오 교황은 400년 무렵 에트루리아(현재 이탈리아의 토스카나)의 귀족 가문에서 태어났다. 440년 식스토 3세 교황의 뒤를 이은 성인은 행정 능력이 뛰어났을 뿐만 아니라 깊이 있는 설교로도 유명하였다. 성인은 온전한 신앙을 확고히 보존하고 교회의 일치를 강력히 수호하며, 이민족들의 침입을 격퇴하거나 무마시키려고 온갖 노력을 기울였다. 재임 중인 451년에 열린 칼케돈 공의회에서는 에우티케스, 네스토리우스 등의 이단을 단죄하고 정통 교회를 수호하였다. 교회 안팎을 아우르는 많은 공로로 ‘대 교황’이라고 불린 성인은 461년에 선종하였다. 1754년 베네딕토 14세 교황이 레오 교황을 시성하였다.","s":{"입당송":"집회 45,24 참조\n주님은 그와 평화의 계약을 맺으시어, 백성을 다스리는 영원한 사제직을 주셨네.","본기도":"하느님,\n사도들의 반석 위에 세우신 교회를\n저승의 세력도 결코 이기지 못하게 하셨으니\n복된 레오 교황의 전구를 들으시어\n교회를 하느님의 진리로 견고하게 하시며\n언제나 평화로이 지켜 주소서.\n성부와 성령과 …….","제1독서":"<우리는 복된 희망이 이루어지기를, 하느님이시며 구원자이신 예수 그리스도께서 나타나시기를 기다리며 경건하게 살고 있습니다.>\n▥ 사도 바오로의 티토서 말씀입니다.\n2,1-8.11-14\n사랑하는 그대여,\n1 그대는 건전한 가르침에 부합하는 말을 하십시오.\n2 나이 많은 남자들은 절제할 줄 알고 기품이 있고 신중하며,\n건실한 믿음과 사랑과 인내를 지녀야 합니다.\n3 나이 많은 여자들도 마찬가지로 몸가짐에 기품이 있어야 하고,\n남을 험담하지 않고, 술의 노예가 되지 않으며,\n선을 가르치는 사람이 되어야 합니다.\n4 그래야 그들이 젊은 여자들을 훈련시켜,\n남편을 사랑하고 자녀를 사랑하며,\n5 신중하고 순결하며, 집안 살림을 잘하고 어질고 남편에게 순종하게 하여,\n하느님의 말씀이 모독을 받지 않도록 할 수 있습니다.\n6 젊은 남자들에게도 마찬가지로 신중히 행동하라고 권고하십시오.\n7 그대 자신을 모든 면에서 선행의 본보기로 보여 주십시오.\n가르칠 때에는 고결하고 품위 있게 하고\n8 트집 잡을 데가 없는 건전한 말을 하여,\n적대자가 우리를 걸고 나쁘게 말할 것이 하나도 없어\n부끄러운 일을 당하게 하십시오.\n11 과연 모든 사람에게 구원을 가져다주는 하느님의 은총이 나타났습니다.\n12 이 은총이 우리를 교육하여, 불경함과 속된 욕망을 버리고\n현세에서 신중하고 의롭고 경건하게 살도록 해 줍니다.\n13 복된 희망이 이루어지기를, 우리의 위대하신 하느님이시며\n구원자이신 예수 그리스도의 영광이 나타나기를 기다리는 우리를\n그렇게 살도록 해 줍니다.\n14 그리스도께서는 우리를 위하여 당신 자신을 내어 주시어,\n우리를 모든 불의에서 해방하시고 또 깨끗하게 하시며,\n선행에 열성을 기울이는 당신 소유의 백성이 되게 하셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 37(36),3-4.18과 23.27과 29(◎ 39ㄱ)\n◎ 의인들의 구원은 주님에게서 오네.\n○ 주님을 믿으며 좋은 일 하고, 이 땅에 살며 신의를 지켜라. 주님 안에서 즐거워하여라. 네 마음이 청하는 대로 주시리라. ◎\n○ 주님이 흠 없는 이들의 삶을 아시니, 그들의 소유는 길이길이 남으리라. 주님은 사람의 발걸음 지켜 주시며, 그 길을 마음에 들어 하시리라. ◎\n○ 악을 피하고 선을 행하여라. 그러면 너는 길이 살리라. 의인들은 땅을 차지하리라. 거기에서 길이 살아가리라. ◎","복음 환호송":"요한 14,23 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 누구든지 나를 사랑하면 내 말을 지키리니 내 아버지도 그를 사랑하시고 우리가 가서 그와 함께 살리라.\n◎ 알렐루야.","복음":"<저희는 쓸모없는 종입니다. 해야 할 일을 하였을 뿐입니다.>\n✠ 루카가 전한 거룩한 복음입니다.\n17,7-10\n그때에 주님께서 말씀하셨다.\n7 “너희 가운데 누가 밭을 갈거나 양을 치는 종이 있으면,\n들에서 돌아오는 그 종에게 ‘어서 와 식탁에 앉아라.’ 하겠느냐?\n8 오히려 ‘내가 먹을 것을 준비하여라.\n그리고 내가 먹고 마시는 동안 허리에 띠를 매고 시중을 들어라.\n그런 다음에 먹고 마셔라.’ 하지 않겠느냐?\n9 종이 분부를 받은 대로 하였다고 해서 주인이 그에게 고마워하겠느냐?\n10 이와 같이 너희도 분부를 받은 대로 다 하고 나서,\n‘저희는 쓸모없는 종입니다.\n해야 할 일을 하였을 뿐입니다.’ 하고 말하여라.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(집회 39,6-10)와 복음(마태 16,13-19)을 봉독할 수 있다.>","예물 기도":"주님,\n저희가 바치는 이 예물을 받으시고 교회를 인자로이 비추시어\n어디서나 주님의 양 떼가 불어나게 하시고\n목자들은 주님을 충실히 따라 주님 이름에 영광을 드리게 하소서.\n우리 주 …….","영성체송":"마태 16,16.18 참조\n베드로가 예수님께 말하였다. 주님은 살아 계신 하느님의 아드님 그리스도이십니다. 예수님이 이르셨다. 너는 베드로이다. 내가 이 반석 위에 내 교회를 세우리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n거룩한 양식으로 자라나는 교회를 인자로이 이끄시어\n교회가 주님 사랑의 섭리로 더 많은 자유를 누리고\n온전한 신앙을 끝까지 간직하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음에서 예수님께서는 “너희도 분부를 받은 대로 다 하고 나서, ‘저희는 쓸모없는 종입니다. 해야 할 일을 하였을 뿐입니다.’ 하고 말하여라.”(루카 17,10)라고 말씀하십니다. 여기서 쓸모없다는 것은 하느님 앞에 도움 되는 것이 없다는 뜻이 아닙니다. 마땅히 내가 해야 할 일을 한 것이기에 하느님께 그에 대한 보상을 요구하지 않는 겸손함을 뜻합니다.\n‘쓸모없는 종’과 ‘해야 할 일’이라는 두 표현에는 분명한 공통점이 있습니다. 그것은 바로 둘 다 주인과 그 주인에게 속한 사람의 관계를 표현하는 말이라는 것입니다. 사제인 저는 가끔 스스로 되묻습니다. ‘내가 지금 정말로 하느님의 일을 하고 있는가? 내 일을 하고 있지는 않는가?’ 이는 참으로 하느님께 속한 사람으로서 존재하는지, 아니면 하느님께 속한 사람인 것처럼 행동하지만 실제로는 하느님과 전혀 관계없는 사람으로 존재하고 있지는 않는지를 묻는 물음입니다.\n오늘 복음에서 말하는 쓸모없는 종이 지닌 겸손함은 우리에게 어떤 일이 주어질 때, “저는 그 일을 하기에 턱없이 부족한 사람입니다.”라며 그저 자기를 낮추는 것이 아닙니다. 오히려 “저는 부족한 사람이지만 하느님께 속한 사람이니, 그것이 하느님의 일이라면 마땅히 제가 해야 할 일을 하겠습니다.”라고 말하는 것입니다.\n이처럼 우리가 하느님의 종으로서 가져야 할 겸손은 “나에게 힘을 주시는 분 안에서 나는 모든 것을 할 수 있습니다.”(필리 4,13)라고 고백하며, 우리가 언제나 하느님께 속한 사람임이 드러나게 행동하는 것입니다. 이 겸손은 비록 조용하지만 아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지게 만드는, 강한 힘이 될 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261111":{"d":"2026년 11월 11일 수요일","c":"백","t":"투르의 성 마르티노 주교 기념일","o":[],"n":"","g":"","i":"마르티노 성인은 316년 무렵 판노니아(현재 헝가리의 솜바테이)의 이교인 가정에서 태어났다. 로마에서 공부한 다음 군인이 된 그는 어느 날 추위에 떨고 있는 거리의 걸인에게 자신의 외투 절반을 잘라 주었는데, 그날 밤 꿈속에 그 외투 차림의 예수님께서 나타나시는 신비 체험을 하고 나서 곧장 세례를 받았다. 그 뒤에 사제가 되었으며, 370년 무렵 프랑스 투르의 주교로 뽑혔다. 성인은 착한 목자로서 모범을 보이고, 수도원들을 세웠으며, 성직자들을 교육하고 가난한 이들에게 복음을 전하다가 397년 프랑스 중부의 캉데생마르탱에서 선종하였다. 프랑스 교회의 초석을 놓은 그는 프랑스 교회의 수호성인 가운데 한 사람으로 존경받고 있다.","s":{"입당송":"1사무 2,35 참조\n주님이 말씀하신다. 내가 믿음직한 사제를 세우리니, 그는 내 마음과 생각에 따라 행동하리라.","본기도":"하느님,\n복된 마르티노 주교는 그 삶과 죽음으로 하느님께 영광을 드렸으니\n저희에게 놀라우신 은총을 새롭게 베푸시어\n살아서도 죽어서도 하느님의 사랑을 떠나지 않게 하소서.\n성부와 성령과 …….","제1독서":"<우리는 그릇된 길에 빠졌으나 하느님께서 당신 자비에 따라, 우리를 구원하셨습니다.>\n▥ 사도 바오로의 티토서 말씀입니다.\n3,1-7\n사랑하는 그대여, 1 신자들에게 상기시켜,\n통치자들과 집권자들에게 복종하고 순종하며\n모든 선행을 할 준비를 갖추게 하십시오.\n2 남을 중상하지 말고 온순하고 관대한 사람이 되어\n모든 이를 아주 온유하게 대하게 하십시오.\n3 사실 우리도 한때 어리석고 순종할 줄 몰랐고 그릇된 길에 빠졌으며,\n갖가지 욕망과 쾌락의 노예가 되었고,\n악과 질투 속에 살았으며, 고약하게 굴고 서로 미워하였습니다.\n4 그러나 우리 구원자이신 하느님의 호의와 인간애가 드러난 그때,\n5 하느님께서 우리를 구원해 주셨습니다.\n우리가 한 의로운 일 때문이 아니라 당신 자비에 따라,\n성령을 통하여 거듭나고 새로워지도록 물로 씻어 구원하신 것입니다.\n6 이 성령을 하느님께서는 우리 구원자이신 예수 그리스도를 통하여\n우리에게 풍성히 부어 주셨습니다.\n7 그리하여 우리는 그분의 은총으로 의롭게 되어,\n영원한 생명의 희망에 따라 상속자가 되었습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 23(22),1-3ㄱ.3ㄴㄷ-4.5.6(◎ 1)\n◎ 주님은 나의 목자, 아쉬울 것 없어라.\n○ 주님은 나의 목자, 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시고, 잔잔한 물가로 나를 이끄시어, 내 영혼에 생기 돋우어 주시네. ◎\n○ 당신 이름 위하여, 나를 바른길로 이끌어 주시네. 어둠의 골짜기를 간다 하여도, 당신 함께 계시오니, 두려울 것 없나이다. 당신의 막대와 지팡이, 저에게 위안이 되나이다. ◎\n○ 원수들 보는 앞에서 제게 상을 차려 주시고, 머리에 향유를 발라 주시니, 제 술잔 넘치도록 가득하옵니다. ◎\n○ 제 한평생 모든 날에 은총과 자애만이 따르리니, 저는 오래오래 주님 집에 사오리다. ◎","복음 환호송":"1테살 5,18\n◎ 알렐루야.\n○ 모든 일에 감사하여라. 이것이 그리스도 예수님 안에서 살아가는 너희에게 바라시는 하느님의 뜻이다.\n◎ 알렐루야.","복음":"<이 외국인 말고는 아무도 하느님께 영광을 드리러 돌아오지 않았단 말이냐?>\n✠ 루카가 전한 거룩한 복음입니다.\n17,11-19\n11 예수님께서 예루살렘으로 가시는 길에\n사마리아와 갈릴래아 사이를 지나가시게 되었다.\n12 그분께서 어떤 마을에 들어가시는데 나병 환자 열 사람이 그분께 마주 왔다.\n그들은 멀찍이 서서 13 소리를 높여 말하였다.\n“예수님, 스승님! 저희에게 자비를 베풀어 주십시오.”\n14 예수님께서는 그들을 보시고,\n“가서 사제들에게 너희 몸을 보여라.” 하고 이르셨다.\n그들이 가는 동안에 몸이 깨끗해졌다.\n15 그들 가운데 한 사람은 병이 나은 것을 보고 큰 소리로 하느님을 찬양하며 돌아와,\n16 예수님의 발 앞에 엎드려 감사를 드렸다. 그는 사마리아 사람이었다.\n17 그러자 예수님께서 말씀하셨다.\n“열 사람이 깨끗해지지 않았느냐? 그런데 아홉은 어디에 있느냐?\n18 이 외국인 말고는 아무도 하느님께 영광을 드리러 돌아오지 않았단 말이냐?”\n19 이어서 그에게 이르셨다.\n“일어나 가거라. 네 믿음이 너를 구원하였다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(이사 61,1-3ㄹ)와 복음(마태 25,31-40)을 봉독할 수 있다.>","예물 기도":"주 하느님,\n거룩한 마르티노 주교를 공경하며 주님께 기꺼이 바치는\n이 예물을 거룩하게 하시어\n좋을 때나 나쁠 때나 저희를 주님께 이끌어 주소서.\n우리 주 …….","영성체송":"마태 25,40 참조\n주님이 말씀하신다. 내가 진실로 너희에게 말한다. 너희가 가장 작은 내 형제 하나에게 해 준 것이 바로 나에게 해 준 것이다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n일치의 성사로 힘을 얻은 저희가\n모든 일에서 주님의 뜻을 충실히 따르고\n복된 마르티노 주교를 본받아 자신을 기꺼이 주님께 봉헌하게 하소서.\n우리 주 …….","오늘의 묵상":"이맘때 “이 외국인 말고는 아무도 하느님께 영광을 드리러 돌아오지 않았단 말이냐?”(루카 17,18)라는 복음 말씀을 묵상할 때면 수험생들을 위한 미사가 기억납니다. 본당에 있었을 때 수능 전날 수험생을 위한 미사를 봉헌하였는데 이 미사에는 평소 보이지 않던 학생들도 많았습니다. 저마다의 이유로 그동안 성당에 나오지 못하였지만 중요한 때를 앞두고 하느님께 은총을 청하는 아이들의 모습이 예뻤습니다.\n다음날 수능이 끝난 뒤 저녁 미사를 봉헌하는데, 맨 앞줄에 한 학생이 앉아 있었습니다. 평소에 성당에 나오지 않다가 수능 전날 미사에만 나온 학생이었습니다. 놀라운 마음에 미사가 끝나고 그 친구에게 물었습니다. “수능도 끝났는데 가족들이랑 맛있는 거 먹지, 왜 성당에 왔어?” 그 친구가 답하였습니다. “그냥 …… 하느님께 감사한 마음이 들어서요.” 그래서 제가 “너 시험 잘 봤구나?” 하고 물었더니, 시험을 잘 보지는 못하였지만 하느님께 감사한 마음이 들어서 왔다고 하였습니다. 가슴이 뭉클하였습니다.\n사람들은 보통 바라던 일이 이루어지고 나면, 그 기적의 순간에 멈추어 서서 그와 같은 일이 또 일어나게 해 달라고 기도합니다. 이렇게 자기가 바라던 일이 이루어진 것에만 집중하는 사람은 그렇게 찾아온 좋은 일이 되풀이되기를 바랍니다. 그러나 그 일을 이루어 주신 하느님을 바라보는 사람은 감사하는 마음을 가지게 됩니다.\n우리는 자기에게 일어난 영광스러운 일을 넘어 그 일을 이루어 주신 하느님을, 감사하는 마음으로 바라볼 수 있어야 하겠습니다. 그렇게 할 때 우리의 영광을 넘어, 영원하신 하느님의 영광을 뵈옵는 일이 될 것이기 때문입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261112":{"d":"2026년 11월 12일 목요일","c":"홍","t":"성 요사팟 주교 순교자 기념일","o":[],"n":"","g":"","i":"성 요사팟 주교는 1580년 무렵 우크라이나의 동방 교회 가문에서 태어났다. 부모는 상인이 되기를 바랐지만 장사보다 영혼 문제에 관심이 많았던 그는 부모의 뜻을 저버리고 수도원에 들어갔다. 이후 사제품을 받은 그는 수도원장까지 맡아 수도회 개혁을 주도하였다. 주교가 된 뒤에 교회의 일치를 위하여 많은 노력을 기울이다가 1623년 이교도들의 손에 목숨을 잃었다. 1867년 비오 9세 교황이 요사팟 주교를 시성하였다.","s":{"입당송":"하느님의 거룩한 이들은 주님의 가르침과 아버지의 법을 따라 끝까지 한마음 한 믿음으로 형제들을 사랑하였네.","본기도":"주님,\n복된 요사팟 주교가 성령을 충만히 받아 양들을 위하여 목숨을 바쳤으니\n그의 전구를 들으시어\n저희도 성령의 힘으로 형제들을 위하여 기꺼이 생명을 바치게 하소서.\n성부와 성령과 …….","제1독서":"<그를 종이 아니라 사랑하는 형제로 맞아들여 주십시오.>\n▥ 사도 바오로의 필레몬서 말씀입니다.\n7-20\n사랑하는 그대여, 7 나는 그대의 사랑으로 큰 기쁨과 격려를 받았습니다.\n그대 덕분에 성도들이 마음에 생기를 얻었기 때문입니다.\n8 그래서 나는 그리스도 안에서 큰 확신을 가지고\n그대가 마땅히 해야 할 일을 명령할 수도 있지만,\n9 사랑 때문에 오히려 부탁을 하려고 합니다.\n나 바오로는 늙은이인 데다가\n이제는 그리스도 예수님 때문에 수인까지 된 몸입니다.\n10 이러한 내가 옥중에서 얻은 내 아들\n오네시모스의 일로 그대에게 부탁하는 것입니다.\n11 그가 전에는 그대에게 쓸모없는 사람이었지만,\n이제는 그대에게도 나에게도 쓸모 있는 사람이 되었습니다.\n12 나는 내 심장과 같은 그를 그대에게 돌려보냅니다.\n13 그를 내 곁에 두어,\n복음 때문에 내가 감옥에 갇혀 있는 동안\n그대 대신에 나를 시중들게 할 생각도 있었지만,\n14 그대의 승낙 없이는 아무것도 하고 싶지 않았습니다.\n그대의 선행이 강요가 아니라 자의로 이루어지게 하려는 것입니다.\n15 그가 잠시 그대에게서 떨어져 있었던 것은\n아마도 그를 영원히 돌려받기 위한 것이었는지도 모릅니다.\n16 이제 그대는 그를 더 이상 종이 아니라 종 이상으로,\n곧 사랑하는 형제로 돌려받게 되었습니다.\n그가 나에게 특별히 사랑받는 형제라면,\n그대에게는 인간적으로 보나 주님 안에서 보나 더욱 그렇지 않습니까?\n17 그러므로 그대가 나를 동지로 여긴다면,\n나를 맞아들이듯이 그를 맞아들여 주십시오.\n18 그가 그대에게 손실을 입혔거나 빚을 진 것이 있거든\n내 앞으로 계산하십시오.\n19 나 바오로가 이 말을 직접 씁니다. 내가 갚겠습니다.\n그렇다고 나에게 빚을 진 덕분에\n지금의 그대가 있다는 사실을 말하려는 것은 아닙니다.\n20 그렇습니다, 형제여! 나는 주님 안에서 그대의 덕을 보려고 합니다.\n그리스도 안에서 내 마음이 생기를 얻게 해 주십시오.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 146(145),6ㄷ-7.8-9ㄱ.9ㄴㄷ-10ㄱㄴ(◎ 5ㄱ)\n◎ 행복하여라, 야곱의 하느님을 구원자로 모시는 이!\n○ 주님은 영원히 신의를 지키시고, 억눌린 이에게 권리를 찾아 주시며, 굶주린 이에게 먹을 것을 주시네. 주님은 잡힌 이를 풀어 주시네. ◎\n○ 주님은 눈먼 이를 보게 하시며, 주님은 꺾인 이를 일으켜 세우시네. 주님은 의인을 사랑하시고, 주님은 이방인을 보살피시네. ◎\n○ 주님은 고아와 과부를 돌보시나, 악인의 길은 꺾어 버리시네. 주님은 영원히 다스리신다. 시온아, 네 하느님이 대대로 다스리신다. ◎","복음 환호송":"요한 15,5 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 나는 포도나무요 너희는 가지다. 내 안에 머무르고 나도 그 안에 머무르는 사람은 많은 열매를 맺으리라.\n◎ 알렐루야.","복음":"<하느님의 나라는 너희 가운데에 있다.>\n✠ 루카가 전한 거룩한 복음입니다.\n17,20-25\n그때에 20 예수님께서는 바리사이들에게서\n하느님의 나라가 언제 오느냐는 질문을 받으시고 그들에게 대답하셨다.\n“하느님의 나라는 눈에 보이는 모습으로 오지 않는다.\n21 또 ‘보라, 여기에 있다.’,\n또는 ‘저기에 있다.’ 하고 사람들이 말하지도 않을 것이다.\n보라, 하느님의 나라는 너희 가운데에 있다.”\n22 예수님께서 제자들에게 이르셨다.\n“너희가 사람의 아들의 날을 하루라도 보려고\n갈망할 때가 오겠지만 보지 못할 것이다.\n23 사람들이 너희에게 ‘보라, 저기에 계시다.’,\n또는 ‘보라, 여기에 계시다.’ 할 것이다.\n그러나 너희는 나서지도 말고 따라가지도 마라.\n24 번개가 치면 하늘 이쪽 끝에서 하늘 저쪽 끝까지 비추는 것처럼,\n사람의 아들도 자기의 날에 그러할 것이다.\n25 그러나 그는 먼저 많은 고난을 겪고\n이 세대에게 배척을 받아야 한다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(에페 4,1-7.11-13)와 복음(요한 17,20-26)을 봉독할 수 있다.>","예물 기도":"지극히 인자하신 하느님,\n이 예물 위에 복을 내리시어\n거룩한 요사팟 주교가 피를 흘려 지킨 믿음이\n저희 안에서 굳건히 자라나게 하소서.\n우리 주 …….","영성체송":"마태 10,39 참조\n주님이 말씀하신다. 나 때문에 제 목숨을 잃는 사람은 영원히 살리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 천상 잔치로 저희에게 용기와 평화의 성령을 보내 주시어\n저희가 거룩한 요사팟 주교를 본받아\n교회의 영광과 일치를 위하여 기꺼이 저희 삶을 바치게 하소서.\n우리 주 …….","오늘의 묵상":"어느 책에서 다음과 같은 이야기를 읽은 적이 있습니다.\n비슷한 시기에 달에 다녀온 두 우주 비행사가 있었는데 한 비행사는 “내가 우주에 가서 아무리 찾아보아도 그 어디에도 하느님은 없었다.”라고 말하였고, 다른 비행사는 “내가 우주에서 본 지구의 모습은 너무나 경이로웠다. 나는 놀라움 안에서 이 모든 것을 창조하신 하느님을 보았다.”라고 말하였다는 것입니다.\n두 우주 비행사는 분명 같은 곳에 다녀왔고, 같은 것을 보았을 것입니다. 그러나 둘의 증언은 너무도 상반되었지요. 이는 보이는 것만 볼 수 있는 눈을 가진 사람과 보이는 것을 통하여 보이지 않는 것까지도 볼 수 있는 눈을 가진 사람의 차이로 여겨집니다.\n오늘 복음에서도 예수님께서는 하느님의 나라는 눈에 보이는 모습으로 오지 않고, 우리 가운데에 있다고(루카 17,21 참조) 말씀하십니다. 이 말씀은 우리가 눈으로 보고, 우리와 함께 살아가는 이웃들 안에서 눈에 보이지 않는 하느님 나라를 발견할 수 있어야 한다는 말씀이 아닐까요? 그런데 만일 우리가 날마다 삶에서 만나는 이웃들에게 냉소적 태도를 지닌다면 과연 그 안에서 하느님 나라를 발견할 수 있을까요?\n우리 안에 있는 하느님 나라를 발견하는 방법은 아주 간단합니다. 바로 예수님께서 하신 것처럼 오늘 내가 만나는 사람들을 환대하고, 그 사람의 의견을 존중하며, 내가 받은 하느님의 사랑을 전해 주는 것, 그래서 ‘우리’라는 이름의 울타리 안에 하느님의 사랑이 넘쳐흐르게 하는 것입니다. 단순히 그렇게 살면 좋겠다고 생각만 하는 것이 아니라 실제로 그렇게 살아가는 사람만이, 우리 가운데 있는 하느님 나라를 발견하고 이 땅에서부터 그 나라에서 살아가는 사람이 될 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261113":{"d":"2026년 11월 13일 금요일","c":"녹","t":"연중 제32주간 금요일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 88(87),3 참조\n주님, 제 기도 당신 앞에 이르게 하소서. 제 울부짖음에 귀를 기울이소서.","본기도":"전능하시고 자비로우신 하느님,\n저희에게 해로운 것을 모두 물리쳐 주시어\n저희가 평안한 몸과 마음으로\n자유로이 하느님의 뜻을 따르게 하소서.\n성부와 성령과 …….","제1독서":"<이 가르침 안에 머물러 있는 이라야 아버지도 아드님도 모십니다.>\n▥ 요한 2서의 말씀입니다.\n4-9\n선택받은 부인이여,\n4 그대의 자녀들 가운데, 우리가 아버지에게서 받은 계명대로\n진리 안에서 살아가는 사람들이 있는 것을 보고 나는 매우 기뻤습니다.\n5 부인, 이제 내가 그대에게 당부합니다.\n그러나 내가 그대에게 써 보내는 것은 무슨 새 계명이 아니라\n우리가 처음부터 지녀 온 계명입니다. 곧 서로 사랑하라는 것입니다.\n6 그리고 그 사랑은 우리가 그분의 계명에 따라 살아가는 것이고,\n그 계명은 그대들이 처음부터 들은 대로\n그 사랑 안에서 살아가야 한다는 것입니다.\n7 속이는 자들이 세상으로 많이 나왔습니다.\n그들은 예수 그리스도께서 사람의 몸으로 오셨다고 고백하지 않는 자들입니다.\n그런 자는 속이는 자며 ‘그리스도의 적’입니다.\n8 여러분은 우리가 일하여 이루어 놓은 것을 잃지 않고\n충만한 상을 받을 수 있도록 자신을 살피십시오.\n9 그리스도의 가르침 안에 머물러 있지 않고\n그것을 벗어나는 자는 아무도 하느님을 모시고 있지 않습니다.\n이 가르침 안에 머물러 있는 이라야 아버지도 아드님도 모십니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 119(118),1.2.10.11.17.18(◎ 1 참조)\n◎ 행복하여라, 주님의 가르침을 따라 사는 이들!\n○ 행복하여라, 온전한 길을 걷는 이들, 주님의 가르침을 따라 사는 이들! ◎\n○ 행복하여라, 그분의 법을 따르는 이들, 마음을 다하여 그분을 찾는 이들! ◎\n○ 제 마음 다하여 당신을 찾나이다. 당신 계명 떠나 헤매지 않게 하소서. ◎\n○ 행여 당신께 죄를 지을세라, 마음 깊이 당신 말씀 간직하나이다. ◎\n○ 당신 종에게 은혜를 베푸소서. 제가 살아 당신 말씀 지키오리다. ◎\n○ 제 눈을 열어 주소서. 당신의 놀라운 가르침 바라보리이다. ◎","복음 환호송":"루카 21,28 참조\n◎ 알렐루야.\n○ 허리를 펴고 머리를 들어라. 너희의 속량이 가까웠다.\n◎ 알렐루야.","복음":"<그날에 사람의 아들이 나타날 것이다.>\n✠ 루카가 전한 거룩한 복음입니다.\n17,26-37\n그때에 예수님께서 제자들에게 말씀하셨다.\n26 “사람의 아들의 날에도 노아 때와 같은 일이 일어날 것이다.\n27 노아가 방주에 들어가는 날까지\n사람들은 먹고 마시고 장가들고 시집가고 하였는데,\n홍수가 닥쳐 그들을 모두 멸망시켰다.\n28 또한 롯 때와 같은 일이 일어날 것이다.\n사람들은 먹고 마시고 사고팔고 심고 짓고 하였는데,\n29 롯이 소돔을 떠난 그날에\n하늘에서 불과 유황이 쏟아져 그들을 모두 멸망시켰다.\n30 사람의 아들이 나타나는 날에도 그와 똑같을 것이다.\n31 그날 옥상에 있는 이는 세간이 집 안에 있더라도 그것을 꺼내러 내려가지 말고,\n마찬가지로 들에 있는 이도 뒤로 돌아서지 마라.\n32 너희는 롯의 아내를 기억하여라.\n33 제 목숨을 보존하려고 애쓰는 사람은 목숨을 잃고,\n목숨을 잃는 사람은 목숨을 살릴 것이다.\n34 내가 너희에게 말한다. 그날 밤에 두 사람이 한 침상에 있으면,\n하나는 데려가고 하나는 버려둘 것이다.\n35 두 여자가 함께 맷돌질을 하고 있으면,\n하나는 데려가고 하나는 버려둘 것이다.”\n(36)·37 제자들이 예수님께, “주님, 어디에서 말입니까?” 하고 묻자,\n예수님께서 그들에게 이르셨다.\n“시체가 있는 곳에 독수리들도 모여든다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n이 제사를 자비로이 굽어보시어\n저희가 성자의 수난을 기념하며\n믿음과 사랑으로 그 신비를 따르게 하소서.\n우리 주 …….","영성체송":"시편 23(22),1-2\n주님은 나의 목자, 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시고, 잔잔한 물가로 나를 이끄시네.\n<또는>\n루카 24,35 참조\n빵을 나눌 때, 제자들은 주 예수님을 알아보았네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 성체로 힘을 얻고 감사하며 자비를 바라오니\n저희에게 성령을 보내시어\n성령의 힘으로 저희 삶을 변화시켜 주소서.\n우리 주 …….","오늘의 묵상":"오늘 복음에서 예수님께서는 “사람의 아들의 날”(루카 17,26), 곧 세상의 마지막 날에 대하여 말씀하십니다. 신학적으로 세상의 마지막 날은 하느님의 결정적 심판과 구원이 만천하에 드러나는 때를 뜻합니다. 오늘 복음에서 제자들은 이 마지막 날이 일어날 장소가 어디인지에 초점을 둡니다. 그러나 예수님께서는 “시체가 있는 곳에 독수리들도 모여든다.”(17,37)라는 비유적 표현으로 그날을 준비해야 하는 우리가 어떤 삶의 자세를 지녀야 하는지 가르쳐 주십니다.\n여기서 시체는 하느님 앞에 죽어 있는 상태, 곧 영적으로 메말라서 굳어 버린 상태를 뜻하고, 독수리는 하느님 심판을 상징하는 동물을 뜻합니다. 하느님 앞에 죽어 있는 상태에 있는 이들에게는 언제나 하느님의 심판이 뒤따를 것이라는 말씀이지요. 그러나 앞서 말씀드린 것처럼 마지막 날은 심판만이 아니라 구원도 드러나는 날이기에, 바꾸어 말하면, 하느님 앞에서 영혼의 생기를 돋우는 사람에게는 언제나 하느님의 구원이 뒤따를 것이라는 말씀이기도 합니다.\n이처럼 세상의 마지막 날은 장소의 문제가 아니라, 우리가 가진 삶에 대한 자세의 문제입니다. 그리고 하느님 앞에 살아 있다는 것은 늘 하느님을 바라보며 깨어 있음을 뜻합니다. 오늘 복음에서 예로 나온 노아나 롯 시대의 사람들처럼 깨어 있지 않고 새로움 없이, 그저 그런 일상을 살아가는 것은 하느님 앞에 죽어 있는 삶입니다. 그러나 늘 새로움을 주시는 성령의 목소리에 귀 기울이며 하느님의 뜻을 찾아 살아간다면, 날마다 되풀이되는 삶일지라도 그 안에서 차고 넘치는 생명력을 꽃피우게 될 것입니다. 그리고 그 꽃잎이 떨어지고 맺는 열매의 이름이 바로 하느님의 구원일 것입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261114":{"d":"2026년 11월 14일 토요일","c":"녹","t":"연중 제32주간 토요일","o":[{"c":"백","t":"복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"시편 88(87),3 참조\n주님, 제 기도 당신 앞에 이르게 하소서. 제 울부짖음에 귀를 기울이소서.","본기도":"전능하시고 자비로우신 하느님,\n저희에게 해로운 것을 모두 물리쳐 주시어\n저희가 평안한 몸과 마음으로\n자유로이 하느님의 뜻을 따르게 하소서.\n성부와 성령과 …….","제1독서":"<우리가 형제들을 돌보아 주어야 합니다. 그렇게 하여 우리는 진리의 협력자가 됩니다.>\n▥ 요한 3서의 말씀입니다.\n5-8\n사랑하는 가이오스,\n5 그대는 형제들을 위하여, 특히 낯선 이들을 위하여\n무슨 일을 하든 다 성실히 하고 있습니다.\n6 그들이 교회 모임에서 그대의 사랑에 관하여 증언하였습니다.\n그들이 하느님께 맞갖도록 그대의 도움을 받아\n여행을 계속할 수 있게 해 주었으면 좋겠습니다.\n7 그들은 그리스도를 위하여 길을 나선 사람들로,\n이교인들에게서는 아무것도 받지 않습니다.\n8 그러므로 우리가 그러한 이들을 돌보아 주어야 합니다.\n그렇게 하여 우리는 진리의 협력자가 되는 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 112(111),1ㄴㄷ-2.3-4.5-6(◎ 1ㄴ)\n◎ 행복하여라, 주님을 경외하는 이!\n○ 행복하여라, 주님을 경외하고, 그분 계명을 큰 즐거움으로 삼는 이! 그의 후손은 땅에서 융성하고, 올곧은 세대는 복을 받으리라. ◎\n○ 부귀영화 그의 집에 넘치고, 그의 의로움 길이 이어지리라. 올곧은 이들에게는 어둠 속에서 빛이 솟으리라. 그 빛은 너그럽고 자비로우며 의롭다네. ◎\n○ 잘되리라, 후하게 꾸어 주고, 자기 일을 바르게 처리하는 이! 그는 언제나 흔들리지 않으리니, 영원히 의인으로 기억되리라. ◎","복음 환호송":"2테살 2,14 참조\n◎ 알렐루야.\n○ 하느님이 복음을 통하여 우리를 부르시어 우리 주 예수 그리스도의 영광을 차지하게 하셨네.\n◎ 알렐루야.","복음":"<하느님께서는 당신께 선택된 이들이 부르짖으면 올바른 판결을 내려 주실 것이다.>\n✠ 루카가 전한 거룩한 복음입니다.\n18,1-8\n그때에 1 예수님께서는 낙심하지 말고 끊임없이 기도해야 한다는 뜻으로\n제자들에게 비유를 말씀하셨다.\n2 “어떤 고을에 하느님도 두려워하지 않고\n사람도 대수롭지 않게 여기는 한 재판관이 있었다.\n3 또 그 고을에는 과부가 한 사람 있었는데 그는 줄곧 그 재판관에게 가서,\n‘저와 저의 적대자 사이에 올바른 판결을 내려 주십시오.’ 하고 졸랐다.\n4 재판관은 한동안 들어주려고 하지 않다가 마침내 속으로 말하였다.\n‘나는 하느님도 두려워하지 않고 사람도 대수롭지 않게 여기지만,\n5 저 과부가 나를 이토록 귀찮게 하니\n그에게는 올바른 판결을 내려 주어야겠다.\n그렇게 하지 않으면 끝까지 찾아와서 나를 괴롭힐 것이다.’”\n6 주님께서 다시 이르셨다.\n“이 불의한 재판관이 하는 말을 새겨들어라.\n7 하느님께서 당신께 선택된 이들이 밤낮으로 부르짖는데\n그들에게 올바른 판결을 내려 주지 않으신 채, 그들을 두고 미적거리시겠느냐?\n8 내가 너희에게 말한다.\n하느님께서는 그들에게 지체 없이 올바른 판결을 내려 주실 것이다.\n그러나 사람의 아들이 올 때에\n이 세상에서 믿음을 찾아볼 수 있겠느냐?”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n이 제사를 자비로이 굽어보시어\n저희가 성자의 수난을 기념하며\n믿음과 사랑으로 그 신비를 따르게 하소서.\n우리 주 …….","영성체송":"시편 23(22),1-2\n주님은 나의 목자, 아쉬울 것 없어라. 푸른 풀밭에 나를 쉬게 하시고, 잔잔한 물가로 나를 이끄시네.\n<또는>\n루카 24,35 참조\n빵을 나눌 때, 제자들은 주 예수님을 알아보았네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 성체로 힘을 얻고 감사하며 자비를 바라오니\n저희에게 성령을 보내시어\n성령의 힘으로 저희 삶을 변화시켜 주소서.\n우리 주 …….","오늘의 묵상":"교리 신학원에서 ‘우리가 기도하면 하느님께서 들어주시는가?’에 대하여 강의를 한 적이 있습니다. 하느님께서는 분명 우리의 기도를 들어주십니다. 그러나 여기에는 두 가지 전제가 있지요. 첫째는 우리 기도의 내용이 하느님께서 이루시려는 선과 일치해야 한다는 것이고, 둘째는 그 기도는 우리가 바라는 때가 아니라 하느님의 시간에, 그분의 방식으로 이루어진다는 것입니다.\n핵심은 ‘하느님의 시간’과 ‘우리가 바라는 때’가 분명히 다르다는 점입니다. 이 다름을 이해해야 오늘 복음에 나오는 “하느님께서는 그들에게 지체 없이 올바른 판결을 내려 주실 것”(루카 18,8)이라는 말씀의 참뜻을 깨달을 수 있습니다. 하느님 구원 역사의 시간은 우리 인간의 시간과 달리 어제, 오늘, 내일로 되어 있지 않습니다. 따라서 우리의 기도가 하느님의 선과 일치한다면 하느님께서는 지체 없이 우리의 기도를 들어주시지만, 그 기도가 이루어지는 때는 우리가 생각하는 ‘지금 당장’은 아닐 수 있습니다.\n이렇게 기도하였으니, 하느님께서 그 기도의 내용대로 지금 당장 해 주셔야 한다고 설득하거나 협상할 수 있는 것이 아닙니다. 오히려 우리가 기도한 내용이 하느님의 시간에, 그분께서 바라시는 방식으로 이루어지리라는 믿음을 가져야 합니다. 그래서 낙심하지 말고 기도해야 한다고 가르치시는 예수님께서도 오늘 복음의 마지막에서 “그러나 사람의 아들이 올 때에 이 세상에서 믿음을 찾아볼 수 있겠느냐?”(18,8)라고 물으시는 것입니다.\n예수님께서 오늘 우리에게 기도하라고 말씀하시면서 요구하시는 것은 바로 이러한 믿음입니다. 하느님의 뜻이, 하느님의 시간에 이루어지리라는 믿음입니다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261115":{"d":"2026년 11월 15일 일요일","c":"녹","t":"연중 제33주일","o":[],"n":"세계 가난한 이의 날","g":"대영광송 · 신경 · 교중","i":"프란치스코 교황은 2016년 11월 ‘자비의 희년’을 폐막하며 연중 제33주일을 ‘세계 가난한 이의 날’로 지내도록 선포하였다. 이날 교회는 가난한 이들을 위한 우선적 선택의 모범을 보여 주신 예수님을 본받아, 모든 공동체와 그리스도인이 가난한 이들을 향한 자비와 연대, 형제애를 실천하도록 일깨우고 촉구한다.","s":{"오늘 전례":"오늘은 연중 제33주일이며 세계 가난한 이의 날입니다. 하느님 아버지께서는 창조와 은총의 모든 복을 사람의 손에 맡기시어, 우리가 좋은 뜻을 세워 아버지의 섭리로 많은 열매를 거두게 하십니다. 우리 모두 돌아오실 아버지를 깨어 기다리는 충실한 종으로서, 아버지의 나라에 들어가는 기쁨을 누리도록 합시다.","입당송":"예레 29,11.12.14 참조\n주님이 말씀하신다. 나는 재앙이 아니라 평화를 주노라. 나를 부르면 너희 기도를 들어 주고, 사로잡힌 너희를 모든 곳에서 데려오리라.","본기도":"주 하느님,\n저희를 도와주시어\n언제나 모든 선의 근원이신 주님을 기쁜 마음으로 섬기며\n완전하고 영원한 행복을 누리게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<훌륭한 아내는 제 손으로 즐거이 일한다.>\n▥ 잠언의 말씀입니다.\n31,10-13.19-20.30-31\n10 훌륭한 아내를 누가 얻으리오? 그 가치는 산호보다 높다.\n11 남편은 그를 마음으로 신뢰하고 소득이 모자라지 않는다.\n12 그 아내는 한평생 남편에게 해 끼치는 일 없이 잘해 준다.\n13 양모와 아마를 구해다가 제 손으로 즐거이 일한다.\n19 한 손으로는 물레질하고 다른 손으로는 실을 잣는다.\n20 가난한 이에게 손을 펼치고 불쌍한 이에게 손을 내밀어 도와준다.\n30 우아함은 거짓이고 아름다움은 헛것이지만 주님을 경외하는 여인은 칭송을 받는다.\n31 그 손이 거둔 결실을 그에게 돌리고 그가 한 일을 성문에서 칭송하여라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 128(127),1-2.3.4-5(◎ 1ㄱ 참조)\n◎ 행복하여라, 주님을 경외하는 모든 사람!\n○ 행복하여라, 주님을 경외하는 사람, 그분의 길을 걷는 모든 사람! 네 손으로 벌어 네가 먹으리니, 너는 행복하여라, 너는 복을 받으리라. ◎\n○ 너의 집 안방에 있는 아내는, 풍성한 포도나무 같고, 너의 밥상에 둘러앉은 아들들은  올리브 나무 햇순 같구나. ◎\n○ 보라, 주님을 경외하는 사람은, 이렇듯 복을 받으리라. 주님은 시온에서 너에게 복을 내리시리라. 너는 한평생 모든 날에, 예루살렘의 번영을 보리라. ◎","제2독서":"<주님의 날이 여러분을 도둑처럼 덮치지는 않을 것입니다.>\n▥ 사도 바오로의 테살로니카 1서 말씀입니다.\n5,1-6\n1 형제 여러분,\n그 시간과 그 때에 관해서는 여러분에게 더 쓸 필요가 없습니다.\n2 주님의 날이 마치 밤도둑처럼 온다는 것을 여러분 자신도 잘 알고 있습니다.\n3 사람들이 “평화롭다, 안전하다.” 할 때, 아기를 밴 여자에게 진통이 오는 것처럼\n갑자기 그들에게 파멸이 닥치는데, 아무도 그것을 피하지 못할 것입니다.\n4 그러나 형제 여러분, 여러분은 어둠 속에 있지 않으므로,\n그날이 여러분을 도둑처럼 덮치지는 않을 것입니다.\n5 여러분은 모두 빛의 자녀이며 낮의 자녀입니다.\n우리는 밤이나 어둠에 속한 사람이 아닙니다.\n6 그러므로 이제 우리는 다른 사람들처럼 잠들지 말고,\n맑은 정신으로 깨어 있도록 합시다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"요한 15,4.5 참조\n◎ 알렐루야.\n○ 주님이 말씀하신다. 내 안에 머물러라. 내 안에 머무르고 나도 그 안에 머무르는 사람은 많은 열매를 맺으리라.\n◎ 알렐루야.","복음":"<네가 작은 일에 성실하였으니, 와서 네 주인과 함께 기쁨을 나누어라.>\n✠ 마태오가 전한 거룩한 복음입니다.\n25,14-30\n그때에 예수님께서 제자들에게 이런 비유를 들어 말씀하셨다.\n14 “하늘 나라는 어떤 사람이 여행을 떠나면서\n종들을 불러 재산을 맡기는 것과 같다.\n15 그는 각자의 능력에 따라 한 사람에게는 다섯 탈렌트,\n다른 사람에게는 두 탈렌트,\n또 다른 사람에게는 한 탈렌트를 주고 여행을 떠났다.\n16 다섯 탈렌트를 받은 이는 곧 가서 그 돈을 활용하여 다섯 탈렌트를 더 벌었다.\n17 두 탈렌트를 받은 이도 그렇게 하여 두 탈렌트를 더 벌었다.\n18 그러나 한 탈렌트를 받은 이는 물러가서 땅을 파고 주인의 그 돈을 숨겼다.\n19 오랜 뒤에 종들의 주인이 와서 그들과 셈을 하게 되었다.\n20 다섯 탈렌트를 받은 이가 나아가서 다섯 탈렌트를 더 바치며,\n‘주인님, 저에게 다섯 탈렌트를 맡기셨는데,\n보십시오, 다섯 탈렌트를 더 벌었습니다.’ 하고 말하였다.\n21 그러자 주인이 그에게 일렀다. ‘잘하였다, 착하고 성실한 종아!\n네가 작은 일에 성실하였으니 이제 내가 너에게 많은 일을 맡기겠다.\n와서 네 주인과 함께 기쁨을 나누어라.’\n22 두 탈렌트를 받은 이도 나아가서, ‘주인님, 저에게 두 탈렌트를 맡기셨는데,\n보십시오, 두 탈렌트를 더 벌었습니다.’ 하고 말하였다.\n23 그러자 주인이 그에게 일렀다. ‘잘하였다, 착하고 성실한 종아!\n네가 작은 일에 성실하였으니 이제 내가 너에게 많은 일을 맡기겠다.\n와서 네 주인과 함께 기쁨을 나누어라.’\n24 그런데 한 탈렌트를 받은 이는 나아가서 이렇게 말하였다.\n‘주인님, 저는 주인님께서 모진 분이시어서, 심지 않은 데에서 거두시고\n뿌리지 않은 데에서 모으신다는 것을 알고 있었습니다.\n25 그래서 두려운 나머지 물러가서 주인님의 탈렌트를 땅에 숨겨 두었습니다.\n보십시오, 주인님의 것을 도로 받으십시오.’\n26 그러자 주인이 그에게 대답하였다.\n‘이 악하고 게으른 종아! 내가 심지 않은 데에서 거두고\n뿌리지 않은 데에서 모으는 줄로 알고 있었다는 말이냐?\n27 그렇다면 내 돈을 대금업자들에게 맡겼어야지.\n그리하였으면 내가 돌아왔을 때에 내 돈에 이자를 붙여 돌려받았을 것이다.\n28 저자에게서 그 한 탈렌트를 빼앗아 열 탈렌트를 가진 이에게 주어라.\n29 누구든지 가진 자는 더 받아 넉넉해지고,\n가진 것이 없는 자는 가진 것마저 빼앗길 것이다.\n30 그리고 저 쓸모없는 종은 바깥 어둠 속으로 내던져 버려라.\n거기에서 그는 울며 이를 갈 것이다.’”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n<또는>\n<네가 작은 일에 성실하였으니, 와서 네 주인과 함께 기쁨을 나누어라.>\n✠ 마태오가 전한 거룩한 복음입니다.\n25,14-15.19-21\n그때에 예수님께서 제자들에게 이런 비유를 들어 말씀하셨다.\n14 “하늘 나라는 어떤 사람이 여행을 떠나면서\n종들을 불러 재산을 맡기는 것과 같다.\n15 그는 각자의 능력에 따라 한 사람에게는 다섯 탈렌트,\n다른 사람에게는 두 탈렌트,\n또 다른 사람에게는 한 탈렌트를 주고 여행을 떠났다.\n19 오랜 뒤에 종들의 주인이 와서 그들과 셈을 하게 되었다.\n20 다섯 탈렌트를 받은 이가 나아가서 다섯 탈렌트를 더 바치며,\n‘주인님, 저에게 다섯 탈렌트를 맡기셨는데,\n보십시오, 다섯 탈렌트를 더 벌었습니다.’ 하고 말하였다.\n21 그러자 주인이 그에게 일렀다. ‘잘하였다, 착하고 성실한 종아!\n네가 작은 일에 성실하였으니\n이제 내가 너에게 많은 일을 맡기겠다.\n와서 네 주인과 함께 기쁨을 나누어라.’”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n빛이신 주님, 주님의 사랑을 실천하는 교회를 인도하시어, 가난한 이들을 살피며 가진 것을 나누고 함께 희망을 키우며, 더불어 사는 세상을 위하여 힘쓰게 하소서.\n\n2. 정치인들을 위하여 기도합시다.\n\n통치자이신 주님, 정치인들에게 정의와 지혜의 은총을 주시어, 국민의 행복을 위하여 힘쓰게 하시며, 공동선을 위한 정책을 수립하고 실현하게 하소서.\n\n3. 수험생들을 위하여 기도합시다.\n\n지혜의 샘이신 주님, 대학 수학 능력 시험을 앞둔 수험생들을 보살펴 주시어, 건강한 몸과 마음으로 이제까지 애써 준비한 것들을 아쉬움 없이 잘 펼쳐 내도록 도와주소서.\n\n4. 지역 사회를 위하여 기도합시다.\n\n사랑이신 주님, 지역 사회의 모든 구성원에게 강복하시어, 가정과 사회의 좋은 관습을 지키고 발전시킴으로써, 지역 사회에 상생과 공존이 이루어지도록 도와주소서.","예물 기도":"주님,\n지극히 높으신 주님께 바치는 이 예물을 굽어보시어\n저희가 오롯이 주님을 사랑하며 살다가 영원한 생명을 얻게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<연중 주일 감사송 3 : 사람이신 그리스도를 통한 인류 구원>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 우리 주 그리스도를 통하여\n주님의 무한한 영광을 보여 주셨으니\n그리스도의 천주성으로\n죽을 운명을 지닌 인간을 도와주시고\n그 인성으로 저희를 죽음과 멸망에서 구원하셨나이다.\n그리스도를 통하여\n주님 앞에서 천사들의 군대가 영원히 기뻐하며\n주님의 위엄을 흠숭하오니\n저희도 환호하며 그들과 소리를 모아 주님을 찬미하나이다.","영성체송":"시편 73(72),28\n저는 하느님 곁에 있어 행복하옵니다. 주 하느님을 피신처로 삼으리이다.\n<또는>\n마르 11,23.24 참조\n주님이 말씀하신다. 내가 진실로 너희에게 말한다. 너희가 기도하며 청하는 것은 무엇이든 이미 받은 줄로 믿어라. 너희에게 그대로 이루어지리라.","영성체 후 묵상":"“우아함은 거짓이고 아름다움은 헛것”이라는 잠언의 말씀대로, 주님께서는 겉모습이 아니라 마음을 살피십니다. 주님께서는 당신께 받은 탈렌트를 활용하여 가난한 이에게 손을 내밀고 불쌍한 이를 도와주는 사람에게 기쁨을 함께 나누자고 하실 것입니다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 거룩하신 성체를 받아 모시고 간절히 비오니\n성자께서 당신 자신을 기억하여 거행하라 명하신 이 성사로\n저희가 언제나 주님의 사랑을 실천하게 하소서.\n우리 주 그리스도를 통하여 비나이다.","오늘의 묵상":"‘금 수저’, ‘흙 수저’라는 말을 들어 본 적이 있을 것입니다. 태어나 보니 흔히 말하는 금 수저를 물고 있었으면서 모든 것을 내 능력으로 얻었다고 착각하는 것도 문제지만, 자신은 아무것도 가지지 않은 흙 수저로 태어났다며 환경을 탓하는 것도 문제입니다. 그것은 자기 자신을 속이며, 없던 한계를 만들어 스스로를 옭아매기 때문입니다.\n오늘 복음에서는 저마다 자신의 능력에 따라 탈렌트를 받은 사람들이 나옵니다. 다섯 탈렌트를 받은 사람과 두 탈렌트를 받은 사람은 그 탈렌트를 가지고 작은 일이라도 성실히 하였습니다. 그러나 한 탈렌트를 받은 사람은 아무것도 하지 않은 채, “저는 주인님께서 모진 분이시어서, 심지 않은 데에서 거두시고 뿌리지 않은 데에서 모으신다는 것을 알고 있었습니다.”(마태 25,24)라고 말합니다.\n주인이 정말 아무것도 주지 않은 채 셈을 하려고 하였다면, 그 주인은 ‘심지 않은 데에서 거두려는’ 사람이 맞을 것입니다. 그런데 주인은 분명 종들에게 저마다 탈렌트를 주었습니다. 실제로 주인은 그런 사람이 아님에도, 한 탈렌트를 받은 이는 주인이 아무것도 주지 않아서 자신은 아무것도 하지 않았다며 주인 탓으로 돌립니다.\n중요한 것은 하느님께 받은 탈렌트의 양이 아니라 하느님께 많은 것을 받으며 산다는 사실을 스스로 깨닫는 것입니다. 그 깨달음은 우리가 하느님의 일을 성실하게 하도록 이끌어 줍니다. 그리고 그 성실함이 우리를 하느님과 함께 기쁨을 나누는 복된 종으로 만들어 줄 것입니다. 우리는 모두 하느님이라는 세상 가장 귀한 수저를 받았음을 잊지 맙시다.\n\n(허권범 프란치스코 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261116":{"d":"2026년 11월 16일 월요일","c":"녹","t":"연중 제33주간 월요일","o":[{"c":"백","t":"스코틀랜드의 성녀 마르가리타"},{"c":"백","t":"성녀 제르트루다 동정"}],"n":"","g":"","i":"","s":{"입당송":"예레 29,11.12.14 참조\n주님이 말씀하신다. 나는 재앙이 아니라 평화를 주노라. 나를 부르면 너희 기도를 들어 주고, 사로잡힌 너희를 모든 곳에서 데려오리라.","본기도":"주 하느님,\n저희를 도와주시어\n언제나 모든 선의 근원이신 주님을 기쁜 마음으로 섬기며\n완전하고 영원한 행복을 누리게 하소서.\n성부와 성령과 …….","제1독서":"<네가 어디에서 추락했는지 생각해 내어 회개하여라.>\n▥ 요한 묵시록의 시작입니다.\n1,1-4.5ㄴ; 2,1-5ㄱ\n1 예수 그리스도의 계시.\n하느님께서 머지않아 반드시 일어날 일들을 당신 종들에게 보여 주시려고\n그리스도께 알리셨고, 그리스도께서 당신 천사를 보내시어\n당신 종 요한에게 알려 주신 계시입니다.\n2 요한은 하느님의 말씀과 예수 그리스도의 증언,\n곧 자기가 본 모든 것을 증언하였습니다.\n3 이 예언의 말씀을 낭독하는 이와 그 말씀을 듣고\n그 안에 기록된 것을 지키는 사람들은 행복합니다.\n그때가 다가왔기 때문입니다.\n4 요한이 아시아에 있는 일곱 교회에 이 글을 씁니다.\n지금도 계시고 전에도 계셨으며\n또 앞으로 오실 분과 그분의 어좌 앞에 계신 일곱 영에게서,\n5 은총과 평화가 여러분에게 내리기를 빕니다.\n나는 주님께서 나에게 말씀하시는 것을 들었습니다.\n2,1 “에페소 교회의 천사에게 써 보내라.\n‘오른손에 일곱 별을 쥐고 일곱 황금 등잔대 사이를 거니는 이가 이렇게 말한다.\n2 나는 네가 한 일과 너의 노고와 인내를 알고,\n또 네가 악한 자들을 용납하지 못한다는 것을 안다.\n사도가 아니면서 사도라고 자칭하는 자들을 시험하여\n너는 그들이 거짓말쟁이임을 밝혀냈다.\n3 너는 인내심이 있어서,\n내 이름 때문에 어려움을 겪으면서도 지치는 일이 없었다.\n4 그러나 너에게 나무랄 것이 있다.\n너는 처음에 지녔던 사랑을 저버린 것이다.\n5 그러므로 네가 어디에서 추락했는지 생각해 내어 회개하고,\n처음에 하던 일들을 다시 하여라.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 1,1-2.3.4와 6(◎ 묵시 2,7ㄴ 참조)\n◎ 승리하는 사람에게는 생명나무의 열매를 먹게 해 주리라.\n○ 행복하여라! 악인의 뜻에 따라 걷지 않는 사람, 죄인의 길에 들어서지 않으며, 오만한 자의 자리에 앉지 않는 사람, 오히려 주님의 가르침을 좋아하고, 밤낮으로 그 가르침을 되새기는 사람. ◎\n○ 그는 시냇가에 심은 나무 같아, 제때에 열매 맺고, 잎이 아니 시들어, 하는 일마다 모두 잘되리라. ◎\n○ 악인은 그렇지 않으니, 바람에 흩날리는 검불 같아라. 의인의 길은 주님이 아시고, 악인의 길은 멸망에 이르리라.
