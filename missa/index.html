찬양하며 집으로 돌아갔다.\n26 이에 모든 사람이 크게 놀라 하느님을 찬양하였다.\n그리고 두려움에 차서\n“우리가 오늘 신기한 일을 보았다.” 하고 말하였다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(에페 3,8-12)와 복음(요한 10,11-16)을 봉독할 수 있다.>","예물 기도":"주님,\n복된 암브로시오를 성령으로 가득 채우시어\n주님의 영광을 널리 전하게 하셨으니\n이 거룩한 제사를 드리는 저희의 믿음도 성령의 빛으로 밝혀 주소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<성인 감사송 1 : 성인들의 영광>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 성인들 가운데서 찬미를 받으시며\n그들의 공로를 갚아 주시어 주님의 은총을 빛내시나이다.\n또 성인들의 삶을 저희에게 모범으로 주시고\n저희가 성인들과 하나 되게 하시며 그 기도의 도움을 받게 하시나이다.\n저희는 이 위대한 증인에게서 힘을 얻고\n악과 싸워서 승리를 거두고 나아갈 길을 끝까지 달려\n우리 주 그리스도를 통하여\n그들과 함께 영원히 시들지 않는 영광의 월계관을 받나이다.\n그러므로 천사와 대천사와 성인들의 무리와 함께\n저희도 주님을 찬미하며 끝없이 노래하나이다.","영성체송":"시편 1,2-3 참조\n주님의 가르침을 밤낮으로 되새기는 사람은 제때에 열매를 맺으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 성사의 신비로운 힘으로 저희를 새롭게 하셨으니\n저희가 복된 암브로시오의 가르침을 따라 구원의 길을 힘차게 걸어\n마침내 영원한 잔치의 기쁨을 누리게 하소서.\n우리 주 …….","오늘의 묵상":"우리가 믿는 하느님께서는 성부와 성자와 성령, 삼위일체 하느님이십니다. 삼위일체의 신비를 온전히 이해하기는 어렵지만 우리는 사랑의 친교를 이루시는 하느님 안에서 살아갑니다. 교회 또한 이러한 친교에 참여하여 살아가는 공동체입니다. 때로는 갈등도 있지만, 교회는 함께할 때 더욱 큰 열매를 맺습니다.\n오늘 복음에서 남자 몇이 아무것도 할 수 없는 중풍 병자를 평상에 눕혀 예수님께 데려옵니다. 사람들이 너무 많아 들어가기 어렵자 지붕 위로 올라가 병자를 예수님 앞으로 내려보냅니다. 그들의 수고는 헛되지 않았습니다. 예수님께서는 “그들의 믿음을 보시고”(루카 5,20) 중풍 병자를 낫게 해 주셨기 때문입니다. 이러한 예수님의 치유 장면에서 우리는 두 가지 차원을 발견합니다. “너는 죄를 용서받았다.”(5,20), “일어나 네 평상을 가지고 집으로 가거라”(5,24). 주님께서는 먼저 죄를 용서하시고 이어서 몸의 병을 낫게 하십니다. 우리에게는 육체의 건강만이 아니라 영혼의 건강도 필요하며, 육체와 영혼이 모두 건강할 때 비로소 완전한 치유가 이루어진다는 것을 깨닫게 됩니다. 더욱이 예수님께서는 영혼의 치유를 먼저 베푸심으로써 무엇이 더 바탕에 있는지 생각하게 하십니다.\n오늘 전례에서 기념하는 암브로시오 성인은 “그대를 위하여 기도해 줄 교회를 부르시오. 주님께서 교회를 보아서라도 그대를 용서하실 것이오.”라고 말하였습니다. 신앙은 결코 혼자 걷는 길이 아닙니다. 오늘은 내가 벗을 위하여 평상을 들고, 내일은 벗들이 나를 위하여 평상을 들어 예수님 앞에 내려보내 줄 것입니다. 교회의 친교 안에서 서로 믿음으로 이끌며, 우리를 하나로 모아 주시는 삼위일체 하느님께 함께 나아갑시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261208":{"d":"2026년 12월 08일 화요일","c":"백","t":"한국 교회의 수호자, 원죄 없이 잉태되신 복되신 동정 마리아 대축일","o":[],"n":"","g":"대영광송 · 신경","i":"성모 마리아께서 잉태되신 순간부터 원죄에 물드시지 않았다는 믿음은 초대 교회 때부터 있었다. 이러한 믿음은 여러 차례의 성모님 발현으로 더욱 깊어졌다. 1854년 비오 9세 교황은 ‘성모 마리아의 원죄 없는 잉태’를 ‘믿을 교리’로 선포하였다. 한국 교회는 이미 1838년 교황청에 서한을 보내 ‘원죄 없이 잉태되신 동정 마리아’를 조선교구의 수호자로 정해 줄 것을 청하였고, 그레고리오 16세 교황이 이 요청을 허락하였다.","s":{"오늘 전례":"오늘은 한국 교회의 수호자, 원죄 없이 잉태되신 복되신 동정 마리아 대축일입니다. 동정 마리아를 성자의 맞갖은 어머니가 되게 하신 하느님을 찬미합시다. 또한 원죄 없이 잉태되신 복되신 동정 마리아께, 한국 교회가 이 땅에서 주님의 뜻을 이루는 주님의 종이 되도록 전구해 주시기를 청합시다.","입당송":"이사 61,10\n나는 주님 안에서 크게 기뻐하고, 내 영혼은 나의 하느님 안에서 즐거워하리라. 신부가 패물로 단장하듯, 그분이 나에게 구원의 옷을 입히시고 의로움의 겉옷을 둘러 주셨네.","본기도":"하느님,\n하느님께서는 원죄 없이 잉태되신 복되신 동정녀를 통하여\n성자의 합당한 거처를 마련하시고\n성자의 죽음을 미리 내다보시어\n동정 마리아를 어떤 죄에도 물들지 않게 하셨으니\n동정녀의 전구를 들으시어\n저희도 깨끗한 몸과 마음으로 하느님께 나아가게 하소서.\n성부와 성령과 …….","제1독서":"<나는 네 후손과 그 여자의 후손 사이에 적개심을 일으키리라.>\n▥ 창세기의 말씀입니다.\n3,9-15.20\n사람이 나무 열매를 먹은 뒤, 주 하느님께서 그를 9 부르시며,\n“너 어디 있느냐?” 하고 물으셨다.\n10 그가 대답하였다.\n“동산에서 당신의 소리를 듣고 제가 알몸이기 때문에 두려워 숨었습니다.”\n11 그분께서 “네가 알몸이라고 누가 일러 주더냐?\n내가 너에게 따 먹지 말라고 명령한 그 나무 열매를\n네가 따 먹었느냐?” 하고 물으시자,\n12 사람이 대답하였다. “당신께서 저와 함께 살라고 주신 여자가\n그 나무 열매를 저에게 주기에 제가 먹었습니다.”\n13 주 하느님께서 여자에게 “너는 어찌하여 이런 일을 저질렀느냐?” 하고 물으시자,\n여자가 대답하였다.\n“뱀이 저를 꾀어서 제가 따 먹었습니다.”\n14 주 하느님께서 뱀에게 말씀하셨다. “네가 이런 일을 저질렀으니\n너는 모든 집짐승과 들짐승 가운데에서 저주를 받아\n네가 사는 동안 줄곧 배로 기어다니며 먼지를 먹으리라.\n15 나는 너와 그 여자 사이에,\n네 후손과 그 여자의 후손 사이에 적개심을 일으키리니\n여자의 후손은 너의 머리에 상처를 입히고\n너는 그의 발꿈치에 상처를 입히리라.”\n20 사람은 자기 아내의 이름을 하와라 하였다.\n그가 살아 있는 모든 것의 어머니가 되었기 때문이다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 98(97),1.2-3ㄱㄴ.3ㄷㄹ-4(◎ 1ㄱㄴ)\n◎ 주님께 노래하여라, 새로운 노래. 그분이 기적들을 일으키셨네.\n○ 주님께 노래하여라, 새로운 노래. 그분이 기적들을 일으키셨네. 그분의 오른손이, 거룩한 그 팔이, 승리를 가져오셨네. ◎\n○ 주님은 당신 구원을 알리셨네. 민족들의 눈앞에, 당신 정의를 드러내셨네. 이스라엘 집안을 위하여, 당신 자애와 진실을 기억하셨네. ◎\n○ 우리 하느님의 구원을, 온 세상 땅끝마다 모두 보았네. 주님께 환성 올려라, 온 세상아. 즐거워하며 환호하여라, 찬미 노래 불러라. ◎","제2독서":"<하느님께서는 세상 창조 이전에 그리스도 안에서 우리를 선택하셨습니다.>\n▥ 사도 바오로의 에페소서 말씀입니다.\n1,3-6.11-12\n3 우리 주 예수 그리스도의 아버지 하느님께서 찬미받으시기를 빕니다.\n하느님께서는 그리스도 안에서\n하늘의 온갖 영적인 복을 우리에게 내리셨습니다.\n4 세상 창조 이전에 그리스도 안에서 우리를 선택하시어,\n우리가 당신 앞에서 거룩하고 흠 없는 사람이 되게 해 주셨습니다.\n사랑으로 5 예수 그리스도를 통하여\n우리를 당신의 자녀로 삼으시기로 미리 정하셨습니다.\n이는 하느님의 그 좋으신 뜻에 따라 이루어진 것입니다.\n6 그리하여 사랑하시는 아드님 안에서\n우리에게 베푸신 그 은총의 영광을 찬양하게 하셨습니다.\n11 만물을 당신의 결정과 뜻대로 이루시는 분의 의향에 따라 미리 정해진 우리도\n그리스도 안에서 한몫을 얻게 되었습니다.\n12 그리하여 하느님께서는 이미 그리스도께 희망을 둔 우리가\n당신의 영광을 찬양하는 사람이 되게 하셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"루카 1,28 참조\n◎ 알렐루야.\n○ 은총이 가득하신 마리아님, 기뻐하소서. 주님께서 함께 계시니, 여인 중에 복되시나이다.\n◎ 알렐루야.","복음":"<은총이 가득한 이여, 기뻐하여라. 주님께서 너와 함께 계시다.>\n✠ 루카가 전한 거룩한 복음입니다.\n1,26-38\n그때에 26 하느님께서는\n가브리엘 천사를 갈릴래아 지방 나자렛이라는 고을로 보내시어,\n27 다윗 집안의 요셉이라는 사람과 약혼한 처녀를 찾아가게 하셨다.\n그 처녀의 이름은 마리아였다.\n28 천사가 마리아의 집으로 들어가 말하였다.\n“은총이 가득한 이여, 기뻐하여라. 주님께서 너와 함께 계시다.”\n29 이 말에 마리아는 몹시 놀랐다.\n그리고 이 인사말이 무슨 뜻인가 하고 곰곰이 생각하였다.\n30 천사가 다시 마리아에게 말하였다.\n“두려워하지 마라, 마리아야. 너는 하느님의 총애를 받았다.\n31 보라, 이제 네가 잉태하여 아들을 낳을 터이니 그 이름을 예수라 하여라.\n32 그분께서는 큰 인물이 되시고 지극히 높으신 분의 아드님이라 불리실 것이다.\n주 하느님께서 그분의 조상 다윗의 왕좌를 그분께 주시어,\n33 그분께서 야곱 집안을 영원히 다스리시리니\n그분의 나라는 끝이 없을 것이다.”\n34 마리아가 천사에게, “저는 남자를 알지 못하는데,\n어떻게 그런 일이 있을 수 있겠습니까?” 하고 말하자,\n35 천사가 마리아에게 대답하였다.\n“성령께서 너에게 내려오시고 지극히 높으신 분의 힘이 너를 덮을 것이다.\n그러므로 태어날 아기는 거룩하신 분, 하느님의 아드님이라고 불릴 것이다.\n36 네 친척 엘리사벳을 보아라. 그 늙은 나이에도 아들을 잉태하였다.\n아이를 못낳는 여자라고 불리던 그가 임신한 지 여섯 달이 되었다.\n37 하느님께는 불가능한 일이 없다.”\n38 마리아가 말하였다.\n“보십시오, 저는 주님의 종입니다.\n말씀하신 대로 저에게 이루어지기를 바랍니다.”\n그러자 천사는 마리아에게서 떠나갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n원죄 없이 잉태되신 복되신 동정 마리아 대축일에\n저희가 드리는 구원의 제사를 받아들이시어\n주님의 은총으로 동정 마리아를 어떤 죄에도 물들지 않게 하셨듯이\n그분의 전구로 저희도 모든 죄에서 벗어나게 하소서.\n우리 주 …….","감사송":"<복되신 동정 마리아 감사송 3 : 마리아와 교회의 신비(12월 8일)>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n주님께서는 복되신 동정 마리아를 원죄에 물들지 않게 지켜 주시고\n은총으로 가득 차게 하시어\n성자의 맞갖은 어머니가 되게 하셨나이다.\n또한 성모님을 통하여\n티 없고 흠 없이 아름다운\n그리스도의 배필인 교회의 시작을 알려 주셨나이다.\n지극히 깨끗하신 동정 마리아에게서\n저희 죄를 없애시는, 죄 없으신 어린양 성자께서 나셨으니\n주님께서는 동정 마리아를 모든 피조물 위에 들어 높이시고\n주님의 백성을 위하여\n은총의 전구자요 거룩한 삶의 모범으로 미리 정하셨나이다.\n그러므로 저희도 천사들의 무리와 함께\n주님을 찬미하며 기쁨에 넘쳐 큰 소리로 노래하나이다.","영성체송":"정의의 태양, 그리스도 우리 하느님을 낳으셨으니, 마리아님, 저희가 모두 당신께 영광을 드리나이다.","영성체 후 묵상":"하느님께서는 세상 창조 이전에 그리스도 안에서 우리를 선택하시어, 우리가 당신 앞에서 거룩하고 흠 없는 사람이 되게 해 주셨습니다. “저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다.” 하고 고백하신 복되신 동정 마리아처럼, 만물을 당신의 결정과 뜻대로 이루시는 하느님의 좋으신 뜻에 우리 자신을 내맡깁시다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주 하느님,\n특별한 은총으로 복되신 동정 마리아를 원죄 없이 잉태되게 하셨으니\n저희가 받아 모신 성체로 저희 죄의 상처를 낫게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 우리가 기념하는 한국 교회의 순교자, 원죄 없이 잉태되신 복되신 동정 마리아 대축일은 예수님의 오심을 기다리는 대림 시기와 깊이 연결되어 있습니다. “은총이 가득한 이여, 기뻐하여라. 주님께서 너와 함께 계시다.”(루카 1,28)라는 가브리엘 천사의 인사는 하느님께서 마리아를 성자의 합당한 거처가 되도록 미리 준비시키셨음을 보여 줍니다.\n성모님께서는 “보십시오, 저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다.”(1,38)라고 응답하시어 에덴동산에서 쫓겨난 인류가 다시 하느님의 나라로 들어갈 수 있도록 협력하셨습니다. 이러한 성모님의 순명은 우리에게 신앙의 본보기가 되며, 제1독서에 나오는 아담과 하와의 불순명과 뚜렷한 대조를 이룹니다. 그들은 유혹에 넘어가 세상에 원죄를 가져왔지만, 성모님께서는 하느님의 뜻에 순명하시어 예수 그리스도께서 세상에 오실 수 있게 도우셨습니다. 그리고 예수 그리스도께서는 당신의 죽음과 부활로 인류를 죄에서 구원하시고, 우리를 거룩함의 길로 나아가도록 이끌어 주셨습니다.\n이로써 성모님의 원죄 없이 잉태되심은 죄와 죽음에 대한 승리의 씨앗이며, 희망의 표징이 됩니다. 오늘 제2독서에서 바오로 사도는 “세상 창조 이전에 그리스도 안에서 우리를 선택하시어, 우리가 당신 앞에서 거룩하고 흠 없는 사람이 되게 해 주셨습니다.”(에페 1,4)라고 말하며 우리 또한 그리스도를 통하여 구원의 역사에 함께하는 이들임을 일깨워 줍니다. 그러므로 우리도 이 대축일의 기쁨 안에서 성모님처럼 하느님의 뜻에 순명하며, 죄의 역사가 아니라 은총의 역사를 이어 가도록 합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261209":{"d":"2026년 12월 09일 수요일","c":"자","t":"대림 제2주간 수요일","o":[{"c":"백","t":"성 요한 디다코(후안 디에고) 쿠아우틀라토아친"}],"n":"","g":"","i":"","s":{"입당송":"하바 2,3; 1코린 4,5 참조\n주님은 지체하지 않고 오시어, 어둠 속에 숨은 것을 밝히시고, 모든 민족들 앞에 당신을 드러내시리라.","본기도":"전능하신 하느님,\n주 그리스도 오실 길을 마련하라 하셨으니\n나약한 저희가 천상의 영약으로 힘을 얻어\n구원의 길을 닦아 나아가게 하소서.\n성부와 성령과 …….","제1독서":"<전능하신 주님께서는 피곤한 이에게 힘을 주신다.>\n▥ 이사야서의 말씀입니다.\n40,25-31\n25 “너희는 나를 누구와 비교하겠느냐? 나를 누구와 같다고 하겠느냐?”\n거룩하신 분께서 말씀하신다.\n26 너희는 눈을 높이 들고 보아라. 누가 저 별들을 창조하였느냐?\n그 군대를 수대로 다 불러내시고\n그들 모두의 이름을 부르시는 분이시다.\n그분께서는 능력이 크시고 권능이 막강하시어 하나도 빠지는 일이 없다.\n27 야곱아, 네가 어찌 이런 말을 하느냐?\n이스라엘아, 네가 어찌 이렇게 이야기하느냐?\n“나의 길은 주님께 숨겨져 있고\n나의 권리는 나의 하느님께서 못 보신 채 없어져 버린다.”\n28 너는 알지 않느냐? 너는 듣지 않았느냐?\n주님은 영원하신 하느님, 땅끝까지 창조하신 분이시다.\n그분께서는 피곤한 줄도 지칠 줄도 모르시고\n그분의 슬기는 헤아릴 길이 없다.\n29 그분께서는 피곤한 이에게 힘을 주시고\n기운이 없는 이에게 기력을 북돋아 주신다.\n30 젊은이들도 피곤하여 지치고 청년들도 비틀거리기 마련이지만\n31 주님께 바라는 이들은 새 힘을 얻고 독수리처럼 날개 치며 올라간다.\n그들은 뛰어도 지칠 줄 모르고 걸어도 피곤한 줄 모른다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 103(102),1-2.3-4.8과 10(◎ 1ㄱ)\n◎ 내 영혼아, 주님을 찬미하여라.\n○ 내 영혼아, 주님을 찬미하여라. 내 안의 모든 것도 거룩하신 그 이름 찬미하여라. 내 영혼아, 주님을 찬미하여라. 그분의 온갖 은혜 하나도 잊지 마라. ◎\n○ 네 모든 잘못을 용서하시고, 네 모든 아픔을 없애시는 분. 네 목숨을 구렁에서 구해 내시고, 자애와 자비의 관을 씌우시는 분. ◎\n○ 주님은 자비롭고 너그러우시며, 분노에는 더디시나 자애는 넘치시네. 우리를 죄대로 다루지 않으시고, 우리의 잘못대로 갚지 않으시네. ◎","복음 환호송":"◎ 알렐루야.\n○ 보라, 당신 백성 구원하러 주님이 오시리니 주님을 맞이하러 달려가는 이는 복되어라.\n◎ 알렐루야.","복음":"<고생하는 너희는 모두 나에게 오너라.>\n✠ 마태오가 전한 거룩한 복음입니다.\n11,28-30\n그때에 예수님께서 말씀하셨다.\n28 “고생하며 무거운 짐을 진 너희는 모두 나에게 오너라.\n내가 너희에게 안식을 주겠다.\n29 나는 마음이 온유하고 겸손하니 내 멍에를 메고 나에게 배워라.\n그러면 너희가 안식을 얻을 것이다.\n30 정녕 내 멍에는 편하고 내 짐은 가볍다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n이 예물을 정성껏 봉헌하며 비오니\n주님께서 제정하신 거룩한 신비의 거행으로\n저희 구원이 온전히 이루어지게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"이사 40,10; 35,5 참조\n보라, 우리 주님이 권능을 떨치며 오시어, 당신 종들의 눈을 밝혀 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n주님께서는 인자하시니\n이 성사의 힘으로 저희 죄를 깨끗이 씻어 주시어\n다가오는 성탄 축제를 준비하게 하소서.\n우리 주 …….","오늘의 묵상":"우리에게 맡겨진 역할을 제대로 수행하려면 잘 쉬어야 합니다. 일을 잘 하려면 쉬어야 한다는 말이 모순처럼 들리기도 하지만, 쉼 없이 계속해서 일을 하며 에너지를 쏟다 보면 몸과 마음이 결국 지쳐 버립니다. 그렇게 지친 사람들이 많은지 언제부터인가 주변에서 ‘번아웃’이라는 말을 자주 듣게 됩니다.\n그렇다면 신앙인으로 살아가면서 잘 쉰다는 것은 어떤 뜻일까요? 오늘 복음에서 예수님께서는 무거운 짐을 지고 살아가는 이들에게 위로의 말씀을 건네십니다. “고생하며 무거운 짐을 진 너희는 모두 나에게 오너라. 내가 너희에게 안식을 주겠다”(마태 11,28). 예수님께서 주시는 안식은 아무것도 하지 않는 상태가 아닙니다. 삶의 무게를 견디려 애쓰는 우리를 당신께 부르시고, 우리 짐을 함께 지시며 다시 일어설 힘을 주시는 위로입니다.\n살다 보면 감당하기 힘든 순간을 맞닥뜨리기도 합니다. 이러한 순간을 혼자 견디기는 매우 어렵습니다. 이런 우리에게 예수님께서는 도움의 손길을 건네시고 함께 계셔 주십니다. “나에게 오너라”(11,28). 예수님께서는 이렇게 우리를 불러 주시고 우리 이야기를 모두 들어 주십니다. 자신이 얼마나 어려운 상황에 놓였는지, 얼마나 상처를 받았는지, 어깨 위의 짐이 얼마나 버거운지 ……. 누구에게도 쉽게 꺼내지 못하는 나만의 이야기를 들어 주실 분이 계시다는 것은 얼마나 큰 선물입니까.\n우리의 짐을 없애 주시는 것이 아니라 함께 짊어지시는 예수님과 만남으로써 우리는 참된 위로와 안식을 얻습니다. 이 만남에서 이루어지는 대화는 저마다 삶의 의미를 더욱 밝혀 주며 우리의 소명을 새로이 발견하도록 이끌어 줄 것입니다. 주님 안에서 쉼을 얻고 그 힘으로 다시 사랑의 삶으로 나아갑시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261210":{"d":"2026년 12월 10일 목요일","c":"자","t":"대림 제2주간 목요일","o":[{"c":"백","t":"로레토의 복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"시편 119(118),151-152 참조\n주님, 당신은 가까이 계시나이다. 당신 계명은 모두 진리이옵니다. 당신이 영원하시기에, 일찍이 저는 당신의 가르침을 깨달았나이다.","본기도":"주님,\n저희 마음을 일깨우시어\n성자께서 오시는 길을 닦게 하시고\n성자를 맞이하여 깨끗한 마음으로 주님을 섬기게 하소서.\n성부와 성령과 …….","제1독서":"<나는 이스라엘의 거룩한 분, 너의 구원자이다.>\n▥ 이사야서의 말씀입니다.\n41,13-20\n13 나 주님이 너의 하느님, 내가 네 오른손을 붙잡아 주고 있다.\n나는 너에게 말한다.\n“두려워하지 마라. 내가 너를 도와주리라.”\n14 두려워하지 마라, 벌레 같은 야곱아,\n구더기 같은 이스라엘아! 내가 너를 도와주리라.\n주님의 말씀이다.\n이스라엘의 거룩한 분이 너의 구원자이다.\n15 보라, 내가 너를 날카로운 타작기로, 날이 많은 새 타작기로 만들리니\n너는 산들을 타작하여 잘게 바수고 언덕들을 지푸라기처럼 만들리라.\n16 네가 그것들을 까부르면 바람이 쓸어 가고 폭풍이 그것들을 흩날려 버리리라.\n그러나 너는 주님 안에서 기뻐 뛰놀고\n이스라엘의 거룩한 분 안에서 자랑스러워하리라.\n17 가련한 이들과 가난한 이들이 물을 찾지만\n물이 없어 갈증으로 그들의 혀가 탄다.\n나 주님이 그들에게 응답하고\n나 이스라엘의 하느님이 그들을 버리지 않으리라.\n18 나는 벌거숭이산들 위에 강물이,\n골짜기들 가운데에 샘물이 솟아나게 하리라.\n광야를 못으로, 메마른 땅을 수원지로 만들리라.\n19 나는 광야에 향백나무와 아카시아, 도금양나무와 소나무를 갖다 놓고\n사막에 방백나무와 사철가막살나무와 젓나무를 함께 심으리라.\n20 이는 주님께서 그것을 손수 이루시고\n이스라엘의 거룩하신 분께서 그것을 창조하셨음을\n모든 이가 보아 알고 살펴 깨닫게 하시려는 것이다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 145(144),1과 9.10-11.12-13ㄱㄴ(◎ 8)\n◎ 주님은 너그럽고 자비하시며 분노에 더디시고 자애가 넘치시네.\n○ 저의 임금이신 하느님, 당신을 높이 기리나이다. 영영 세세 당신 이름을 찬미하나이다. 주님은 모두에게 좋으시며, 그 자비 모든 조물 위에 내리시네. ◎\n○ 주님, 모든 조물이 당신을 찬송하고, 당신께 충실한 이들이 당신을 찬미하나이다. 당신 나라의 영광을 노래하고, 당신의 권능을 이야기하나이다. ◎\n○ 당신의 위업과 그 나라의 존귀한 영광, 사람들에게 알리나이다. 당신의 나라는 영원무궁한 나라, 당신의 통치는 모든 세대에 미치나이다. ◎","복음 환호송":"이사 45,8\n◎ 알렐루야.\n○ 하늘아, 위에서 이슬을 내려라. 구름아, 의로움을 뿌려라. 땅은 열려 구원이 피어나게 하여라.\n◎ 알렐루야.","복음":"<세례자 요한보다 더 큰 인물은 나오지 않았다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n11,11-15\n그때에 예수님께서 군중에게 말씀하셨다.\n11 “내가 진실로 너희에게 말한다.\n여자에게서 태어난 이들 가운데\n세례자 요한보다 더 큰 인물은 나오지 않았다.\n그러나 하늘 나라에서는 가장 작은 이라도 그보다 더 크다.\n12 세례자 요한 때부터 지금까지 하늘 나라는 폭행을 당하고 있다.\n폭력을 쓰는 자들이 하늘 나라를 빼앗으려고 한다.\n13 모든 예언서와 율법은 요한에 이르기까지 예언하였다.\n14 너희가 그것을 받아들이고자 한다면,\n요한이 바로 오기로 되어 있는 엘리야다.\n15 귀 있는 사람은 들어라.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n저희에게 온갖 선물을 베풀어 주셨으니\n그 가운데에서 저희가 모아 바치는 이 제물을 받아들이시고\n현세에서 저희 믿음을 북돋아 주시어\n후세에서 영원한 구원의 상급을 받게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"티토 2,12-13 참조\n우리는 현세에서 의롭고 경건하게 살며, 복된 희망이 이루어지고 위대하신 하느님의 영광이 나타나기를 기다리네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 이 성찬에 참여한 저희가\n덧없이 지나가는 현세를 살면서도\n지금부터 천상 양식에 맛들여 영원한 것을 사랑하게 하소서.\n우리 주 …….","오늘의 묵상":"역사 안에서 큰 업적을 남긴 이들을 우리는 위인이라고 부릅니다. 그들은 후대의 본보기가 되며 사람들에게 존경을 받습니다. 교회 안에서도 우리는 신앙의 귀감이 되는 성인들을 공경하며 그들의 삶을 본받고자 합니다. 예수님께서는 이들 가운데 세례자 요한을 두고 직접 이렇게 말씀하십니다. “여자에게서 태어난 이들 가운데 세례자 요한보다 더 큰 인물은 나오지 않았다”(마태 11,11).\n세례자 요한의 삶을 묵상해 보면 이 말씀의 뜻을 자연스럽게 깨닫게 됩니다. 그는 사람들에게 회개의 세례를 선포하는 데 그치지 않고, 예수님을 메시아로 증언하며 기꺼이 뒤로 물러설 줄 알았습니다. “그분은 커지셔야 하고 나는 작아져야 한다.”(요한 3,30)라는 그의 겸손한 고백은 신앙인의 삶이 어떠해야 하는지 보여 줍니다. 그는 자신을 따르는 이들을 예수님께 이끌었습니다.\n또한 세례자 요한은 진리의 목소리를 내는 사람이기도 하였습니다. 최고 권력자인 헤로데 앞에서도 “그 여자를 차지하는 것은 옳지 않습니다.”(마태 14,4)라고 분명히 말하며 예언자의 사명에 끝까지 충실하였습니다. 불의 앞에서 침묵하지 않는 용기는 자신을 온전히 비울 때 나타나는 것입니다.\n세례자 요한의 위대함은 자신을 드러내는 데 있지 않고 예수 그리스도의 길을 마련하고 그분의 길을 곧게 내는 데 있었습니다(3,3 참조). 그렇기에 예수님께서는 그를 크게 칭찬하셨습니다. 우리도 마찬가지로 자신을 드러내기보다 삶으로 그리스도를 증언하도록 부름받았음을 기억합시다. 그리고 성인을 본받아 말과 행동으로 예수님을 드러내는 삶을 실천합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261211":{"d":"2026년 12월 11일 금요일","c":"자","t":"대림 제2주간 금요일","o":[{"c":"백","t":"성 다마소 1세 교황"}],"n":"","g":"","i":"","s":{"입당송":"보라, 주님이 영화롭게 내려오시리라. 당신 백성을 찾아오시어, 평화를 베푸시고 영원한 생명을 주시리라.","본기도":"전능하신 하느님,\n하느님 백성이 다시 오실 외아드님을 깨어 기다리오니\n구세주 그리스도의 말씀에 따라\n저희가 등불을 밝혀 들고 깨어 있다가 그분을 맞이하게 하소서.\n성자께서는 성부와 …….","제1독서":"<아, 네가 내 계명들에 주의를 기울였다면.>\n▥ 이사야서의 말씀입니다.\n48,17-19\n17 이스라엘의 거룩하신 분\n너의 구원자이신 주님께서 이렇게 말씀하신다.\n“나는 주 너의 하느님\n너에게 유익하도록 너를 가르치고\n네가 가야 할 길로 너를 인도하는 이다.\n18 아, 네가 내 계명들에 주의를 기울였다면\n너의 평화가 강물처럼, 너의 의로움이 바다 물결처럼 넘실거렸을 것을.\n19 네 후손들이 모래처럼, 네 몸의 소생들이 모래알처럼 많았을 것을.\n그들의 이름이 내 앞에서 끊어지지도 없어지지도 않았을 것을.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 1,1-2.3.4와 6(◎ 요한 8,12 참조)\n◎ 주님, 당신을 따르는 이는 생명의 빛을 얻으리이다.\n○ 행복하여라! 악인의 뜻에 따라 걷지 않는 사람, 죄인의 길에 들어서지 않으며, 오만한 자의 자리에 앉지 않는 사람, 오히려 주님의 가르침을 좋아하고, 밤낮으로 그 가르침을 되새기는 사람. ◎\n○ 그는 시냇가에 심은 나무 같아, 제때에 열매 맺고, 잎이 아니 시들어, 하는 일마다 모두 잘되리라. ◎\n○ 악인은 그렇지 않으니, 바람에 흩날리는 검불 같아라. 의인의 길은 주님이 아시고, 악인의 길은 멸망에 이르리라. ◎","복음 환호송":"◎ 알렐루야.\n○ 주님이 오시니 마중 나가자. 주님은 평화의 임금이시다.\n◎ 알렐루야.","복음":"<그들은 요한의 말도 사람의 아들의 말도 듣지 않는다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n11,16-19\n그때에 예수님께서 군중에게 말씀하셨다.\n16 “이 세대를 무엇에 비기랴?\n장터에 앉아 서로 부르며 이렇게 말하는 아이들과 같다.\n17 ‘우리가 피리를 불어 주어도 너희는 춤추지 않고\n우리가 곡을 하여도 너희는 가슴을 치지 않았다.’\n18 사실 요한이 와서 먹지도 않고 마시지도 않자,\n‘저자는 마귀가 들렸다.’ 하고 말한다.\n19 그런데 사람의 아들이 와서 먹고 마시자,\n‘보라, 저자는 먹보요 술꾼이며 세리와 죄인들의 친구다.’ 하고 말한다.\n그러나 지혜가 옳다는 것은 그 지혜가 이룬 일로 드러났다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n비천한 저희가 드리는 기도와 제물을 굽어보시어\n아무런 공덕이 없는 저희를 너그러이 보호하시며 도와주소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"필리 3,20-21 참조\n우리는 구세주 예수 그리스도를 기다리네. 그분은 우리의 비천한 몸을 당신의 영광스러운 몸과 같이 바꾸어 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 신비로운 제사에 참여한 저희를 생명의 양식으로 기르시니\n저희가 지상 것을 슬기롭게 헤아리며\n끊임없이 천상 것을 찾도록 가르쳐 주소서.\n우리 주 …….","오늘의 묵상":"어린 시절 받아쓰기를 하고 어머니가 채점해 주셨을 때의 일입니다. 문제는 ‘삼촌’을 쓰는 것이었는데, 저는 평소 제가 부르던 대로 ‘삼춘’이라고 답을 적었습니다. 어머니가 답이 틀렸다고 하시자 저는 아니라고 내가 맞다고 떼를 썼습니다. 그러다가 정답지에 ‘삼촌’이 적혀 있는 것을 보고 나서야 받아들였던 기억이 납니다.\n“이 세대를 무엇에 비기랴?”(마태 11,16) 오늘 복음에서 예수님께서는 세례자 요한도 예수님도 받아들이지 못하는 이들을 장터의 아이들에 비유하시며 그들의 완고한 마음을 꾸짖으십니다. 그들은 세례자 요한이 선포한 회개의 세례도 거부하고 예수님의 복음도 받아들이지 않았습니다. 하느님께서는 당신의 목소리를 알아들을 수 있도록 여러 가지 방식으로 다가오시지만, 고집스럽게 자기 기준만 내세우면 결국 하느님마저 받아들이지 못하게 됩니다.\n자기가 무조건 옳고 틀릴 리가 없다는 태도는 떼쓰는 아이들에게서만 볼 수 있는 것은 아닙니다. 우리도 그런 실수를 저지르는 경우가 적지 않습니다. 지나치게 완고한 마음은 성숙한 신앙인으로 나아가는 데 큰 장애물입니다. 하느님께서는 우리를 계속해서 올바른 길로 이끌어 주십니다. 그러기에 우리는 삶에서 새로운 바람이 기대하지 않은 방식으로 불어올 수 있다는 것을 기억해야 합니다.\n다른 사람의 목소리에도 귀를 기울이는 열린 마음으로 살아갈 때 우리 안에 불평과 불만이 줄어들고 작은 일에도 감사할 줄 아는 사람이 될 수 있습니다. 하느님의 지혜가 우리의 생각과 기준보다 훨씬 크다는 사실을 되새기고, 하느님께서 주신 순수한 마음으로 살아가면 좋겠습니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261212":{"d":"2026년 12월 12일 토요일","c":"자","t":"대림 제2주간 토요일","o":[{"c":"백","t":"과달루페의 복되신 동정 마리아"}],"n":"","g":"","i":"","s":{"입당송":"시편 80(79),2.4 참조\n커룹들 위에 좌정하신 주님, 오소서. 당신 얼굴을 비추소서. 저희가 구원되리이다.","본기도":"전능하신 하느님,\n하느님의 찬란한 빛으로 저희 마음을 밝히시어\n밤의 어둠을 모두 몰아내시고\n외아드님께서 오실 때에 저희가 빛의 자녀로 드러나게 하소서.\n성자께서는 성부와 …….","제1독서":"<엘리야가 다시 오리라.>\n▥ 집회서의 말씀입니다.\n48,1-4.9-11\n그 무렵 1 엘리야 예언자가 불처럼 일어섰는데 그의 말은 횃불처럼 타올랐다.\n2 엘리야는 그들에게 굶주림을 불러들였고\n자신의 열정으로 그들의 수를 감소시켰다.\n3 주님의 말씀에 따라 그는 하늘을 닫아 버리고\n세 번씩이나 불을 내려보냈다.\n4 엘리야여, 당신은 놀라운 일들로 얼마나 큰 영광을 받았습니까?\n누가 당신처럼 자랑스러울 수 있겠습니까?\n9 당신은 불 소용돌이 속에서 불 마차에 태워 들어 올려졌습니다.\n10 당신은 정해진 때를 대비하여\n주님의 분노가 터지기 전에 그것을 진정시키고\n아버지의 마음을 자식에게 되돌리며\n야곱의 지파들을 재건하리라고 기록되어 있습니다.\n11 당신을 본 사람들과 사랑 안에서 잠든 사람들은 행복합니다.\n우리도 반드시 살아날 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 80(79),2ㄱㄷㄹ과 3ㄴㄷ.15-16.18-19(◎ 4)\n◎ 하느님, 저희를 다시 일으켜 주소서. 당신 얼굴을 비추소서. 저희가 구원되리이다.\n○ 이스라엘의 목자시여, 귀를 기울이소서. 커룹들 위에 좌정하신 분, 광채와 함께 나타나소서. 당신 권능을 떨치시어, 저희를 도우러 오소서. ◎\n○ 만군의 하느님, 어서 돌아오소서. 하늘에서 굽어살피시고, 이 포도나무를 찾아오소서. 당신 오른손이 심으신 나뭇가지를, 당신 위해 키우신 아들을 찾아오소서. ◎\n○ 당신 오른쪽에 있는 사람에게, 당신 위해 키우신 인간의 아들에게 손을 얹으소서. 저희는 당신을 떠나지 않으오리다. 저희를 살려 주소서. 당신 이름을 부르오리다. ◎","복음 환호송":"루카 3,4.6\n◎ 알렐루야.\n○ 너희는 주님의 길을 마련하여라. 그분의 길을 곧게 내어라. 모든 사람이 하느님의 구원을 보리라.\n◎ 알렐루야.","복음":"<엘리야가 이미 왔지만 사람들은 그를 알아보지 못하였다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n17,10-13\n산에서 내려올 때에 10 제자들이 예수님께,\n“율법 학자들은 어찌하여 엘리야가 먼저 와야 한다고 말합니까?” 하고 물었다.\n11 그러자 예수님께서 대답하셨다.\n“과연 엘리야가 와서 모든 것을 바로잡을 것이다.\n12 내가 너희에게 말한다.\n엘리야는 이미 왔지만, 사람들은 그를 알아보지 못하고 제멋대로 다루었다.\n그처럼 사람의 아들도 그들에게 고난을 받을 것이다.”\n13 그제야 제자들은 그것이 세례자 요한을 두고 하신 말씀인 줄을 깨달았다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n이 예물을 정성껏 봉헌하며 비오니\n주님께서 제정하신 거룩한 신비의 거행으로\n저희 구원이 온전히 이루어지게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"묵시 22,12 참조\n주님이 말씀하신다. 보라, 내가 곧 간다. 상도 가져가, 사람마다 제 행실대로 갚아 주리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n주님께서는 인자하시니\n이 성사의 힘으로 저희 죄를 깨끗이 씻어 주시어\n다가오는 성탄 축제를 준비하게 하소서.\n우리 주 …….","오늘의 묵상":"대림 시기에 신자로서 해야 하는 일이 있습니다. 바로 판공성사입니다. 성탄을 준비하는 이 시기에 우리는 판공성사를 통하여 하느님 앞에서 자신의 죄를 고백하고 진심으로 뉘우치며 다시 주님께 돌아갑니다. 회개는 우리 그리스도인의 삶의 방식이며, 성경에서 예언자들이 끊임없이 선포한 것이기도 합니다.\n오늘 독서와 복음에서 모두 엘리야 예언자의 이름이 나옵니다. 엘리야 예언자는 북이스라엘의 임금 아합이 잘못된 길을 갈 때 두려워하지 않고 이렇게 외칩니다. “내가 이스라엘을 불행에 빠뜨리는 것이 아니라, 임금님과 임금님 조상의 집안이 그렇게 하고 있습니다. 여러분은 주님의 계명을 저버렸고, 임금님은 바알을 따랐습니다”(1열왕 18,18). 이는 헤로데 임금 앞에서 굽히지 않고 진리를 말하였던 세례자 요한의 모습을 떠올리게 합니다. 하느님의 말씀을 전하여 사람들이 회개하도록 이끄는 이들이 바로 예언자입니다. 그런데 예언자들이 선포한 회개는 단순히 도덕적으로 흠 없는 사람이 되는 데 목적이 있지 않습니다. 참된 회개는 삶의 방향을 하느님께 돌리고 하느님과 교회의 친교 안에서 살아가는 삶으로 나아가는 것입니다.\n“엘리야는 이미 왔지만, 사람들은 그를 알아보지 못하고 제멋대로 다루었다”(마태 17,12). 이는 오늘을 살아가는 우리를 향한 말씀이기도 합니다. 회개의 부르심에 기꺼이 응답합시다. 판공성사를 준비하며 자신의 죄를 진심으로 뉘우치고 다시는 죄를 짓지 않겠다고 굳게 다짐합시다. 그리하여 우리를 구원하시고자 오시는 예수님께 더욱 눈길을 두며 날마다 주님과 맺는 친교 안에서 살아가도록 합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261213":{"d":"2026년 12월 13일 일요일","c":"자","t":"대림 제3주일","o":[],"n":"자선 주일","g":"신경 · 교중","i":"“금을 쌓아 두는 것보다 자선을 베푸는 것이 낫다”(토빗 12,8). 한국 교회는 1984년부터 해마다 대림 제3주일을 ‘자선 주일’로 지내고 있다. 자선은 주님의 사랑을 실천하는 한 가지 방법이며, 주님께서 당신 자신을 송두리째 내주신 성체성사의 나눔의 신비를 체험하게 하는 신앙 행위이다. 오늘 교회는 가난하고 병든 이들, 소외된 이들이 그리스도의 사랑을 느끼며 살아갈 수 있도록 기도하고, 특별 헌금으로 자선을 실천한다. 교회는 자선이라는 사랑의 구체적 실천으로 다시 오시는 아기 예수님을 기다릴 수 있도록 준비시킨다.","s":{"오늘 전례":"오늘은 대림 제3주일이며 자선 주일입니다. 하느님께서는 가난하고 보잘것없는 이들이 하느님 나라의 평화와 영광을 누리게 하십니다. 주님께서 우리를 부르시어, 주님의 은총으로 우리에게 깨끗하고 너그러운 마음을 주시고, 구세주께서 오시는 길을 정성껏 준비하게 해 주시도록 기도합시다.","입당송":"필리 4,4.5 참조\n기뻐하여라. 거듭 말하니, 주님 안에서 늘 기뻐하여라. 주님이 가까이 오셨다.","본기도":"하느님,\n하느님 백성이 주님의 성탄을 간절히 기다리오니\n저희가 구원의 큰 기쁨을 누리며\n즐거운 마음으로 이 축제를 맞이하게 하소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<나는 주님 안에서 크게 기뻐하리라.>\n▥ 이사야서의 말씀입니다.\n61,1-2ㄱ.10-11\n1 주님께서 나에게 기름을 부어 주시니 주 하느님의 영이 내 위에 내리셨다.\n주님께서 나를 보내시어 가난한 이들에게 기쁜 소식을 전하고\n마음이 부서진 이들을 싸매어 주며\n잡혀간 이들에게 해방을, 갇힌 이들에게 석방을 선포하게 하셨다.\n2 주님의 은혜의 해를 선포하게 하셨다.\n10 나는 주님 안에서 크게 기뻐하고\n내 영혼은 나의 하느님 안에서 즐거워하리니\n신랑이 관을 쓰듯 신부가 패물로 단장하듯\n그분께서 나에게 구원의 옷을 입히시고 의로움의 겉옷을 둘러 주셨기 때문이다.\n11 땅이 새순을 돋아나게 하고 정원이 싹을 솟아나게 하듯\n주 하느님께서는 모든 민족들 앞에 의로움과 찬미가 솟아나게 하시리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"루카 1,46ㄴ-48.49-50.53-54(◎ 이사 61,10ㄱ 참조)\n◎ 내 영혼이 내 하느님 안에서 기뻐하네.\n○ 내 영혼이 주님을 찬양하고, 내 구원자 하느님 안에서 내 마음 기뻐 뛰노네. 그분이 비천한 당신 종을 굽어보셨네. 이제부터 과연 모든 세대가 나를 복되다 하리라. ◎\n○ 전능하신 분이 나에게 큰일을 하셨으니, 그 이름은 거룩하신 분이시다. 그분 자비는 세세 대대로 그분을 두려워하는 이들에게 미치리라. ◎\n○ 굶주린 이를 좋은 것으로 채워 주시고, 부유한 자를 빈손으로 돌려보내셨네.\n당신 자비를 기억하시어 당신 종 이스라엘을 돌보셨네. ◎","제2독서":"<주님께서 재림하실 때까지 하느님께서 여러분의 영과 혼과 몸을 지켜 주시기를 빕니다.>\n▥ 사도 바오로의 테살로니카 1서 말씀입니다.\n5,16-24\n형제 여러분, 16 언제나 기뻐하십시오.\n17 끊임없이 기도하십시오. 18 모든 일에 감사하십시오.\n이것이 그리스도 예수님 안에서 살아가는 여러분에게 바라시는 하느님의 뜻입니다.\n19 성령의 불을 끄지 마십시오. 20 예언을 업신여기지 마십시오.\n21 모든 것을 분별하여, 좋은 것은 간직하고\n22 악한 것은 무엇이든 멀리하십시오.\n23 평화의 하느님께서 친히 여러분을 완전히 거룩하게 해 주시기를 빕니다.\n또 우리 주 예수 그리스도께서 재림하실 때까지\n여러분의 영과 혼과 몸을 온전하고 흠 없이 지켜 주시기를 빕니다.\n24 여러분을 부르시는 분은 성실하신 분이십니다.\n그러니 그렇게 해 주실 것입니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"이사 61,1 참조(루카 4,18 인용)\n◎ 알렐루야.\n○ 주님의 영이 내 위에 내리셨다. 나를 보내시어 가난한 이들에게 기쁜 소식을 전하게 하셨다 .\n◎ 알렐루야.","복음":"<너희 가운데에는 너희가 모르는 분이 서 계신다.>\n✠ 요한이 전한 거룩한 복음입니다.\n1,6-8.19-28\n6 하느님께서 보내신 사람이 있었는데 그의 이름은 요한이었다.\n7 그는 증언하러 왔다.\n빛을 증언하여 자기를 통해 모든 사람이 믿게 하려는 것이었다.\n8 그 사람은 빛이 아니었다. 빛을 증언하러 왔을 따름이다.\n19 요한의 증언은 이러하다.\n유다인들이 예루살렘에서 사제들과 레위인들을 요한에게 보내어,\n“당신은 누구요?” 하고 물었을 때, 20 요한은 서슴지 않고 고백하였다.\n“나는 그리스도가 아니다.” 하고 고백한 것이다.\n21 그들이 “그러면 누구란 말이오? 엘리야요?” 하고 묻자,\n요한은 “아니다.” 하고 대답하였다.\n“그러면 그 예언자요?” 하고 물어도 다시 “아니다.” 하고 대답하였다.\n22 그래서 그들이 물었다.\n“당신은 누구요? 우리를 보낸 이들에게 우리가 대답을 해야 하오.\n당신은 자신을 무엇이라고 말하는 것이오?”\n23 요한이 말하였다.\n“나는 이사야 예언자가 말한 대로 ‘너희는 주님의 길을 곧게 내어라.’ 하고\n광야에서 외치는 이의 소리다.”\n24 그들은 바리사이들이 보낸 사람들이었다. 25 이들이 요한에게 물었다.\n“당신이 그리스도도 아니고 엘리야도 아니고 그 예언자도 아니라면,\n세례는 왜 주는 것이오?”\n26 그러자 요한이 그들에게 대답하였다. “나는 물로 세례를 준다.\n그런데 너희 가운데에는 너희가 모르는 분이 서 계신다.\n27 내 뒤에 오시는 분이신데,\n나는 그분의 신발 끈을 풀어 드리기에도 합당하지 않다.”\n28 이는 요한이 세례를 주던 요르단 강 건너편 베타니아에서 일어난 일이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n창조주이신 주님, 주님의 교회를 이끌어 주시어, 물질의 풍요와 기술의 발전으로 삶의 가치관이 변해 가는 이 시대에, 주님의 진리를 전하며 세상을 이롭게 하는 빛과 소금이 되게 하소서.\n\n2. 세계 평화를 위하여 기도합시다.\n\n평화의 주님, 세상을 구성하는 크고 작은 공동체들을 굽어살피시어, 저마다 제 역할을 충실히 수행하며, 서로 조화를 이루어 평화로운 세상을 만들도록 도와주소서.\n\n3. 가난한 이들을 위하여 기도합시다.\n\n의로우신 주님, 가난 때문에 소외된 이들을 위로하시어, 저희가 풍요 속의 빈곤이라는 현실을 연대의 힘으로 이겨 내며, 이 세상에 공동선을 실현할 수 있도록 이끌어 주소서.\n\n4. 본당 공동체를 위하여 기도합시다.\n\n인자하신 주님, 대림 시기를 지내는 저희 본당 공동체에 주님의 은총을 베푸시어, 인내와 끈기를 지니고 일상을 충실히 살며, 이웃들에게 사랑을 실천하는 뜻깊은 성탄을 준비하게 하소서.","예물 기도":"주님, 이 예물을 정성껏 봉헌하며 비오니\n주님께서 제정하신 거룩한 신비의 거행으로\n저희 구원이 온전히 이루어지게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"이사 35,4 참조\n마음이 불안한 이들에게 말하여라. 힘을 내어라, 두려워하지 마라. 보라, 우리 하느님이 오시어 우리를 구원하시리라.","영성체 후 묵상":"“언제나 기뻐하십시오. 끊임없이 기도하십시오. 모든 일에 감사하십시오. …… 평화의 하느님께서 …… 여러분의 영과 혼과 몸을 온전하고 흠 없이 지켜 주시기를 빕니다.” 우리를 부르시는 분께서는 성실하신 분이시니, 꼭 그렇게 해 주실 것이라는 굳건한 믿음으로 바오로 사도는 권고하고 기도합니다. 주님께서 가까이 오셨습니다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 주님께서는 인자하시니\n이 성사의 힘으로 저희 죄를 깨끗이 씻어 주시어\n다가오는 성탄 축제를 준비하게 하소서.\n우리 주 그리스도를 통하여 비나이다.","오늘의 묵상":"오늘 전례에서 가장 많이 듣게 되는 낱말은 ‘기쁨’입니다. 대림 제3주일은 ‘기뻐하여라 주일’이라고도 불리는데, 성탄이 가까웠음을 알리며 기쁨과 희망을 더 깊이 묵상하는 날이기 때문입니다. 이 기쁨은 주님께서 우리 가운데 오신다는 확신에서 비롯되는 신앙의 기쁨입니다.\n제1독서에서 이사야 예언자는 “주 하느님의 영이 내 위에 내리셨다.”(61,1)라고 선포합니다. 이 말씀은 예수님께서 나자렛 회당에서 몸소 읽으시고 선언하신 구절이기도 합니다. 가난한 이들에게 기쁜 소식을 전하고, 잡혀간 이들에게 해방을 선포하며, 주님의 은혜의 해를 선포하는 이 말씀은 희년의 완성을 보여 줍니다. 우리가 기다리는 예수 그리스도는 바로 이 구원을 완성하시는 분이십니다.\n“당신은 누구요?”(요한 1,19) 세례자 요한이 받은 이 물음에 우리라면 어떻게 대답하겠습니까? 예수님을 믿고 따르는 우리도 세례자 요한처럼 예수 그리스도라는 기쁜 소식을 증언하는 사람들임을 잊지 않아야 합니다. 더 나아가 그 증언은 말뿐만 아니라 우리의 삶으로도 드러나야 합니다.\n제2독서에서 바오로 사도는 그리스도인의 삶이 나아가야 할 모습을 분명하게 보여 줍니다. “언제나 기뻐하십시오. 끊임없이 기도하십시오. 모든 일에 감사하십시오”(1테살 5,16-18). 이 세 가지는 서로 연결됩니다. 기도하는 사람은 감사하며 살아가고, 감사하는 사람은 참된 기쁨을 발견하며, 기쁨에 찬 사람은 자연스럽게 감사의 기도를 드리기 때문입니다. 우리도 주님께서 주시는 신앙의 기쁨 안에서 기도하고 감사하는 삶을 살며, 그리스도를 증언하는 이가 되어야 하겠습니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261214":{"d":"2026년 12월 14일 월요일","c":"백","t":"십자가의 성 요한 사제 학자 기념일","o":[],"n":"","g":"","i":"십자가의 요한 성인은 1542년 무렵 에스파냐 아빌라의 폰티베로스에서 태어났다. 어린 시절 매우 가난하였던 그는 가르멜 수도회에 입회하여 수도 생활을 하다가 사제가 되었다. 그 뒤 요한은 ‘아빌라의 성녀’로 잘 알려진 예수의 데레사 성녀와 함께 가르멜 수도회의 개혁을 추진하면서 영성 생활의 스승 역할을 하였다. 1591년 세상을 떠난 그는 1726년에 시성되었고, 1926년에 ‘교회 학자’로 선포되었다. 교회의 위대한 신비가인 십자가의 요한 성인이 자신의 체험을 바탕으로 쓴 『가르멜의 산길』, 『어두운 밤』, 『영혼의 노래』 등은 영성 신학의 고전으로 널리 인정받고 있다.","s":{"입당송":"갈라 6,14 참조\n나는 우리 주 예수 그리스도의 십자가 외에는 어떠한 것도 자랑하지 않으리라. 십자가로 말미암아, 내게서는 세상이 십자가에 못 박혔고, 세상에서는 내가 십자가에 못 박혔노라.","본기도":"하느님,\n복된 요한 사제에게\n온전히 자기를 버리고 십자가를 열렬히 사랑하게 하셨으니\n저희가 그를 본받아\n마침내 영광스러운 하느님을 뵈옵게 하소서.\n성부와 성령과 …….","제1독서":"<야곱에게서 별 하나가 솟는다.>\n▥ 민수기의 말씀입니다.\n24,2-7.15-17\n그 무렵 2 발라암은 눈을 들어 지파별로 자리 잡은 이스라엘을 보았다.\n그때에 하느님의 영이 그에게 내렸다.\n3 그리하여 그는 신탁을 선포하였다.\n“브오르의 아들 발라암의 말이다.\n열린 눈을 가진 사람의 말이며 4 하느님의 말씀을 듣는 이의 말이다.\n전능하신 분의 환시를 보고 쓰러지지만 눈은 뜨이게 된다.\n5 야곱아, 너의 천막들이,\n이스라엘아, 너의 거처가 어찌 그리 좋으냐!\n6 골짜기처럼 뻗어 있고 강가의 동산 같구나.\n주님께서 심으신 침향나무 같고 물가의 향백나무 같구나.\n7 그의 물통에서는 물이 넘치고 그의 씨는 물을 흠뻑 먹으리라.\n그들의 임금은 아각보다 뛰어나고 그들의 왕국은 위세를 떨치리라.”\n15 그러고 나서 그는 신탁을 선포하였다.\n“브오르의 아들 발라암의 말이다.\n열린 눈을 가진 사람의 말이며\n16 하느님의 말씀을 듣고 지극히 높으신 분의 지식을 아는 이의 말이다.\n전능하신 분의 환시를 보고 쓰러지지만 눈은 뜨이게 된다.\n17 나는 한 모습을 본다. 그러나 지금은 아니다.\n나는 그를 바라본다. 그러나 가깝지는 않다.\n야곱에게서 별 하나가 솟고 이스라엘에게서 왕홀이 일어난다.\n그는 모압의 관자놀이를, 셋의 모든 자손의 정수리를 부수리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 25(24),4-5ㄱㄴ.6과 7ㄴㄷ.8-9(◎ 4ㄴ)\n◎ 주님, 당신의 행로를 가르쳐 주소서.\n○ 주님, 당신의 길을 알려 주시고, 당신의 행로를 가르쳐 주소서. 저를 가르치시어 당신 진리로 이끄소서. 당신은 제 구원의 하느님이시옵니다. ◎\n○ 주님, 예로부터 베풀어 오신 당신의 자비와 자애 기억하소서. 주님, 당신의 자애에 따라, 당신의 어지심으로 저를 기억하소서. ◎\n○ 주님은 어질고 바르시니, 죄인들에게도 길을 가르치신다. 가련한 이 올바른 길 걷게 하시고, 가난한 이 당신 길 알게 하신다. ◎","복음 환호송":"시편 85(84),8\n◎ 알렐루야.\n○ 주님, 저희에게 당신 자애를 보여 주시고 당신 구원을 베풀어 주소서.\n◎ 알렐루야.","복음":"<요한의 세례가 어디에서 온 것이냐?>\n✠ 마태오가 전한 거룩한 복음입니다.\n21,23-27\n23 예수님께서 성전에 가서 가르치고 계실 때,\n수석 사제들과 백성의 원로들이 예수님께 다가와 말하였다.\n“당신은 무슨 권한으로 이런 일을 하는 것이오?\n그리고 누가 당신에게 이런 권한을 주었소?”\n24 그러자 예수님께서 말씀하셨다. “나도 너희에게 한 가지 묻겠다.\n너희가 나에게 대답하면,\n나도 무슨 권한으로 이런 일을 하는지 너희에게 말해 주겠다.\n25 요한의 세례가 어디에서 온 것이냐? 하늘에서냐, 아니면 사람에게서냐?”\n그들은 저희끼리 의논하였다.\n“‘하늘에서 왔다.’ 하면,\n‘어찌하여 그를 믿지 않았느냐?’ 하고 우리에게 말할 것이오.\n26 그렇다고 ‘사람에게서 왔다.’ 하자니 군중이 두렵소.\n그들이 모두 요한을 예언자로 여기니 말이오.”\n27 그래서 그들이 예수님께 “모르겠소.” 하고 대답하였다.\n그러자 예수님께서 그들에게 말씀하셨다.\n“나도 무슨 권한으로 이런 일을 하는지 너희에게 말하지 않겠다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n\n<또는, 기념일 독서(1코린 2,1-10ㄱ)와 복음(루카 14,25-33)을 봉독할 수 있다.>","예물 기도":"전능하신 하느님,\n복된 요한을 기억하며 바치는 이 제물을 받아들이시고\n저희가 거행하는 주님 수난의 신비를 삶으로 드러내게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.\n<또는>\n<성인 감사송 1 : 성인들의 영광>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 성인들 가운데서 찬미를 받으시며\n그들의 공로를 갚아 주시어 주님의 은총을 빛내시나이다.\n또 성인들의 삶을 저희에게 모범으로 주시고\n저희가 성인들과 하나 되게 하시며 그 기도의 도움을 받게 하시나이다.\n저희는 이 위대한 증인에게서 힘을 얻고\n악과 싸워서 승리를 거두고 나아갈 길을 끝까지 달려\n우리 주 그리스도를 통하여\n그들과 함께 영원히 시들지 않는 영광의 월계관을 받나이다.\n그러므로 천사와 대천사와 성인들의 무리와 함께\n저희도 주님을 찬미하며 끝없이 노래하나이다.","영성체송":"마태 16,24 참조\n주님이 말씀하신다. 누구든지 내 뒤를 따라오려면, 자신을 버리고 제 십자가를 지고 나를 따라야 한다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"하느님,\n복된 요한에게 십자가의 신비를 오묘하게 밝혀 주셨으니\n저희가 이 제사로 힘을 얻고\n언제나 그리스도와 하나 되어\n교회 안에서 모든 이의 구원을 위하여 일하게 하소서.\n우리 주 …….","오늘의 묵상":"제가 공부하였던 대전 가톨릭 대학교의 교육 이념은 ‘비움, 배움, 섬김’입니다. 예수님을 닮은 사제로 양성되는 신학생들에게 꼭 필요한 덕목이며, 신학생뿐 아니라 그리스도인인 우리가 갖추어야 할 삶의 자세이기도 합니다. 오늘 복음을 묵상하며 이 가운데 특별히 섬김의 뜻을 다시 생각해 봅니다.\n“당신은 무슨 권한으로 이런 일을 하는 것이오?”(마태 21,23) 수석 사제들과 원로들에게 예수님께서는 눈엣가시 같은 존재셨습니다. 자신들이 독점하던 권위에 사람들이 의문을 품고 예수님을 참된 스승으로 받아들이기 시작하였기 때문입니다.\n그러나 예수님께서는 권위를 내세우는 방식이 아니라 섬김의 자세로 사람들에게 다가가셨습니다. 부정하게 여겨지던 병자들에게도 다가가시어 낫게 하시고, 죄인으로 취급받던 이들과 함께 식사하시며, 최후의 만찬에서는 제자들의 발을 씻어 주셨습니다. 이러한 모습은 “사람의 아들은 섬김을 받으러 온 것이 아니라 섬기러 왔고, 또 많은 이들의 몸값으로 자기 목숨을 바치러 왔다.”(마르 10,45)라는 말씀을 몸소 실천하신 것입니다.\n누군가의 손길이 필요한 이들과 관계를 맺고 자신을 낮출 때 비로소 참된 권위가 드러납니다. 권위와 섬김은 배치되는 말이 아니라 함께해야 하는 덕목입니다. 힘과 지위에서 오는 명령은 겉으로는 복종하게 할 수 있을지 몰라도 마음까지 움직일 수는 없습니다. 사람의 마음을 움직이고 공동체를 하나로 모으는 힘은 섬김에서 나온다는 사실을 기억하며, 사랑으로 이웃들을 섬깁시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261215":{"d":"2026년 12월 15일 화요일","c":"자","t":"대림 제3주간 화요일","o":[],"n":"","g":"","i":"","s":{"입당송":"즈카 14,5.7 참조\n보라, 주님이 거룩한 이들을 모두 데리고 오시리니, 그날에는 큰 빛이 비치리라.","본기도":"하느님,\n외아드님을 통하여 저희를 새사람이 되게 하셨으니\n사랑으로 지으신 저희를 자비로이 굽어보시어\n성자께서 오실 때에 저희의 온갖 죄악을 씻어 주소서.\n성부와 성령과 …….","제1독서":"<구세주의 구원이 가난한 모든 사람에게 약속된다.>\n▥ 스바니야 예언서의 말씀입니다.\n3,1-2.9-13\n주님께서 이렇게 말씀하신다.\n1 “불행하여라, 반항하는 도성, 더럽혀진 도성, 억압을 일삼는 도성!\n2 말을 듣지 않고 교훈을 받아들이지 않는구나.\n주님을 신뢰하지 않고 자기 하느님께 가까이 가지 않는구나.\n9 그때에 나는 민족들의 입술을 깨끗하게 만들어 주리라.\n그들이 모두 주님의 이름을 받들어 부르며\n어깨를 나란히 하고 주님을 섬기게 하리라.\n10 에티오피아 강 너머에서 나의 숭배자들, 흩어진 이들이 선물을 가지고 나에게 오리라.\n11 그날에는 네가 나를 거역하며 저지른 그 모든 행실을\n부끄러워하지 않아도 되리라.\n그때에는 내가 네 가운데에서 거만스레 흥겨워하는 자들을 치워 버리리라.\n그러면 네가 나의 거룩한 산에서 다시는 교만을 부리지 않으리라.\n12 나는 네 한가운데에 가난하고 가련한 백성을 남기리니\n그들은 주님의 이름에 피신하리라.\n13 이스라엘의 남은 자들은 불의를 저지르지 않고 거짓을 말하지 않으며\n그들 입에서는 사기 치는 혀를 보지 못하리라.\n정녕 그들은 아무런 위협도 받지 않으며 풀을 뜯고 몸을 누이리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 34(33),2-3.6-7.17-18.19와 23(◎ 7ㄱ)\n◎ 가련한 이 부르짖자 주님이 들어 주셨네.\n○ 나 언제나 주님을 찬미하리니, 내 입에 늘 찬양이 있으리라. 내 영혼 주님을 자랑하리니, 가난한 이는 듣고 기뻐하여라. ◎\n○ 주님을 바라보아라. 기쁨이 넘치고, 너희 얼굴에는 부끄러움이 없으리라. 가련한 이 부르짖자 주님이 들으시어, 그 모든 곤경에서 구원해 주셨네. ◎\n○ 주님의 얼굴은 악행을 일삼는 자들에게 맞서, 그들의 기억을 세상에서 지우려 하시네. 의인들이 울부짖자 주님이 들으시어, 그 모든 곤경에서 구해 주셨네. ◎\n○ 주님은 마음이 부서진 이를 가까이하시고, 영혼이 짓밟힌 이를 구원해 주신다. 주님이 당신 종들의 목숨 건져 주시니, 그분께 피신하는 이 모두 죗값을 벗으리라. ◎","복음 환호송":"◎ 알렐루야.\n○ 오소서, 주님. 지체하지 마소서. 당신 백성의 죄를 용서하소서.\n◎ 알렐루야.","복음":"<요한이 왔을 때, 죄인들은 그를 믿었다.>\n✠ 마태오가 전한 거룩한 복음입니다.\n21,28-32\n그때에 예수님께서 수석 사제들과 백성의 원로들에게 말씀하셨다.\n28 “너희는 어떻게 생각하느냐?\n어떤 사람에게 아들이 둘 있었는데, 맏아들에게 가서\n‘얘야, 너 오늘 포도밭에 가서 일하여라.’ 하고 일렀다.\n29 그는 ‘싫습니다.’ 하고 대답하였지만, 나중에 생각을 바꾸어 일하러 갔다.\n30 아버지는 또 다른 아들에게 가서 같은 말을 하였다.\n그는 ‘가겠습니다, 아버지!’ 하고 대답하였지만 가지는 않았다.\n31 이 둘 가운데 누가 아버지의 뜻을 실천하였느냐?”\n그들이 “맏아들입니다.” 하고 대답하자,\n예수님께서 그들에게 말씀하셨다.\n“내가 진실로 너희에게 말한다.\n세리와 창녀들이 너희보다 먼저 하느님의 나라에 들어간다.\n32 사실 요한이 너희에게 와서 의로운 길을 가르칠 때,\n너희는 그를 믿지 않았지만 세리와 창녀들은 그를 믿었다.\n너희는 그것을 보고도 생각을 바꾸지 않고 끝내 그를 믿지 않았다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n비천한 저희가 드리는 기도와 제물을 굽어보시어\n아무런 공덕이 없는 저희를 너그러이 보호하시며 도와주소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"2티모 4,8 참조\n의로운 심판관은 당신이 나타나기를 애타게 기다린 사람에게 의로움의 화관을 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 신비로운 제사에 참여한 저희를 생명의 양식으로 기르시니\n저희가 지상 것을 슬기롭게 헤아리며\n끊임없이 천상 것을 찾도록 가르쳐 주소서.\n우리 주 …….","오늘의 묵상":"가톨릭 신자들에게 순명은 중요한 덕목으로, 성모님에게서 그 본보기를 찾을 수 있습니다. “보십시오, 저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다”(루카 1,38). 성모님께서는 받아들이시기 어려운 상황에서도 하느님의 뜻을 받아들이셨고, 우리도 그 모습을 본받아 충실한 신자가 되고자 노력합니다.\n그런데 오늘 복음에서 맏아들은 아버지에게 이렇게 대답합니다. “싫습니다”(마태 21,29). 신앙인으로서 차마 해서는 안 될 말처럼 들릴 수도 있고, 그러나 한편으로는 정말로 하고 싶었지만 끝내 하지 못한 말일 수도 있습니다. 그러나 살면서 어떻게 모든 일이 만족스럽고 기쁠 수 있겠습니까. 때로는 자신의 마음을 솔직하게 인정하고 표현하는 것이 더 정직하고 책임감 있는 모습이지 않을까요?\n자신의 마음을 숨김없이 있는 그대로 주님께 말씀드리는 시간은 우리 모두에게 필요합니다. 그리스도인은 참기만 하는 사람들도, 듣기 좋은 말만 하는 사람들도 아닙니다. “예수님, 저 이런 상황을 도저히 못 참겠어요.”, “예수님, 저 이 사람이랑 함께하기 싫어요.”라고도 기도할 수 있어야 합니다. 우리 안에 좋지 않은 생각이나 마음까지 예수님께 다 고백하고 비울 때, 언제나 우리의 기도를 들어 주시는 주님께서 우리와 함께 계심을 새롭게 깨닫게 될 것입니다. 그리고 그러한 가운데 드러나는 하느님의 뜻을 주님 사랑에 기대어 받아들이고 실천할 수 있을 것입니다.\n오늘 복음의 둘째 아들처럼 겉으로만 순명하는 척하기보다 진실한 대화 안에서 하느님의 뜻을 발견하는 것은 어떨까요? 하느님과 깊은 만남 안에서 참된 순명이 시작된다는 것을 기억하며 살아가는 우리가 되기를 바랍니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261216":{"d":"2026년 12월 16일 수요일","c":"자","t":"대림 제3주간 수요일","o":[],"n":"","g":"","i":"","s":{"입당송":"하바 2,3; 1코린 4,5 참조\n주님은 지체하지 않고 오시어, 어둠 속에 숨은 것을 밝히시고, 모든 민족들 앞에 당신을 드러내시리라.","본기도":"전능하신 하느님,\n다가오는 성자의 성탄 축제로\n저희가 현세 생활을 바로잡아 영원한 상급을 받게 하소서.\n성부와 성령과 …….","제1독서":"<하늘아, 위에서 이슬을 내려라.>\n▥ 이사야서의 말씀입니다.\n45,6ㄴ-8.18.21ㅁ-25\n6 내가 주님이고 다른 이가 없다.\n7 나는 빛을 만드는 이요 어둠을 창조하는 이다.\n나는 행복을 주는 이요 불행을 일으키는 이다.\n나 주님이 이 모든 것을 이룬다.\n8 하늘아, 위에서 이슬을 내려라. 구름아, 의로움을 뿌려라.\n땅은 열려 구원이 피어나게, 의로움도 함께 싹트게 하여라.\n나 주님이 이것을 창조하였다.\n18 주님께서 말씀하신다. 하늘을 창조하신 분, 그분께서 하느님이시다.\n땅을 빚으시고 땅을 만드신 분, 그분께서 그것을 굳게 세우셨다.\n그분께서는 그것을 혼돈으로 창조하지 않으시고\n살 수 있는 곳으로 빚어 만드셨다.\n내가 주님이다. 다른 이가 없다.\n21 나 주님이 아니냐? 나밖에는 다른 신이 아무도 없다.\n의롭고 구원을 베푸는 하느님, 나 말고는 아무도 없다.\n22 땅끝들아, 모두 나에게 돌아와 구원을 받아라.\n나는 하느님, 다른 이가 없다.\n23 내가 나 자신을 두고 맹세한다.\n내 입에서 의로운 말이 나갔으니 그 말은 돌이킬 수 없는 것이다.\n정녕 모두 나에게 무릎을 꿇고 입으로 맹세하며 24 말하리라.\n“주님께만 의로움과 권능이 있다.\n그분께 격분하는 자들은 모두 그분 앞에 와서 부끄러운 일을 당하리라.\n25 이스라엘의 모든 후손들은 주님 안에서 승리와 영예를 얻으리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 85(84),9ㄱㄴㄷ과 10.11-12.13-14(◎ 이사 45,8)\n◎ 하늘아, 위에서 이슬을 내려라. 구름아, 의로움을 뿌려라.\n○ 하느님 말씀을 나는 듣고자 하노라. 당신 백성, 당신께 충실한 이에게, 주님은 진정 평화를 말씀하신다. 그분을 경외하는 이에게 구원이 가까우니, 영광은 우리 땅에 머물리라. ◎\n○ 자애와 진실이 서로 만나고, 정의와 평화가 입을 맞추리라. 진실이 땅에서 돋아나고, 정의가 하늘에서 굽어보리라. ◎\n○ 주님이 복을 베푸시어, 우리 땅이 열매를 내리라. 정의가 그분 앞을 걸어가고, 그분은 그 길로 나아가시리라. ◎","복음 환호송":"이사 40,9-10 참조\n◎ 알렐루야.\n○ 기쁜 소식을 전하는 너는 목소리를 한껏 높여라. 보라, 주 하느님이 권능을 떨치며 오신다.\n◎ 알렐루야.","복음":"<요한에게 가서 너희가 보고 들은 것을 전하여라.>\n✠ 루카가 전한 거룩한 복음입니다.\n7,18ㄴ-23\n그때에 18 요한은 자기 제자들 가운데에서 두 사람을 불러\n19 주님께 보내며, “오실 분이 선생님이십니까?\n아니면 저희가 다른 분을 기다려야 합니까?” 하고 여쭙게 하였다.\n20 그 사람들이 예수님께 다가와 말하였다.\n“세례자 요한이 저희를 보내어, ‘오실 분이 선생님이십니까?\n아니면 저희가 다른 분을 기다려야 합니까?’ 하고 여쭈어 보라고 하셨습니다.”\n21 그때에 예수님께서는 질병과 병고와 악령에 시달리는 많은 사람을 고쳐 주시고,\n또 많은 눈먼 이를 볼 수 있게 해 주셨다.\n22 예수님께서 그들에게 대답하셨다.\n“요한에게 가서 너희가 보고 들은 것을 전하여라.\n눈먼 이들이 보고 다리저는 이들이 제대로 걸으며,\n나병 환자들이 깨끗해지고 귀먹은 이들이 들으며,\n죽은 이들이 되살아나고 가난한 이들이 복음을 듣는다.\n23 나에게 의심을 품지 않는 이는 행복하다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n이 예물을 정성껏 봉헌하며 비오니\n주님께서 제정하신 거룩한 신비의 거행으로\n저희 구원이 온전히 이루어지게 하소서.\n우리 주 …….","감사송":"<대림 감사송 1 : 그리스도의 두 차례 오심>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n그리스도께서 비천한 인간으로 처음 오실 때에는\n구약에 마련된 임무를 완수하시고\n저희에게 영원한 구원의 길을 열어 주셨나이다.\n그리고 빛나는 영광 중에 다시 오실 때에는\n저희에게 반드시 상급을 주실 것이니\n저희는 지금 깨어 그 약속을 기다리고 있나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"이사 40,10; 35,5 참조\n보라, 우리 주님이 권능을 떨치며 오시어, 당신 종들의 눈을 밝혀 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n주님께서는 인자하시니\n이 성사의 힘으로 저희 죄를 깨끗이 씻어 주시어\n다가오는 성탄 축제를 준비하게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 복음에서 세례자 요한의 제자들은 무척이나 당황스러웠을 것입니다. 스승인 세례자 요한을 따름으로써 참된 길을 가고 있다고 생각하였는데, 바로 그 스승이 예수님께 가서 다음과 같이 여쭙게 하였기 때문입니다. “오실 분이 선생님이십니까? 아니면 저희가 다른 분을 기다려야 합니까?”(루카 7,19) 그들은 요한이 시킨 대로 예수님께 가 묻습니다.\n그러나 예수님께서는 곧바로 답하시지 않습니다. 그 대신 병자를 낫게 하시고 기적을 행하십니다. 요한의 제자들은 분명한 답을 듣지 못해서 더 혼란스러웠을까요, 아니면 예수님께서 하신 일을 보고 더 큰 깨달음을 얻었을까요? 우리는 알 수 없습니다. 그러나 분명한 것은 예수님께서 구원의 길로 이끄시는 방식은 우리가 예상하는 틀을 벗어날 수도 있다는 것입니다. 이따금 우리는 내 생각대로 교회가 움직이기를 바라고, 내가 바라는 대로 하느님께서 일하시기를 기대합니다. 이러한 생각에는 하느님의 뜻보다 내 생각을 앞세우고 싶은 유혹이 숨어 있을 수 있습니다.\n대림 시기를 보내며 오늘까지 우리는 감사송에서 이렇게 기도하였습니다. “빛나는 영광 중에 다시 오실 때에는, 저희에게 반드시 상급을 주실 것이니, 저희는 지금 깨어 그 약속을 기다리고 있나이다.” 주님 성탄 대축일은 우리가 예상하고 준비한 대로 12월 24일 밤일 테지만 주님의 다시 오심은 우리가 하는 계산과 예상대로 이루어지지 않을 것입니다. 자신의 좁은 생각에 걸려 넘어지는 것이 아니라, 언제나 우리 생각을 뛰어넘는 하느님의 방식을 믿고 기쁘게 받아들이는 우리가 되기를 바랍니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261217":{"d":"2026년 12월 17일 목요일","c":"자","t":"12월 17일","o":[],"n":"","g":"","i":"","s":{"입당송":"이사 49,13 참조\n하늘아, 즐거워하여라. 땅아, 기뻐하여라. 우리 주님이 오시어, 가련한 우리를 가엾이 여기시리라.","본기도":"인류를 창조하시고 구원하신 하느님,\n평생 동정녀의 태중에서 말씀이 사람이 되게 하셨으니\n저희 기도를 인자로이 들으시어\n인성을 받아들이신 외아드님을 통하여 저희도 그 신성에 참여하게 하소서.\n성자께서는 성부와 …….","제1독서":"<왕홀이 유다에게서 떠나지 않으리라.>\n▥ 창세기의 말씀입니다.\n49.1-2.8-10\n그 무렵 1 야곱이 아들들을 불러 말하였다.\n“너희는 모여들 오너라. 뒷날 너희가 겪을 일을 내가 너희에게 일러 주리라.\n2 야곱의 아들들아, 모여 와 들어라. 너희 아버지 이스라엘의 말을 들어라.\n8 너 유다야, 네 형제들이 너를 찬양하리라.\n네 손은 원수들의 목을 잡고 네 아버지의 아들들이 네 앞에 엎드리리라.\n9 유다는 어린 사자. 내 아들아, 너는 네가 잡은 짐승을 먹고 컸다.\n유다가 사자처럼, 암사자처럼 웅크려 엎드리니 누가 감히 그를 건드리랴?\n10 유다에게 조공을 바치고 민족들이 그에게 순종할 때까지\n왕홀이 유다에게서, 지휘봉이 그의 다리 사이에서 떠나지 않으리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.3-4ㄱㄴ.7-8.17(◎ 7ㄴㄷ 참조)\n◎ 주님, 이 시대에 정의와 평화가 꽃피게 하소서.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 산들은 백성에게 평화를, 언덕들은 정의를 가져오게 하소서. 그가 가련한 백성의 권리를 보살피고, 불쌍한 이에게 도움을 베풀게 하소서. ◎\n○ 저 달이 다할 그때까지, 정의와 큰 평화가 그의 시대에 꽃피게 하소서. 그가 바다에서 바다까지, 강에서 땅끝까지 다스리게 하소서. ◎\n○ 그의 이름 영원히 이어지며, 그의 이름 해처럼 솟아오르게 하소서. 세상 모든 민족들이 그를 통해 복을 받고, 그를 칭송하게 하소서. ◎","복음 환호송":"◎ 알렐루야.\n○ 지극히 높으신 분의 지혜 만물을 힘차고 아름답게 가꾸시는 분, 어서 오소서. 저희에게 슬기의 길을 가르치소서.\n◎ 알렐루야.","복음":"<다윗의 자손이신 예수 그리스도의 족보>\n✠ 마태오가 전한 거룩한 복음입니다.\n1,1-17\n1 다윗의 자손이시며 아브라함의 자손이신 예수 그리스도의 족보.\n2 아브라함은 이사악을 낳고 이사악은 야곱을 낳았으며\n야곱은 유다와 그 형제들을 낳았다.\n3 유다는 타마르에게서 페레츠와 제라를 낳고\n페레츠는 헤츠론을 낳았으며 헤츠론은 람을 낳았다.\n4 람은 암미나답을 낳고 암미나답은 나흐손을 낳았으며 나흐손은 살몬을 낳았다.\n5 살몬은 라합에게서 보아즈를 낳고 보아즈는 룻에게서 오벳을 낳았다.\n오벳은 이사이를 낳고 6 이사이는 다윗 임금을 낳았다.\n다윗은 우리야의 아내에게서 솔로몬을 낳고, 7 솔로몬은 르하브암을 낳았으며\n르하브암은 아비야를 낳고 아비야는 아삽을 낳았다.\n8 아삽은 여호사팟을 낳고 여호사팟은 여호람을 낳았으며\n여호람은 우찌야를 낳았다.\n9 우찌야는 요탐을 낳고 요탐은 아하즈를 낳았으며 아하즈는 히즈키야를 낳았다.\n10 히즈키야는 므나쎄를 낳고 므나쎄는 아몬을 낳았으며 아몬은 요시야를 낳았다.\n11 요시야는 바빌론 유배 때에 여호야킨과 그 동생들을 낳았다.\n12 바빌론 유배 뒤에 여호야킨은 스알티엘을 낳고 스알티엘은 즈루빠벨을 낳았다.\n13 즈루빠벨은 아비훗을 낳고 아비훗은 엘야킴을 낳았으며 엘야킴은 아조르를 낳았다.\n14 아조르는 차독을 낳고 차독은 아킴을 낳았으며 아킴은 엘리웃을 낳았다.\n15 엘리웃은 엘아자르를 낳고 엘아자르는 마탄을 낳았으며 마탄은 야곱을 낳았다.\n16 야곱은 마리아의 남편 요셉을 낳았는데,\n마리아에게서 그리스도라고 불리는 예수님께서 태어나셨다.\n17 그리하여 이 모든 세대의 수는 아브라함부터 다윗까지가 십사 대이고,\n다윗부터 바빌론 유배까지가 십사 대이며,\n바빌론 유배부터 그리스도까지가 십사 대이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n교회가 바치는 예물을 거룩하게 하시고\n저희가 이 신비로운 제사에서 받는 천상 양식으로 다시 힘을 얻게 하소서.\n우리 주 …….","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"하까 2,7 참조\n보라, 모든 민족들의 보화가 들어오리니, 주님의 집은 영광으로 가득 차리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님, 천상 양식을 받고 비오니\n저희가 늘 이 양식을 바라며 성령의 빛을 충만히 받아\n그리스도께서 오실 때 등불을 밝혀 들고 마중 나가게 하소서.\n우리 주 …….","오늘의 묵상":"대림 시기는 크게 두 부분으로 나뉩니다. 대림 제1주일부터 12월 16일까지는 우리 곁에 오실 예수님을 기다리는 데 초점을 맞추고, 12월 17일 오늘부터 주님 성탄 대축일까지는 이 세상에 오신 예수님의 탄생을 기억하며 그 의미를 깊이 묵상합니다. 그래서 오늘 복음 내용은 신약 성경의 첫 장인 마태오 복음서의 예수님 족보입니다.\n족보의 내용에 집중하기는 쉽지 않습니다. 아브라함과 이사악, 야곱과 다윗처럼 익숙한 이름도 있지만 대부분은 낯설고, 누가 누구를 낳았다고 되풀이되는 내용이 지금 우리와는 관련이 없다고 느껴지기 때문입니다. 그러나 이 족보는 단순히 이름의 목록이 아니라, 인류를 구원하시려는 하느님의 오랜 계획을 보여 주는 구원의 역사입니다.\n믿음의 조상 아브라함에게 땅과 후손을 약속하신 하느님께서는 이스라엘 민족과 맺으신 계약에 끝까지 충실하셨고, 마침내 예수 그리스도를 세상에 보내심으로써 그 약속을 완성하셨습니다. 족보에는 이름만 짧게 기록되어 있지만, 그 한 사람 한 사람은 저마다 삶 속에서 하느님과 함께 기쁨과 슬픔, 희망과 시련의 시간을 보냈을 것입니다. 그렇게 이어진 수많은 세월 끝에 하느님의 구원 계획은 성탄의 신비 안에서 드러나게 됩니다.\n우리 삶도 마찬가지입니다. 지금 우리가 살아가는 하루하루도 하느님의 구원 역사 안에 있습니다. 우리 이름은 언젠가는 잊히겠지만 하느님을 향한 우리 믿음은 계속해서 다음 세대로 이어질 것입니다. 아기 예수님의 탄생을 기다리는 이 시기, 오래전부터 우리를 위하여 구원을 준비하신 하느님의 사랑을 기억하며, 하느님과 함께 믿음의 발걸음을 이어 갑시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261218":{"d":"2026년 12월 18일 금요일","c":"자","t":"12월 18일","o":[],"n":"","g":"","i":"","s":{"입당송":"어린양이 오시리라 요한이 선포하였네. 우리 임금님 그리스도 오시리라.","본기도":"전능하신 하느님,\n죄의 멍에를 메고 구원을 기다려 온 저희가\n다시 맞는 성자의 탄생으로 옛 종살이에서 벗어나게 하소서.\n성부와 성령과 …….","제1독서":"<내가 다윗을 위하여 의로운 싹을 돋아나게 하리라.>\n▥ 예레미야서의 말씀입니다.\n23,5-8\n5 보라, 그날이 온다! 주님의 말씀이다.\n내가 다윗을 위하여 의로운 싹을 돋아나게 하리라.\n그 싹은 임금이 되어 다스리고 슬기롭게 일을 처리하며\n세상에 공정과 정의를 이루리라.\n6 그의 시대에 유다가 구원을 받고 이스라엘이 안전하게 살리라.\n사람들이 그의 이름을 ‘주님은 우리의 정의’라고 부르리라.\n7 그러므로 이제 그날이 온다. 주님의 말씀이다.\n그때에는 사람들이 더 이상 “이스라엘 자손들을 이집트에서 데리고 올라오신,\n살아 계신 주님을 두고 맹세한다.” 하지 않고,\n8 그 대신 “이스라엘 집안의 후손들을 북쪽 땅에서,\n그리고 당신께서 쫓아 보내셨던 모든 나라에서 데리고 올라오신,\n살아 계신 주님을 두고 맹세한다.”할 것이다.\n그때에 그들은 자기 고향 땅에서 살게 될 것이다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 72(71),1-2.12-13.18-19ㄱㄴ(◎ 7ㄴㄷ 참조)\n◎ 주님, 이 시대에 정의와 평화가 꽃피게 하소서.\n○ 하느님, 당신의 공정을 임금에게, 당신의 정의를 임금의 아들에게 베푸소서. 그가 당신 백성을 정의로, 가련한 이들을 공정으로 다스리게 하소서. ◎\n○ 그는 하소연하는 불쌍한 이를, 도와줄 사람 없는 가련한 이를 구원하나이다. 약한 이, 불쌍한 이에게 동정을 베풀고, 불쌍한 이들의 목숨을 살려 주나이다. ◎\n○ 주 하느님, 이스라엘의 하느님은 찬미받으시리라. 그분 홀로 기적들을 일으키신다. 영광스러운 그 이름 영원히 찬미받으시리라. 그 영광 온 누리에 가득하리라. ◎","복음 환호송":"◎ 알렐루야.\n○ 이스라엘 집안의 영도자, 시나이 산에서 모세에게 법을 주셨으니 당신 팔을 펼치시어 저희를 구원하러 오소서.\n◎ 알렐루야.","복음":"<예수님께서는 다윗의 자손 요셉과 약혼한 마리아에게서 탄생하시리라.>\n✠ 마태오가 전한 거룩한 복음입니다.\n1,18-24\n18 예수 그리스도께서는 이렇게 탄생하셨다.\n그분의 어머니 마리아가 요셉과 약혼하였는데,\n그들이 같이 살기 전에 마리아가 성령으로 말미암아 잉태한 사실이 드러났다.\n19 마리아의 남편 요셉은 의로운 사람이었고\n또 마리아의 일을 세상에 드러내고 싶지 않았으므로,\n남모르게 마리아와 파혼하기로 작정하였다.\n20 요셉이 그렇게 하기로 생각을 굳혔을 때,\n꿈에 주님의 천사가 나타나 말하였다.\n“다윗의 자손 요셉아, 두려워하지 말고 마리아를 아내로 맞아들여라.\n그 몸에 잉태된 아기는 성령으로 말미암은 것이다.\n21 마리아가 아들을 낳으리니 그 이름을 예수라고 하여라.\n그분께서 당신 백성을 죄에서 구원하실 것이다.”\n22 주님께서 예언자를 통하여 하신 말씀이 이루어지려고 이 모든 일이 일어났다.\n곧 23 “보아라, 동정녀가 잉태하여 아들을 낳으리니\n그 이름을 임마누엘이라고 하리라.” 하신 말씀이다.\n임마누엘은 번역하면 ‘하느님께서 우리와 함께 계시다.’는 뜻이다.\n24 잠에서 깨어난 요셉은 주님의 천사가 명령한 대로 아내를 맞아들였다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n성자의 죽음으로 죽음을 이기게 하셨으니\n이 제사로 저희를 어여삐 여기시어\n성자의 영원한 생명에 참여하게 하소서.\n성자께서는 영원히 …….","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"마태 1,23 참조\n그 이름을 임마누엘이라고 하리니, ‘하느님이 우리와 함께 계시다.’는 뜻이다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 이 성전에서 주님의 자비를 입었으니\n다가오는 구원의 대축제를 정성껏 준비하게 하소서.\n우리 주 …….","오늘의 묵상":"눈이 오면 누군가는 반가워하지만 누군가는 이런저런 걱정부터 합니다. 눈이 많이 올 때는 앞이 잘 보이지 않거나 길이 미끄럽기 때문에 더 조심해야 합니다. 우리 삶에도 그런 때가 있습니다. 때로는 앞을 가늠할 수 없을 만큼 힘든 순간을 만나기도 하고, 때로는 속도를 늦추며 천천히 가야 할 때도 있습니다. 그러나 어떤 상황에서도 잃지 말아야 할 것은 우리가 나아가야 할 분명한 방향입니다.\n그리스도인이 지향하는 삶의 목적지는 하느님 나라입니다. 그 길에서 우리를 올바른 방향으로 이끌어 주는 길잡이는 바로 하느님의 말씀입니다. 오늘 복음은 그 말씀에 순명한 요셉 성인을 보여 줍니다. 복음은 그를 “의로운 사람”(마태 1,19)이라고 소개합니다. 요셉은 마리아의 잉태 소식을 듣고 조용히 파혼하려고 하였습니다. 그러나 꿈에 나타난 천사의 말을 듣고 자신의 계획을 내려놓습니다. “두려워하지 말고 마리아를 아내로 맞아들여라”(1,20). 이 말씀에 순종한 요셉은 자신의 판단보다 하느님의 뜻을 앞세웠고, 그의 순명은 구원 역사가 이루어지는 데 매우 중요한 역할을 하였습니다.\n우리 뜻이 하느님의 뜻과 달라 자신의 생각을 바꾸어야 할 때가 있습니다. 하느님의 뜻이 내 생각과 다를 때에도 기꺼이 받아들일 수 있는지 돌아봅시다. 유연함 없이 곧기만 한 나뭇가지는 부러지기 마련입니다.\n요셉 성인뿐만 아니라 우리는 모두 하느님의 구원 계획에 초대받았습니다. 삶의 길이 잘 보이지 않거나 힘들수록 하느님 말씀에 더욱 귀를 기울여야 합니다. 그 말씀이 우리의 등불이며 나침반임을 기억하며, 하느님 나라를 향하여 걸어갑시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261219":{"d":"2026년 12월 19일 토요일","c":"자","t":"12월 19일","o":[],"n":"","g":"","i":"","s":{"입당송":"히브 10,37 참조\n오실 분이 지체 없이 오시리라. 그분은 우리 구세주, 이제는 우리 땅에 두려움이 없으리라.","본기도":"하느님,\n거룩한 동정녀의 출산을 통하여 영광의 빛을 세상에 드러내셨으니\n저희가 언제나 이 강생의 놀라운 신비를\n온전한 믿음과 경건한 마음으로 거행하게 하소서.\n성부와 성령과 …….","제1독서":"<천사가 삼손의 탄생을 알리다.>\n▥ 판관기의 말씀입니다.\n13,2-7.24-25\n그 무렵 2 초르아 출신으로 단 씨족에 속한 사람이 하나 있었는데,\n그의 이름은 마노아였다.\n그의 아내는 임신할 수 없는 몸이어서 자식을 낳지 못하였다.\n3 그런데 주님의 천사가 그 여자에게 나타나서 말하였다.\n“보라, 너는 임신할 수 없는 몸이어서 자식을 낳지 못하였지만,\n이제 잉태하여 아들을 낳을 것이다.\n4 그러니 앞으로 조심하여 포도주도 독주도 마시지 말고,\n부정한 것은 아무것도 먹지 마라.\n5 네가 임신하여 아들을 낳을 것이기 때문이다.\n그리고 아기의 머리에 면도칼을 대어서는 안 된다.\n그 아이는 모태에서부터 이미 하느님께 바쳐진 나지르인이 될 것이다.\n그가 이스라엘을 필리스티아인들의 손에서 구원해 내기 시작할 것이다.”\n6 그러자 그 여자가 남편에게 가서 말하였다.\n“하느님의 사람이 나에게 오셨는데,\n그 모습이 하느님 천사의 모습 같아서 너무나 두려웠습니다.\n그래서 나는 그분이 어디에서 오셨는지 묻지도 못하였고,\n그분도 당신 이름을 알려 주지 않으셨습니다.\n7 그런데 그분이 나에게,\n‘보라, 너는 잉태하여 아들을 낳을 것이다.\n그러니 앞으로 포도주도 독주도 마시지 말고,\n부정한 것은 아무것도 먹지 마라.\n그 아이는 모태에서부터 죽는 날까지\n하느님께 바쳐진 나지르인이 될 것이다.’ 하고 말씀하셨습니다.”\n24 그 여자는 아들을 낳고 이름을 삼손이라 하였다.\n아이는 자라나고 주님께서는 그에게 복을 내려 주셨다.\n25 그가 초르아와 에스타올 사이에 자리 잡은 ‘단의 진영’에 있을 때,\n주님의 영이 그를 움직이기 시작하였다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 71(70),3-4ㄱㄷ.5-6ㄱㄴ.16-17(◎ 8 참조)\n◎ 저의 입은 당신을 찬양하고 당신 영광을 찬미하나이다.\n○ 이 몸 보호할 반석 되시고, 저를 구할 산성 되소서. 당신은 저의 바위, 저의 보루시옵니다. 저의 하느님, 악인의 손에서 저를 구원하소서. ◎\n○ 주 하느님, 당신은 저의 희망, 어릴 적부터 당신만을 믿었나이다. 저는 태중에서부터 당신께 의지해 왔나이다. 어미 배 속에서부터 당신은 저의 보호자시옵니다. ◎\n○ 저는 주 하느님의 위업에 둘러싸여, 오로지 당신 의로움만을 기리오리다. 하느님, 당신은 저를 어릴 때부터 가르치셨고, 저는 이제껏 당신의 기적을 전하여 왔나이다. ◎","복음 환호송":"◎ 알렐루야.\n○ 이사이의 뿌리, 민족들의 깃발로 우뚝 서신 분, 지체 없이 오시어, 저희를 구원하소서.\n◎ 알렐루야.","복음":"<가브리엘 천사가 세례자 요한의 탄생을 알리다.>\n✠ 루카가 전한 거룩한 복음입니다.\n1,5-25\n5 유다 임금 헤로데 시대에 아비야 조에 속한 사제로서\n즈카르야라는 사람이 있었다.\n그의 아내는 아론의 자손으로서 이름은 엘리사벳이었다.\n6 이 둘은 하느님 앞에서 의로운 이들로,\n주님의 모든 계명과 규정에 따라 흠 없이 살아가는 사람들이었다.\n7 그런데 그들에게는 아이가 없었다.\n엘리사벳이 아이를 못낳는 여자였기 때문이다.\n게다가 둘 다 나이가 많았다.\n8 즈카르야가 자기 조 차례가 되어 하느님 앞에서\n사제 직무를 수행할 때의 일이다.\n9 사제직의 관례에 따라 제비를 뽑았는데,\n그가 주님의 성소에 들어가 분향하기로 결정되었다.\n10 그가 분향하는 동안에 밖에서는 온 백성의 무리가 기도하고 있었다.\n11 그때에 주님의 천사가 즈카르야에게 나타나 분향 제단 오른쪽에 섰다.\n12 즈카르야는 그 모습을 보고 놀라 두려움에 사로잡혔다.\n13 천사가 그에게 말하였다.\n“두려워하지 마라, 즈카르야야. 너의 청원이 받아들여졌다.\n네 아내 엘리사벳이 너에게 아들을 낳아 줄 터이니,\n그 이름을 요한이라 하여라.\n14 너도 기뻐하고 즐거워할 터이지만\n많은 이가 그의 출생을 기뻐할 것이다.\n15 그가 주님 앞에서 큰 인물이 될 것이기 때문이다.\n그는 포도주도 독주도 마시지 않고\n어머니 태중에서부터 성령으로 가득 찰 것이다.\n16 그리고 이스라엘 자손들 가운데에서 많은 사람을\n그들의 하느님이신 주님께 돌아오게 할 것이다.\n17 그는 또 엘리야의 영과 힘을 지니고 그분보다 먼저 와서,\n부모의 마음을 자녀에게 돌리고,\n순종하지 않는 자들은 의인들의 생각을 받아들이게 하여,\n백성이 주님을 맞이할 준비를 갖추게 할 것이다.”\n18 즈카르야가 천사에게, “제가 그것을 어떻게 알 수 있겠습니까?\n저는 늙은이고 제 아내도 나이가 많습니다.” 하고 말하자,\n19 천사가 그에게 대답하였다.\n“나는 하느님을 모시는 가브리엘인데,\n너에게 이야기하여 이 기쁜 소식을 전하라고 파견되었다.\n20 보라, 때가 되면 이루어질 내 말을 믿지 않았으니,\n이 일이 일어나는 날까지\n너는 벙어리가 되어 말을 못 하게 될 것이다.”\n21 한편 즈카르야를 기다리던 백성은\n그가 성소 안에서 너무 지체하므로 이상하게 여겼다.\n22 그런데 그가 밖으로 나와서 말도 하지 못하자,\n사람들은 그가 성소 안에서 어떤 환시를 보았음을 알게 되었다.\n그는 사람들에게 몸짓만 할 뿐 줄곧 벙어리로 지냈다.\n23 그러다가 봉직 기간이 차자 집으로 돌아갔다.\n24 그 뒤에 그의 아내 엘리사벳이 잉태하였다.\n엘리사벳은 다섯 달 동안 숨어 지내며 이렇게 말하였다.\n25 “내가 사람들 사이에서 겪어야 했던 치욕을 없애 주시려고\n주님께서 굽어보시어 나에게 이 일을 해 주셨구나.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 제대에 올리는 이 예물을 자비로이 굽어보시어\n저희가 바치는 보잘것없는 예물을 주님의 힘으로 거룩하게 하소서.\n우리 주 …….","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"루카 1,78-79 참조\n떠오르는 태양이 높은 데서 우리를 찾아오시어, 우리의 발을 평화의 길로 이끌어 주시리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n천상 양식을 받고 감사하며 청하오니\n저희가 다가오는 구원을 열망하며\n깨끗한 마음으로 구세주의 성탄을 맞이하게 하소서.\n우리 주 …….","오늘의 묵상":"신앙생활을 하면서도 이따금 하느님의 뜻을 이해하기 어려울 때가 있습니다. 구약 성경의 욥기에서 보듯, 하느님의 뜻에 따라 충실히 살아가는 이들이 깊은 시련과 고난을 겪을 때입니다. 신앙의 모범으로 살아가는 이들에게도 인간적으로 감당하기 어려운 시간이 찾아옵니다.\n오늘 복음에서 우리는 세례자 요한의 탄생 이야기를 듣습니다. 복음은 그의 부모 엘리사벳과 즈카르야를 두고 이렇게 말합니다. “이 둘은 하느님 앞에서 의로운 이들로, 주님의 모든 계명과 규정에 따라 흠 없이 살아가는 사람들이었다”(루카 1,6). 이어 “그런데 그들에게는 아이가 없었다.”(1,7)라고 덧붙입니다. 성경에서 후손은 하느님의 축복과 약속의 표징이었습니다. 그렇기에 그들에게 아이가 없다는 것은 얼마나 큰 고통과 기다림이 있었을지 짐작할 수 있습니다. 오늘 제1독서에 나오는 마노아의 아내도 같은 처지였습니다.\n하느님께서는 바로 그 고통의 자리에 당신의 천사를 보내시어 새로운 생명을 약속하십니다. 인간의 힘으로 어찌할 수 없는 상황에서도 하느님께서는 당신의 창조 사업을 이어 가십니다. 이 과정에서 드러나시는 분은 바로 성령이십니다. 성령께서는 우리에게 생명을 주시고 새로움을 입혀 주십니다.\n의로움이 하느님의 은총을 온전히 보장하지는 않습니다. 오히려 우리 자신의 한계를 인정하고 하느님의 때를 기다리는 것이 신앙인의 참모습일 것입니다. 천사의 말을 믿지 못한 즈카르야도 침묵의 시간을 겪고서야 하느님의 계획을 받아들였습니다. 우리도 삶의 어려움 속에서 성령께 마음을 열고, 하느님의 때를 기다릴 수 있기를 바랍니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261220":{"d":"2026년 12월 20일 일요일","c":"자","t":"대림 제4주일","o":[],"n":"","g":"신경 · 교중","i":"","s":{"오늘 전례":"오늘은 대림 제4주일입니다. 이스라엘의 목자이신 주 하느님께서는 이스라엘의 보잘것없는 이들 가운데서 주님의 종 마리아를 선택하시어 주님의 거처로 삼으셨습니다. 말씀이 사람이 되시어 보여 주신 순종과 섬김을 우리도 배워, 언제나 주님의 뜻을 충실히 따릅시다. 주님께서 이루신 구원을 성모님과 함께 기뻐하며 영원한 찬미의 노래를 부릅시다.","입당송":"이사 45,8\n하늘아, 위에서 이슬을 내려라. 구름아, 의로움을 뿌려라. 땅은 열려 구원이 피어나게 하여라.","본기도":"주님,\n천사의 아룀으로 성자께서 사람이 되심을 알았으니\n성자의 수난과 십자가로 부활의 영광에 이르는 은총을\n저희에게 내려 주소서.\n성부와 성령과 함께 천주로서\n영원히 살아 계시며 다스리시는 성자\n우리 주 예수 그리스도를 통하여 비나이다.","제1독서":"<다윗의 나라는 주님 앞에서 영원할 것이다.>\n▥ 사무엘기 하권의 말씀입니다.\n7,1-5.8ㄷ-12.14ㄱ.16\n다윗 1 임금이 자기 궁에 자리 잡고,\n주님께서 그를 사방의 모든 원수에게서 평온하게 해 주셨을 때이다.\n2 임금이 나탄 예언자에게 말하였다.\n“보시오, 나는 향백나무 궁에 사는데, 하느님의 궤는 천막에 머무르고 있소.”\n3 나탄이 임금에게 말하였다.\n“주님께서 임금님과 함께 계시니, 가셔서 무엇이든 마음 내키시는 대로 하십시오.”\n4 그런데 그날 밤, 주님의 말씀이 나탄에게 내렸다.\n5 “나의 종 다윗에게 가서 말하여라.\n‘주님이 이렇게 말한다. 내가 살 집을 네가 짓겠다는 말이냐?\n8 나는 양 떼를 따라다니던 너를 목장에서 데려다가,\n내 백성 이스라엘의 영도자로 세웠다.\n9 또한 네가 어디를 가든지 너와 함께 있으면서,\n모든 원수를 네 앞에서 물리쳤다.\n나는 너의 이름을 세상 위인들의 이름처럼 위대하게 만들어 주었다.\n10 나는 내 백성 이스라엘을 위하여 한곳을 정하고,\n그곳에 그들을 심어 그들이 제자리에서 살게 하겠다.\n그러면 이스라엘은 더 이상 불안해하지 않아도 되고,\n다시는 전처럼, 불의한 자들이 그들을 괴롭히지 않을 것이다.\n11 곧 내가 나의 백성 이스라엘에게 판관을 임명하던 때부터 해 온 것처럼,\n나는 너를 모든 원수에게서 평온하게 해 주겠다.\n더 나아가 주님이 너에게 한 집안을 일으켜 주리라고 선언한다.\n12 너의 날수가 다 차서 조상들과 함께 잠들게 될 때,\n네 몸에서 나와 네 뒤를 이을 후손을 내가 일으켜 세우고,\n그의 나라를 튼튼하게 하겠다.\n14 나는 그의 아버지가 되고 그는 나의 아들이 될 것이다.\n16 너의 집안과 나라가 네 앞에서 영원히 굳건해지고,\n네 왕좌가 영원히 튼튼하게 될 것이다.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 89(88),2-3.4-5.27과 29(◎ 2ㄱ 참조)\n◎ 주님, 당신 자애를 영원히 노래하오리다.\n○ 주님의 자애를 영원히 노래하오리다. 제 입은 당신의 진실을 대대로 전하오리다. 제가 아뢰나이다. “주님은 자애를 영원히 세우시고, 진실을 하늘에 굳히셨나이다.” ◎\n○ 나는 내가 뽑은 이와 계약을 맺고, 나의 종 다윗에게 맹세하였노라. “영원토록 네 후손을 굳건히 하고, 대대로 이어 갈 네 왕좌를 세우노라.” ◎\n○ 그는 나를 부르리라. “당신은 저의 아버지, 저의 하느님, 제 구원의 바위.” 영원토록 그에게 내 자애를 베풀리니, 그와 맺은 내 계약 변함이 없으리라. ◎","제2독서":"<오랜 세월 감추어 두셨던 신비가 이제 알려지게 되었습니다.>\n▥ 사도 바오로의 로마서 말씀입니다.\n16,25-27\n형제 여러분, 25 하느님은 내가 전하는 복음으로, 곧 예수 그리스도의 복음 선포로,\n또 오랜 세월 감추어 두셨던 신비의 계시로\n여러분의 힘을 북돋아 주실 능력이 있는 분이십니다.\n26 이제는 모습을 드러낸 이 신비가 모든 민족들을 믿음의 순종으로 이끌도록,\n영원하신 하느님의 명령에 따라 예언자들의 글을 통하여 알려지게 되었습니다.\n27 홀로 지혜로우신 하느님께 예수 그리스도를 통하여\n영원토록 영광이 있기를 빕니다. 아멘.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"루카 1,38\n◎ 알렐루야.\n○ 보소서, 저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다.\n◎ 알렐루야.","복음":"<보라, 이제 네가 잉태하여 아들을 낳을 것이다.>\n✠ 루카가 전한 거룩한 복음입니다.\n1,26-38\n그때에 26 하느님께서는\n가브리엘 천사를 갈릴래아 지방 나자렛이라는 고을로 보내시어,\n27 다윗 집안의 요셉이라는 사람과 약혼한 처녀를 찾아가게 하셨다.\n그 처녀의 이름은 마리아였다.\n28 천사가 마리아의 집으로 들어가 말하였다.\n“은총이 가득한 이여, 기뻐하여라. 주님께서 너와 함께 계시다.”\n29 이 말에 마리아는 몹시 놀랐다.\n그리고 이 인사말이 무슨 뜻인가 하고 곰곰이 생각하였다.\n30 천사가 다시 마리아에게 말하였다.\n“두려워하지 마라, 마리아야. 너는 하느님의 총애를 받았다.\n31 보라, 이제 네가 잉태하여 아들을 낳을 터이니 그 이름을 예수라 하여라.\n32 그분께서는 큰 인물이 되시고 지극히 높으신 분의 아드님이라 불리실 것이다.\n주 하느님께서 그분의 조상 다윗의 왕좌를 그분께 주시어,\n33 그분께서 야곱 집안을 영원히 다스리시리니 그분의 나라는 끝이 없을 것이다.”\n34 마리아가 천사에게, “저는 남자를 알지 못하는데,\n어떻게 그런 일이 있을 수 있겠습니까?” 하고 말하자,\n35 천사가 마리아에게 대답하였다.\n“성령께서 너에게 내려오시고 지극히 높으신 분의 힘이 너를 덮을 것이다.\n그러므로 태어날 아기는 거룩하신 분, 하느님의 아드님이라고 불릴 것이다.\n36 네 친척 엘리사벳을 보아라. 그 늙은 나이에도 아들을 잉태하였다.\n아이를 못낳는 여자라고 불리던 그가 임신한 지 여섯 달이 되었다.\n37 하느님께는 불가능한 일이 없다.”\n38 마리아가 말하였다. “보십시오, 저는 주님의 종입니다.\n말씀하신 대로 저에게 이루어지기를 바랍니다.”\n그러자 천사는 마리아에게서 떠나갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n희망이신 주님, 성탄을 기다리는 교회와 함께하시어, 복음의 기쁨으로 충만하게 하시고, 그리하여 세상 사람들이 교회에서 삶의 희망을 찾도록 이끌어 주소서.\n\n2. 세계 경제인들을 위하여 기도합시다.\n\n인도자이신 주님, 세계의 경제를 이끄는 이들을 살펴 주시어, 그들이 경제적 이익에 앞서 인간의 존엄과 권리를 지키는 데 힘을 모으고, 인류 공동선을 위하여 최선을 다하게 하소서.\n\n3. 미혼모와 미혼부를 위하여 기도합시다.\n\n생명의 주인이신 주님, 미혼모와 미혼부를 위하여 기도하오니 그들을 보살펴 주시고, 이 사회가 그들의 어려움을 이해하고 함께하며, 청소년의 생명 교육에도 관심을 기울이게 하소서.\n\n4. 가정 공동체를 위하여 기도합시다.\n\n사랑이신 주님, 성탄의 기쁜 소식을 기다리는 모든 가정에 강복하시어, 여러 사정으로 떨어져 지내는 가족들이 기도 안에서 하나 되어 사랑을 느끼고 가족의 소중함을 잃지 않게 하소서.","예물 기도":"주님, 성령의 힘으로\n복되신 동정 마리아께서 성자를 잉태하게 하셨으니\n제대 위의 이 예물도 성령의 힘으로 거룩하게 하소서.\n우리 주 그리스도를 통하여 비나이다.","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"이사 7,14 참조\n보라, 동정녀가 잉태하여 아들을 낳으리니, 그 이름을 임마누엘이라 하리라.","영성체 후 묵상":"“은총이 가득한 이여, 기뻐하여라. 주님께서 너와 함께 계시다.” 나자렛 고을의 처녀 마리아는 몹시 놀라며 이 인사말이 무슨 뜻인지 곰곰이 생각합니다. 우리도 늘 하느님의 뜻을 깊이 묵상하며 “보십시오, 저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다.” 하고 순명할 수 있어야 하겠습니다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"전능하신 하느님,\n영원한 구원의 보증인 성체를 받아 모시고 비오니\n구원의 축제일이 가까워질수록 더욱 경건한 마음으로\n주님 성탄의 신비를 합당하게 거행하도록 도와주소서.\n성자께서는 영원히 살아 계시며 다스리시나이다.","오늘의 묵상":"사제 서품 예식에서 수품자들은 자신의 이름이 불릴 때 “예, 여기 있습니다.”라고 응답합니다. 하느님의 부르심에 자신을 온전히 내맡기겠다는 이 응답은 사람들에게 깊은 감동을 줍니다. 대림 시기 마지막 주일인 오늘 복음에서도 우리는 이러한 응답과 만납니다. 하느님의 구원 계획에 기꺼이 참여하겠다고 하신 성모님의 응답입니다.\n그 응답은 아무런 고민 없이 이루어진 것이 아니었습니다. 흔히 성모님을 생각하면 자애로운 어머니의 모습을 떠올리지만, 오늘 복음에 나오는 마리아는 천사의 인사에 몹시 놀란 십대의 어린 소녀였습니다. 모든 것을 이해할 수 있었던 것은 아니겠지만, “곰곰이 생각하였다.”(루카 1,29)라는 표현에서 하느님의 말씀을 마음에 간직할 줄 아는 소녀였음을 볼 수 있습니다.\n천사의 설명은 쉽게 이해하기 어려운 내용이었습니다. 그럼에도 마리아는 “보십시오, 저는 주님의 종입니다. 말씀하신 대로 저에게 이루어지기를 바랍니다.”(1,38)라고 응답합니다. 이 응답은 한 소녀의 결단을 넘어 하느님의 구원 계획에 대한 인류의 가장 위대한 협력이 되었습니다. 그 뒤 마리아는 예수님의 어머니로서 그리고 주님의 종으로서 살아가며 끊임없이 하느님의 뜻을 찾고 그 뜻에 자신을 내맡겼습니다. 성모님의 삶 한가운데에는 늘 예수님께서 계셨습니다.\n우리 삶도 마찬가지입니다. 예수님께서는 과거에만 계셨던 분도, 세상 마지막에만 만나게 될 분도 아니십니다. 지금도 우리와 함께하시며 우리가 삶 안에서 아버지의 뜻을 이루기를 바라십니다. 우리도 성모님처럼 하느님의 말씀을 마음에 새기고, 하느님의 뜻이 우리를 통하여 이루어질 수 있도록 기꺼이 응답하는 신앙인들이 되면 좋겠습니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261221":{"d":"2026년 12월 21일 월요일","c":"자","t":"12월 21일","o":[],"n":"","g":"","i":"","s":{"입당송":"이사 7,14; 8,10 참조\n이제 세상을 다스리러 주님이 오시리니, 그 이름을 임마누엘이라 하리라. 하느님이 우리와 함께 계시다.","본기도":"주님,\n사람이 되어 오시는 외아드님의 탄생을 기뻐하오니\n주님 백성이 드리는 기도를 인자로이 들으시어\n그분께서 위엄을 갖추고 다시 오실 때\n영원한 생명을 상으로 받게 하소서.\n성부와 성령과 …….","제1독서":"<보셔요, 내 연인이 산을 뛰어넘어 오잖아요.>\n▥ 아가의 말씀입니다.\n2,8-14\n8 내 연인의 소리! 보셔요, 그이가 오잖아요.\n산을 뛰어오르고 언덕을 뛰어넘어 오잖아요.\n9 나의 연인은 노루나 젊은 사슴 같답니다.\n보셔요, 그이가 우리 집 담장 앞에 서서\n창틈으로 기웃거리고 창살 틈으로 들여다본답니다.\n10 내 연인은 나에게 속삭이며 말했지요.\n“나의 애인이여, 일어나오. 나의 아름다운 여인이여, 이리 와 주오.\n11 자, 이제 겨울은 지나고 장마는 걷혔다오.\n12 땅에는 꽃이 모습을 드러내고 노래의 계절이 다가왔다오.\n우리 땅에서는 멧비둘기 소리가 들려온다오.\n13 무화과나무는 이른 열매를 맺어 가고 포도나무 꽃송이들은 향기를 내뿜는다오.\n나의 애인이여, 일어나오. 나의 아름다운 여인이여, 이리 와 주오.\n14 바위틈에 있는 나의 비둘기, 벼랑 속에 있는 나의 비둘기여!\n그대의 모습을 보게 해 주오. 그대의 목소리를 듣게 해 주오.\n그대의 목소리는 달콤하고 그대의 모습은 어여쁘다오.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.\n<또는>\n<이스라엘의 임금 주님께서 네 한가운데에 계시다.>\n▥ 스바니야 예언서의 말씀입니다.\n3,14-18ㄱ\n14 딸 시온아, 환성을 올려라. 이스라엘아, 크게 소리쳐라.\n딸 예루살렘아, 마음껏 기뻐하고 즐거워하여라.\n15 주님께서 너에게 내리신 판결을 거두시고 너의 원수들을 쫓아내셨다.\n이스라엘 임금 주님께서 네 한가운데에 계시니\n다시는 네가 불행을 두려워하지 않으리라.\n16 그날에 사람들이 예루살렘에게 말하리라.\n“시온아, 두려워하지 마라. 힘없이 손을 늘어뜨리지 마라.”\n17 주 너의 하느님, 승리의 용사께서 네 한가운데에 계시다.\n그분께서 너를 두고 기뻐하며 즐거워하신다.\n당신 사랑으로 너를 새롭게 해 주시고\n너 때문에 환성을 올리며 기뻐하시리라.\n18 축제의 날인 양 그렇게 하시리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 33(32),2-3.11-12.20-21(◎ 1ㄱ과 3ㄱ 참조)\n◎ 의인들아, 주님 안에서 환호하여라. 주님께 새로운 노래를 불러라.\n○ 비파 타며 주님을 찬송하고, 열 줄 수금으로 찬미 노래 불러라. 주님께 노래하여라, 새로운 노래. 고운 가락을 내며 환성 올려라. ◎\n○ 주님의 뜻은 영원히 이어지고, 그 마음속 계획은 대대로 이어진다. 행복하여라, 주님을 하느님으로 모시는 민족, 그분이 당신 소유로 뽑으신 백성! ◎\n○ 주님은 우리 도움, 우리 방패. 우리 영혼이 주님을 기다리네. 그분 안에서 우리 마음 기뻐하고, 거룩하신 그 이름 우리가 신뢰하네. ◎","복음 환호송":"◎ 알렐루야.\n○ 임마누엘, 저희 임금님, 어서 오소서. 주 하느님, 저희를 구원하소서.\n◎ 알렐루야.","복음":"<내 주님의 어머니께서 저에게 오시다니 어찌 된 일입니까?>\n✠ 루카가 전한 거룩한 복음입니다.\n1,39-45\n39 그 무렵 마리아는 길을 떠나, 서둘러 유다 산악 지방에 있는 한 고을로 갔다.\n40 그리고 즈카르야의 집에 들어가 엘리사벳에게 인사하였다.\n41 엘리사벳이 마리아의 인사말을 들을 때 그의 태 안에서 아기가 뛰놀았다.\n엘리사벳은 성령으로 가득 차 42 큰 소리로 외쳤다.\n“당신은 여인들 가운데에서 가장 복되시며 당신 태중의 아기도 복되십니다.\n43 내 주님의 어머니께서 저에게 오시다니 어찌 된 일입니까?\n44 보십시오, 당신의 인사말 소리가 제 귀에 들리자\n저의 태 안에서 아기가 즐거워 뛰놀았습니다.\n45 행복하십니다, 주님께서 하신 말씀이 이루어지리라고 믿으신 분!”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 자비로 이 예물을 바치오니\n주님의 교회가 드리는 이 예물을 받아들이시어\n저희에게 구원의 성사가 되게 하소서.\n우리 주 …….","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"루카 1,45 참조\n주님 말씀이 이루어지리라 믿으셨으니, 복되시나이다.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n이 거룩한 신비에 참여한 저희를 언제나 돌보아 주시어\n정성을 다하여 주님을 따르고\n영혼과 육신의 충만한 구원을 받게 하소서.\n우리 주 …….","오늘의 묵상":"오늘 제1독서의 아가서는 사랑을 노래하는 시입니다. 남녀의 사랑을 노래하는 듯하지만, 교회는 이 말씀 안에서 우리를 향한 주님의 사랑을 묵상합니다. “나의 애인이여, 일어나오. 나의 아름다운 여인이여, 이리 와 주오”(아가 2,10). 아가서는 사랑의 기쁨을 아름다운 언어로 노래하면서 사랑이 지닌 생동감도 보여 줍니다. 참된 기쁨을 느끼는 사람의 삶은 활력이 넘치기 때문입니다.\n이러한 생동감은 오늘 복음의 성모님에게서도 발견할 수 있습니다. 예수님을 잉태하신 성모님께서는 “서둘러”(루카 1,39) 친척 엘리사벳에게 향하십니다. 천사가 전한 갑작스러운 잉태 소식은 성모님의 발걸음을 머뭇거리게 만들 수도 있었지만, 성모님께서는 엘리사벳이 임신한 지 여섯 달이 되었다는 이야기를 듣고서 “길을 떠나[십니다]”(1,39).\n성모님과 엘리사벳의 만남을 묵상해 봅시다. 두 여인과 눈에 보이지는 않지만 태 안에 있는 두 아이, 예수님과 세례자 요한이 있습니다. 성모님께서는 가장 귀한 선물이신 예수님을 모시고 엘리사벳을 방문하셨고, 엘리사벳은 성령으로 예수님을 알아 뵙고 기뻐하였으며, 세례자 요한도 즐거이 뛰놀았습니다. 이 모습은 참기쁨 안에 있는 이들의 모습이 어떤지 보여 줍니다.\n이 기쁨의 자리에 우리 모두 초대받았습니다. 예수님을 기다리며 희망의 발걸음을 내디디고, 다른 이의 기쁨에 함께 기뻐하며, 우리를 찾아오는 이들을 따뜻하게 맞이합시다. 성령께서 주시는 생동감으로 살아가며 참된 기쁨의 노래를 부릅시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261222":{"d":"2026년 12월 22일 화요일","c":"자","t":"12월 22일","o":[],"n":"","g":"","i":"","s":{"입당송":"시편 24(23),7\n성문들아, 머리를 들어라. 영원한 문들아, 일어서라. 영광의 임금님 들어가신다.","본기도":"하느님,\n죽음에 떨어진 인간을 굽어살피시고\n저희를 구원하시려 외아드님을 세상에 보내 주셨으니\n저희가 구세주의 강생을 경축하며\n마침내 그분과 함께 영원한 생명을 누리게 하소서.\n성자께서는 성부와 …….","제1독서":"<한나가 사무엘의 탄생을 감사드리다.>\n▥ 사무엘기 상권의 말씀입니다.\n1,24-28\n그 무렵 사무엘이 24 젖을 떼자 한나는 그 아이를 데리고 올라갔다.\n그는 삼 년 된 황소 한 마리에\n밀가루 한 에파와 포도주를 채운 가죽 부대 하나를 싣고,\n실로에 있는 주님의 집으로 아이를 데려갔다. 아이는 아직 나이가 어렸다.\n25 사람들은 황소를 잡은 뒤 아이를 엘리에게 데리고 갔다.\n26 한나가 엘리에게 말하였다.\n“나리! 나리께서 살아 계시는 것이 틀림없듯이,\n제가 여기 나리 앞에 서서 주님께 기도하던 바로 그 여자입니다.\n27 제가 기도한 것은 이 아이 때문입니다.\n주님께서는 제가 드린 청을 들어주셨습니다.\n그래서 저도 아이를 주님께 바치기로 하였습니다.\n이 아이는 평생을 주님께 바친 아이입니다.”\n그런 다음 그들은 그곳에서 주님께 예배를 드렸다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"1사무 2,1.4-5.6-7.8ㄱㄴㄷㄹ(◎ 1ㄱ 참조)\n◎ 저의 구원자 주님 안에서 제 마음 기뻐 뛰나이다.\n○ 주님 안에서 제 마음이 기뻐 뛰고, 주님 안에서 제 얼굴을 높이 드나이다. 당신의 구원을 기뻐하기에, 제 입은 원수들을 비웃나이다. ◎\n○ 힘센 용사들의 활은 부러지고, 비틀거리던 이들은 힘차게 일어선다. 배부른 자들은 양식을 얻으려 품을 팔고, 배고픈 이들은 더는 굶주리지 않는다. 아이 못낳던 여자는 일곱을 낳고, 아들 많은 여자는 홀로 시들어 간다. ◎\n○ 주님은 죽이기도 살리기도 하시며, 저승으로 내리기도 저승에서 올리기도 하신다. 주님은 가난하게도 가멸게도 하시며, 낮추기도 높이기도 하신다. ◎\n○ 주님은 비천한 이를 땅바닥에서 일으켜 세우시고, 가난한 이를 잿더미에서 들어 높이시어, 존귀한 이들과 한자리에 앉히시며, 영광스러운 자리를 차지하게 하신다. ◎","복음 환호송":"◎ 알렐루야.\n○ 민족들의 임금님, 교회의 모퉁잇돌이신 주님, 어서 오소서. 흙으로 빚으신 사람을 구원하소서.\n◎ 알렐루야.","복음":"<전능하신 분께서 나에게 큰일을 하셨습니다.>\n✠ 루카가 전한 거룩한 복음입니다.\n1,46-56\n그때에 46 마리아가 말하였다. “내 영혼이 주님을 찬송하고\n47 내 마음이 나의 구원자 하느님 안에서 기뻐 뛰니\n48 그분께서 당신 종의 비천함을 굽어보셨기 때문입니다.\n이제부터 과연 모든 세대가 나를 행복하다 하리니\n49 전능하신 분께서 나에게 큰일을 하셨기 때문입니다.\n그분의 이름은 거룩하고\n50 그분의 자비는 대대로 당신을 경외하는 이들에게 미칩니다.\n51 그분께서는 당신 팔로 권능을 떨치시어\n마음속 생각이 교만한 자들을 흩으셨습니다.\n52 통치자들을 왕좌에서 끌어내리시고 비천한 이들을 들어 높이셨으며\n53 굶주린 이들을 좋은 것으로 배불리시고\n부유한 자들을 빈손으로 내치셨습니다.\n54 당신의 자비를 기억하시어 당신 종 이스라엘을 거두어 주셨으니\n55 우리 조상들에게 말씀하신 대로\n그 자비가 아브라함과 그 후손에게 영원히 미칠 것입니다.”\n56 마리아는 석 달가량 엘리사벳과 함께 지내다가 자기 집으로 돌아갔다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님의 사랑을 믿으며 거룩한 제대에 제물을 바치오니\n주님의 은총으로 저희를 씻으시어\n저희가 주님께 드리는 이 성찬의 제사로 더욱 깨끗해지게 하소서.\n우리 주 …….","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"루카 1,49.46\n전능하신 분이 나에게 큰일을 하셨으니, 내 영혼이 주님을 찬양하네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n성체를 받아 모신 저희에게 힘을 주시어\n저희가 믿음을 증언하는 삶으로 구세주를 기쁘게 맞이하고\n영원한 행복을 누리게 하소서.\n우리 주 …….","오늘의 묵상":"우리는 일을 할 때 되도록 효율적인 방법을 찾으려고 합니다. 그러다 보면 보통 가장 능력 있는 사람이 책임을 맡아 시간과 비용을 아끼는 방법을 선택합니다. 그러나 하느님께서는 세상의 기준과는 다른 방식으로 일하십니다. 인류를 구원하시고자 권력자나 뛰어난 사람이 아닌 젊은 처녀 마리아를 선택하셨습니다.\n오늘 복음에서 성모님께서는 엘리사벳의 인사를 들으시고 하느님을 찬미하시며 노래하십니다. “그분께서 당신 종의 비천함을 굽어보셨기 때문입니다”(루카 1,48). 하느님의 일을 위하여 내가 선택된다면 어떤 마음이 들까요? 성모님께서는 당신께서 선택받으셨다는 사실을 자랑하시지 않았습니다. 오히려 당신을 주님의 종으로 고백하시며 겸손을 잃으시지 않고 모든 영광을 하느님께 돌리셨습니다.\n하느님께서 굽어보신다는 말에 담긴 뜻을 좀 더 묵상하고 싶습니다. 하느님께서는 당신 자신을 낮추시어 인간의 삶 속으로 들어오시고, 작은 이들의 처지를 외면하시지 않으며 자비를 베푸십니다. 교만한 자들이나 부유한 자들에게는 하느님의 자리가 좁을 수밖에 없습니다. 그러나 자신의 부족함을 아는 이들에게 하느님께서는 모든 것이 되어 주십니다. 성모님께서는 바로 그런 하느님을 고백하십니다.\n한 사람 한 사람을 굽어보시는 하느님의 사랑에 깊이 머무르십시오. 하느님께서 우리와 함께하심을 깨닫는 사람은 자연스럽게 찬미와 감사의 기도를 드리게 됩니다. 하루의 모든 일을 하느님의 은총으로 받아들이려고 교회도 성무일도 저녁 기도마다 마리아의 노래를 바칩니다. 성모님을 닮아 겸손한 마음으로 우리의 눈길을 하느님께 향하게 합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261223":{"d":"2026년 12월 23일 수요일","c":"자","t":"12월 23일","o":[],"n":"","g":"","i":"","s":{"입당송":"이사 9,5; 시편 72(71),17 참조\n우리에게 한 아기가 태어나 용맹한 하느님이라 불리리니, 세상 모든 민족들이 그를 통해 복을 받으리라.","본기도":"전능하시고 영원하신 하느님,\n성자께서 강생하실 날이 가까웠으니\n동정 마리아에게서 사람이 되신 말씀\n저희와 함께 사신 우리 주 예수 그리스도를 통하여\n하느님의 부당한 종인 저희에게 자비를 베풀어 주소서.\n성자께서는 성부와 …….","제1독서":"<주님의 날이 오기 전에 내가 너희에게 엘리야 예언자를 보내리라.>\n▥ 말라키 예언서의 말씀입니다.\n3,1-4.23-24\n주 하느님께서 이렇게 말씀하신다.\n1 “보라, 내가 나의 사자를 보내니 그가 내 앞에서 길을 닦으리라.\n너희가 찾던 주님, 그가 홀연히 자기 성전으로 오리라.\n너희가 좋아하는 계약의 사자\n보라, 그가 온다.\n─ 만군의 주님께서 말씀하신다. ─\n2 그가 오는 날을 누가 견디어 내며\n그가 나타날 때에 누가 버티고 서 있을 수 있겠느냐?\n그는 제련사의 불 같고 염색공의 잿물 같으리라.\n3 그는 은 제련사와 정련사처럼 앉아 레위의 자손들을 깨끗하게 하고\n그들을 금과 은처럼 정련하여 주님에게 의로운 제물을 바치게 하리라.\n4 그러면 유다와 예루살렘의 제물이 옛날처럼, 지난날처럼 주님 마음에 들리라.\n23 보라, 주님의 크고 두려운 날이 오기 전에\n내가 너희에게 엘리야 예언자를 보내리라.\n24 그가 부모의 마음을 자녀에게 돌리고 자녀의 마음을 부모에게 돌리리라.\n그래야 내가 와서 이 땅을 파멸로 내리치지 않으리라.”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 25(24),4-5ㄱㄴ.8-9.10과 14(◎ 루카 21,28)\n◎ 허리를 펴고 머리를 들어라. 너희의 속량이 가까웠다.\n○ 주님, 당신의 길을 알려 주시고, 당신의 행로를 가르쳐 주소서. 저를 가르치시어 당신 진리로 이끄소서. 당신은 제 구원의 하느님이시옵니다. ◎\n○ 주님은 어질고 바르시니, 죄인들에게도 길을 가르치신다. 가련한 이 올바른 길 걷게 하시고, 가난한 이 당신 길 알게 하신다. ◎\n○ 주님의 계약과 법규를 지키는 이들에게, 주님의 모든 길은 자애와 진실이라네. 주님은 당신을 경외하는 이와 사귀시고, 당신의 계약 그들에게 알려 주신다. ◎","복음 환호송":"◎ 알렐루야.\n○ 민족들의 임금님, 교회의 모퉁잇돌이신 주님, 어서 오소서. 흙으로 빚으신 사람을 구원하소서.\n◎ 알렐루야.","복음":"<세례자 요한의 탄생>\n✠ 루카가 전한 거룩한 복음입니다.\n1,57-66\n57 엘리사벳은 해산달이 차서 아들을 낳았다.\n58 이웃과 친척들은 주님께서 엘리사벳에게 큰 자비를 베푸셨다는 것을 듣고,\n그와 함께 기뻐하였다.\n59 여드레째 되는 날, 그들은 아기의 할례식에 갔다가\n아버지의 이름을 따서 아기를 즈카르야라고 부르려 하였다.\n60 그러나 아기 어머니는 “안 됩니다. 요한이라고 불러야 합니다.” 하고 말하였다.\n61 그들은 “당신의 친척 가운데에는 그런 이름을 가진 이가 없습니다.” 하며,\n62 그 아버지에게 아기의 이름을 무엇이라 하겠느냐고 손짓으로 물었다.\n63 즈카르야는 글 쓰는 판을 달라고 하여 ‘그의 이름은 요한’이라고 썼다.\n그러자 모두 놀라워하였다.\n64 그때에 즈카르야는 즉시 입이 열리고 혀가 풀려\n말을 하기 시작하면서 하느님을 찬미하였다.\n65 그리하여 이웃이 모두 두려움에 휩싸였다.\n그리고 이 모든 일이 유다의 온 산악 지방에서 화제가 되었다.\n66 소문을 들은 이들은 모두 그것을 마음에 새기며,\n“이 아기가 대체 무엇이 될 것인가?” 하고 말하였다.\n정녕 주님의 손길이 그를 보살피고 계셨던 것이다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n거룩한 예배로 저희가 바치는 이 예물이\n주님과 완전한 화해를 이루는 제사가 되게 하시어\n저희가 깨끗한 마음으로 구세주의 성탄을 경축하게 하소서.\n우리 주 …….","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"묵시 3,20\n보라, 내가 문 앞에 서서 문을 두드리고 있다. 누구든지 내 목소리를 듣고 문을 열면, 나는 그의 집에 들어가 그와 함께 먹고, 그 사람도 나와 함께 먹으리라.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 천상 양식을 받아 모신 저희에게 평화를 주시어\n주님께서 지극히 사랑하시는 성자께서 오실 때에\n등불을 밝혀 들고 마중 나가게 하소서.\n우리 주 …….","오늘의 묵상":"우리는 세례를 받으면서 세례명을 얻습니다. 세례명으로 불리면서 우리가 하느님의 자녀임을 기억하고, 신앙인답게 살아가야 함을 기억합니다. 이처럼 이름은 단순한 호칭이 아니라 그 사람의 정체성과 특별한 사명을 담고 있습니다.\n오늘 복음에서 우리는 세례자 요한의 탄생 이야기를 듣습니다. 짧은 복음이지만 그 안에서 계속해서 분위기가 바뀌는 모습을 볼 수 있습니다. 먼저 사람들은 아기의 할례식에서 함께 기뻐합니다. 자녀가 없었던 즈카르야와 엘리사벳에게 아기가 태어난 일은 큰 기적이고 기쁨이었기 때문입니다.\n“안 됩니다. 요한이라고 불러야 합니다”(루카 1,60). 그런데 아기의 부모는 예상 밖의 이름을 정하여 사람들을 놀라게 합니다. 그와 동시에 한동안 벙어리로 지냈던 아기 아버지의 입이 열립니다. 이웃들은 이 아기 탄생의 의미를 온전히 알 수 없었고, 장차 일어날 하느님의 일에 대해서도 알지 못하였기에 “이 아기가 대체 무엇이 될 것인가?”(1,66)라고 말하며 두려워할 수밖에 없었습니다.\n그러나 우리는 세례자 요한의 탄생이 더 큰 기쁨, 곧 예수님의 오심을 준비하려는 것임을 압니다. 하느님의 은총은 우리에게도 마찬가지로 기쁨과 놀라움과 두려움을 불러일으킵니다. 그러므로 우리는 주님의 은총에 감사드리고, 때로는 자신의 틀을 깰 줄 알며, 하느님께 온전히 의탁함으로써 우리에게 주어진 희망을 맞이해야 합니다. 이것이 하느님의 자녀로서 새 이름을 얻은 이들이 살아가는 방식이기 때문입니다. 주님께 받은 이름에 맞갖은 삶으로 그리스도를 맞이합시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},"20261224":{"d":"2026년 12월 24일 목요일","c":"자","t":"12월 24일","o":[],"n":"","g":"","i":"","m":[{"l":"12월 24일 미사","s":{"입당송":"갈라 4,4 참조\n보라, 이제 때가 차, 하느님이 당신 아드님을 세상에 보내신다.","본기도":"주 예수님,\n지체하시지 말고 어서 오시어\n주님의 사랑을 믿는 저희를 위로하여 주소서.\n주님께서는 성부와 …….","제1독서":"<다윗의 나라는 주님 앞에서 영원할 것이다.>\n▥ 사무엘기 하권의 말씀입니다.\n7,1-5.8ㄷ-12.14ㄱ.16\n다윗 1 임금이 자기 궁에 자리 잡고,\n주님께서 그를 사방의 모든 원수에게서 평온하게 해 주셨을 때이다.\n2 임금이 나탄 예언자에게 말하였다.\n“보시오, 나는 향백나무 궁에 사는데,\n하느님의 궤는 천막에 머무르고 있소.”\n3 나탄이 임금에게 말하였다.\n“주님께서 임금님과 함께 계시니,\n가셔서 무엇이든 마음 내키시는 대로 하십시오.”\n4 그런데 그날 밤, 주님의 말씀이 나탄에게 내렸다.\n5 “나의 종 다윗에게 가서 말하여라.\n‘주님이 이렇게 말한다.\n내가 살 집을 네가 짓겠다는 말이냐?\n8 나는 양 떼를 따라다니던 너를 목장에서 데려다가,\n내 백성 이스라엘의 영도자로 세웠다.\n9 또한 네가 어디를 가든지 너와 함께 있으면서,\n모든 원수를 네 앞에서 물리쳤다.\n나는 너의 이름을 세상 위인들의 이름처럼 위대하게 만들어 주었다.\n10 나는 내 백성 이스라엘을 위하여 한곳을 정하고,\n그곳에 그들을 심어 그들이 제자리에서 살게 하겠다.\n그러면 이스라엘은 더 이상 불안해하지 않아도 되고,\n다시는 전처럼, 불의한 자들이 그들을 괴롭히지 않을 것이다.\n11 곧 내가 나의 백성 이스라엘에게 판관을 임명하던 때부터 해 온 것처럼,\n나는 너를 모든 원수에게서 평온하게 해 주겠다.\n더 나아가 주님이 너에게 한 집안을 일으켜 주리라고 선언한다.\n12 너의 날수가 다 차서 조상들과 함께 잠들게 될 때,\n네 몸에서 나와 네 뒤를 이을 후손을 내가 일으켜 세우고,\n그의 나라를 튼튼하게 하겠다.\n14 나는 그의 아버지가 되고 그는 나의 아들이 될 것이다.\n16 너의 집안과 나라가 네 앞에서 영원히 굳건해지고,\n네 왕좌가 영원히 튼튼하게 될 것이다.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 89(88),2-3.4-5.27과 29(◎ 2ㄱ 참조)\n◎ 주님, 당신 자애를 영원히 노래하오리다.\n○ 주님의 자애를 영원히 노래하오리다. 제 입은 당신의 진실을 대대로 전하오리다. 제가 아뢰나이다. “주님은 자애를 영원히 세우시고, 진실을 하늘에 굳히셨나이다.” ◎\n○ 나는 내가 뽑은 이와 계약을 맺고, 나의 종 다윗에게 맹세하였노라. “영원토록 네 후손을 굳건히 하고, 대대로 이어 갈 네 왕좌를 세우노라.” ◎\n○ 그는 나를 부르리라. “당신은 저의 아버지, 저의 하느님, 제 구원의 바위.” 영원토록 그에게 내 자애를 베풀리니, 그와 맺은 내 계약 변함이 없으리라. ◎","복음 환호송":"◎ 알렐루야.\n○ 떠오르는 별, 영원한 빛, 정의의 태양이신 주님, 어서 오소서. 어둠 속 죽음의 그늘에 앉아 있는 이들을 비추소서.\n◎ 알렐루야.","복음":"<높은 곳에서 별이 우리를 찾아오셨다.>\n✠ 루카가 전한 거룩한 복음입니다.\n1,67-79\n그때에 요한의 67 아버지 즈카르야는 성령으로 가득 차 이렇게 예언하였다.\n68 “주 이스라엘의 하느님께서는 찬미받으소서.\n그분께서는 당신 백성을 찾아와 속량하시고\n69 당신 종 다윗 집안에서 우리를 위하여 힘센 구원자를 일으키셨습니다.\n70 당신의 거룩한 예언자들의 입을 통하여 예로부터 말씀하신 대로\n71 우리 원수들에게서, 우리를 미워하는 모든 자의 손에서\n우리를 구원하시려는 것입니다.\n72 그분께서는 우리 조상들에게 자비를 베푸시고\n당신의 거룩한 계약을 기억하셨습니다.\n73 이 계약은 우리 조상 아브라함에게 하신 맹세로\n74 원수들 손에서 구원된 우리가 두려움 없이\n75 한평생 당신 앞에서 거룩하고 의롭게 당신을 섬기도록 해 주시려는 것입니다.\n76 아기야, 너는 지극히 높으신 분의 예언자라 불리고\n주님을 앞서 가 그분의 길을 준비하리니\n77 죄를 용서받아 구원됨을 주님의 백성에게 깨우쳐 주려는 것이다.\n78 우리 하느님의 크신 자비로 높은 곳에서 별이 우리를 찾아오시어\n79 어둠과 죽음의 그늘에 앉아 있는 이들을 비추시고\n우리 발을 평화의 길로 이끌어 주실 것이다.”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","예물 기도":"주님,\n주님께 봉헌하는 이 예물을 인자로이 받아들이시어\n이 거룩한 제물을 받아 모시는 저희가 죄에서 해방되고\n깨끗한 마음으로 성자의 영광스러운 오심을 기다리게 하소서.\n우리 주 …….","감사송":"<대림 감사송 2 : 그리스도를 기다리는 두 가지 의미>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n우리 주 그리스도를 통하여 언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n모든 예언자는 그리스도께서 오실 것을 미리 알려 주었고\n동정 성모님께서는 극진한 사랑으로 그분을 품어 주셨으며\n요한은 오실 분을 미리 알려 주고\n이미 와 계신 그분을 가리켜 주었나이다.\n그리스도께서는 저희가 깨어 기도하고 기쁘게 찬미의 노래를 부르면서\n성탄 축제를 준비하고 기다리게 하셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와 하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"루카 1,68\n찬미받으소서, 주 이스라엘의 하느님. 주님은 당신 백성을 찾아와 속량하셨네.","영성체 후 묵상":"<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님,\n저희가 놀라운 이 성사로 생기를 되찾고 비오니\n마땅히 경배하올 성자의 성탄 축일을 정성껏 준비하여\n기쁜 마음으로 영원한 선물을 받게 하소서.\n성자께서는 영원히 …….","오늘의 묵상":"미사에서 성찬 전례 때 바치는 감사 기도에는 네 가지 양식이 있습니다. 본당에서는 비교적 짧으면서도 성찬례의 핵심을 담고 있는 제2양식을 자주 바치지만, 전례에 따라 제4양식을 바치기도 합니다. 제4양식은 창조에서부터 이어지는 하느님의 구원 역사를 잘 보여 줄 뿐만 아니라 삼위일체적 구조로 구원의 신비를 아름답게 보여 주기 때문입니다.\n오늘 복음에서 우리는 즈카르야의 노래를 듣습니다. 이 찬가도 하느님의 구원 역사를 되새기며 삼위일체 하느님의 활동을 묵상하게 합니다. 입이 열려 말을 할 수 있게 된 즈카르야의 첫마디는 하느님을 향한 찬미였습니다. 그는 아브라함과 맺으신 계약과 다윗 집안에 하신 약속 그리고 예언자들을 통하여 끊임없이 이어 오신 하느님의 구원 계획을 이야기하며, 인간에게 먼저 다가오시는 하느님을 찬미합니다. 이어 새로운 시대를 맞이하며 자신의 아들이 주님의 길을 준비하고, 장차 오실 분께서 구원과 평화를 이루실 것임을 예언합니다.\n성령으로 가득 찬 즈카르야의 찬가는 약속에 충실하신 성부께서 성자를 세상에 보내시고, 성령께서 그 구원의 신비를 드러내시는 모습을 보여 줍니다. 이렇게 삼위일체 하느님께서는 인류의 구원을 이루시며 우리에게 참된 생명과 새로운 희망을 주시는 분이십니다.\n교회는 성무일도 아침 기도마다 즈카르야의 노래를 바칩니다. 어두운 밤이 지나고 새로운 하루를 시작하듯, 예수 그리스도의 강생으로 새로운 시대를 맞이한 교회의 정체성이 이 찬가에 잘 드러나기 때문입니다. 우리가 모두 구원 역사의 산 증인인 교회의 한 지체임을 기억하며, 약속을 끝까지 이루시는 삼위일체 하느님을 날마다 찬미하며 살아갑시다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},{"l":"성탄 전야 미사","s":{"오늘 전례":"참으로 기쁜 밤입니다. 오늘 우리에게 한 아기가 태어났습니다. 모든 사람에게 구원을 가져다주는 하느님의 은총이 나타났습니다. 위대하신 하느님이시며 구원자이신 예수 그리스도의 영광이 나타났습니다. 하늘의 군대와 함께 기뻐하며 노래합시다. “지극히 높은 곳에서는 하느님께 영광, 땅에서는 그분 마음에 드는 사람들에게 평화!”","입당송":"탈출 16,6-7 참조\n오늘 너희는 우리를 구원하러 오시는 분이 주님이심을 알게 되리라. 아침이 되면 주님의 영광을 보리라.","본기도":"하느님, 구원을 기다리는 저희에게 해마다 기쁨을 주시니\n저희를 구원하러 오시는 성자를 기꺼이 맞이하여\n심판하러 오실 우리 주 예수 그리스도를 두려움 없이 뵈옵게 하소서.\n성자께서는 성부와 …….","제1독서":"<주님께서 너를 마음에 들어 하셨다.>\n▥ 이사야서의 말씀입니다.\n62,1-5\n1 시온 때문에 나는 잠잠히 있을 수가 없고\n예루살렘 때문에 나는 가만히 있을 수가 없다,\n그의 의로움이 빛처럼 드러나고 그의 구원이 횃불처럼 타오를 때까지.\n2 그러면 민족들이 너의 의로움을, 임금들이 너의 영광을 보리라.\n너는 주님께서 친히 지어 주실 새로운 이름으로 불리리라.\n3 너는 주님의 손에 들려 있는 화려한 면류관이 되고\n너의 하느님 손바닥에 놓여 있는 왕관이 되리라.\n4 다시는 네가 ‘소박맞은 여인’이라,\n다시는 네 땅이 ‘버림받은 여인’이라 일컬어지지 않으리라.\n오히려 너는 ‘내 마음에 드는 여인’이라,\n너의 땅은 ‘혼인한 여인’이라 불리리니 주님께서 너를 마음에 들어 하시고\n네 땅을 아내로 맞아들이실 것이기 때문이다.\n5 정녕 총각이 처녀와 혼인하듯 너를 지으신 분께서 너와 혼인하고\n신랑이 신부로 말미암아 기뻐하듯\n너의 하느님께서는 너로 말미암아 기뻐하시리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 89(88),4-5.16-17.27과 29(◎ 2ㄱ)\n◎ 주님의 자애를 영원히 노래하오리다.\n○ 나는 내가 뽑은 이와 계약을 맺고, 나의 종 다윗에게 맹세하였노라. “영원토록 네 후손을 굳건히 하고, 대대로 이어 갈 네 왕좌를 세우노라.” ◎\n○ 행복하여라, 축제의 기쁨을 아는 백성! 주님, 그들은 당신 얼굴 그 빛 속을 걷나이다. 그들은 날마다 당신 이름으로 기뻐하고, 당신 정의로 힘차게 일어서나이다. ◎\n○ 그는 나를 부르리라. “당신은 저의 아버지, 저의 하느님, 제 구원의 바위.” 영원토록 그에게 내 자애를 베풀리니, 그와 맺은 내 계약 변함이 없으리라. ◎","제2독서":"<다윗의 후손이신 그리스도에 대한 바오로의 증언>\n▥ 사도행전의 말씀입니다.\n13,16-17.22-25\n피시디아의 안티오키아에 간 바오로는 회당에서 16 일어나\n조용히 하라고 손짓한 다음 이렇게 말하였다.\n“이스라엘인 여러분, 그리고 하느님을 경외하는 여러분,\n내 말을 들어 보십시오.\n17 이 이스라엘 백성의 하느님께서는 우리 조상들을 선택하시고,\n이집트 땅에서 나그네살이할 때에 그들을 큰 백성으로 키워 주셨으며,\n권능의 팔로 그들을 거기에서 데리고 나오셨습니다.\n22 그러고 나서 그들에게 다윗을 임금으로 세우셨습니다.\n그에 대해서는 ‘내가 이사이의 아들 다윗을 찾아냈으니,\n그는 내 마음에 드는 사람으로 나의 뜻을 모두 실천할 것이다.’ 하고\n증언해 주셨습니다.\n23 이 다윗의 후손 가운데에서,\n하느님께서는 약속하신 대로 예수님을 구원자로 이스라엘에 보내셨습니다.\n24 이분께서 오시기 전에 요한이 이스라엘 온 백성에게\n회개의 세례를 미리 선포하였습니다.\n25 요한은 사명을 다 마칠 무렵 이렇게 말하였습니다.\n‘너희는 내가 누구라고 생각하느냐? 나는 그분이 아니다.\n그분께서는 내 뒤에 오시는데,\n나는 그분의 신발 끈을 풀어 드리기에도 합당하지 않다.’”\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"◎ 알렐루야.\n○ 내일 세상의 죄악이 사라지고 구세주 우리를 다스리시리라.\n◎ 알렐루야.","복음":"<다윗의 자손이신 예수 그리스도의 족보>\n✠ 마태오가 전한 거룩한 복음입니다.\n1,1-25\n1 다윗의 자손이시며 아브라함의 자손이신 예수 그리스도의 족보.\n2 아브라함은 이사악을 낳고 이사악은 야곱을 낳았으며\n야곱은 유다와 그 형제들을 낳았다.\n3 유다는 타마르에게서 페레츠와 제라를 낳고\n페레츠는 헤츠론을 낳았으며 헤츠론은 람을 낳았다.\n4 람은 암미나답을 낳고 암미나답은 나흐손을 낳았으며 나흐손은 살몬을 낳았다.\n5 살몬은 라합에게서 보아즈를 낳고 보아즈는 룻에게서 오벳을 낳았다.\n오벳은 이사이를 낳고 6 이사이는 다윗 임금을 낳았다.\n다윗은 우리야의 아내에게서 솔로몬을 낳고,\n7 솔로몬은 르하브암을 낳았으며 르하브암은 아비야를 낳고\n아비야는 아삽을 낳았다.\n8 아삽은 여호사팟을 낳고 여호사팟은 여호람을 낳았으며 여호람은 우찌야를 낳았다.\n9 우찌야는 요탐을 낳고 요탐은 아하즈를 낳았으며 아하즈는 히즈키야를 낳았다.\n10 히즈키야는 므나쎄를 낳고 므나쎄는 아몬을 낳았으며 아몬은 요시야를 낳았다.\n11 요시야는 바빌론 유배 때에 여호야킨과 그 동생들을 낳았다.\n12 바빌론 유배 뒤에 여호야킨은 스알티엘을 낳고 스알티엘은 즈루빠벨을 낳았다.\n13 즈루빠벨은 아비훗을 낳고 아비훗은 엘야킴을 낳았으며 엘야킴은 아조르를 낳았다.\n14 아조르는 차독을 낳고 차독은 아킴을 낳았으며 아킴은 엘리웃을 낳았다.\n15 엘리웃은 엘아자르를 낳고 엘아자르는 마탄을 낳았으며 마탄은 야곱을 낳았다.\n16 야곱은 마리아의 남편 요셉을 낳았는데,\n마리아에게서 그리스도라고 불리는 예수님께서 태어나셨다.\n17 그리하여 이 모든 세대의 수는 아브라함부터 다윗까지가 십사 대이고,\n다윗부터 바빌론 유배까지가 십사 대이며,\n바빌론 유배부터 그리스도까지가 십사 대이다.\n18 예수 그리스도께서는 이렇게 탄생하셨다.\n그분의 어머니 마리아가 요셉과 약혼하였는데,\n그들이 같이 살기 전에 마리아가 성령으로 말미암아 잉태한 사실이 드러났다.\n19 마리아의 남편 요셉은 의로운 사람이었고\n또 마리아의 일을 세상에 드러내고 싶지 않았으므로,\n남모르게 마리아와 파혼하기로 작정하였다.\n20 요셉이 그렇게 하기로 생각을 굳혔을 때, 꿈에 주님의 천사가 나타나 말하였다.\n“다윗의 자손 요셉아, 두려워하지 말고 마리아를 아내로 맞아들여라.\n그 몸에 잉태된 아기는 성령으로 말미암은 것이다.\n21 마리아가 아들을 낳으리니 그 이름을 예수라고 하여라.\n그분께서 당신 백성을 죄에서 구원하실 것이다.”\n22 주님께서 예언자를 통하여 하신 말씀이 이루어지려고 이 모든 일이 일어났다.\n곧 23 “보아라, 동정녀가 잉태하여 아들을 낳으리니\n그 이름을 임마누엘이라고 하리라.” 하신 말씀이다.\n임마누엘은 번역하면 ‘하느님께서 우리와 함께 계시다.’는 뜻이다.\n24 잠에서 깨어난 요셉은 주님의 천사가 명령한 대로 아내를 맞아들였다.\n25 그러나 아내가 아들을 낳을 때까지 잠자리를 같이하지 않았다.\n그리고 아들의 이름을 예수라고 하였다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.\n<또는>\n<마리아가 아들을 낳으리니 그 이름을 예수라고 하여라.>\n✠ 마태오가 전한 거룩한 복음입니다.\n1,18-25\n18 예수 그리스도께서는 이렇게 탄생하셨다.\n그분의 어머니 마리아가 요셉과 약혼하였는데,\n그들이 같이 살기 전에 마리아가 성령으로 말미암아 잉태한 사실이 드러났다.\n19 마리아의 남편 요셉은 의로운 사람이었고\n또 마리아의 일을 세상에 드러내고 싶지 않았으므로,\n남모르게 마리아와 파혼하기로 작정하였다.\n20 요셉이 그렇게 하기로 생각을 굳혔을 때, 꿈에 주님의 천사가 나타나 말하였다.\n“다윗의 자손 요셉아, 두려워하지 말고 마리아를 아내로 맞아들여라.\n그 몸에 잉태된 아기는 성령으로 말미암은 것이다.\n21 마리아가 아들을 낳으리니 그 이름을 예수라고 하여라.\n그분께서 당신 백성을 죄에서 구원하실 것이다.”\n22 주님께서 예언자를 통하여 하신 말씀이 이루어지려고 이 모든 일이 일어났다.\n곧 23 “보아라, 동정녀가 잉태하여 아들을 낳으리니\n그 이름을 임마누엘이라고 하리라.” 하신 말씀이다.\n임마누엘은 번역하면 ‘하느님께서 우리와 함께 계시다.’는 뜻이다.\n24 잠에서 깨어난 요셉은 주님의 천사가 명령한 대로 아내를 맞아들였다.\n25 그러나 아내가 아들을 낳을 때까지 잠자리를 같이하지 않았다.\n그리고 아들의 이름을 예수라고 하였다.\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n빛이신 주님, 성자의 탄생을 경축하는 교회를 비추시어, 교회가 모든 사람을 섬기고, 많은 이를 구원하러 오신 우리 주 예수 그리스도를 충실히 본받도록 이끌어 주소서.\n\n2. 우리나라를 위하여 기도합시다.\n\n사랑이신 주님, 이 나라를 주님의 사랑으로 이끌어 주시어, 이웃끼리 서로 불신하고 경쟁하기보다 소통하고 배려하며 함께하는 가운데 행복을 누리게 하소서.\n\n3. 난민을 위하여 기도합시다.\n\n보호자이신 주님, 전쟁이나 분쟁으로 삶의 터전을 떠나온 이들을 살피시어, 마음의 평화를 찾고, 사회와 이웃의 환대 속에서 하루빨리 평온한 일상으로 돌아가도록 도와주소서.\n\n4. 지역 사회를 위하여 기도합시다.\n\n구원의 주님, 아기 예수님의 탄생을 맞는 저희 지역 사회를 굽어살피시어, 차분한 마음으로 성탄의 참뜻을 묵상하는 가운데 주님께서 주신 참사랑을 실천하게 하소서.","예물 기도":"주님,\n성자의 탄생으로 저희 구원이 시작되었으니\n저희가 더욱 정성스러운 제사로 이 성대한 축제를 맞이하게 하소서.\n우리 주 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"이사 40,5 참조\n주님의 영광이 드러나리니, 모든 사람이 우리 하느님의 구원을 보리라.","영성체 후 묵상":"“지극히 높은 곳에서는 하느님께 영광, 땅에서는 그분 마음에 드는 사람들에게 평화!” 아기 예수님의 탄생은 하늘에서도 땅에서도 축복이 되는 커다란 사건입니다. 그분께서 세상에 오심으로써 하늘과 땅이 연결되고 지상에 사는 우리도 천상의 양식을 받아 모시며 하늘로 이어지는 길을 걷게 됩니다. 우리 안에 오신 주님을 찬미하며 이 거룩한 밤을 보내야겠습니다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주님, 천상 양식을 먹고 마신 저희가\n성자의 탄생을 기리며 새로운 힘을 얻게 하소서.\n성자께서는 영원히 …….","오늘의 묵상":"신앙생활을 하는 사람이나 그렇지 않은 사람이나 겉으로 보이는 모습은 크게 다르지 않습니다. 그러나 세상을 바라보는 시각에는 분명히 다른 점이 있습니다. 믿음이 없는 이들은 삶에서 일어나는 사건을 우연으로 여기지만 신앙인은 그 안에서 하느님의 섭리를 발견합니다. 우리와 함께하시는 하느님을 믿기 때문입니다.\n“보아라, 동정녀가 잉태하여 아들을 낳으리니 그 이름을 임마누엘이라고 하리라”(마태 1,23). 천사는 아기의 이름을 통하여 하느님께서 우리와 함께 계심을 일깨워 줍니다. 그리고 예수님의 족보는 이스라엘의 역사 안에서 함께하신 하느님을 묵상하게 하며, 하느님께서 구원의 약속에 얼마나 성실하신 분이신지를 보여 줍니다.\n오늘 복음의 족보에는 남성들만이 아니라 다섯 명의 여인들이 나옵니다. 타마르와 우리야의 아내 밧세바는 인간의 죄와 나약함을 떠올리게 하고, 라합과 룻은 이방인이었습니다. 성령으로 말미암은 성모님의 잉태도 사람들의 눈에는 평범한 사건이 아니었습니다. 그럼에도 하느님께서는 이들을 통하여 구원의 역사를 이어 가셨고, 이는 마침내 예수님의 탄생으로 이어졌습니다. 이러한 역사는 구원이 죄인과 이방인을 포함하여 모든 사람에게 열려 있음을 깨닫게 합니다.\n이처럼 예수님의 탄생은 모든 이를 위한 선물이며, 구원의 약속에 성실하신 하느님의 사랑을 더욱 가까이 체험하는 시간입니다. 우리를 홀로 내버려두시지 않고 우리와 함께하시고자 우리 삶 안으로 들어오시는 아기 예수님을 기쁘게 맞이합시다. “보라, 내가 세상 끝 날까지 언제나 너희와 함께 있겠다”(28,20).\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}}]},"20261225":{"d":"2026년 12월 25일 금요일","c":"백","t":"주님 성탄 대축일","o":[],"n":"","g":"대영광송 · 신경","i":"<주님 성탄 대축일에 모든 사제는 세 대의 미사를 거행하거나 공동 집전할 수 있다. 다만 제때에 그 미사를 드려야 한다.>","m":[{"l":"밤 미사","s":{"오늘 전례":"참으로 기쁜 밤입니다. 오늘 우리에게 한 아기가 태어났습니다. 모든 사람에게 구원을 가져다주는 하느님의 은총이 나타났습니다. 위대하신 하느님이시며 구원자이신 예수 그리스도의 영광이 나타났습니다. 하늘의 군대와 함께 기뻐하며 노래합시다. “지극히 높은 곳에서는 하느님께 영광, 땅에서는 그분 마음에 드는 사람들에게 평화!”","입당송":"시편 2,7\n주님이 나에게 말씀하셨다. 너는 내 아들. 내가 오늘 너를 낳았노라.\n<또는>\n주님 안에서 다 함께 기뻐하세. 우리 구세주 세상에 태어나셨네. 오늘 하늘에서 참평화 우리에게 내리셨네.","본기도":"하느님,\n참된 빛이신 그리스도의 탄생으로 이 거룩한 밤을 밝혀 주셨으니\n저희가 세상에서 이 빛의 신비를 깨닫고\n천국에서 그 빛의 기쁨을 누리게 하소서.\n성자께서는 성부와 …….","제1독서":"<우리에게 한 아들이 주어졌습니다.>\n▥ 이사야서의 말씀입니다.\n9,1-6\n1 어둠 속을 걷던 백성이 큰 빛을 봅니다.\n암흑의 땅에 사는 이들에게 빛이 비칩니다.\n2 당신께서는 즐거움을 많게 하시고 기쁨을 크게 하십니다.\n사람들이 당신 앞에서 기뻐합니다,\n수확할 때 기뻐하듯 전리품을 나눌 때 즐거워하듯.\n3 정녕 당신께서는 그들이 짊어진 멍에와 어깨에 멘 장대와 부역 감독관의 몽둥이를\n미디안을 치신 그날처럼 부수십니다.\n4 땅을 흔들며 저벅거리는 군화도 피 속에 뒹군 군복도\n모조리 화염에 싸여 불꽃의 먹이가 됩니다.\n5 우리에게 한 아기가 태어났고 우리에게 한 아들이 주어졌습니다.\n왕권이 그의 어깨에 놓이고 그의 이름은 놀라운 경륜가,\n용맹한 하느님, 영원한 아버지, 평화의 군왕이라 불리리이다.\n6 다윗의 왕좌와 그의 왕국 위에 놓인 그 왕권은 강대하고\n그 평화는 끝이 없으리이다.\n그는 이제부터 영원까지 공정과 정의로 그 왕국을 굳게 세우고 지켜 가리이다.\n만군의 주님의 열정이 이를 이루시리이다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 96(95),1-2ㄱ.2ㄴ-3.11-12.13(◎ 루카 2,11 참조)\n◎ 오늘 우리 구원자 주 그리스도 태어나셨다.\n○ 주님께 노래하여라, 새로운 노래. 주님께 노래하여라, 온 세상아. 주님께 노래하여라, 그 이름 찬미하여라. ◎\n○ 나날이 선포하여라, 그분의 구원을. 전하여라, 겨레들에게 그분의 영광을, 모든 민족들에게 그분의 기적을. ◎\n○ 하늘은 기뻐하고 땅은 즐거워하여라. 바다와 그 안에 가득 찬 것들은 소리쳐라. 들과 그 안에 있는 것도 모두 기뻐 뛰고, 숲 속의 나무들도 모두 환호하여라. ◎\n○ 그분이 오신다. 주님 앞에서 환호하여라. 세상을 다스리러 그분이 오신다. 그분은 누리를 의롭게, 민족들을 진리로 다스리신다. ◎","제2독서":"<모든 사람에게 하느님의 은총이 나타났습니다.>\n▥ 사도 바오로의 티토서 말씀입니다.\n2,11-14\n사랑하는 그대여, 11 모든 사람에게 구원을 가져다주는\n하느님의 은총이 나타났습니다.\n12 이 은총이 우리를 교육하여, 불경함과 속된 욕망을 버리고\n현세에서 신중하고 의롭고 경건하게 살도록 해 줍니다.\n13 복된 희망이 이루어지기를, 우리의 위대하신 하느님이시며 구원자이신\n예수 그리스도의 영광이 나타나기를 기다리는 우리를\n그렇게 살도록 해 줍니다.\n14 그리스도께서는 우리를 위하여 당신 자신을 내어 주시어,\n우리를 모든 불의에서 해방하시고 또 깨끗하게 하시며,\n선행에 열성을 기울이는 당신 소유의 백성이 되게 하셨습니다.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","복음 환호송":"루카 2,10-11 참조\n◎ 알렐루야.\n○ 큰 기쁨이 될 소식을 너희에게 전하노라. 오늘 구원자 주 그리스도 태어나셨다.\n◎ 알렐루야.","복음":"<오늘 너희를 위하여 구원자가 태어나셨다.>\n✠ 루카가 전한 거룩한 복음입니다.\n2,1-14\n1 그 무렵 아우구스투스 황제에게서 칙령이 내려,\n온 세상이 호적 등록을 하게 되었다.\n2 이 첫 번째 호적 등록은 퀴리니우스가 시리아 총독으로 있을 때에 실시되었다.\n3 그래서 모두 호적 등록을 하러 저마다 자기 본향으로 갔다.\n4 요셉도 갈릴래아 지방 나자렛 고을을 떠나\n유다 지방, 베들레헴이라고 불리는 다윗 고을로 올라갔다.\n그가 다윗 집안의 자손이었기 때문이다.\n5 그는 자기와 약혼한 마리아와 함께 호적 등록을 하러 갔는데,\n마리아는 임신 중이었다.\n6 그들이 거기에 머무르는 동안 마리아는 해산 날이 되어, 7 첫아들을 낳았다.\n그들은 아기를 포대기에 싸서 구유에 뉘었다.\n여관에는 그들이 들어갈 자리가 없었던 것이다.\n8 그 고장에는 들에 살면서 밤에도 양 떼를 지키는 목자들이 있었다.\n9 그런데 주님의 천사가 다가오고 주님의 영광이 그 목자들의 둘레를 비추었다.\n그들은 몹시 두려워하였다.\n10 그러자 천사가 그들에게 말하였다. “두려워하지 마라.\n보라, 나는 온 백성에게 큰 기쁨이 될 소식을 너희에게 전한다.\n11 오늘 너희를 위하여 다윗 고을에서 구원자가 태어나셨으니,\n주 그리스도이시다.\n12 너희는 포대기에 싸여 구유에 누워 있는 아기를 보게 될 터인데,\n그것이 너희를 위한 표징이다.”\n13 그때에 갑자기 그 천사 곁에 수많은 하늘의 군대가 나타나\n하느님을 이렇게 찬미하였다.\n14 “지극히 높은 곳에서는 하느님께 영광\n땅에서는 그분 마음에 드는 사람들에게 평화!”\n주님의 말씀입니다.\n◎ 그리스도님, 찬미합니다.","보편 지향 기도":"<각 공동체 스스로 준비한 기도를 바치는 것이 바람직하다.>\n\n1. 교회를 위하여 기도합시다.\n\n빛이신 주님, 성자의 탄생을 경축하는 교회를 비추시어, 교회가 모든 사람을 섬기고, 많은 이를 구원하러 오신 우리 주 예수 그리스도를 충실히 본받도록 이끌어 주소서.\n\n2. 우리나라를 위하여 기도합시다.\n\n사랑이신 주님, 이 나라를 주님의 사랑으로 이끌어 주시어, 이웃끼리 서로 불신하고 경쟁하기보다 소통하고 배려하며 함께하는 가운데 행복을 누리게 하소서.\n\n3. 난민을 위하여 기도합시다.\n\n보호자이신 주님, 전쟁이나 분쟁으로 삶의 터전을 떠나온 이들을 살피시어, 마음의 평화를 찾고, 사회와 이웃의 환대 속에서 하루빨리 평온한 일상으로 돌아가도록 도와주소서.\n\n4. 지역 사회를 위하여 기도합시다.\n\n구원의 주님, 아기 예수님의 탄생을 맞는 저희 지역 사회를 굽어살피시어, 차분한 마음으로 성탄의 참뜻을 묵상하는 가운데 주님께서 주신 참사랑을 실천하게 하소서.","예물 기도":"주님,\n오늘 인간의 본성이 그리스도 안에서 주님과 결합되었으니\n이 축제의 제물을 기꺼이 받아들이시어\n저희가 이 거룩한 교환의 신비로 그리스도의 모습을 닮게 하소서.\n성자께서는 영원히 …….","감사송":"<주님 성탄 감사송 1 : 빛이신 그리스도>\n거룩하신 아버지, 전능하시고 영원하신 주 하느님,\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 사람이 되신 말씀의 신비로\n저희 마음의 눈을 새롭게 밝혀 주시어\n하느님을 눈으로 뵙고 알아서\n보이지 않는 하느님을 사랑하도록\n저희 마음을 이끌어 주셨나이다.\n그러므로 천사와 대천사와 좌품 주품 천사와\n하늘의 모든 군대와 함께\n저희도 주님의 영광을 찬미하며 끝없이 노래하나이다.","영성체송":"요한 1,14\n말씀이 사람이 되셨네. 우리는 그분의 영광을 보았네.","영성체 후 묵상":"“지극히 높은 곳에서는 하느님께 영광, 땅에서는 그분 마음에 드는 사람들에게 평화!” 아기 예수님의 탄생은 하늘에서도 땅에서도 축복이 되는 커다란 사건입니다. 그분께서 세상에 오심으로써 하늘과 땅이 연결되고 지상에 사는 우리도 천상의 양식을 받아 모시며 하늘로 이어지는 길을 걷게 됩니다. 우리 안에 오신 주님을 찬미하며 이 거룩한 밤을 보내야겠습니다.\n\n<그리스도와 일치를 이루는 가운데 잠시 마음속으로 기도합시다.>","영성체 후 기도":"주 하느님,\n우리 구세주의 성탄을 기쁘게 지내오니\n저희가 성자의 가르침대로 현세를 거룩히 살아\n영원히 주님과 함께 사는 행복에 이르게 하소서.\n성자께서는 영원히 …….","오늘의 묵상":"정성스럽게 마련한 구유에 누워 계신 아기 예수님을 바라보며 어떤 생각을 하나요? 어두운 밤을 밝히는 환한 조명 아래에서 기쁘고 설레는 마음으로 성탄 인사를 나누는 것이 오늘 우리의 모습일 것입니다. 그러나 지금 우리가 맞이하는 성탄과 달리, 예수님께서 이 세상에 오신 그날 밤은 그렇게 화려하지도 떠들썩하지도 않았을 것입니다.\n“여관에는 그들이 들어갈 자리가 없었던 것이다”(루카 2,7). 하느님께서 사람이 되시어 이 세상에 오셨지만, 사람들은 하느님의 아드님을 알아 뵐 눈이 없었고, 예수님을 맞이할 준비도 되어 있지 않았습니다. 결국 성모님과 요셉은 갓 태어난 아기를 짐승의 먹이를 담는 구유에 눕힐 수밖에 없었습니다.\n본디 구유는 우리가 성탄 시기에 꾸미는 구유처럼 깨끗하지도 아름답지도 않습니다. 오히려 지저분하고 냄새나는 자리입니다. 예수님께서 그러한 구유에 누우셨음은 그분께서 가장 낮은 자리로 오셨음을, 가장 가난한 이들과 함께하시려고 오셨음을 보여 줍니다. 또한 예수님께서는 짐승의 먹이를 담는 곳에 자리하심으로써, 먹히고자 이 세상에 오셨음을 미리 보여 주십니다.\n“그것이 너희를 위한 표징이다”(2,12). 이 작은 아기가 우리의 메시아이십니다. 참된 빛이신 예수님께서는 이렇게 가난하고 작은 모습으로 세상의 어둠을 밝히시러 오셨습니다. 그렇지만 예수님의 방식을 알아볼 수 있는 눈이 없다면 예수님께 자리를 내드리지 못할 것입니다. 성탄의 기쁨을 누리면서도 우리의 눈길을 더욱 아기 예수님께 향합시다. 예수님 앞에 머무르며 참으로 고요한 밤, 거룩한 밤이 되기를 바랍니다.\n\n(김인환 히폴리토 신부)\n\n매일미사 © 한국천주교중앙협의회"}},{"l":"새벽 미사","s":{"오늘 전례":"오늘은 주님 성탄 대축일입니다. 주님께서 우리에게 오셨습니다. 우리 구원자이신 하느님의 호의와 인간애가 드러났습니다. 천사들이 일러 준 대로 “베들레헴으로 가서 주님께서 우리에게 알려 주신 그 일, 그곳에서 일어난 일을 봅시다.” 하고 달려간 목자들처럼 기뻐하며 이 미사에 참여합시다.","입당송":"이사 9,1.5; 루카 1,33 참조\n오늘 우리 위에 빛이 비치고, 주님이 우리에게 태어나셨네. 주님은 놀라운 하느님, 평화의 임금님, 영원한 아버지라 불리시리니, 그분의 나라는 끝이 없으리라.","본기도":"전능하신 하느님,\n사람이 되신 말씀의 새로운 빛을 받고 간절히 바라오니\n저희 마음에 가득 찬 믿음의 빛이 행실에서도 빛나게 하소서.\n성부와 성령과 …….","제1독서":"<보라, 너의 구원이 다가온다.>\n▥ 이사야서의 말씀입니다.\n62,11-12\n11 보라, 주님께서 땅끝까지 선포하셨다. 딸 시온에게 말하여라.\n“보라, 너의 구원이 다가온다.\n보라, 그분의 상급이 그분과 함께 오고 그분의 보상이 그분 앞에 서서 온다.”\n12 사람들이 그들을 ‘거룩한 백성’, ‘주님의 구원을 받은 이들’이라 부르리라.\n그리고 너는 ‘그리워 찾는 도성’, ‘버림받지 않은 도성’이라 불리리라.\n주님의 말씀입니다.\n◎ 하느님, 감사합니다.","화답송":"시편 97(96),1과 6.11-12\n◎ 오늘 우리 위에 빛이 비치고, 주님이 우리에게 태어나셨네.\n○ 주님은 임금이시다. 땅은 즐거워하고, 수많은 섬들도 기뻐하여라. 하늘은 그분 의로움을 널리 알리고, 만백성 그분 영광을 우러러보네. ◎\n○ 의인에게는 빛이 내리고, 마음 바른 이에게는 기쁨이 쏟아진다. 의인들아, 주님 안에서 기뻐하여라. 거룩하신 그 이름 찬송하여라. ◎","제2독서":"<하느님께서는 당신 자비에 따라 우리를 구원해 주셨습니
