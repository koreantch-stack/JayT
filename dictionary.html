<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>국어사전 테스트</title>

<style>
body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.box {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
}

h1 {
    margin-top: 0;
}

input {
    width: 70%;
    padding: 14px;
    font-size: 16px;
}

button {
    padding: 14px 20px;
    font-size: 16px;
    cursor: pointer;
}

#result {
    margin-top: 25px;
    line-height: 1.8;
}
</style>

</head>

<body>

<div class="box">

<h1>📖 표준국어대사전</h1>

<input
    id="word"
    type="text"
    placeholder="단어를 입력하세요"
>

<button onclick="searchWord()">
검색
</button>

<div id="result">
검색 결과가 여기에 표시됩니다.
</div>

</div>


<script>

const API_KEY =
"F189E2B227CC59D32D9DB4E8AD8DF289";

const API_URL =
"https://stdict.korean.go.kr/api/search.do";


async function searchWord() {

    const word =
        document.getElementById("word").value.trim();

    const result =
        document.getElementById("result");


    if (!word) {

        result.innerHTML =
            "검색할 단어를 입력하세요.";

        return;

    }


    result.innerHTML =
        "검색 중입니다...";


    const url =
        API_URL
        + "?key="
        + encodeURIComponent(API_KEY)
        + "&q="
        + encodeURIComponent(word)
        + "&req_type=json"
        + "&start=1"
        + "&num=10";


    try {

        const response =
            await fetch(url);


        const text =
            await response.text();


        console.log(text);


        result.innerHTML = `
            <h3>API 응답</h3>
            <pre style="
                white-space:pre-wrap;
                word-break:break-all;
            ">${escapeHTML(text)}</pre>
        `;


    } catch(error) {

        result.innerHTML = `
            <h3>오류</h3>
            <p>${escapeHTML(error.message)}</p>
        `;

    }

}


function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
