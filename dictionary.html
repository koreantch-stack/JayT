<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>표준국어대사전</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6fb;
    color: #172033;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
}

.container {
    width: min(800px, 94%);
    margin: 0 auto;
    padding: 30px 0 50px;
}

.header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    border-radius: 22px;
    padding: 30px 25px;
    box-shadow: 0 8px 25px rgba(37, 99, 235, 0.2);
}

.header h1 {
    margin: 0;
    font-size: 30px;
}

.header p {
    margin: 8px 0 22px;
    font-size: 14px;
    color: #dbeafe;
}

.search {
    display: flex;
    gap: 8px;
}

.search input {
    flex: 1;
    min-width: 0;
    border: none;
    border-radius: 13px;
    padding: 15px;
    font-size: 17px;
    outline: none;
}

.search button {
    border: none;
    border-radius: 13px;
    padding: 0 22px;
    background: #111827;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.status {
    margin-top: 12px;
    font-size: 13px;
    color: #dbeafe;
    min-height: 18px;
}

.result {
    background: white;
    margin-top: 15px;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08);
}

.word {
    font-size: 28px;
    font-weight: 900;
    color: #111827;
}

.pos {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 9px;
    border-radius: 7px;
    background: #e0e7ff;
    color: #3730a3;
    font-size: 12px;
    font-weight: bold;
}

.meaning {
    margin-top: 15px;
    font-size: 17px;
    line-height: 1.7;
}

.example {
    margin-top: 15px;
    padding: 12px;
    border-left: 4px solid #6366f1;
    background: #f8fafc;
    line-height: 1.6;
    color: #475569;
}

.detail {
    margin-top: 15px;
    padding: 11px 14px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #64748b;
    padding: 30px;
}

.info {
    margin-top: 15px;
    padding: 15px;
    background: white;
    border-radius: 15px;
    color: #64748b;
    font-size: 12px;
    line-height: 1.6;
}

@media(max-width:500px) {

    .container {
        width: 94%;
        padding-top: 15px;
    }

    .header {
        padding: 23px 18px;
    }

    .header h1 {
        font-size: 25px;
    }

    .search input {
        font-size: 15px;
    }

    .search button {
        padding: 0 15px;
    }

    .word {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>📖 표준국어대사전</h1>

        <p>
            국립국어원 표준국어대사전
        </p>

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="검색할 단어를 입력하세요"
            >

            <button onclick="searchWord()">
                검색
            </button>

        </div>

        <div id="status" class="status"></div>

    </div>


    <div id="results"></div>


    <div class="info">

        국립국어원 표준국어대사전 Open API를 이용한 검색 서비스입니다.

    </div>

</div>


<script>

/* =====================================================
   국립국어원 표준국어대사전 인증키
   ===================================================== */

const API_KEY =
"F189E2B227CC59D32D9DB4E8AD8DF289";


/* API 주소 */

const API_URL =
"https://stdict.korean.go.kr/api/search.do";


/* 검색 */

async function searchWord() {

    const input =
        document.getElementById("searchInput");

    const word =
        input.value.trim();

    const status =
        document.getElementById("status");

    const results =
        document.getElementById("results");


    if (!word) {

        input.focus();

        return;

    }


    status.textContent =
        "검색 중입니다...";

    results.innerHTML = "";


    const url =
        API_URL
        + "?key=" + encodeURIComponent(API_KEY)
        + "&q=" + encodeURIComponent(word)
        + "&req_type=json"
        + "&start=1"
        + "&num=30";


    try {

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "API 서버 응답 오류 : "
                + response.status
            );

        }


        const data =
            await response.json();


        console.log(data);


        if (data.error) {

            throw new Error(
                data.error.message ||
                "API 오류가 발생했습니다."
            );

        }


        const channel =
            data.channel || {};


        let items =
            channel.item || [];


        if (!Array.isArray(items)) {

            items = [items];

        }


        status.textContent =
            "검색 결과 "
            + (channel.total || items.length)
            + "건";


        if (items.length === 0) {

            results.innerHTML = `
                <div class="result empty">

                    검색 결과가 없습니다.

                    <br><br>

                    다른 단어를 검색해 보세요.

                </div>
            `;

            return;

        }


        results.innerHTML =
            items.map(function(item) {


                let senses =
                    item.sense || [];


                if (!Array.isArray(senses)) {

                    senses = [senses];

                }


                let definitions =
                    senses.map(function(sense) {

                        return `
                            <div class="meaning">

                                ${escapeHTML(
                                    sense.definition || ""
                                )}

                            </div>
                        `;

                    }).join("");


                let detailLink =
                    senses[0] &&
                    senses[0].link
                    ? senses[0].link
                    : "https://stdict.korean.go.kr/search/searchResult.do?searchKeyword="
                    + encodeURIComponent(
                        item.word || word
                    );


                return `

                    <div class="result">

                        <div class="word">

                            ${escapeHTML(
                                item.word || ""
                            )}

                        </div>


                        ${
                            item.pos
                            ?
                            `
                            <div class="pos">

                                ${escapeHTML(
                                    item.pos
                                )}

                            </div>
                            `
                            :
                            ""
                        }


                        ${definitions}


                        <button
                            class="detail"
                            onclick="window.open(
                                '${detailLink}',
                                '_blank'
                            )"
                        >

                            표준국어대사전에서 자세히 보기

                        </button>

                    </div>

                `;

            }).join("");


    } catch (error) {

        console.error(error);


        status.textContent = "";


        results.innerHTML = `

            <div class="result empty">

                <strong>
                    검색에 실패했습니다.
                </strong>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                API 사용 URL 또는 인증키 설정을 확인해야 합니다.

            </div>

        `;

    }

}


/* HTML 특수문자 처리 */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* 엔터키로 검색 */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchWord();

            }

        }
    );

</script>

</body>
</html>
