<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f2328">
<title>PDF 뷰어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="scroller" hidden>
  <div id="pages"></div>
</div>

<div id="empty">
  <div class="emptyBox">
    <h1>PDF 뷰어</h1>
    <p class="sub">광고 없이 PDF만 봅니다</p>
    <button id="btnOpenBig" class="big">PDF 열기</button>
    <div id="recentBox" hidden>
      <h2>최근 본 문서</h2>
      <ul id="recentList"></ul>
    </div>
  </div>
</div>

<div id="topbar">
  <div id="title">PDF 뷰어</div>
  <button id="btnInfo" class="tbtn">정보</button>
</div>

<div id="bar">
  <button id="btnOpen" class="tbtn">열기</button>
  <button id="btnSearch" class="tbtn">검색</button>
  <button id="btnPage" class="tbtn pageBtn">- / -</button>
  <button id="btnDark" class="tbtn">다크</button>
</div>

<div id="zoomPill" hidden></div>
<div id="busy" hidden></div>
<div id="toast" hidden></div>

<div id="sheet" hidden>
  <div class="back" id="sheetBack"></div>
  <div class="panel"><div id="sheetBody"></div></div>
</div>

<input id="file" type="file" accept="application/pdf,.pdf" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
